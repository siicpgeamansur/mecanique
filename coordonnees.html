<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Coordonnées cartésiennes · cylindriques · sphériques</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  --ok-soft:rgba(30,122,46,.15);--bad-soft:rgba(192,40,31,.15);--warn-soft:rgba(154,91,0,.13);
  --gcol:#188038;--mcol:#9a5b00;--wcol:#7b4fc2;--acol:#2e8b3a;--rcol:#c0281f;
  --canvas:#f8fbff;--grid:#dce5ee;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#0c0c0c;--bar:#141414;--panel:#171717;--panel2:#212121;--field:#101010;--line:#333333;
  --fg:#f2f2f2;--muted:#a0a0a0;--accent:#f2f2f2;--accent-fg:#14151f;--accent-soft:#2a2a2a;--accent-ink:#d0d0d0;--run:#4ade80;
  --ok:#4ade80;--warn:#ffb74d;--bad:#ff7b7b;--violet:#c792ff;
  --ok-soft:rgba(74,222,128,.18);--bad-soft:rgba(248,113,113,.2);--warn-soft:rgba(255,183,77,.15);
  --gcol:#4ade80;--mcol:#ffb74d;--wcol:#c792ff;--acol:#4ade80;--rcol:#ff7b7b;
  --canvas:#101010;--grid:#262626;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary,label):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:1500px;margin:0 auto}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}

/* grille deux colonnes */
.ws-two{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
.ws-main{min-width:0}
.ws-side{position:sticky;top:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-height:calc(100vh - 170px);overflow:auto}
.ws-side h3{margin:0 0 10px;font-size:15px}
.ws-side .gstats{grid-template-columns:1fr 1fr;gap:6px;margin:8px 0 0}
.ws-side .stat{padding:5px 8px}
.ws-side .chips{margin:10px 0 0}
@media (max-width:1150px){
  .ws-two{grid-template-columns:1fr}
  .ws-side{position:static;max-height:none}
  .ws-side .gstats{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
}

/* Activité */
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px;overflow:auto;padding:12px;flex:1;min-height:0}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none;accent-color:var(--accent)}
.opt.good{background:var(--ok-soft)}.opt.bad{background:var(--bad-soft)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}

/* Cours */
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px;line-height:1.7}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}

/* éléments d'atelier */
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
.fld b{color:var(--accent);font-family:var(--font-mono);font-weight:500;font-size:12px}
input[type=range]{padding:0;accent-color:var(--accent)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip input{accent-color:var(--accent);margin:0}
.stagebox{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--panel);margin:8px 0}
.stagebox canvas{display:block;width:100%;height:340px;background:var(--canvas);border-radius:8px}
.gl{width:100%;height:470px;border-radius:8px;overflow:hidden;background:var(--canvas)}
.gl canvas{display:block;height:auto;border-radius:0}
@media (max-width:820px){.gl{height:330px}}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:13.5px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:var(--ok-soft);border-color:var(--ok)}.verdict.no{background:var(--bad-soft);border-color:var(--bad)}.verdict.warn{background:var(--warn-soft);border-color:var(--warn)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0}
.panel h3{margin:0 0 8px;font-size:15px;color:var(--accent-ink)}
.cgroup{background:var(--panel2);border-radius:8px;padding:8px 10px;margin-bottom:8px}
.cgroup strong{display:block;font-size:12.5px;color:var(--accent-ink);margin-bottom:5px}
.crow{display:grid;grid-template-columns:24px 1fr;gap:6px;align-items:center;margin-bottom:4px}
.crow span{font-weight:600;color:var(--accent);font-size:13px;text-align:center}
.crow input{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-family:var(--font-mono);font-size:12.5px;color:var(--fg)}

@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  .stagebox canvas{height:260px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
</style>
<script>
try{if(localStorage.getItem('coord-theme')==='dark')document.documentElement.dataset.theme='dark';}catch(e){}
</script>
</head>
<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <line x1="13" y1="22" x2="22" y2="18" stroke="var(--rcol)" stroke-width="2"/>
        <line x1="13" y1="22" x2="5" y2="18" stroke="var(--gcol)" stroke-width="2"/>
        <line x1="13" y1="22" x2="13" y2="4" stroke="var(--wcol)" stroke-width="2"/>
        <circle cx="17" cy="10" r="2.4" fill="var(--mcol)"/>
      </svg>
      <span>Coordonnées <small>cartésiennes · cylindriques · sphériques</small></span>
    </div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Activité</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
      <button class="btn" id="bTheme" type="button">Mode sombre</button>
    </div>
  </div></header>
  <div class="band" id="modes"><div class="inner row"><div class="seg" id="wsSeg" role="tablist" aria-label="Ateliers"></div></div></div>
  <main class="inner work" id="work">
    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>
    <aside id="act" hidden aria-label="Activité"></aside>
  </main>
  <section id="course" hidden aria-label="Cours"></section>
</div>
<div id="dlg" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
'use strict';

/* ================= Helpers ================= */
const $ = id => document.getElementById(id);
const f = (x,d=3)=>{if(!isFinite(x))return "–";const a=Math.abs(x);if(a!==0&&(a<1e-3||a>=1e4))return x.toExponential(2);return x.toFixed(d).replace(".",",")};
const fmt = (x,d)=>f(x,d);
const deg = x => x*180/Math.PI;
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
function h(tag, attrs, ...kids){
  const el=document.createElement(tag);
  if(attrs) for(const [k,v] of Object.entries(attrs)){
    if(v===false||v==null) continue;
    if(k==='class') el.className=v;
    else if(k==='html') el.innerHTML=v;
    else if(k.startsWith('on')) el.addEventListener(k.slice(2),v);
    else if(v===true) el.setAttribute(k,'');
    else el.setAttribute(k,v);
  }
  for(const k of kids.flat()) if(k!=null&&k!==false) el.append(k.nodeType?k:document.createTextNode(k));
  return el;
}
function setup(cv){
  if(!cv) return null;
  const dpr=window.devicePixelRatio||1, r=cv.getBoundingClientRect();
  const w=Math.max(100,r.width), hh=r.height;
  if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(hh*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(hh*dpr)}
  const c=cv.getContext('2d'); c.setTransform(dpr,0,0,dpr,0,0); c.clearRect(0,0,w,hh);
  return {c,w,h:hh};
}
function arrow(c,x0,y0,x1,y1,col,lab,lw){
  lw=lw||2; const dx=x1-x0,dy=y1-y0,L=Math.hypot(dx,dy); if(L<3)return;
  const ux=dx/L,uy=dy/L,hl=Math.min(L*0.6,lw*4.2),hw=lw*2.1;
  c.strokeStyle=col;c.fillStyle=col;c.lineWidth=lw;c.lineCap="round";
  c.beginPath();c.moveTo(x0,y0);c.lineTo(x1-ux*hl*0.8,y1-uy*hl*0.8);c.stroke();
  c.beginPath();c.moveTo(x1,y1);c.lineTo(x1-hl*ux+hw*uy,y1-hl*uy-hw*ux);c.lineTo(x1-hl*ux-hw*uy,y1-hl*uy+hw*ux);c.closePath();c.fill();
  if(lab){c.font="600 13px "+css("--font-ui");c.fillText(lab,x1+6,y1-6)}
}
function dot(c,x,y,col,lab,dx=8,dy=-8){
  c.fillStyle=col; c.beginPath(); c.arc(x,y,4.5,0,7); c.fill();
  if(lab){ c.font="600 14px "+css("--font-ui"); c.fillText(lab,x+dx,y+dy); }
}

/* ================= Thème ================= */
let darkTheme = false;
try{ darkTheme = localStorage.getItem('coord-theme') === 'dark'; }catch(e){}
function applyTheme(){
  document.documentElement.dataset.theme = darkTheme ? 'dark' : 'light';
  const b = $('bTheme');
  if(b){
    b.textContent = darkTheme ? 'Mode clair' : 'Mode sombre';
    b.setAttribute('aria-label', darkTheme ? 'Activer le mode clair' : 'Activer le mode sombre');
  }
  if(G3 && G3.scene) G3.scene.background.set(darkTheme ? 0x101010 : 0xf8fbff);
}
applyTheme();
$('bTheme').addEventListener('click', ()=>{
  darkTheme = !darkTheme;
  try{ localStorage.setItem('coord-theme', darkTheme ? 'dark' : 'light'); }catch(e){}
  applyTheme();
  if(UI.cur==='c2d'){ drawTop(); drawSide(); }
});

/* ================= Point partagé ================= */
const PT = { x:3, y:2, z:4 };
function derived(){
  const {x,y,z}=PT;
  const rho = Math.hypot(x,y);
  const r = Math.hypot(x,y,z);
  const phi = Math.atan2(y,x);
  const theta = r>1e-9 ? Math.acos(clamp(z/r,-1,1)) : 0;
  return {x,y,z,rho,r,phi,theta};
}
let onChange = ()=>{};

function coordsHTML(){
  return `
    <h3>Coordonnées du point</h3>
    <div class="cgroup">
      <strong>Cartésiennes (x, y, z)</strong>
      <div class="crow"><span>x</span><input type="number" id="cx" step="0.1" value="3"></div>
      <div class="crow"><span>y</span><input type="number" id="cy" step="0.1" value="2"></div>
      <div class="crow"><span>z</span><input type="number" id="cz" step="0.1" value="4"></div>
    </div>
    <div class="cgroup">
      <strong>Cylindriques (ρ, φ, z)</strong>
      <div class="crow"><span>ρ</span><input type="number" id="crho" step="0.1" value="3.606"></div>
      <div class="crow"><span>φ</span><input type="number" id="cphi" step="0.01" value="0.588"></div>
      <div class="crow"><span>z</span><input type="number" id="cz2" step="0.1" value="4"></div>
      <div class="small" style="margin-top:2px">φ en radians</div>
    </div>
    <div class="cgroup">
      <strong>Sphériques (r, θ, φ)</strong>
      <div class="crow"><span>r</span><input type="number" id="cr" step="0.1" value="5.385"></div>
      <div class="crow"><span>θ</span><input type="number" id="cth" step="0.01" value="0.733"></div>
      <div class="crow"><span>φ</span><input type="number" id="cphi2" step="0.01" value="0.588"></div>
      <div class="small" style="margin-top:2px">θ, φ en radians</div>
    </div>
  `;
}
function checksHTML(){
  return `
    <h3 style="margin-top:14px">Vérifications</h3>
    <div class="gstats">
      <div class="stat"><span>x² + y²</span><b id="vXY"></b></div>
      <div class="stat"><span>ρ²</span><b id="vRho2"></b></div>
      <div class="stat"><span>ρ² + z²</span><b id="vRhoZ"></b></div>
      <div class="stat"><span>r²</span><b id="vR2"></b></div>
    </div>
  `;
}

function syncInputs(){
  const d = derived();
  const act = document.activeElement;
  const set=(id,v)=>{const e=$(id); if(e && e!==act) e.value = (Math.abs(v)<5e-4?0:v).toFixed(3);};
  set('cx',d.x); set('cy',d.y); set('cz',d.z);
  set('crho',d.rho); set('cphi',d.phi); set('cz2',d.z);
  set('cr',d.r); set('cth',d.theta); set('cphi2',d.phi);
  const ro=(id,v)=>{const e=$(id); if(e) e.textContent=v;};
  ro('vXY',   fmt(d.x*d.x+d.y*d.y,4));
  ro('vRho2', fmt(d.rho*d.rho,4));
  ro('vRhoZ', fmt(d.rho*d.rho+d.z*d.z,4));
  ro('vR2',   fmt(d.r*d.r,4));
}
function fromCart(){
  PT.x = parseFloat($('cx').value)||0;
  PT.y = parseFloat($('cy').value)||0;
  PT.z = parseFloat($('cz').value)||0;
  syncInputs(); onChange();
}
function fromCyl(){
  const rho = parseFloat($('crho').value)||0;
  const phi = parseFloat($('cphi').value)||0;
  const z   = parseFloat($('cz2').value)||0;
  PT.x = rho*Math.cos(phi); PT.y = rho*Math.sin(phi); PT.z = z;
  syncInputs(); onChange();
}
function fromSph(){
  const r = parseFloat($('cr').value)||0;
  const th= parseFloat($('cth').value)||0;
  const ph= parseFloat($('cphi2').value)||0;
  PT.x = r*Math.sin(th)*Math.cos(ph);
  PT.y = r*Math.sin(th)*Math.sin(ph);
  PT.z = r*Math.cos(th);
  syncInputs(); onChange();
}
function bindCoords(){
  const on=(id,fn)=>{const e=$(id); if(e) e.addEventListener('input',fn);};
  ['cx','cy','cz'].forEach(id=>on(id,fromCart));
  ['crho','cphi','cz2'].forEach(id=>on(id,fromCyl));
  ['cr','cth','cphi2'].forEach(id=>on(id,fromSph));
}
function setPT(x,y,z){ PT.x=x; PT.y=y; PT.z=z; syncInputs(); onChange(); }

/* ================= Three.js ================= */
const toThree = (x,y,z)=> new THREE.Vector3(x, z, y);
let G3 = null;

function makeLabel(text, color){
  const cv=document.createElement('canvas'); cv.width=128; cv.height=64;
  const g2=cv.getContext('2d');
  g2.font='bold 46px system-ui, sans-serif';
  g2.fillStyle='#'+color.toString(16).padStart(6,'0');
  g2.textAlign='center'; g2.textBaseline='middle';
  g2.fillText(text,64,34);
  const tex=new THREE.CanvasTexture(cv);
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:false}));
  sp.scale.set(1.0,0.5,1);
  return sp;
}
function clearGroup(g){
  if(!g) return;
  while(g.children.length){
    const c=g.children[0]; g.remove(c);
    if(c.geometry) c.geometry.dispose();
    if(c.material){ Array.isArray(c.material)?c.material.forEach(m=>m.dispose()):c.material.dispose(); }
  }
}
function line(g, pts, color, dashed){
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  const mat = dashed
    ? new THREE.LineDashedMaterial({color,dashSize:0.18,gapSize:0.12})
    : new THREE.LineBasicMaterial({color});
  const l=new THREE.Line(geo,mat);
  if(dashed) l.computeLineDistances();
  g.add(l);
}

function init3D(){
  const host=$('gl'); if(!host || !window.THREE) return;
  const w=host.clientWidth||600, hh=host.clientHeight||460;
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(darkTheme?0x101010:0xf8fbff);

  const camera=new THREE.PerspectiveCamera(45,w/hh,0.1,200);
  camera.position.set(9,7,11);

  const renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(w,hh);
  renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
  host.appendChild(renderer.domElement);

  const controls=new THREE.OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.08;
  controls.target.set(0,2,0);

  scene.add(new THREE.AmbientLight(0xffffff,0.65));
  const dl=new THREE.DirectionalLight(0xffffff,0.7); dl.position.set(6,12,8); scene.add(dl);

  const grid=new THREE.GridHelper(12,12, darkTheme?0x445566:0xa8b6c6, darkTheme?0x263340:0xd6e0ea);
  scene.add(grid);

  const L=5.5;
  const mk=(dir,color,name)=>{
    scene.add(new THREE.ArrowHelper(dir.clone().normalize(), new THREE.Vector3(0,0,0), L, color, 0.55, 0.28));
    const s=makeLabel(name,color);
    s.position.copy(dir.clone().normalize().multiplyScalar(L+0.75));
    scene.add(s);
  };
  mk(new THREE.Vector3(1,0,0),0xd93025,'x');
  mk(new THREE.Vector3(0,0,1),0x188038,'y');
  mk(new THREE.Vector3(0,1,0),0x1a73e8,'z');

  const point=new THREE.Mesh(
    new THREE.SphereGeometry(0.18,24,24),
    new THREE.MeshStandardMaterial({color:0xe8710a,emissive:0x3a1a00})
  );
  scene.add(point);

  const cart=new THREE.Group(), cyl=new THREE.Group(), sph=new THREE.Group();
  scene.add(cart,cyl,sph);

  G3={scene,camera,renderer,controls,point,cart,cyl,sph,raf:0};
  const loop=()=>{ G3.raf=requestAnimationFrame(loop); G3.controls.update(); G3.renderer.render(G3.scene,G3.camera); };
  loop();
}
function dispose3D(){
  if(!G3) return;
  cancelAnimationFrame(G3.raf);
  G3.renderer.dispose();
  const el=G3.renderer.domElement;
  if(el && el.parentNode) el.parentNode.removeChild(el);
  G3=null;
}
function resize3D(){
  if(!G3) return;
  const host=$('gl'); if(!host) return;
  const w=host.clientWidth, hh=host.clientHeight;
  if(w<10||hh<10) return;
  G3.camera.aspect=w/hh; G3.camera.updateProjectionMatrix();
  G3.renderer.setSize(w,hh);
}
function update3D(){
  if(!G3) return;
  const d=derived();
  G3.point.position.copy(toThree(d.x,d.y,d.z));
  [G3.cart,G3.cyl,G3.sph].forEach(clearGroup);

  const showCart = $('gCart') ? $('gCart').checked : true;
  const showCyl  = $('gCyl')  ? $('gCyl').checked  : true;
  const showSph  = $('gSph')  ? $('gSph').checked  : true;

  if(showCart){
    line(G3.cart,[toThree(0,0,0), toThree(d.x,0,0)],0xd93025,true);
    line(G3.cart,[toThree(d.x,0,0), toThree(d.x,d.y,0)],0x188038,true);
    line(G3.cart,[toThree(d.x,d.y,0), toThree(d.x,d.y,d.z)],0x1a73e8,true);
    const proj=new THREE.Mesh(new THREE.SphereGeometry(0.09,12,12), new THREE.MeshBasicMaterial({color:0x8a94a3}));
    proj.position.copy(toThree(d.x,d.y,0));
    G3.cart.add(proj);
  }

  if(showCyl && d.rho>0.05){
    const mesh=new THREE.Mesh(
      new THREE.CylinderGeometry(d.rho,d.rho,Math.abs(d.z)+0.6,48,1,true),
      new THREE.MeshBasicMaterial({color:0x22aa77,wireframe:true,transparent:true,opacity:0.22})
    );
    mesh.position.copy(toThree(0,0,d.z/2));
    G3.cyl.add(mesh);
    line(G3.cyl,[toThree(0,0,0), toThree(d.x,d.y,0)],0x0f9d58,true);
    const arc=[];
    for(let i=0;i<=32;i++){ const a=d.phi*i/32; arc.push(toThree(d.rho*Math.cos(a), d.rho*Math.sin(a), 0)); }
    line(G3.cyl,arc,0x0f9d58);
  }

  if(showSph && d.r>0.05){
    const mesh=new THREE.Mesh(
      new THREE.SphereGeometry(d.r,32,24),
      new THREE.MeshBasicMaterial({color:0xaa66ff,wireframe:true,transparent:true,opacity:0.15})
    );
    G3.sph.add(mesh);
    line(G3.sph,[toThree(0,0,0), toThree(d.x,d.y,d.z)],0x7c3aed,true);
    if(d.rho>0.02){
      const arc=[];
      for(let i=0;i<=24;i++){
        const t=d.theta*i/24;
        arc.push(toThree(d.r*Math.sin(t)*Math.cos(d.phi), d.r*Math.sin(t)*Math.sin(d.phi), d.r*Math.cos(t)));
      }
      line(G3.sph,arc,0x7c3aed);
    }
  }
}

function drawTop(){
  const cv=$('cvTop'); if(!cv) return;
  const {c,w,h:hh}=setup(cv);
  const d=derived();
  const R=Math.max(1,Math.abs(d.x),Math.abs(d.y),d.rho)*1.25;
  const sc=Math.min(w,hh)*0.42/R;
  const ox=w/2, oy=hh/2;
  const X=v=>ox+v*sc, Y=v=>oy-v*sc;

  // grille
  const step=R>12?5:1;
  c.strokeStyle=css('--grid'); c.lineWidth=1;
  for(let v=-Math.ceil(R/step)*step; v<=R+1e-9; v+=step){
    c.beginPath(); c.moveTo(X(v),Y(-R)); c.lineTo(X(v),Y(R)); c.stroke();
    c.beginPath(); c.moveTo(X(-R),Y(v)); c.lineTo(X(R),Y(v)); c.stroke();
  }

  // axes
  arrow(c,X(0),Y(0),X(R),Y(0),css('--rcol'),null,2);
  arrow(c,X(0),Y(0),X(0),Y(R),css('--gcol'),null,2);
  c.font="700 14px "+css('--font-ui');
  c.fillStyle=css('--rcol'); c.fillText('x',X(R)+6,Y(0)+4);
  c.fillStyle=css('--gcol'); c.fillText('y',X(0)+6,Y(R)-4);
  c.fillStyle=css('--muted'); c.fillText('O',X(0)-16,Y(0)+16);

  // cercle de rayon rho
  if(d.rho>1e-6){
    c.setLineDash([5,5]); c.strokeStyle=css('--mcol'); c.lineWidth=1.5;
    c.beginPath(); c.arc(X(0),Y(0),d.rho*sc,0,2*Math.PI); c.stroke();
    c.setLineDash([]);
  }

  // segment OM
  c.strokeStyle=css('--accent'); c.lineWidth=2.5;
  c.beginPath(); c.moveTo(X(0),Y(0)); c.lineTo(X(d.x),Y(d.y)); c.stroke();

  // arc phi
  if(d.rho>1e-6){
    const rad=Math.min(0.34*d.rho,R*0.32)*sc;
    const a0=Math.min(0,-d.phi), a1=Math.max(0,-d.phi);
    c.strokeStyle=css('--acol'); c.lineWidth=2.5;
    c.beginPath(); c.arc(X(0),Y(0),rad,a0,a1,false); c.stroke();
    const mid=-d.phi/2;
    c.fillStyle=css('--acol'); c.font="700 16px "+css('--font-ui');
    c.fillText('φ', X(0)+(rad+14)*Math.cos(mid)-5, Y(0)+(rad+14)*Math.sin(mid)+5);
  }

  // point M et étiquette
  dot(c,X(d.x),Y(d.y),css('--mcol'),null);
  c.fillStyle=css('--mcol'); c.font="600 13px "+css('--font-ui');
  c.fillText('M (x ; y)', X(d.x)+10, Y(d.y)-10);

  // étiquette rho
  const mx=X(d.x/2), my=Y(d.y/2);
  c.fillStyle=css('--accent'); c.font="700 14px "+css('--font-ui');
  c.fillText('ρ', mx+6, my-6);
}

function drawSide(){
  const cv=$('cvSide'); if(!cv) return;
  const {c,w,h:hh}=setup(cv);
  const d=derived();
  const R=Math.max(1, d.rho, Math.abs(d.z))*1.25;
  const ox=w*0.18, oy=d.z<0 ? hh*0.5 : hh*0.82;
  const sc=Math.min(w*0.75/R, (d.z<0?hh*0.45:hh*0.72)/R);
  const X=v=>ox+v*sc, Y=v=>oy-v*sc;

  // grille
  const step=R>12?5:1;
  c.strokeStyle=css('--grid'); c.lineWidth=1;
  for(let v=0; v<=R+1e-9; v+=step){
    c.beginPath(); c.moveTo(X(v),Y(-R)); c.lineTo(X(v),Y(R)); c.stroke();
  }
  for(let v=-Math.ceil(R/step)*step; v<=R+1e-9; v+=step){
    c.beginPath(); c.moveTo(X(0),Y(v)); c.lineTo(X(R),Y(v)); c.stroke();
  }

  // axes
  arrow(c,X(0),Y(0),X(R),Y(0),css('--accent'),null,2);
  arrow(c,X(0),Y(0),X(0),Y(R),css('--wcol'),null,2);
  arrow(c,X(0),Y(0),X(0),Y(Math.min(-R,d.z*1.2)),css('--wcol'),null,2);
  c.font="700 14px "+css('--font-ui');
  c.fillStyle=css('--accent'); c.fillText('ρ', X(R)+6, Y(0)+4);
  c.fillStyle=css('--wcol'); c.fillText('z', X(0)+8, Y(R)-2);
  c.fillStyle=css('--muted'); c.fillText('O', X(0)-16, Y(0)+16);

  // segments en pointillés jusqu'aux axes
  c.setLineDash([4,4]); c.strokeStyle=css('--muted'); c.lineWidth=1.2;
  c.beginPath(); c.moveTo(X(d.rho),Y(0)); c.lineTo(X(d.rho),Y(d.z)); c.stroke();
  c.beginPath(); c.moveTo(X(0),Y(d.z)); c.lineTo(X(d.rho),Y(d.z)); c.stroke();
  c.setLineDash([]);

  // rayon OM
  c.strokeStyle=css('--wcol'); c.lineWidth=2.5;
  c.beginPath(); c.moveTo(X(0),Y(0)); c.lineTo(X(d.rho),Y(d.z)); c.stroke();

  // arc theta (depuis +z vers le rayon)
  if(d.r>1e-6){
    const aEnd=-Math.atan2(d.z,d.rho);
    const rad=Math.min(0.34*d.r,R*0.32)*sc;
    c.strokeStyle=css('--acol'); c.lineWidth=2.5;
    c.beginPath(); c.arc(X(0),Y(0),rad,-Math.PI/2,aEnd,false); c.stroke();
    const mid=(-Math.PI/2+aEnd)/2;
    c.fillStyle=css('--acol'); c.font="700 16px "+css('--font-ui');
    c.fillText('θ', X(0)+(rad+14)*Math.cos(mid)-5, Y(0)+(rad+14)*Math.sin(mid)+5);
  }

  // point M
  dot(c,X(d.rho),Y(d.z),css('--mcol'),null);
  c.fillStyle=css('--mcol'); c.font="600 13px "+css('--font-ui');
  c.fillText('M', X(d.rho)+10, Y(d.z)-10);

  // étiquette r
  const mx=X(d.rho/2), my=Y(d.z/2);
  c.fillStyle=css('--wcol'); c.font="700 14px "+css('--font-ui');
  c.fillText('r', mx+8, my-6);

  // graduations des axes
  c.fillStyle=css('--muted'); c.font="11px "+css('--font-mono');
  c.fillText(fmt(d.rho,2), X(d.rho)-12, Y(0)+16);
  c.fillText(fmt(d.z,2), X(0)-40, Y(d.z)+4);
}

θ = acos(z / r) = acos(${fmt(d.z,3)} / ${fmt(d.r,3)}) = <b>${fmt(d.theta,4)}</b> rad = ${fmt(deg(d.theta),2)}°<br>

y = r·sinθ·sinφ = ${fmt(d.r,3)} × ${fmt(Math.sin(d.theta),4)} × ${fmt(Math.sin(d.phi),4)} = <b>${fmt(d.y,4)}</b><br>

      <div class="formula">

ρ² + z² = ${fmt(d.rho*d.rho+d.z*d.z,6)} &nbsp;=&nbsp; r² = ${fmt(r2,6)}
      </div>
      <div class="verdict ${Math.abs(d.rho)<1e-6?'warn':(d.r<1e-6?'warn':'yes')}">
        ${d.r<1e-6
          ? '<b>Origine :</b> θ et φ sont indéfinis, seul r = 0 a un sens.'
          : (d.rho<1e-6
            ? '<b>Sur l’axe z :</b> φ est indéfini (ρ = 0). θ vaut 0 si z > 0, π si z < 0.'
            : 'Les trois représentations décrivent bien le même point, et les conversions sont inverses l’une de l’autre.')}
      </div>
    </div>
  `;
}

  box.innerHTML='';
  const a=ACT[AS.key];
  const close=h('button',{class:'btn sm',type:'button',onclick:()=>{AS.open=false;renderAct();}},'Fermer');
  box.append(h('div',{class:'phead'},h('b',null,'Activité'),h('span',{class:'sub'},a.title),close));
  const nq=a.qcm.length;
  box.append(h('div',{class:'tabs',role:'tablist'},
    h('button',{type:'button',role:'tab','aria-selected':AS.tab==='steps'?'true':'false',onclick:()=>{AS.tab='steps';renderAct();}},'Consignes'),
    h('button',{type:'button',role:'tab','aria-selected':AS.tab==='qcm'?'true':'false',onclick:()=>{AS.tab='qcm';renderAct();}},'Questions ('+nq+')')));
  const body=h('div',{class:'pbody'});
  if(AS.tab==='steps'){
    body.append(h('p',{class:'small'},a.level+' · environ '+a.time), h('div',{class:'goal'},h('b',null,'Objectif. '),h('span',{html:a.goal})));
    body.append(h('ol',{class:'steps'},a.steps.map(s=>h('li',{html:s}))));
    body.append(h('div',{class:'defi'},h('b',null,'Défi'),h('p',{html:a.defi.q}),h('details',null,h('summary',null,'Voir la réponse'),h('p',{html:a.defi.a}))));
    if(a.course) body.append(h('p',null,h('button',{class:'btn',type:'button',onclick:()=>openCourse(a.course)},'Voir le cours : '+courseSection(a.course).t)));
    body.append(h('p',null,h('button',{class:'btn pri',type:'button',onclick:()=>{AS.tab='qcm';renderAct();}},'Passer aux questions')));
  } else {
    const s=actState(), show=s.checked||s.shown;
    a.qcm.forEach((q,i)=>{
      const fs=h('fieldset',{class:'q'},h('legend',{html:(i+1)+'. '+q.q}));
      q.o.forEach((o,j)=>{
        const good=show&&j===q.a, bad=s.checked&&!s.shown&&s.a[i]===j&&j!==q.a;
        const inp=h('input',{type:'radio',name:'q'+i,checked:show&&s.shown?j===q.a:s.a[i]===j,disabled:show});
        inp.addEventListener('change',()=>{s.a[i]=j;renderAct();});
        fs.append(h('label',{class:'opt'+(good?' good':'')+(bad?' bad':'')},inp,h('span',null,o+(good?'  ✓':''))));
      });
      if(show){ const miss=s.a[i]==null&&!s.shown; fs.append(h('p',{class:'why'},(miss?'Sans réponse. ':'')+q.w)); }
      body.append(fs);
    });
    const done=Object.keys(s.a).length;
    body.append(h('p',{class:'small'},s.shown?'Réponses affichées.':s.checked?'':done+' réponse(s) sur '+nq+'.'));
    if(s.checked&&!s.shown) body.append(h('p',{class:'score'},'Score : '+actScore(a)+' / '+nq));
    const row=h('div',{class:'files'});
    if(!show) row.append(h('button',{class:'btn pri',type:'button',onclick:()=>{s.checked=true;renderAct();}},'Corriger'));
    row.append(h('button',{class:'btn',type:'button',onclick:()=>{s.shown=true;renderAct();}},'Afficher les réponses'));
    if(show) row.append(h('button',{class:'btn',type:'button',onclick:()=>{AS.st[AS.key]={a:{},checked:false,shown:false};renderAct();}},'Recommencer'));
    body.append(row);
  }
  box.append(body);
}
function actToggle(){ if(CS.open){CS.open=false;renderCourse();} AS.open=!AS.open; renderAct(); }
$('bAct').addEventListener('click',actToggle);

function renderCourse(){
  const box=$('course'), btn=$('bCourse'), work=$('work');
  btn.setAttribute('aria-pressed',CS.open?'true':'false'); btn.classList.toggle('pri',CS.open);
  box.hidden=!CS.open; work.hidden=CS.open; $('modes').hidden=CS.open;
  if(!CS.open){ box.innerHTML=''; return; }
  box.innerHTML='';
  const cur=courseSection(CS.id), idx=COURSE.indexOf(cur);
  const go=id=>{CS.id=id;renderCourse();};
  const nav=h('nav',{class:'ctoc','aria-label':'Sommaire du cours'},COURSE.map((s,i)=>h('button',{type:'button',class:s.id===cur.id?'on':'','aria-current':s.id===cur.id?'true':'false',onclick:()=>go(s.id)},(i+1)+'. '+s.t)));
  const sel=h('select',{class:'ctoc-sel','aria-label':'Choisir une section',onchange:e=>go(e.target.value)},COURSE.map((s,i)=>h('option',{value:s.id,selected:s.id===cur.id},(i+1)+'. '+s.t)));
  const art=h('article',{class:'cbody'});
  art.append(h('p',{class:'ckick'},'Cours · section '+(idx+1)+' sur '+COURSE.length), h('h2',null,cur.t), h('div',{html:cur.h}));
  art.append(h('div',{class:'cpn'},
    idx>0?h('button',{class:'btn',type:'button',onclick:()=>go(COURSE[idx-1].id)},'← '+COURSE[idx-1].t):h('span'),
    idx<COURSE.length-1?h('button',{class:'btn pri',type:'button',onclick:()=>go(COURSE[idx+1].id)},COURSE[idx+1].t+' →'):h('span')));
  const top=h('div',{class:'ctop'},h('b',null,'Cours : systèmes de coordonnées'),h('button',{class:'btn pri sm',type:'button',onclick:()=>{CS.open=false;renderCourse();}},'Retour à l’atelier'));
  box.append(top,sel,h('div',{class:'cwrap'},nav,art));
}
function openCourse(id){ if(id) CS.id=id; CS.open=true; renderCourse(); }
$('bCourse').addEventListener('click',()=>{CS.open=!CS.open;renderCourse();});

function closeDlg(){ $('dlg').hidden=true; $('dlg').innerHTML=''; }
function openDlg(title,body){
  const d=$('dlg'); d.innerHTML=''; d.hidden=false;
  d.style.cssText='position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px';
  const boxEl=h('div',{style:'background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column'},
    h('header',{style:'display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)'},h('b',null,title),h('button',{class:'btn sm',type:'button',onclick:closeDlg},'Fermer')),
    h('div',{style:'padding:14px 16px;overflow:auto;font-size:13.5px'},body));
  d.append(boxEl);
  d.onclick=ev=>{ if(ev.target===d) closeDlg(); };
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$('dlg').hidden) closeDlg(); });
$('bHelp').addEventListener('click',()=>{
  openDlg('Aide', h('div',{html:'<p>Trois ateliers sur les systèmes de coordonnées : exploration 3D, vues 2D (coupes) et convertisseur.</p>'+
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Les coordonnées se saisissent dans le panneau collant à droite (sous le contenu sur mobile). Modifier un système met à jour les deux autres.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM corrigé.</li><li>Le bouton <b>Cours</b> détaille chaque système, les conversions, le repère local et les dégénérescences.</li><li>Le bouton <b>Mode sombre / clair</b> commute le thème (choix mémorisé).</li></ul>'+
    '<h3>Scène 3D</h3><p>Souris gauche = rotation · molette = zoom · clic droit = déplacement. Axes : x rouge, y vert, z bleu (vertical).</p>'}));
});

/* ================= RESIZE + INIT ================= */
window.addEventListener('resize',()=>{ resize3D(); if(UI.cur==='c2d'){ drawTop(); drawSide(); } });

const hmap={c3d:0,c2d:1,ccv:2}, hh=location.hash.slice(1);
if(hh in hmap) UI.cur=hh;
AS.key=UI.cur;
renderSeg(); mountWs(); renderAct(); renderCourse();
})();
</script>
