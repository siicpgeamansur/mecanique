/* ---------- cours ---------- */
const COURSE = [];
COURSE.push({ id: 'reducteur', t: 'À quoi sert un réducteur ?', h: `
<p>Un moteur électrique tourne vite (de 1 000 à 6 000 tr/min) mais fournit un couple faible. La plupart des mécanismes ont besoin du contraire : une vitesse plus lente et un couple plus élevé. Le réducteur de vitesse fait cette adaptation.</p>
<h3>La puissance se conserve</h3>
<div class="formula">P = C·ω &nbsp;;&nbsp; sans pertes : C<sub>e</sub>·ω<sub>e</sub> = C<sub>s</sub>·ω<sub>s</sub> &nbsp;⇒&nbsp; C<sub>s</sub> = C<sub>e</sub>·ω<sub>e</sub>/ω<sub>s</sub> = C<sub>e</sub>/|k|</div>
<p>Avec des pertes, on introduit le rendement η : C<sub>s</sub>·ω<sub>s</sub> = η·C<sub>e</sub>·ω<sub>e</sub>. Le couple de sortie est alors un peu plus faible.</p>
<table class="ctable"><tr><th>Réducteur 1/4</th><th>Entrée</th><th>Sortie (η = 1)</th></tr><tr><td>Vitesse</td><td>1 000 tr/min</td><td>250 tr/min</td></tr><tr><td>Couple</td><td>2 N·m</td><td>8 N·m</td></tr><tr><td>Puissance</td><td>209 W</td><td>209 W</td></tr></table>
<p>Pour passer des tr/min aux rad/s : ω(rad/s) = 2π·N(tr/min)/60.</p>
<div class="retain"><b>À retenir.</b> Un réducteur sert à réduire la vitesse de rotation, mais surtout à augmenter le couple. Si la vitesse est divisée par 4, le couple est multiplié par 4 (au rendement près).</div>` });
COURSE.push({ id: 'module', t: 'Module et diamètre : D = m·Z', h: `
<p>Une roue dentée est décrite par son nombre de dents <b>Z</b> et son <b>module</b> <b>m</b> (en mm), qui fixe la taille des dents. Le diamètre primitif D est le diamètre du cercle sur lequel deux roues « roulent sans glisser » l’une sur l’autre.</p>
<div class="formula">D = m·Z &nbsp;&nbsp; (R = D/2 = m·Z/2) &nbsp;&nbsp; ; pas p = π·m</div>
<ul><li>Deux roues qui engrènent ont <b>le même module</b>.</li><li>L’entraxe de deux roues en contact extérieur : a = (D<sub>1</sub> + D<sub>2</sub>)/2 = m·(Z<sub>1</sub> + Z<sub>2</sub>)/2.</li><li>Au point de contact, la vitesse est la même sur les deux roues : V = ω<sub>1</sub>·R<sub>1</sub> = |ω<sub>2</sub>|·R<sub>2</sub>.</li></ul>
<table class="ctable"><tr><th>m (mm)</th><th>Z</th><th>D = m·Z (mm)</th></tr><tr><td>2</td><td>25</td><td>50</td></tr><tr><td>2</td><td>75</td><td>150</td></tr><tr><td>3</td><td>40</td><td>120</td></tr></table>
<div class="retain"><b>À retenir.</b> D = m·Z. Comme ω<sub>1</sub>·R<sub>1</sub> = |ω<sub>2</sub>|·R<sub>2</sub>, le rapport des vitesses est le rapport inverse des rayons, des diamètres ou des nombres de dents.</div>` });
COURSE.push({ id: 'rapport', t: 'Rapport de réduction d’un train', h: `
<h3>Une paire de roues</h3>
<div class="formula">ω<sub>2</sub>/ω<sub>1</sub> = ± R<sub>1</sub>/R<sub>2</sub> = ± D<sub>1</sub>/D<sub>2</sub> = ± Z<sub>1</sub>/Z<sub>2</sub></div>
<p>Le signe est « − » pour un contact <b>extérieur</b> (les roues tournent en sens inverse) et « + » pour un contact <b>intérieur</b> (couronne). C’est le rapport de transmission de la paire.</p>
<h3>Un train d’engrenages</h3>
<p>Le rapport de réduction du train est le produit des rapports de chaque paire :</p>
<div class="formula">k = ω<sub>sortie</sub>/ω<sub>entrée</sub> = (−1)<sup>n</sup> × ∏ Z<sub>menantes</sub> / ∏ Z<sub>menées</sub></div>
<p>où <b>n est le nombre de contacts extérieurs</b>. Un contact extérieur inverse le sens de rotation, donc le signe de k dit si l’entrée et la sortie tournent dans le même sens (k &gt; 0) ou en sens inverse (k &lt; 0).</p>
<ul><li>|k| &lt; 1 : réducteur (vitesse divisée, couple multiplié).</li><li>|k| &gt; 1 : multiplicateur.</li></ul>
<p><b>Attention à la convention.</b> Selon les ouvrages, le « rapport de réduction » ou le « rapport de transmission » désigne ω<sub>s</sub>/ω<sub>e</sub> (convention de cette page) ou son inverse ω<sub>e</sub>/ω<sub>s</sub>. Regardez toujours la définition donnée dans le sujet.</p>
<table class="ctable"><tr><th>Train</th><th>n</th><th>k</th></tr><tr><td>Z<sub>1</sub> = 20 → Z<sub>2</sub> = 60</td><td>1</td><td>−20/60 = −1/3</td></tr><tr><td>Z<sub>1</sub> = 20 → Z<sub>2</sub> → Z<sub>3</sub> = 40</td><td>2</td><td>+20/40 = +1/2</td></tr><tr><td>Deux étages 20/40 puis 20/60</td><td>2</td><td>+(20·20)/(40·60) = +1/6</td></tr></table>
<div class="retain"><b>À retenir.</b> k = (−1)<sup>n</sup> × (produit des Z menantes)/(produit des Z menées), avec n le nombre de contacts extérieurs.</div>` });
COURSE.push({ id: 'simple', t: 'Train simple : solides à une ou deux roues', h: `
<p>Un <b>train simple</b> est une suite de solides (arbres) en série ; chaque solide engrène avec le suivant. Un solide intermédiaire peut porter :</p>
<ul><li><b>une seule roue</b> : elle engrène avec la roue précédente et la suivante, c’est une roue intermédiaire (« parasite ») ;</li><li><b>deux roues solidaires</b> de nombres de dents différents (Z et Z′) : la première engrène avec le solide précédent, la seconde avec le suivant. Les deux roues tournent à la même vitesse.</li></ul>
<div class="formula">k = (−1)<sup>n</sup> × (produit des Z menantes)/(produit des Z menées)</div>
<p>Avec des roues uniques, les nombres de dents intermédiaires se simplifient : k = (−1)<sup>N−1</sup> × Z<sub>1</sub>/Z<sub>N</sub>. Elles ne changent que le sens de rotation et servent à éloigner l’entrée de la sortie.</p>
<p>Avec des solides à <b>deux roues</b>, rien ne se simplifie : chaque étage (paire Z<sub>menante</sub>/Z<sub>menée</sub>) multiplie le rapport. Deux étages de rapport 1/3 donnent 1/9 sans roue de plus de 3 fois le diamètre de la petite.</p>
<h3>Les limites</h3>
<ul><li>Avec une seule paire, pour réduire beaucoup il faut une petite roue menante et une très grande roue menée : l’encombrement augmente vite (Z<sub>1</sub> = 10 et Z<sub>2</sub> = 80 donnent seulement |k| = 1/8).</li><li>Les solides à deux roues permettent de réduire par étages, mais ajoutent des arbres, des paliers et de la longueur. Pour aller plus loin à encombrement égal, on utilise un train épicycloïdal.</li></ul>
<div class="retain"><b>À retenir.</b> Roue intermédiaire unique : elle inverse le sens, sans effet sur |k|. Solide à deux roues : les roues tournent à la même vitesse, et c’est ce qui permet de multiplier les rapports de plusieurs étages.</div>` });
COURSE.push({ id: 'epi', t: 'Train épicycloïdal : constituants', h: `
<p>Un train épicycloïdal est un train d’engrenages dont certains axes sont mobiles. Il comprend :</p>
<ul><li>le <b>solaire</b> (ou planétaire) S, au centre, à denture extérieure ;</li><li>la <b>couronne</b> C, à denture intérieure ;</li><li>des <b>satellites</b> qui engrènent à la fois avec S et avec C ;</li><li>le <b>porte-satellites</b> PS, qui porte les axes des satellites.</li></ul>
<p>Le solaire, la couronne et le porte-satellites tournent autour du <b>même axe</b>. Les satellites tournent sur leur propre axe et se déplacent autour de l’axe central.</p>
<p>Ce mécanisme a deux degrés de liberté : pour imposer un seul rapport de réduction, on <b>fixe une pièce au bâti</b> et l’on choisit l’entrée parmi les deux autres, la troisième est la sortie. Sinon, il faut imposer la vitesse de deux pièces (cas du différentiel).</p>
<div class="retain"><b>À retenir.</b> Trois pièces coaxiales (S, C, PS) : une fixe, une en entrée, une en sortie. Les satellites ne sont jamais ni entrée ni sortie, ce sont des roues intermédiaires.</div>` });
COURSE.push({ id: 'montage', t: 'Contraintes de montage', h: `
<p>Pour qu’un train épicycloïdal soit réalisable, plusieurs conditions géométriques doivent être vérifiées.</p>
<ol>
<li><b>Coaxialité.</b> Les satellites engrènent à la fois avec le solaire et avec la couronne, donc le rayon de la couronne est la somme du rayon du solaire et du diamètre d’un satellite :
<div class="formula">R<sub>C</sub> = R<sub>S</sub> + 2·R<sub>P</sub> &nbsp;⇔&nbsp; D<sub>C</sub> = D<sub>S</sub> + 2·D<sub>P</sub> &nbsp;⇔&nbsp; Z<sub>C</sub> = Z<sub>S</sub> + 2·Z<sub>P</sub></div></li>
<li><b>Entraxe et porte-satellites.</b> L’axe d’un satellite est à la distance a = R<sub>S</sub> + R<sub>P</sub> de l’axe central. Dans un schéma cinématique, le porte-satellites se dessine en forme de <b>haricot</b> qui relie l’axe central à l’axe de chaque satellite.</li>
<li><b>Assemblage.</b> Avec N satellites équirépartis, il faut que (Z<sub>S</sub> + Z<sub>C</sub>)/N soit un entier, sinon le dernier satellite ne peut pas s’engager entre les dents.</li>
<li><b>Non-interférence.</b> Les satellites voisins ne doivent pas se toucher : 2·a·sin(π/N) &gt; m·(Z<sub>P</sub> + 2) (diamètre de tête d’un satellite).</li>
</ol>
<table class="ctable"><tr><th>Z<sub>S</sub></th><th>Z<sub>P</sub></th><th>Z<sub>C</sub> = Z<sub>S</sub> + 2·Z<sub>P</sub></th><th>N possibles</th></tr><tr><td>20</td><td>20</td><td>60</td><td>2, 4, 5 (80/N entier)</td></tr><tr><td>24</td><td>18</td><td>60</td><td>2, 3, 4, 6 (84/N entier)</td></tr></table>
<div class="retain"><b>À retenir.</b> Z<sub>C</sub> = Z<sub>S</sub> + 2·Z<sub>P</sub> (somme des rayons ou des diamètres), (Z<sub>S</sub> + Z<sub>C</sub>)/N entier, et porte-satellites en haricot de longueur a = R<sub>S</sub> + R<sub>P</sub>.</div>` });
COURSE.push({ id: 'willis', t: 'Formule de Willis', h: `
<p>La formule de Willis relie les vitesses des trois pièces coaxiales, en utilisant le fait que, <b>dans le repère du porte-satellites</b>, le train se comporte comme un train simple.</p>
<div class="formula">(ω<sub>C/0</sub> − ω<sub>PS/0</sub>) / (ω<sub>S/0</sub> − ω<sub>PS/0</sub>) = (−1)<sup>n</sup> × Z<sub>S</sub>/Z<sub>C</sub> = −Z<sub>S</sub>/Z<sub>C</sub></div>
<p>Ici n = 1 : un contact extérieur (solaire–satellite). Le satellite est une roue intermédiaire et le contact intérieur (satellite–couronne) ne compte pas dans n. Les vitesses sont mesurées par rapport au bâti (repère 0).</p>
<h3>Les cas usuels</h3>
<table class="ctable"><tr><th>Pièce fixe</th><th>Entrée → sortie</th><th>k</th><th>Z<sub>S</sub> = 20, Z<sub>C</sub> = 60</th></tr>
<tr><td>Couronne</td><td>S → PS</td><td>Z<sub>S</sub>/(Z<sub>S</sub> + Z<sub>C</sub>)</td><td>1/4</td></tr>
<tr><td>Solaire</td><td>C → PS</td><td>Z<sub>C</sub>/(Z<sub>S</sub> + Z<sub>C</sub>)</td><td>3/4</td></tr>
<tr><td>Porte-satellites</td><td>S → C</td><td>−Z<sub>S</sub>/Z<sub>C</sub></td><td>−1/3</td></tr>
<tr><td>Solaire</td><td>PS → C</td><td>(Z<sub>S</sub> + Z<sub>C</sub>)/Z<sub>C</sub></td><td>4/3</td></tr></table>
<p><b>Exemple.</b> Couronne fixe (ω<sub>C</sub> = 0) : −ω<sub>PS</sub>/(ω<sub>S</sub> − ω<sub>PS</sub>) = −Z<sub>S</sub>/Z<sub>C</sub>, d’où ω<sub>PS</sub>·(Z<sub>C</sub> + Z<sub>S</sub>) = Z<sub>S</sub>·ω<sub>S</sub>.</p>
<div class="retain"><b>À retenir.</b> Écrire Willis, remplacer les deux vitesses connues (dont celle de la pièce fixe, nulle) et résoudre pour la troisième. Les vitesses sont toujours relatives au bâti.</div>` });
COURSE.push({ id: 'avantage', t: 'Pourquoi un train épicycloïdal ?', h: `
<p>À encombrement équivalent, un train épicycloïdal permet un <b>meilleur rapport de réduction</b> qu’un train simple à deux roues.</p>
<table class="ctable"><tr><th>Exemple, m = 2 mm</th><th>Train simple</th><th>Train épicycloïdal</th></tr><tr><td>Rapport |k|</td><td>1/4</td><td>1/4</td></tr><tr><td>Roues</td><td>Z = 20 et Z = 80</td><td>Z<sub>S</sub> = 20, Z<sub>P</sub> = 20, Z<sub>C</sub> = 60</td></tr><tr><td>Encombrement</td><td>D<sub>1</sub> + D<sub>2</sub> = 200 mm</td><td>D<sub>C</sub> = 120 mm</td></tr></table>
<ul><li><b>Compacité :</b> l’encombrement est plus faible pour un même rapport.</li><li><b>Coaxialité :</b> l’entrée et la sortie sont sur le même axe.</li><li><b>Répartition de l’effort :</b> le couple passe par plusieurs satellites, ce qui permet de transmettre plus de couple avec des dents plus petites.</li><li><b>Plusieurs rapports :</b> selon la pièce fixée, un même mécanisme donne plusieurs rapports.</li></ul>
<p>Inconvénients : montage plus complexe (contraintes de montage) et fabrication d’une denture intérieure.</p>
<div class="retain"><b>À retenir.</b> À encombrement équivalent, le train épicycloïdal offre un plus grand rapport de réduction qu’un train simple. Il est aussi compact et coaxial. C’est pourquoi on le trouve dans les motoréducteurs et les boîtes automatiques.</div>` });
COURSE.push({ id: 'trapeze', t: 'Commande trapézoïdale en vitesse', h: `
<p>Pour éviter les à-coups (accélération infinie), on impose à un axe un profil de vitesse en trapèze : accélération constante <b>a</b> pendant t<sub>a</sub>, vitesse constante V<sub>max</sub> pendant t<sub>c</sub>, puis décélération constante <b>d</b> pendant t<sub>d</sub>.</p>
<div class="formula">t<sub>a</sub> = V<sub>max</sub>/a &nbsp;;&nbsp; t<sub>d</sub> = V<sub>max</sub>/d &nbsp;;&nbsp; T = t<sub>a</sub> + t<sub>c</sub> + t<sub>d</sub></div>
<h3>La distance est l’aire sous v(t)</h3>
<div class="formula">D = V<sub>max</sub> × (T − (t<sub>a</sub> + t<sub>d</sub>)/2) &nbsp;;&nbsp; si t<sub>a</sub> = t<sub>d</sub> : D = V<sub>max</sub> × (T − t<sub>a</sub>)</div>
<h3>Calcul des temps (a et V<sub>max</sub> connus)</h3>
<p>Distance parcourue en accélération et décélération : D<sub>ad</sub> = V<sub>max</sub>²/(2a) + V<sub>max</sub>²/(2d).</p>
<ul><li>Si D ≥ D<sub>ad</sub> (profil trapézoïdal) : t<sub>c</sub> = (D − D<sub>ad</sub>)/V<sub>max</sub>. Avec a = d : <b>T = D/V<sub>max</sub> + V<sub>max</sub>/a</b>.</li><li>Si D &lt; D<sub>ad</sub> (profil triangulaire) : V<sub>max</sub> n’est pas atteinte. Avec a = d : V<sub>pic</sub> = √(a·D) et T = 2·√(D/a).</li></ul>
<h3>Calcul de a et V<sub>max</sub> (temps connus)</h3>
<p>Avec T, t<sub>a</sub> et t<sub>d</sub> donnés : <b>V<sub>max</sub> = D/(T − (t<sub>a</sub> + t<sub>d</sub>)/2)</b>, puis a = V<sub>max</sub>/t<sub>a</sub> et d = V<sub>max</sub>/t<sub>d</sub>. Cas courant « trois tiers » (t<sub>a</sub> = t<sub>c</sub> = t<sub>d</sub> = T/3) : V<sub>max</sub> = 3D/(2T) et a = 9D/(2T²).</p>
<p>Si on donne a, T et D, on résout V<sub>max</sub>²/a − T·V<sub>max</sub> + D = 0 et l’on garde la racine qui donne t<sub>c</sub> ≥ 0.</p>
<h3>Unités</h3>
<table class="ctable"><tr><th>Translation</th><th>Rotation</th></tr><tr><td>m, m/s, m/s²</td><td>rad, rad/s, rad/s² (ω = 2π·N/60)</td></tr></table>
<div class="retain"><b>À retenir.</b> Distance = aire du trapèze. Toujours vérifier si V<sub>max</sub> est atteinte (D ≥ D<sub>ad</sub>) avant d’écrire t<sub>c</sub>. Souvent a = d, ou t<sub>a</sub> = t<sub>d</sub>.</div>` });

/* ---------- interface ---------- */
const UI = { cur: 'g1' };
const AS = { key: 'g1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'reducteur' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  ANIM.fn = null;
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal', html: '<b>Objectif. </b>' + a.goal }));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w })); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : engrenages et commande trapézoïdale'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers sur les réducteurs (SI, CPGE) : train d’engrenages simple, train épicycloïdal, exercices sur le rapport de réduction, commande trapézoïdale en vitesse et exercices sur le profil trapézoïdal.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Dans les ateliers 1, 2 et 4, réglez les curseurs : les vues de face et de dessus s’animent et les calculs se mettent à jour. Le bouton Pause arrête l’animation.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> rappelle D = m·Z, le rapport de réduction, les contraintes de montage, la formule de Willis et le profil trapézoïdal.</li><li>Dans les exercices, tapez un nombre (virgule ou point) ou une fraction comme 1/4. Le signe compte.</li></ul>' +
    '<h3>Convention</h3><p>Le rapport de réduction k vaut ω<sub>sortie</sub>/ω<sub>entrée</sub>. Le sens positif est le sens horaire sur la vue de face.</p>' +
    '<h3>Vos données</h3><p>Les réponses au QCM et le choix clair ou sombre sont mémorisés dans ce navigateur uniquement.</p>' }));
});
/* thème clair (par défaut) ou sombre */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  const b = $('#bTheme'); b.textContent = t === 'dark' ? 'Mode clair' : 'Mode sombre'; b.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
}
applyTheme(lsGet(KEYS.theme, 'light'));
$('#bTheme').addEventListener('click', () => { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(t); lsSet(KEYS.theme, t); });
/* boucle d'animation */
function loop(ts) {
  const dt = Math.min(0.05, (ts - ANIM.last) / 1000 || 0); ANIM.last = ts;
  if (ANIM.fn && !CS.open && !document.hidden) { try { ANIM.fn(dt); } catch (e) { ANIM.fn = null; } }
  requestAnimationFrame(loop);
}
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); requestAnimationFrame(loop); })();
</script>
