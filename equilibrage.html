<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Équilibrer dynamiquement un solide en rotation — SII · CPGE PSI*</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:180px;max-width:100%}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.task-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.task-row:last-child{border-bottom:0}
.task-row .chips{margin:0}
canvas.viz{width:100%;height:300px;display:block;border:1px solid var(--line);border-radius:8px;background:#fafbfc;cursor:default}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.card h4{margin:0 0 6px;font-size:14px;color:var(--accent-ink)}
.card p{font-size:13px;margin:4px 0}
.toggle-card{border:2px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer;background:var(--panel);transition:border-color .15s}
.toggle-card:hover{border-color:var(--accent)}
.toggle-card.active{border-color:var(--accent);background:var(--accent-soft)}
.toggle-card h4{margin:0 0 6px;font-size:14px}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  .task-row{grid-template-columns:1fr}
  canvas.viz{height:260px}
  .opts input[type=range]{width:140px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}.toggle-card{transition:border-color .15s,background .15s}}
</style>
</head>
<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand">
      <svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="10" fill="none" stroke="#2e6da4" stroke-width="1.5"/>
        <circle cx="13" cy="13" r="2" fill="#2e6da4"/>
        <circle cx="13" cy="13" r="10" fill="none" stroke="#1e7a2e" stroke-width="1.5" stroke-dasharray="2 4"/>
        <circle cx="19" cy="8" r="2" fill="#c0281f"/>
        <line x1="13" y1="13" x2="19" y2="8" stroke="#c0281f" stroke-width="1.2" stroke-dasharray="2 2"/>
        <path d="M 22 13 A 9 9 0 0 1 13 22" fill="none" stroke="#9a5b00" stroke-width="1.5"/>
      </svg>
      <span>Équilibrer dynamiquement <small>SII · CPGE PSI*</small></span>
    </div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Activité</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>
  <div class="band" id="modes"><div class="inner row"><div class="seg" id="wsSeg" role="tablist" aria-label="Ateliers"></div></div></div>
  <main class="inner work" id="work">
    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>
    <aside id="act" hidden aria-label="Activité"></aside>
  </main>
  <section id="course" hidden aria-label="Cours"></section>
</div>
<div id="dlg" hidden></div>

<script>
'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-o7-v1' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const WORKSHOPS = [];

/* Paramètres physiques réalistes */
const PHY = {
  M: 10, g: 9.81, L: 0.1, d: 0.05,
  omega: 2 * Math.PI * 30000 / 60,
  r: 0.05e-3,
  D: 1e-4,
  E: 0
};

function computeForces(theta, p) {
  const w2 = p.omega * p.omega;
  const ct = Math.cos(theta), st = Math.sin(theta);
  const XA = (p.D * w2 * st) / p.L + (p.M * p.r - p.E / p.L) * w2 * ct - p.M * p.g * (1 + p.d / p.L);
  const XB = (p.D * w2 * st - p.E * w2 * ct + p.M * p.g * p.d) / p.L;
  const YA = (p.M * p.r + p.E / p.L) * w2 * st - (p.D * w2 * ct) / p.L;
  const YB = (-p.D * w2 * ct + p.E * w2 * st) / p.L;
  return { XA, YA, XB, YB };
}

/* ============ ATELIER 1 : TYPES DE PROBLÈMES ============ */
const TYPES_DATA = [
  { t: "Connaissant les efforts (moteur, pesanteur, vérin), trouver les lois de mouvement", ans: "eff→mvt",
    why: "C'est le problème classique du PFD/TEC : des efforts aux mouvements." },
  { t: "Imposer une loi de vitesse en trapèze et déterminer le couple moteur nécessaire", ans: "mvt→eff",
    why: "C'est le dimensionnement d'actionneur : du mouvement aux efforts." },
  { t: "Déterminer la répartition de masse pour éviter les vibrations à grande vitesse", ans: "rep",
    why: "C'est l'équilibrage : du mouvement et des efforts à la répartition des masses." },
  { t: "Calculer l'effort dans un roulement connaissant la loi de vitesse imposée", ans: "mvt→eff",
    why: "Le mouvement est imposé, on cherche les efforts transmis dans la liaison." },
  { t: "Trouver l'équation différentielle du mouvement d'un vérin soumis à une pression", ans: "eff→mvt",
    why: "Les efforts (pression, pesanteur) sont connus, on cherche le mouvement." },
  { t: "Placer des masselottes sur une jante pour supprimer les vibrations", ans: "rep",
    why: "On agit sur la répartition des masses pour annuler les efforts tournants." }
];
const ANS_LABEL = { "eff→mvt": "Des efforts aux mouvements", "mvt→eff": "Du mouvement aux efforts", "rep": "Répartition des masses" };
const TYPES_ST = { assign: {}, checked: false };

function mountTypes(root) {
  root.innerHTML = '<h2>1. Types de problèmes</h2>'
    + '<p>En CPGE, on distingue <b>trois grandes familles</b> de problèmes selon ce qui est connu et ce que l\'on cherche :</p>'
    + '<ul>'
    + '<li><b>Des efforts aux mouvements</b> : on connaît les efforts, on cherche les lois de mouvement.</li>'
    + '<li><b>Du mouvement aux efforts</b> : on impose un mouvement, on cherche les efforts (dimensionnement d\'actionneur, calcul d\'efforts de liaison).</li>'
    + '<li><b>Répartition des masses</b> : on veut répartir la masse pour éviter les vibrations (équilibrage).</li>'
    + '</ul>'
    + '<p>Attribuez à chaque étude sa famille, puis cliquez sur <b>Vérifier</b>.</p>'
    + '<div id="types-rows"></div>'
    + '<div class="files" style="margin-top:8px"><button class="btn pri" id="types-check" type="button">Vérifier</button><button class="btn" id="types-reset" type="button">Recommencer</button></div>'
    + '<div class="verdict" id="types-msg"></div>';
  renderTypes();
  $('#types-check').addEventListener('click', () => { TYPES_ST.checked = true; renderTypes(); });
  $('#types-reset').addEventListener('click', () => { TYPES_ST.assign = {}; TYPES_ST.checked = false; renderTypes(); });
}
function renderTypes() {
  const box = $('#types-rows'); if (!box) return; box.innerHTML = '';
  TYPES_DATA.forEach((task, i) => {
    const fb = h('div', { class: 'fb', style: 'font-size:12.5px;color:var(--muted);margin-top:2px' });
    if (TYPES_ST.checked) {
      const ok = TYPES_ST.assign[i] === task.ans;
      fb.style.color = ok ? 'var(--ok)' : 'var(--bad)';
      fb.innerHTML = (ok ? '✓ ' : '✗ Bonne réponse : <b>' + ANS_LABEL[task.ans] + '</b>. ') + task.why;
    }
    const chips = h('div', { class: 'chips' });
    Object.entries(ANS_LABEL).forEach(([key, label]) => {
      chips.append(h('button', {
        type: 'button', class: 'chip' + (TYPES_ST.assign[i] === key ? ' on' : ''),
        onclick: () => { if (TYPES_ST.checked) return; TYPES_ST.assign[i] = TYPES_ST.assign[i] === key ? null : key; renderTypes(); }
      }, label));
    });
    box.append(h('div', { class: 'task-row' }, h('div', null, h('span', null, (i + 1) + '. ' + task.t), fb), chips));
  });
  const done = Object.values(TYPES_ST.assign).filter(v => v != null).length;
  const msg = $('#types-msg'); if (!msg) return;
  if (TYPES_ST.checked) {
    let ok = 0; TYPES_DATA.forEach((t, i) => { if (TYPES_ST.assign[i] === t.ans) ok++; });
    msg.className = 'verdict ' + (ok === TYPES_DATA.length ? 'yes' : 'warn');
    msg.textContent = 'Score : ' + ok + ' / ' + TYPES_DATA.length + '.';
  } else { msg.className = 'verdict'; msg.textContent = done + ' / ' + TYPES_DATA.length + ' attribuée(s).'; }
}
WORKSHOPS.push({ id: 'types', title: 'Types de problèmes', hint: 'Classer les études en trois familles.', mount: mountTypes,
  reset: () => { TYPES_ST.assign = {}; TYPES_ST.checked = false; } });

/* ============ ATELIER 2 : SOURCE DES VIBRATIONS ============ */
const CYL = { M: 10, R: 0.05, Lc: 0.1 };
const VIB = {
  a: 0.05,
  alpha: 0,
  N: 30000,
  omega: 2 * Math.PI * 30000 / 60,
  theta: 0,
  playing: true,
  raf: null,
  lastT: null
};

function vibDerived() {
  const M = CYL.M, R = CYL.R, Lc = CYL.Lc;
  const Iaxe = M * R * R / 2;
  const Iperp = M * (3 * R * R + Lc * Lc) / 12;
  const al = VIB.alpha * Math.PI / 180;
  const r = VIB.a * 1e-3;
  const D = 0;
  const E = (Iperp - Iaxe) * Math.sin(al) * Math.cos(al) + M * r * PHY.d;
  return { r, D, E, Iaxe, Iperp };
}

function vibParams() {
  const d = vibDerived();
  return Object.assign({}, PHY, { r: d.r, D: d.D, E: d.E, omega: VIB.omega });
}

function vibOmegaVis() { return Math.max(0.4, Math.min(VIB.omega / 1000, 6)); }
function vibSlowFactor() { return VIB.omega / vibOmegaVis(); }

function mountVib(root) {
  stopVibAnim();
  root.innerHTML =
    '<h2>2. Source des vibrations</h2>'
    + '<p>Le cylindre est monté sur un arbre guidé en rotation par deux roulements A et B (liaison pivot d\'axe (AB)). Deux défauts de montage suffisent à créer des vibrations :</p>'
    + '<ul>'
    + '<li><b>une translation verticale</b> du cylindre par rapport à l\'axe : G quitte l\'axe, déséquilibre <b>statique</b> (r = |OG|) ;</li>'
    + '<li><b>une inclinaison</b> de l\'axe du cylindre par rapport à (AB) : les produits d\'inertie D et E ne sont plus nuls, déséquilibre <b>dynamique</b>.</li>'
    + '</ul>'
    + '<p><b>Remarque de physique.</b> Une translation pure d\'un cylindre parfait ne crée <b>pas</b> de produit d\'inertie (symétrie de révolution). Pour obtenir D ≠ 0 ou E ≠ 0, il faut <b>incliner</b> l\'axe. Les valeurs r, D, E affichées sont calculées à partir de la géométrie (cylindre de 10 kg, R = 5 cm, L = 10 cm).</p>'
    + '<p class="small">D et E sont les produits d\'inertie du cylindre <b>dans le repère lié au rotor</b> : ce sont des constantes. C\'est la projection des efforts centrifuges sur les roulements fixes qui fait apparaître les sin θ, cos θ dans les formules des efforts.</p>'
    + '<div class="opts">'
    + '<label class="fld"><span>Translation verticale = <b id="vib-a-out">0.05</b> mm</span><input type="range" id="vib-a" min="0" max="0.2" step="0.005"></label>'
    + '<label class="fld"><span>Inclinaison α = <b id="vib-al-out">0.0</b> °</span><input type="range" id="vib-al" min="-8" max="8" step="0.2"></label>'
    + '<label class="fld"><span>Vitesse = <b id="vib-w-out">30000</b> tr/min</span><input type="range" id="vib-w" min="1000" max="60000" step="1000"></label>'
    + '</div>'
    + '<div class="gstats" id="vib-derived"></div>'
    + '<div class="small" id="vib-note" style="margin-bottom:8px"></div>'
    + '<div class="files" style="margin:4px 0 10px">'
    + '<button class="btn pri" id="vib-play" type="button">Pause</button>'
    + '<button class="btn" id="vib-zero" type="button">α = 0</button>'
    + '</div>'
    + '<canvas class="viz" id="vib-solid" style="height:300px"></canvas>'
    + '<canvas class="viz" id="vib-plot" style="height:300px"></canvas>'
    + '<div class="leg" style="display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0">'
    + '<span><span style="display:inline-block;width:12px;height:3px;background:#2e6da4;vertical-align:middle;margin-right:4px"></span>X<sub>A</sub></span>'
    + '<span><span style="display:inline-block;width:12px;height:3px;background:#1e7a2e;vertical-align:middle;margin-right:4px"></span>Y<sub>A</sub></span>'
    + '<span><span style="display:inline-block;width:12px;height:3px;background:#c0281f;vertical-align:middle;margin-right:4px"></span>X<sub>B</sub></span>'
    + '<span><span style="display:inline-block;width:12px;height:3px;background:#9a5b00;vertical-align:middle;margin-right:4px"></span>Y<sub>B</sub></span>'
    + '</div>'
    + '<div class="verdict" id="vib-msg"></div>';

  $('#vib-a').value = VIB.a;
  $('#vib-al').value = VIB.alpha;
  $('#vib-w').value = VIB.N;
  $('#vib-play').textContent = VIB.playing ? 'Pause' : 'Démarrer';

  $('#vib-a').addEventListener('input', e => { VIB.a = +e.target.value; vibUpdate(); });
  $('#vib-al').addEventListener('input', e => { VIB.alpha = +e.target.value; vibUpdate(); });
  $('#vib-w').addEventListener('input', e => {
    VIB.N = +e.target.value;
    VIB.omega = 2 * Math.PI * VIB.N / 60;
    vibUpdate();
  });
  $('#vib-play').addEventListener('click', () => {
    VIB.playing = !VIB.playing;
    $('#vib-play').textContent = VIB.playing ? 'Pause' : 'Démarrer';
    if (VIB.playing) startVibAnim(); else stopVibAnim();
    drawVib();
  });
  $('#vib-zero').addEventListener('click', () => {
    VIB.alpha = 0;
    $('#vib-al').value = 0;
    vibUpdate();
  });

  vibUpdate();
  if (VIB.playing) startVibAnim();
}

function vibUpdate() {
  const d = vibDerived();
  $('#vib-a-out').textContent = VIB.a.toFixed(2);
  $('#vib-al-out').textContent = VIB.alpha.toFixed(1);
  $('#vib-w-out').textContent = VIB.N;

  const stats = $('#vib-derived');
  stats.innerHTML = '';
  stats.append(
    h('div', { class: 'stat' },
      h('span', null, 'r = |OG| (calculé)'),
      h('b', { style: 'color:' + (d.r > 1e-6 ? 'var(--bad)' : 'var(--ok)') },
        (d.r * 1000).toFixed(3) + ' mm')),
    h('div', { class: 'stat' },
      h('span', null, 'D (calculé)'),
      h('b', null, (d.D * 1e4).toFixed(2) + ' ×10⁻⁴')),
    h('div', { class: 'stat' },
      h('span', null, 'E (calculé)'),
      h('b', { style: 'color:' + (Math.abs(d.E) > 1e-6 ? 'var(--bad)' : 'var(--ok)') },
        (d.E * 1e4).toFixed(2) + ' ×10⁻⁴'))
  );

  const slow = vibSlowFactor();
  const tRev = 60 / VIB.N;
  $('#vib-note').innerHTML = 'Vitesse réelle : <b>' + VIB.N + ' tr/min</b> soit '
    + (VIB.N / 60).toFixed(1) + ' tr/s (1 tour = ' + (tRev * 1000).toFixed(1)
    + ' ms). Pour rester lisible, l\'animation est <b>ralentie ×'
    + Math.round(slow) + '</b> (1 tour visuel ≈ ' + (2 * Math.PI / vibOmegaVis()).toFixed(1) + ' s).';

  const msg = $('#vib-msg');
  const p = vibParams();
  let min = Infinity, max = -Infinity;
  for (let i = 0; i <= 60; i++) {
    const th = 2 * Math.PI * i / 60;
    const f = computeForces(th, p);
    ['XA','YA','XB','YB'].forEach(k => { if (f[k] < min) min = f[k]; if (f[k] > max) max = f[k]; });
  }
  const amp = Math.round(max - min);
  const staticOk = d.r < 1e-7;
  const dynOk = Math.abs(d.E) < 1e-7 && Math.abs(d.D) < 1e-7;

  if (staticOk && dynOk) {
    msg.className = 'verdict yes';
    msg.innerHTML = '<b>✓ Cylindre parfaitement équilibré.</b> Les efforts dans les roulements sont <b>constants</b> : aucune vibration.';
  } else if (!staticOk && dynOk) {
    msg.className = 'verdict warn';
    msg.innerHTML = '<b>⚠ Défaut statique seul</b> (translation, pas d\'inclinaison). G tourne autour de l\'axe : les efforts varient à la fréquence ω. Amplitude ~' + amp + ' N.';
  } else if (staticOk && !dynOk) {
    msg.className = 'verdict warn';
    msg.innerHTML = '<b>⚠ Défaut dynamique seul</b> (inclinaison, G sur l\'axe). Les produits d\'inertie D, E ne sont pas nuls : efforts cycliques. Amplitude ~' + amp + ' N.';
  } else {
    msg.className = 'verdict no';
    msg.innerHTML = '<b>✗ Défauts statique ET dynamique.</b> Les efforts varient à ω. Amplitude ~' + amp + ' N.';
  }

  drawVib();
}

function drawVib() {
  drawVibSolid();
  drawVibPlot();
}

function drawVibSolid() {
  const canvas = $('#vib-solid'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);

  const halfW = W / 2;
  const theta = VIB.theta;

  // ================= Vue de côté =================
  const cx1 = halfW / 2, cy1 = H / 2;
  ctx.fillStyle = '#5a6068'; ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Vue de côté — montage du cylindre', cx1, 16);

  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx1 - halfW * 0.44, cy1); ctx.lineTo(cx1 + halfW * 0.44, cy1); ctx.stroke();

  drawBearing(ctx, cx1 - halfW * 0.34, cy1);
  drawBearing(ctx, cx1 + halfW * 0.34, cy1);
  ctx.fillStyle = '#5a6068'; ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('A', cx1 - halfW * 0.34, cy1 + 42);
  ctx.fillText('B', cx1 + halfW * 0.34, cy1 + 42);

  const aPix = Math.min(VIB.a * 80, 45);
  const alRad = VIB.alpha * Math.PI / 180;
  const cylW = halfW * 0.5, cylH = 46;
  ctx.save();
  ctx.translate(cx1, cy1 - aPix);
  ctx.rotate(alRad);
  ctx.fillStyle = 'rgba(46,109,164,0.15)';
  ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 1.5;
  ctx.fillRect(-cylW / 2, -cylH / 2, cylW, cylH);
  ctx.strokeRect(-cylW / 2, -cylH / 2, cylW, cylH);
  ctx.setLineDash([4, 3]); ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(-cylW / 2 - 14, 0); ctx.lineTo(cylW / 2 + 14, 0); ctx.stroke();
  ctx.setLineDash([]);
  ctx.restore();

  const gx = cx1, gy = cy1 - aPix;
  ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
  ctx.beginPath(); ctx.moveTo(cx1, cy1); ctx.lineTo(gx, gy); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(gx, gy, 6, 0, 2 * Math.PI);
  ctx.fillStyle = '#c0281f'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#c0281f'; ctx.font = 'bold 12px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('G', gx + 9, gy + 4);

  ctx.strokeStyle = '#e6eaee'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(halfW, 10); ctx.lineTo(halfW, H - 10); ctx.stroke();

  // ================= Vue de face =================
  const fx = halfW + halfW / 2, fy = H / 2;
  const R = Math.min(halfW, H) * 0.3;

  ctx.fillStyle = '#5a6068'; ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Vue de face (selon z₀) — rotation', fx, 16);

  ctx.beginPath(); ctx.arc(fx, fy, R, 0, 2 * Math.PI);
  ctx.fillStyle = 'rgba(46,109,164,0.10)';
  ctx.fill();
  ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 1.2;
  ctx.stroke();

  const aVis = Math.min(VIB.a * 200, R * 0.85);
  if (aVis > 2) {
    ctx.setLineDash([3, 4]);
    ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(fx, fy, aVis, 0, 2 * Math.PI); ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.beginPath(); ctx.arc(fx, fy, 4, 0, 2 * Math.PI);
  ctx.fillStyle = '#5a6068'; ctx.fill();

  const gxF = fx + aVis * Math.cos(theta);
  const gyF = fy - aVis * Math.sin(theta);
  ctx.setLineDash([3, 2]);
  ctx.strokeStyle = '#c0281f'; ctx.lineWidth = 1.4;
  ctx.beginPath(); ctx.moveTo(fx, fy); ctx.lineTo(gxF, gyF); ctx.stroke();
  ctx.setLineDash([]);
  ctx.beginPath(); ctx.arc(gxF, gyF, 7, 0, 2 * Math.PI);
  ctx.fillStyle = '#c0281f'; ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#c0281f'; ctx.font = 'bold 12px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('G', gxF + 10, gyF + 4);

  if (Math.abs(VIB.alpha) > 0.1) {
    const alphaVis = Math.min(Math.abs(VIB.alpha) * 4, R * 0.6) * Math.sign(VIB.alpha);
    ctx.strokeStyle = '#7b4fc2'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(fx, fy);
    ctx.lineTo(fx + alphaVis * Math.cos(theta), fy - alphaVis * Math.sin(theta));
    ctx.stroke();
    ctx.fillStyle = '#7b4fc2'; ctx.font = '10px "IBM Plex Sans", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText('inclinaison', fx + alphaVis * Math.cos(theta) + 4, fy - alphaVis * Math.sin(theta) - 4);
  }

  ctx.fillStyle = '#9a5b00'; ctx.font = '12px "IBM Plex Mono", monospace';
  ctx.textAlign = 'center';
  ctx.fillText('θ = ' + (theta * 180 / Math.PI).toFixed(0) + '°', fx, H - 12);

  ctx.strokeStyle = '#b9bfc7'; ctx.lineWidth = 1; ctx.setLineDash([2, 3]);
  ctx.beginPath(); ctx.moveTo(fx - R - 12, fy); ctx.lineTo(fx + R + 12, fy); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(fx, fy - R - 12); ctx.lineTo(fx, fy + R + 12); ctx.stroke();
  ctx.setLineDash([]);
  ctx.fillStyle = '#8a929c'; ctx.font = '10px "IBM Plex Mono", monospace';
  ctx.textAlign = 'left'; ctx.fillText('x₀', fx + R + 14, fy + 4);
  ctx.fillText('y₀', fx + 4, fy - R - 14);
}

function drawBearing(ctx, x, y) {
  ctx.fillStyle = '#e6eaee'; ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(x - 12, y + 12); ctx.lineTo(x + 12, y + 12); ctx.lineTo(x, y + 32);
  ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.strokeStyle = '#b9bfc7'; ctx.lineWidth = 1;
  for (let i = -8; i <= 8; i += 4) {
    ctx.beginPath(); ctx.moveTo(x + i, y + 12); ctx.lineTo(x + i - 4, y + 18); ctx.stroke();
  }
  ctx.fillStyle = '#d0d5da'; ctx.strokeStyle = '#5a6068'; ctx.lineWidth = 1.5;
  ctx.fillRect(x - 10, y - 10, 20, 20);
  ctx.strokeRect(x - 10, y - 10, 20, 20);
  ctx.beginPath(); ctx.arc(x, y, 4, 0, 2 * Math.PI);
  ctx.fillStyle = '#5a6068'; ctx.fill();
}

function drawVibPlot() {
  const canvas = $('#vib-plot'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);

  const p = vibParams();
  const N = 120;
  const data = [];
  let min = Infinity, max = -Infinity;
  for (let i = 0; i <= N; i++) {
    const th = 2 * Math.PI * i / N;
    const f = computeForces(th, p);
    data.push({ theta: th, ...f });
    ['XA','YA','XB','YB'].forEach(k => { if (f[k] < min) min = f[k]; if (f[k] > max) max = f[k]; });
  }

  const pad = 50;
  const plotW = W - 2 * pad, plotH = H - 2 * pad;
  const range = Math.max(Math.abs(min), Math.abs(max), 100);
  const yMin = -range * 1.1, yMax = range * 1.1;
  const sx = t => pad + (t / (2 * Math.PI)) * plotW;
  const sy = v => H - pad - ((v - yMin) / (yMax - yMin)) * plotH;

  ctx.strokeStyle = '#e6eaee'; ctx.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const x = pad + (plotW * i) / 4;
    ctx.beginPath(); ctx.moveTo(x, pad); ctx.lineTo(x, H - pad); ctx.stroke();
    const v = yMin + (yMax - yMin) * i / 4;
    const y = sy(v);
    ctx.beginPath(); ctx.moveTo(pad, y); ctx.lineTo(W - pad, y); ctx.stroke();
  }
  ctx.strokeStyle = '#8a929c'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(pad, sy(0)); ctx.lineTo(W - pad, sy(0)); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(pad, pad); ctx.lineTo(pad, H - pad); ctx.stroke();
  ctx.fillStyle = '#5a6068'; ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  for (let i = 0; i <= 4; i++) {
    ctx.fillText((2 * Math.PI * i / 4 * 180 / Math.PI).toFixed(0) + '°', pad + (plotW * i) / 4, H - pad + 18);
  }
  ctx.textAlign = 'right';
  for (let i = 0; i <= 4; i++) {
    const v = yMin + (yMax - yMin) * i / 4;
    ctx.fillText((v / 1000).toFixed(0) + 'k', pad - 6, sy(v) + 4);
  }
  ctx.textAlign = 'center';
  ctx.fillText('θ', W - pad + 20, sy(0) + 4);
  ctx.textAlign = 'left';
  ctx.fillText('Efforts (N)', pad, pad - 8);

  const curves = [
    { key: 'XA', color: '#2e6da4' },
    { key: 'YA', color: '#1e7a2e' },
    { key: 'XB', color: '#c0281f' },
    { key: 'YB', color: '#9a5b00' }
  ];
  curves.forEach(c => {
    ctx.strokeStyle = c.color; ctx.lineWidth = 2;
    ctx.beginPath();
    data.forEach((d, i) => {
      const x = sx(d.theta), y = sy(d[c.key]);
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
  });

  const curX = sx(VIB.theta);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1; ctx.setLineDash([3, 3]);
  ctx.beginPath(); ctx.moveTo(curX, pad); ctx.lineTo(curX, H - pad); ctx.stroke();
  ctx.setLineDash([]);
  const fc = computeForces(VIB.theta, p);
  curves.forEach(c => {
    const y = sy(fc[c.key]);
    ctx.beginPath(); ctx.arc(curX, y, 5, 0, 2 * Math.PI);
    ctx.fillStyle = c.color; ctx.fill();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  });
}

function startVibAnim() {
  if (VIB.raf != null) return;
  VIB.lastT = null;
  VIB.raf = requestAnimationFrame(vibAnim);
}
function stopVibAnim() {
  if (VIB.raf != null) { cancelAnimationFrame(VIB.raf); VIB.raf = null; }
  VIB.lastT = null;
}
function vibAnim(t) {
  if (!VIB.playing) { VIB.raf = null; VIB.lastT = null; return; }
  if (VIB.lastT == null) VIB.lastT = t;
  const dt = Math.min((t - VIB.lastT) / 1000, 0.05);
  VIB.lastT = t;
  VIB.theta += vibOmegaVis() * dt;
  if (VIB.theta > 2 * Math.PI) VIB.theta -= 2 * Math.PI;
  const canvas = $('#vib-solid');
  if (canvas && canvas.offsetParent !== null) drawVib();
  VIB.raf = requestAnimationFrame(vibAnim);
}

WORKSHOPS.push({ id: 'vib', title: 'Source des vibrations', hint: 'Efforts cycliques, translation et inclinaison du cylindre.',
  mount: mountVib,
  reset: () => { VIB.a = 0.05; VIB.alpha = 0; VIB.N = 30000; VIB.omega = 2 * Math.PI * 30000 / 60; VIB.theta = 0; VIB.playing = true; },
  leave: () => stopVibAnim() });

/* ============ ATELIER 3 : CONDITIONS D'ÉQUILIBRAGE ============ */

    + '<ul>'
    + '<li><b>Équilibrage statique</b> : G sur l\'axe de rotation (r = 0).</li>'
    + '<li><b>Équilibrage dynamique</b> : l\'axe de rotation est <b>axe principal d\'inertie</b> (D = E = 0).</li>'

    + '<label class="fld"><span>r = <b id="cond-r-out">0.05</b> mm</span><input type="range" id="cond-r" min="0" max="0.2" step="0.01"></label>'

    + '<label class="fld"><span>E = <b id="cond-E-out">0.0</b> ×10⁻⁴</span><input type="range" id="cond-E" min="0" max="2" step="0.1"></label>'
    + '</div>'
    + '<div class="gstats" id="cond-stats"></div>'

  });
  renderCond();
}
function renderCond() {
  $('#cond-r-out').textContent = COND.r.toFixed(2);
  $('#cond-D-out').textContent = COND.D.toFixed(1);
  $('#cond-E-out').textContent = COND.E.toFixed(1);
  const staticOK = COND.r < 0.001;
  const dynOK = COND.D < 0.001 && COND.E < 0.001;
  const stats = $('#cond-stats'); stats.innerHTML = '';
  stats.append(
    h('div', { class: 'stat', style: staticOK ? 'border-color:var(--ok);background:rgba(30,122,46,.05)' : 'border-color:var(--bad)' },
      h('span', null, 'Condition statique : r = 0'),
      h('b', { style: 'color:' + (staticOK ? 'var(--ok)' : 'var(--bad)') }, staticOK ? '✓ r = 0' : '✗ r = ' + COND.r.toFixed(2) + ' mm')),
    h('div', { class: 'stat', style: dynOK ? 'border-color:var(--ok);background:rgba(30,122,46,.05)' : 'border-color:var(--bad)' },
      h('span', null, 'Condition dynamique : D = E = 0'),
      h('b', { style: 'color:' + (dynOK ? 'var(--ok)' : 'var(--bad)') }, dynOK ? '✓ D = E = 0' : '✗ D = ' + COND.D.toFixed(1) + ', E = ' + COND.E.toFixed(1))),
    h('div', { class: 'stat', style: (staticOK && dynOK) ? 'border-color:var(--ok);background:rgba(30,122,46,.08)' : '' },
      h('span', null, 'Équilibrage complet'),
      h('b', { style: 'color:' + ((staticOK && dynOK) ? 'var(--ok)' : 'var(--muted)') }, (staticOK && dynOK) ? '✓ OK' : '— non réalisé')));
  const cards = $('#cond-cards'); cards.innerHTML = '';
  cards.append(
    h('div', { class: 'card', style: staticOK ? 'border-color:var(--ok)' : '' },
      h('h4', null, staticOK ? '✓ Statique OK' : '✗ Statique KO'),
      h('p', { html: 'Le centre d\'inertie G est ' + (staticOK ? 'sur' : 'hors de') + ' l\'axe de rotation.' }),
      h('p', { html: staticOK ? 'Le solide lâché dans n\'importe quelle position reste en équilibre.' : 'Le solide lâché dans une position autre que celle du point bas va tourner.' })),
    h('div', { class: 'card', style: dynOK ? 'border-color:var(--ok)' : '' },
      h('h4', null, dynOK ? '✓ Axe principal' : '✗ Axe non principal'),
      h('p', { html: 'Les produits d\'inertie D et E sont ' + (dynOK ? 'nuls' : 'non nuls') + '.' }),
      h('p', { html: dynOK ? 'L\'axe de rotation est axe principal d\'inertie : les efforts restent constants.' : 'L\'axe n\'est pas principal : les efforts tournent avec le solide.' })));
  const msg = $('#cond-msg');
  if (staticOK && dynOK) {
    msg.className = 'verdict yes';
    msg.innerHTML = '<b>✓ Équilibrage dynamique complet.</b> Les efforts dans les roulements sont indépendants de θ, donc constants. Pas de vibration.';
  } else if (staticOK && !dynOK) {
    msg.className = 'verdict warn';
    msg.innerHTML = '<b>⚠ Équilibrage statique seulement.</b> G est sur l\'axe, mais l\'axe n\'est pas principal d\'inertie. <b>Insuffisant en pratique.</b>';
  } else if (!staticOK && dynOK) {
    msg.className = 'verdict warn';
    msg.innerHTML = '<b>⚠ Axe principal seulement.</b> D = E = 0, mais G est décalé : le solide va tourner sous l\'effet de la pesanteur.';
  } else {
    msg.className = 'verdict no';
    msg.innerHTML = '<b>✗ Aucune condition satisfaite.</b> Il faut à la fois r = 0 et D = E = 0 pour annuler les vibrations.';
  }
}

/* ============ ATELIER 4 : STATIQUE VS DYNAMIQUE ============ */
const SD = { mode: 'none' };
function mountSD(root) {
  root.innerHTML = '<h2>4. Statique vs dynamique</h2>'
    + '<p>Les deux équilibrages ne s\'impliquent pas l\'un l\'autre. L\'équilibrage statique seul est <b>sans grand intérêt</b> : il ne garantit pas l\'absence de vibrations en rotation.</p>'
    + '<p>Cliquez sur un mode pour voir son effet.</p>'
    + '<div class="toggle-card' + (SD.mode === 'none' ? ' active' : '') + '" data-mode="none">'
    + '<h4>Aucun équilibrage</h4><p style="font-size:13px;margin:4px 0">r ≠ 0, D ≠ 0, E ≠ 0. Le solide tourne mal : efforts tournants dans les roulements.</p></div>'
    + '<div class="toggle-card' + (SD.mode === 'stat' ? ' active' : '') + '" data-mode="stat">'
    + '<h4>Équilibrage statique seulement</h4><p style="font-size:13px;margin:4px 0">r = 0, mais D ou E ≠ 0. Les roulements voient encore des efforts cycliques.</p></div>'
    + '<div class="toggle-card' + (SD.mode === 'dyn' ? ' active' : '') + '" data-mode="dyn">'
    + '<h4>Équilibrage dynamique</h4><p style="font-size:13px;margin:4px 0">r = 0 et D = E = 0. Les efforts sont constants, aucune vibration.</p></div>'
    + '<canvas class="viz" id="sd-canvas" style="height:280px"></canvas>'
    + '<div id="sd-msg"></div>';
  document.querySelectorAll('#ws .toggle-card').forEach(el => {
    el.addEventListener('click', () => { SD.mode = el.dataset.mode; mountSD(root); });
  });
  drawSD();
  const msg = $('#sd-msg'); msg.innerHTML = '';
  const texts = {
    none: '<div class="verdict no"><b>✗ Aucun équilibrage.</b> Le centre d\'inertie est décalé, l\'axe n\'est pas principal. Les efforts X<sub>A</sub>, Y<sub>A</sub>, X<sub>B</sub>, Y<sub>B</sub> dépendent de θ : vibrations à la fréquence de rotation.</div>',
    stat: '<div class="verdict warn"><b>⚠ Équilibrage statique seul.</b> G est sur l\'axe : le solide ne tourne plus sous l\'effet de la pesanteur. Mais les produits d\'inertie D et E ne sont pas nuls : les efforts restent cycliques. <b>Insuffisant.</b></div>',
    dyn: '<div class="verdict yes"><b>✓ Équilibrage dynamique.</b> G sur l\'axe + axe principal d\'inertie. Les efforts dans les roulements sont constants, aucune vibration.</div>'
  };
  msg.innerHTML = texts[SD.mode];
}
function drawSD() {
  const canvas = $('#sd-canvas'); if (!canvas) return;
  const W = canvas.clientWidth, H = canvas.clientHeight;
  if (!W || !H) return;
  const dpr = window.devicePixelRatio || 1;
  canvas.width = W * dpr; canvas.height = H * dpr;
  const ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#fafbfc'; ctx.fillRect(0, 0, W, H);
  const halfW = W / 2;
  ctx.fillStyle = '#111'; ctx.font = 'bold 13px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Effet statique (G sur l\'axe ?)', halfW / 2, 22);
  const cx = halfW / 2, cy = H / 2 + 10;
  const axisY = cy;
  ctx.strokeStyle = '#5a6068'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(cx - 70, axisY); ctx.lineTo(cx + 70, axisY); ctx.stroke();
  ctx.fillStyle = '#5a6068'; ctx.font = '11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('axe', cx + 72, axisY + 4);
  const theta = SD.mode === 'none' ? Math.PI / 6 : 0;
  ctx.save();
  ctx.translate(cx, cy); ctx.rotate(-theta);
  ctx.fillStyle = 'rgba(46,109,164,0.2)';
  ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 1.5;
  ctx.fillRect(-50, -20, 100, 40); ctx.strokeRect(-50, -20, 100, 40);
  let gOffset = 0;
  if (SD.mode === 'none') gOffset = 15;
  ctx.fillStyle = '#c0281f';
  ctx.beginPath(); ctx.arc(gOffset, 0, 5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = '#c0281f'; ctx.font = 'bold 11px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'left'; ctx.fillText('G', gOffset + 7, 4);
  ctx.restore();
  ctx.fillStyle = SD.mode === 'none' ? '#c0281f' : '#1e7a2e';
  ctx.font = '12px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  if (SD.mode === 'none') {
    ctx.fillText('G n\'est pas sur l\'axe :', cx, H - 45);
    ctx.fillText('le solide tourne sous la pesanteur', cx, H - 28);
  } else {
    ctx.fillText('G est sur l\'axe :', cx, H - 45);
    ctx.fillText('le solide reste en équilibre', cx, H - 28);
  }
  ctx.fillStyle = '#111'; ctx.font = 'bold 13px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('Effet dynamique (efforts cycliques ?)', halfW + halfW / 2, 22);
  const cx2 = halfW + halfW / 2, cy2 = H / 2 + 10;
  const bearingL = cx2 - 70, bearingR = cx2 + 70;
  ctx.fillStyle = '#5a6068'; ctx.fillRect(bearingL - 15, cy2 + 15, 30, 10);
  ctx.fillRect(bearingR - 15, cy2 + 15, 30, 10);
  ctx.save();
  ctx.translate(cx2, cy2);
  ctx.fillStyle = 'rgba(46,109,164,0.15)';
  ctx.strokeStyle = '#2e6da4'; ctx.lineWidth = 1.5;
  ctx.fillRect(-60, -12, 120, 24); ctx.strokeRect(-60, -12, 120, 24);
  ctx.restore();
  const forces = SD.mode === 'dyn'
    ? [{ x: bearingL, y: cy2 - 25, dx: 0, dy: -15 }, { x: bearingR, y: cy2 - 25, dx: 0, dy: -15 }]
    : SD.mode === 'stat'
    ? [{ x: bearingL, y: cy2 - 25, dx: 15, dy: -15 }, { x: bearingR, y: cy2 - 25, dx: 15, dy: -15 }]
    : [{ x: bearingL, y: cy2 - 25, dx: 20, dy: -20 }, { x: bearingR, y: cy2 - 25, dx: 20, dy: -20 }];
  forces.forEach(f => {
    ctx.strokeStyle = SD.mode === 'dyn' ? '#1e7a2e' : '#c0281f';
    ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x + f.dx, f.y + f.dy); ctx.stroke();
    const angle = Math.atan2(f.dy, f.dx);
    ctx.beginPath();
    ctx.moveTo(f.x + f.dx, f.y + f.dy);
    ctx.lineTo(f.x + f.dx - 7 * Math.cos(angle - 0.4), f.y + f.dy - 7 * Math.sin(angle - 0.4));
    ctx.moveTo(f.x + f.dx, f.y + f.dy);
    ctx.lineTo(f.x + f.dx - 7 * Math.cos(angle + 0.4), f.y + f.dy - 7 * Math.sin(angle + 0.4));
    ctx.stroke();
  });
  ctx.fillStyle = SD.mode === 'dyn' ? '#1e7a2e' : '#c0281f';
  ctx.font = '12px "IBM Plex Sans", sans-serif';
  ctx.textAlign = 'center';
  if (SD.mode === 'dyn') {
    ctx.fillText('Efforts constants', cx2, H - 45);
    ctx.fillText('→ pas de vibration', cx2, H - 28);
  } else {
    ctx.fillText('Efforts tournants', cx2, H - 45);
    ctx.fillText('→ vibrations', cx2, H - 28);
  }
}

      'Le perçage et le meulage enlèvent de la matière.',
      'Les machines d\'équilibrage mesurent les vibrations.'
    ],
    defi: { q: 'Comment une machine d\'équilibrage détermine-t-elle la correction ?', a: 'Elle fait tourner le solide et mesure les vibrations (amplitude et phase). Un calcul permet d\'en déduire la position et la masse à ajouter ou à enlever.' },
    qcm: [
      { q: 'Une masselotte sur une jante est une correction par…', o: ['Ajout de matière', 'Enlèvement de matière', 'Mesure', 'Aucune des trois'], a: 0, w: 'On ajoute une petite masse.' },
      { q: 'Un perçage sur un rotor est une correction par…', o: ['Ajout de matière', 'Enlèvement de matière', 'Mesure', 'Aucune des trois'], a: 1, w: 'On enlève de la matière.' },
      { q: 'Une machine d\'équilibrage sert à…', o: ['Ajouter de la matière', 'Enlever de la matière', 'Mesurer les vibrations pour guider la correction', 'Remplacer les roulements'], a: 2, w: 'Elle mesure l\'amplitude et la phase.' },
      { q: 'L\'équilibrage par enlèvement de matière est souvent utilisé pour…', o: ['Les jantes de voiture', 'Les rotors de moteur, les aubes de turbine', 'Les hélices d\'hélicoptère', 'Les roues de vélo'], a: 1, w: 'Sur les pièces massives, on perce ou on meule.' },
      { q: 'L\'équilibrage par ajout de matière est souvent utilisé pour…', o: ['Les rotors de moteur', 'Les jantes de voiture, les hélices', 'Les aubes de turbine', 'Les vilebrequins'], a: 1, w: 'On ajoute des masselottes sur les jantes, hélices, rotors d\'hélicoptère.' }
    ]
  }
};

/* ============ COURS ============ */
const COURSE = [];
COURSE.push({ id: 'intro', t: 'Introduction', h: `
<p>En CPGE, on distingue <b>trois grandes familles</b> de problèmes que l'on résout avec le PFD et le TEC.</p>
<h3>1. Des efforts aux mouvements</h3>
<p>Connaissant les efforts (pesanteur, moteurs, vérins, ressorts…), on cherche les <b>lois de mouvement</b>.</p>
<h3>2. Du mouvement aux efforts</h3>
<p>Un mouvement est <b>imposé</b> et l'on cherche les efforts générés : dimensionner un actionneur, calculer les efforts de liaison.</p>
<h3>3. Répartition des masses</h3>
<p>On cherche à répartir la masse pour éviter les vibrations, <b>y compris à vitesse constante</b>. C'est l'<b>équilibrage</b>.</p>
<div class="retain"><b>Ce cours</b> traite uniquement du troisième type : comment éviter les vibrations d'un solide en rotation à grande vitesse.</div>
` });
COURSE.push({ id: 'probleme', t: 'Problème à résoudre', h: `
<p>De nombreux systèmes comportent un élément en rotation à grande vitesse : rotors de moteur, turbines, roues, hélices… Le moindre défaut dans la répartition des masses crée des <b>efforts centrifuges tournants</b> qui provoquent :</p>
<ul>
<li>des <b>vibrations</b> ;</li>
<li>une <b>usure prématurée</b> des roulements ;</li>
<li>à terme, une défaillance du système.</li>
</ul>
<h3>Exemples industriels</h3>
<ul>
<li>Usure anormale des bagues et billes de roulement.</li>
<li>Usure des coussinets de bielle d'un moteur thermique.</li>
<li>Équilibrage d'une turbine de réacteur nucléaire.</li>
<li>Équilibrage du porte-outil d'un centre d'usinage.</li>
<li>Équilibrage de la turbine d'un turboréacteur de Boeing 777.</li>
</ul>
<h3>Objectif</h3>
<p>Faire en sorte que les actions mécaniques transmises par les éléments de guidage soient <b>constantes</b> au cours du mouvement. C'est l'<b>équilibrage dynamique</b>.</p>
<div class="retain"><b>À retenir.</b> Les défauts de répartition des masses créent des efforts qui tournent avec le solide.</div>
` });
COURSE.push({ id: 'solution', t: 'Mise en évidence des solutions', h: `
<p>Prenons un solide S guidé en rotation par deux roulements A et B :</p>
<ul>
<li>AG = d·z₀ + r·x (G décalé de r par rapport à l'axe)</li>
<li>matrice d'inertie avec les produits D, E, F</li>
<li>rotation à vitesse ω autour de (A, z₀)</li>
</ul>
<h3>PFD appliqué à S</h3>
<p>En isolant S et en écrivant le PFD, on obtient les composantes des actions de liaison :</p>
<div class="formula">X<sub>A</sub> = (D·ω²·sin θ)/L + (M·r − E/L)·ω²·cos θ − M·g·(1 + d/L)</div>
<div class="formula">X<sub>B</sub> = (D·ω²·sin θ − E·ω²·cos θ + M·g·d)/L</div>
<div class="formula">Y<sub>A</sub> = (M·r + E/L)·ω²·sin θ − (D·ω²·cos θ)/L</div>
<div class="formula">Y<sub>B</sub> = (−D·ω²·cos θ + E·ω²·sin θ)/L</div>
<p>On constate que ces efforts <b>dépendent de θ</b> : ils tournent avec le solide et créent des vibrations.</p>
<h3>Condition d'équilibrage</h3>
<div class="formula"><b>r = 0</b> et <b>D = 0</b> et <b>E = 0</b></div>
<ul>
<li>G sur l'axe de rotation → <b>équilibrage statique</b>.</li>
<li>Axe de rotation = axe principal d'inertie → <b>équilibrage dynamique</b>.</li>
</ul>
<div class="retain"><b>À retenir.</b> r = 0 et D = E = 0 sont les deux conditions à satisfaire simultanément.</div>
` });
COURSE.push({ id: 'equilibrages', t: 'Les deux équilibrages', h: `
<h3>Équilibrage statique</h3>
<p>Le centre d'inertie G est <b>sur l'axe de rotation</b> (r = 0). Le solide lâché dans une position quelconque reste en équilibre dans cette position.</p>
<h3>Équilibrage dynamique</h3>
<p>L'axe de rotation est <b>axe principal d'inertie</b> du solide. Les produits d'inertie D et E sont <b>nuls</b>.</p>
<h3>Les deux sont-ils équivalents ?</h3>
<p><b>Non.</b> L'équilibrage statique seul est <b>sans grand intérêt</b> : il ne supprime pas les efforts tournants en rotation. Un solide peut être statiquement équilibré et vibrer en rotation.</p>
<h3>En pratique</h3>
<p>C'est l'<b>équilibrage dynamique</b> qu'il faut garantir : G sur l'axe et axe de rotation principal d'inertie.</p>
<div class="retain"><b>À retenir.</b> L'équilibrage dynamique inclut l'équilibrage statique. C'est le seul qui supprime vraiment les vibrations.</div>
` });
COURSE.push({ id: 'pratique', t: 'Réalisation pratique', h: `
<p>Les corrections se font par <b>ajout</b> ou <b>enlèvement</b> de matière, aux endroits calculés pour corriger la répartition des masses.</p>
<h3>Ajout de matière</h3>
<ul>
<li>Masselottes sur une jante de voiture.</li>
<li>Masselottes sur le rotor arrière d'un hélicoptère.</li>
</ul>
<h3>Enlèvement de matière</h3>
<ul>
<li>Perçage d'un rotor de moteur électrique.</li>
<li>Meulage d'une zone du rotor.</li>
</ul>
<h3>Machines d'équilibrage</h3>
<p>Les conditions sont déterminées à l'aide de <b>machines d'équilibrage</b> qui mesurent l'amplitude et l'intensité des vibrations lors de la rotation.</p>
<ul>
<li>Machine d'équilibrage de roue de voiture.</li>
<li>Machine d'équilibrage d'essieu de train.</li>
<li>Équilibreuse portative (intervention sur site).</li>
</ul>
<div class="retain"><b>À retenir.</b> Ajout ou enlèvement de matière selon les contraintes. Les machines guident la correction.</div>
` });
COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Équilibrage</dt><dd>Répartir la masse d'un solide en rotation pour éviter les vibrations.</dd>
<dt>Équilibrage statique</dt><dd>Centre d'inertie G sur l'axe de rotation (r = 0).</dd>
<dt>Équilibrage dynamique</dt><dd>G sur l'axe ET axe de rotation principal d'inertie (r = 0, D = E = 0).</dd>
<dt>Axe principal d'inertie</dt><dd>Axe pour lequel les produits d'inertie sont nuls.</dd>
<dt>Produit d'inertie</dt><dd>Terme hors diagonale de la matrice d'inertie (D, E, F).</dd>
<dt>Balourd</dt><dd>Défaut de répartition créant un effort centrifuge tournant.</dd>
<dt>Effort centrifuge</dt><dd>Effort proportionnel à ω², dépend de θ si mal équilibré.</dd>
<dt>Masselotte</dt><dd>Petite masse ajoutée pour corriger le balourd.</dd>
<dt>Machine d'équilibrage</dt><dd>Appareil qui mesure les vibrations pour déterminer les corrections.</dd>
<dt>Équilibreuse portative</dt><dd>Machine d'équilibrage utilisable sur site.</dd>
</dl>
` });

/* ============ UI ============ */
const UI = { cur: 'types' };
const AS = { key: 'types', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null };
const CS = { open: false, id: 'intro' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', {
    type: 'button', role: 'tab',
    'aria-pressed': w.id === UI.cur ? 'true' : 'false',
    'aria-selected': w.id === UI.cur ? 'true' : 'false',
    onclick: () => gotoWs(w.id)
  }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  const old = wsById(UI.cur); if (old.leave) old.leave();
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab;
  const keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag;
  box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'QCM (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time));
    body.append(h('div', { class: 'goal', html: '<b>Objectif.</b> ' + a.goal }));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) {
        b.textContent = 'Confirmer ? Votre travail sera effacé';
        AS.arm = setTimeout(() => { b.textContent = 'Recommencer l\'atelier'; AS.arm = null; }, 3500);
        return;
      }
      clearTimeout(AS.arm); AS.arm = null;
      wsById(UI.cur).reset(); mountWs(); renderAct();
    } }, 'Recommencer l\'atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a;
        const bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: (show && s.shown ? j === q.a : s.a[i] === j), disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) {
        const miss = s.a[i] == null && !s.shown;
        fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w }));
      }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', {
    type: 'button', class: s.id === cur.id ? 'on' : '',
    'aria-current': s.id === cur.id ? 'true' : 'false',
    onclick: () => go(s.id)
  }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : équilibrage dynamique'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l\'atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title },
    h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')),
    h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers interactifs sur l\'équilibrage dynamique des solides en rotation.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Le bouton <b>Activité</b> propose consignes, défi et QCM corrigé.</li><li>Le bouton <b>Cours</b> propose une synthèse rédigée.</li></ul>' +
    '<h3>Atelier 2</h3><p>Le bouton <b>Pause / Démarrer</b> bloque ou relance la rotation du cylindre autour de (AB). Le bouton <b>α = 0</b> annule l\'inclinaison de l\'axe du cylindre. La vitesse d\'animation est ralentie pour rester lisible, le facteur est affiché sous les curseurs.</p>' +
    '<h3>Notation</h3><p><b>r</b> = décalage radial de G (mm). <b>D</b> et <b>E</b> = produits d\'inertie (×10⁻⁴ kg·m²). X<sub>A</sub>, Y<sub>A</sub>, X<sub>B</sub>, Y<sub>B</sub> = efforts dans les roulements.</p>' }));
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    if (UI.cur === 'vib') drawVib();
    else if (UI.cur === 'sd') drawSD();
  }, 120);
});

(function init() {
  AS.open = !isSmall();
  renderSeg();
  mountWs();
  renderAct();
  renderCourse();
})();
</script>
