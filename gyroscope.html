<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier Gyroscope</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Mise en page : barre d'outils en haut, onglets d'ateliers, zone de travail, panneau Activité à droite (feuille basse sur téléphone), vue Cours avec sommaire. Même gabarit que l'Atelier Récursivité. */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --node-stroke:#33475b;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;
  --ok-soft:rgba(30,122,46,.15);--warn-soft:rgba(154,91,0,.13);--bad-soft:rgba(192,40,31,.13);
  --g-s:#cfe3f6;--g-p:#f6e2bf;--g-c:#d3ecd7;--g-ps:#dcd6ee;--g-m:#e4e8ee;
  --overlay:rgba(10,16,22,.55);--shadow:rgba(0,0,0,.28);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14181d;--bar:#1d232a;--panel:#191e24;--panel2:#212830;--field:#14181d;--line:#3b4551;
  --fg:#e8ecf0;--muted:#9ba6b2;--accent:#5b9bd5;--accent-fg:#0b1620;--accent-soft:#203449;--accent-ink:#b3d4f2;--run:#62c673;
  --node-stroke:#a7b8c9;
  --ok:#62c673;--warn:#e3a94f;--bad:#f2766d;
  --ok-soft:rgba(98,198,115,.18);--warn-soft:rgba(227,169,79,.17);--bad-soft:rgba(242,118,109,.17);
  --g-s:#27425c;--g-p:#5b4420;--g-c:#25492d;--g-ps:#3d3760;--g-m:#2d3640;
  --overlay:rgba(0,0,0,.65);--shadow:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
.fld b{color:var(--fg);font-family:var(--font-mono);font-weight:500}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
sub,sup{line-height:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:var(--ok-soft)}.opt.bad{background:var(--bad-soft)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
/* cours */
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
/* ateliers */
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:1000px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
.zsh{border:1px solid var(--line);border-radius:10px;padding:9px 12px 3px;background:var(--panel2)}.zsh-t{margin-bottom:6px}.zsh .chips{margin-bottom:8px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:220px;max-width:100%}
.opts input[type=number]{width:96px;font-family:var(--font-mono)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:6px 0 10px}
.zgrid .fld{margin:0 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:var(--ok-soft);border-color:var(--ok)}.verdict.no{background:var(--bad-soft);border-color:var(--bad)}.verdict.warn{background:var(--warn-soft);border-color:var(--warn)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.two>div{min-width:0}
.viewlbl{font-size:12.5px;color:var(--muted);margin:8px 0 2px!important}
.gwrap{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--bg)}
svg.g{display:block;width:100%;height:auto}
.formula.sm{font-size:13.5px;line-height:1.7}
.calc{margin:6px 0 10px}.calc .formula{margin:4px 0}
.chk{display:flex;flex-direction:column;gap:5px;margin:6px 0}
.chk div{display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13.5px}
.chk .mk{flex:none;font-weight:700;width:1.2em;text-align:center}
.chk .okk{background:var(--ok-soft);border-color:var(--ok)}.chk .okk .mk{color:var(--ok)}
.chk .nok{background:var(--bad-soft);border-color:var(--bad)}.chk .nok .mk{color:var(--bad)}
.tbl{overflow-x:auto;margin:8px 0}
table.ctable{border-collapse:collapse;font-size:13px}
.ctable th,.ctable td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.ctable td.n{font-family:var(--font-mono);text-align:right;white-space:nowrap}
details.adv{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:12px 0;background:var(--panel)}
details.adv summary{cursor:pointer;font-weight:600;color:var(--accent-ink)}
details.adv[open] summary{margin-bottom:8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1.5px solid var(--node-stroke);vertical-align:-1px;margin-right:5px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0}
/* dessins d'engrenages */
.gear{stroke:var(--node-stroke);stroke-width:1.2;stroke-linejoin:round}
.gear.s{fill:var(--g-s)}.gear.p{fill:var(--g-p)}.gear.c{fill:var(--g-c)}.gear.m{fill:var(--g-m)}.gear.in{fill:var(--g-s)}.gear.out{fill:var(--g-c)}
.pitch{fill:none;stroke:var(--muted);stroke-dasharray:4 3;stroke-width:.8;opacity:.75}
.hub{fill:var(--bg);stroke:var(--node-stroke);stroke-width:1.2}
.mk{fill:var(--bad)}
.arm{fill:var(--g-ps);stroke:var(--node-stroke);stroke-width:1.2;opacity:.62}
.shaft{stroke:var(--node-stroke);stroke-width:1.6}
.gtxt{font:600 12px var(--font-mono);fill:var(--fg);text-anchor:middle}
.gtxt.sm{font-size:10.5px;font-weight:500;fill:var(--muted)}
.gtxt.l{text-anchor:start}
.dirtxt{font:600 15px var(--font-ui);fill:var(--accent-ink);text-anchor:middle}
.hatchln{stroke:var(--node-stroke);stroke-width:1.1}
.fixlbl{font:600 11px var(--font-ui);fill:var(--bad);text-anchor:middle}
.ground{stroke:var(--node-stroke);stroke-width:1}
.rect{stroke:var(--node-stroke);stroke-width:1.2}
.rect.in{fill:var(--g-s)}.rect.out{fill:var(--g-c)}.rect.s{fill:var(--g-s)}.rect.p{fill:var(--g-p)}.rect.c{fill:var(--g-c)}.rect.m{fill:var(--g-m)}
.bean{stroke:var(--node-stroke);stroke-width:1;fill:none;opacity:.7}
.plot-ax{stroke:var(--muted);stroke-width:1}
.plot-grid{stroke:var(--line);stroke-width:.7;stroke-dasharray:3 3}
.plot-lbl{font:11px var(--font-mono);fill:var(--muted)}
.plot-ttl{font:600 12px var(--font-ui);fill:var(--fg)}
.curve{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.curve.fill{fill:var(--accent-soft);stroke:none}
.cursor{stroke:var(--bad);stroke-width:1.4}
.cdot{fill:var(--bad)}
.rail{position:relative;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin:8px 0}
.rail .car{position:absolute;top:4px;width:34px;height:24px;margin-left:-17px;border-radius:5px;background:var(--accent);border:1px solid var(--accent-ink)}
/* exercices */
.exs{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel);margin:8px 0}
.exs p{margin:4px 0}
.fieldrow{display:flex;gap:10px 16px;flex-wrap:wrap;margin:10px 0}
.fieldrow .fld{margin:0;min-width:150px;flex:1 1 150px}
.fieldrow input{font-family:var(--font-mono)}
.fieldrow input.okk{border-color:var(--ok);background:var(--ok-soft)}
.fieldrow input.nok{border-color:var(--bad);background:var(--bad-soft)}
.solbox{border-left:3px solid var(--accent);padding:2px 12px;margin:10px 0;background:var(--panel2);border-radius:0 8px 8px 0}
.scoreline{font:500 12.5px var(--font-mono);color:var(--muted);margin:2px 0}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
}
/* illustrations du cours */
.fig{margin:14px 0;max-width:100%}
.fig .gwrap{background:var(--bg)}
.fig figcaption{font-size:13px;line-height:1.5;color:var(--muted);margin:6px 2px 0}
.figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0;align-items:start}
.figrow .fig{margin:0;min-width:0}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
/* atelier gyroscope */
#ws{max-width:1240px}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;min-width:0;margin-bottom:10px}
.panel h3{margin:0 0 6px!important;font-size:15px!important}
.angrow{display:flex;gap:10px;align-items:center;margin-top:6px}
.angrow input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.angrow input[type=number]{width:84px}
.angrow .lab{font-size:13px;white-space:nowrap}
.canvas3d{width:100%;height:420px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel2);touch-action:none;cursor:grab}
.canvas3d canvas{display:block}
.leg{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin:8px 0}
.leg i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.infob{background:var(--accent-soft);border-radius:8px;padding:8px 12px;font-size:13.5px;margin:8px 0}
.figs2d{display:flex;flex-wrap:wrap;gap:14px;margin:10px 0}
.figs2d .fig{margin:0;flex:1 1 300px;max-width:340px}
.vres{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px 18px;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:90px}
.vm{display:inline-flex;align-items:center;gap:8px;font-family:var(--font-mono);font-size:15px;flex-wrap:wrap;justify-content:center}
.vm .tb{font-size:3.2rem;line-height:1;color:var(--muted);font-weight:300}
.vcol{display:flex;flex-direction:column;gap:4px;text-align:center}
.vcol span{padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--field);min-width:60px}
.mat{display:inline-grid;grid-template-columns:repeat(3,auto);gap:2px 12px;font-family:var(--font-mono);font-size:13px;padding:4px 10px;border-left:2px solid var(--muted);border-right:2px solid var(--muted);border-radius:4px}
@media (max-width:820px){.canvas3d{height:300px}}
#g-plot{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.ptit{font-size:12.5px;color:var(--muted);margin:10px 0 4px}
.chkrow{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin:6px 0}
.chkrow label{display:flex;align-items:center;gap:5px;cursor:pointer}
.chkrow i{display:inline-block;width:11px;height:11px;border-radius:50%}
.sw{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.appsvg{max-width:520px;margin:6px auto}
table.tb2{border-collapse:collapse;margin:8px 0;font-size:13.5px}
table.tb2 td,table.tb2 th{border:1px solid var(--line);padding:5px 10px;text-align:center}
table.tb2 th{background:var(--panel2)}
@media print{
  header.band,#modes,#act,#hint,.noprint{display:none!important}
  html,body,#app,#work,#stage,#scroller{height:auto!important;overflow:visible!important;display:block!important}
  #course{display:none!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="band"><div class="inner row">

  pb: {
    prin: '<b>Principe.</b> Le poignet fait tourner la coque à Ω, perpendiculairement à l’axe du rotor. Le couple gyroscopique plaque les extrémités de l’axe contre la gorge ; le frottement fait rouler l’axe dans la gorge et accélère le rotor, jusqu’à ce que l’axe roule sans glisser.',
    ctl: (S, A) => [S('m (masse du rotor, g)', 30, 200, 5, 'm', v => v), S('R (rayon du rotor, mm)', 15, 35, 1, 'R', v => v), S('f (fréquence du poignet, tr/s)', 1, 8, 0.5, 'f', v => fx(v, 1)), S('a/r (demi-longueur / rayon de l’axe)', 20, 80, 1, 'k', v => v), S('μ (frottement axe / gorge)', 0.1, 0.6, 0.05, 'mu', v => fx(v, 2)), S('N_0 (vitesse de lancement, tr/min)', 500, 5000, 100, 'N0', v => v)],
    stats: (A, r) => [['I = ½·m·R²', fx(r.I * 1e6, 1) + '×10<sup>−6</sup> kg·m²'], ['Ω = 2π·f', fx(r.Om, 1) + ' rad/s'], ['Vitesse maximale N<sub>max</sub>', fx(r.Ns, 0) + ' tr/min'], ['Couple ressenti C<sub>max</sub> = I·ω·Ω', fx(r.Cs, 2) + ' N·m'], ['Effort au bord de la boule', fx(r.F, 0) + ' N (≈ ' + fx(r.F / G, 1) + ' kgf)'], ['Taux de croissance k = μ·Ω·r/a', fx(r.kk, 3) + ' s<sup>−1</sup>'], ['Temps de montée', r.ts > 0 ? fx(r.ts, 1) + ' s' : '—'], ['Énergie cinétique ½·I·ω<sub>max</sub>²', fx(r.E, 1) + ' J']],
    note: (A, r) => r.w0 >= r.ws ? ['warn', 'Le rotor est lancé plus vite que la vitesse de roulement : le frottement le ralentit jusqu’à N<sub>max</sub>. Tournez le poignet plus vite.'] : null,
    eq: (A, r) => '<p><b>1. Données.</b> Rotor assimilé à un disque :</p><div class="formula sm">I = ½·m·R² = ½ × ' + fx(r.m, 3) + ' × ' + fx(r.R, 3) + '² = ' + fx(r.I * 1e6, 2) + '×10<sup>−6</sup> kg·m² ; Ω = 2π·f = ' + fx(r.Om, 2) + ' rad/s</div>' +
      '<p><b>2. Couple gyroscopique.</b> Le poignet fait tourner l’axe du rotor à Ω, perpendiculaire à H (α = 90°) :</p><div class="formula sm">C = H ∧ Ω, de module C = I·ω·Ω</div>' +
      '<p><b>3. Efforts dans la gorge.</b> Ce couple tend à faire sortir l’axe du plan de la gorge ; ses deux extrémités, distantes de 2a, appuient sur les parois avec des efforts opposés :</p><div class="formula sm">N·2a = C &nbsp;⟹&nbsp; N = C / (2a)</div>' +
      '<p><b>4. Le frottement entraîne le rotor.</b> Tant que l’axe glisse dans la gorge, l’effort tangentiel μ·N à chaque contact, au rayon r de l’axe, donne un couple moteur sur la rotation propre :</p><div class="formula sm">C<sub>m</sub> = 2·μ·N·r = μ·(r/a)·C = μ·(r/a)·I·ω·Ω</div>' +
      '<p><b>5. Équation de la rotation propre</b> (pertes négligées) :</p><div class="formula sm">I·dω/dt = μ·(r/a)·I·ω·Ω &nbsp;⟹&nbsp; dω/dt = k·ω, &nbsp;k = μ·Ω·r/a = ' + fx(A.mu, 2) + ' × ' + fx(r.Om, 2) + ' / ' + A.k + ' = <b>' + fx(r.kk, 3) + ' s<sup>−1</sup></b></div><div class="formula sm">ω(t) = ω<sub>0</sub>·e<sup>k·t</sup></div>' +
      '<p>La croissance est <b>exponentielle</b> : le couple moteur est proportionnel à ω. Avec ω<sub>0</sub> = 0, rien ne se passe : c’est pourquoi on lance le rotor avec une ficelle ou le pouce.</p>' +
      '<p><b>6. Vitesse limite.</b> L’accélération cesse quand l’axe roule sans glisser : la vitesse du point de contact sur l’axe (ω·r) égale celle de la gorge (Ω·a) :</p><div class="formula sm">ω<sub>max</sub> = Ω·a/r = ' + fx(r.Om, 2) + ' × ' + A.k + ' = <b>' + fx(r.ws, 0) + ' rad/s</b> (' + fx(r.Ns, 0) + ' tr/min) ; temps de montée t = ln(ω<sub>max</sub>/ω<sub>0</sub>) / k = ' + (r.ts > 0 ? fx(r.ts, 1) + ' s' : '—') + '</div>' +
      '<p><b>7. Couple ressenti.</b></p><div class="formula sm">C<sub>max</sub> = I·ω<sub>max</sub>·Ω = I·Ω²·a/r = <b>' + fx(r.Cs, 2) + ' N·m</b> ; au bord de la boule (r<sub>b</sub> = 35 mm) : F ≈ C/r<sub>b</sub> = ' + fx(r.F, 0) + ' N</div>' +
      '<p>Le couple résistant croît comme le <b>carré</b> de la vitesse du poignet : c’est ce qui fait de la powerball un appareil de musculation de l’avant-bras.</p><p class="small">Modèle simplifié : frottement de Coulomb, roulement parfait à la vitesse limite, pertes dans l’air négligées.</p>',
    plot: (A, r, box) => {
      const T = r.ts > 0 ? r.ts * 1.3 + 1 : 6, pts = [];
      for (let i = 0; i <= 200; i++) { const t = T * i / 200, w = r.w0 < r.ws ? Math.min(r.ws, r.w0 * Math.exp(r.kk * t)) : Math.max(r.ws, r.w0 * Math.exp(-r.kk * t)); pts.push([t, w * 30 / Math.PI]); }
      const p = syPlot([{ pts, col: GCOL.O }], { y0: 0, hl: [{ v: r.Ns, col: GCOL.M, lab: 'N_max' }], xl: 't (s)', yl: 'N (tr/min)', label: 'Montée en vitesse du rotor' });
      plotBox(box, 'Montée en vitesse du rotor (poignet à fréquence constante)', p);
    }
  },
  top: {
    heavy: true,
    prin: '<b>Principe.</b> Le poids crée un moment autour de la pointe ; grâce au moment cinétique de rotation propre, il ne fait pas tomber la toupie mais la fait précesser. Au-dessus d’une vitesse critique, l’axe proche de la verticale est stable ; les frottements ralentissent la toupie jusqu’à la chute.',
    ctl: (S, A) => [S('m (masse, g)', 20, 300, 5, 'm', v => v), S('R (rayon du plateau, mm)', 10, 50, 1, 'R', v => v), S('d (hauteur de G au-dessus de la pointe, mm)', 5, 50, 1, 'd', v => v), S('N (vitesse de lancement, tr/min)', 200, 4000, 100, 'N', v => v), S('θ_0 (inclinaison initiale, °)', 2, 30, 1, 'th0', v => v), S('τ (constante de temps des frottements, s)', 5, 60, 1, 'tau', v => v)],
    stats: (A, r) => [['I<sub>3</sub> = ½·m·R²', fx(r.I3 * 1e6, 2) + '×10<sup>−6</sup> kg·m²'], ['I<sub>1</sub> = ¼·m·R² + m·d²', fx(r.I1 * 1e6, 2) + '×10<sup>−6</sup> kg·m²'], ['Vitesse critique N<sub>c</sub>', fx(r.Nc, 0) + ' tr/min'], ['Précession Ω ≈ m·g·d / (I<sub>3</sub>·ω)', fx(r.Om, 2) + ' rad/s (T = ' + fx(TAU / r.Om, 2) + ' s)'], ['Pulsation de nutation I<sub>3</sub>·ω / I<sub>1</sub>', fx(r.wn, 0) + ' rad/s'], ['Instabilité prévue t<sub>c</sub> = τ·ln(ω/ω<sub>c</sub>)', r.tc > 0 ? fx(r.tc, 1) + ' s' : 'dès le départ'], ['Chute simulée (θ > 70°)', r.sim.fell != null ? fx(r.sim.fell, 1) + ' s' : 'pas avant ' + fx(r.sim.Tm, 0) + ' s']],
    note: (A, r) => r.w <= r.wc ? ['no', 'N &lt; N<sub>c</sub> : la toupie est <b>instable dès le lancement</b>, elle tombe.'] : ['yes', 'N &gt; N<sub>c</sub> : la toupie tient tant que les frottements ne l’ont pas ralentie sous N<sub>c</sub>.'],
    eq: (A, r) => '<p><b>1. Inerties</b> (plateau assimilé à un disque, axe perpendiculaire passant par la pointe O, théorème de Huygens) :</p><div class="formula sm">I<sub>3</sub> = ½·m·R² = ' + fx(r.I3 * 1e6, 2) + '×10<sup>−6</sup> kg·m² ; I<sub>1</sub> = ¼·m·R² + m·d² = ' + fx(r.I1 * 1e6, 2) + '×10<sup>−6</sup> kg·m²</div>' +
      '<p><b>2. Énergies</b> avec les angles d’Euler : précession φ, nutation θ, rotation propre ψ :</p><div class="formula sm">T = ½·I<sub>1</sub>·[(dθ/dt)² + (dφ/dt)²·sin²θ] + ½·I<sub>3</sub>·ω<sub>3</sub>², &nbsp;ω<sub>3</sub> = dψ/dt + (dφ/dt)·cos θ ; &nbsp;V = m·g·d·cos θ</div>' +
      '<p><b>3. Intégrales premières</b> (φ et ψ n’apparaissent pas dans le lagrangien L = T − V) :</p><div class="formula sm">I<sub>3</sub>·ω<sub>3</sub> = cte ; &nbsp;I<sub>1</sub>·(dφ/dt)·sin²θ + I<sub>3</sub>·ω<sub>3</sub>·cos θ = cte ; &nbsp;T + V = cte</div>' +
      '<p><b>4. Équation de Lagrange en θ :</b></p><div class="formula sm">I<sub>1</sub>·d²θ/dt² = I<sub>1</sub>·(dφ/dt)²·sin θ·cos θ − I<sub>3</sub>·ω<sub>3</sub>·(dφ/dt)·sin θ + m·g·d·sin θ</div>' +
      '<p><b>5. Précession régulière</b> (θ = cte) :</p><div class="formula sm">m·g·d = (dφ/dt)·(I<sub>3</sub>·ω<sub>3</sub> − I<sub>1</sub>·(dφ/dt)·cos θ) &nbsp;⟹&nbsp; Ω ≈ m·g·d / (I<sub>3</sub>·ω<sub>3</sub>) = ' + fx(r.mgd * 1000, 2) + '×10<sup>−3</sup> / (' + fx(r.I3 * 1e6, 2) + '×10<sup>−6</sup> × ' + fx(r.w, 1) + ') = <b>' + fx(r.Om, 2) + ' rad/s</b></div>' +
      '<p><b>6. Stabilité de la toupie « dormante ».</b> Pour θ petit, on pose ξ = θ·e<sup>iφ</sup> (projection horizontale de l’axe). L’équation linéarisée est :</p><div class="formula sm">I<sub>1</sub>·d²ξ/dt² − i·I<sub>3</sub>·ω<sub>3</sub>·dξ/dt − m·g·d·ξ = 0</div>' +
      '<p>En cherchant ξ = e<sup>iλt</sup> : I<sub>1</sub>·λ² − I<sub>3</sub>·ω<sub>3</sub>·λ + m·g·d = 0. Les solutions restent bornées si λ est réel, c’est-à-dire si le discriminant est positif :</p><div class="formula sm">I<sub>3</sub>²·ω<sub>3</sub>² &gt; 4·I<sub>1</sub>·m·g·d &nbsp;⟹&nbsp; ω<sub>c</sub> = 2·√(I<sub>1</sub>·m·g·d) / I<sub>3</sub> = <b>' + fx(r.wc, 1) + ' rad/s</b> (N<sub>c</sub> = ' + fx(r.Nc, 0) + ' tr/min)</div>' +
      '<p>Les deux racines donnent la précession lente (λ ≈ m·g·d / (I<sub>3</sub>·ω<sub>3</sub>)) et la nutation rapide (λ ≈ I<sub>3</sub>·ω<sub>3</sub>/I<sub>1</sub> = ' + fx(r.wn, 0) + ' rad/s).</p>' +
      '<p><b>7. Effet des frottements.</b> ω<sub>3</sub>(t) = ω<sub>0</sub>·e<sup>−t/τ</sup> ; la toupie devient instable quand ω<sub>3</sub> = ω<sub>c</sub> :</p><div class="formula sm">t<sub>c</sub> = τ·ln(ω<sub>0</sub>/ω<sub>c</sub>) = ' + (r.tc > 0 ? A.tau + ' × ln(' + fx(r.w, 1) + ' / ' + fx(r.wc, 1) + ') = <b>' + fx(r.tc, 1) + ' s</b>' : 'déjà dépassé') + '</div>' +
      '<p class="small">La simulation intègre les équations de Lagrange complètes (même modèle que l’atelier 1), avec un ralentissement exponentiel de la rotation propre.</p>',
    plot: (A, r, box) => {
      const sm = r.sim, vl = r.tc > 0 ? [{ v: r.tc, col: GCOL.M, lab: 't_c', left: true }] : [];
      const p1 = syPlot([{ pts: sm.th, col: GCOL.M }], { y0: 0, x0: 0, x1: sm.Tm, vl, xl: 't (s)', yl: 'θ (°)', label: 'Inclinaison de la toupie' });
      plotBox(box, 'Inclinaison θ(t) de l’axe (la toupie tombe quand θ dépasse 70°)', p1);
      const p2 = syPlot([{ pts: sm.nn, col: GCOL.O }], { y0: 0, x0: 0, x1: sm.Tm, h: 150, hl: [{ v: r.Nc, col: GCOL.M, lab: 'N_c' }], vl, xl: 't (s)', yl: 'N (tr/min)', label: 'Vitesse de rotation de la toupie' });
      plotBox(box, 'Vitesse de rotation propre N(t) et vitesse critique Nc', p2);
    }
  },
  mill: {
    prin: '<b>Principe.</b> La meule roule sur la piste en tournant autour de l’arbre vertical. Son moment cinétique de rotation propre, horizontal, est obligé de tourner avec l’arbre : le couple gyroscopique appuie la meule sur la piste et augmente l’effort d’écrasement, sans masse supplémentaire.',
    ctl: (S, A) => [S('m (masse de la meule, t)', 0.5, 10, 0.5, 'm', v => fx(v, 1)), S('R (rayon de la meule, mm)', 400, 1500, 50, 'R', v => v), S('r_m (rayon de la piste, mm)', 600, 2500, 50, 'rm', v => v), S('N (vitesse de l’arbre, tr/min)', 5, 60, 1, 'N', v => v)],
    stats: (A, r) => [['ω de la meule = Ω·r<sub>m</sub>/R', fx(r.w, 2) + ' rad/s'], ['I = ½·m·R²', fx(r.I, 0) + ' kg·m²'], ['H = I·ω', fx(r.H, 0) + ' N·m·s'], ['Couple I·ω·Ω', fx(r.C / 1000, 2) + ' kN·m'], ['Poids m·g', fx(r.P / 1000, 1) + ' kN'], ['Effort ajouté ΔN = ½·m·R·Ω²', fx(r.dN / 1000, 2) + ' kN'], ['Effort d’écrasement N', fx(r.Nt / 1000, 1) + ' kN (+' + fx(100 * r.gain, 0) + ' %)']],
    eq: (A, r) => '<p><b>1. Roulement sans glissement</b> de la meule sur la piste : le centre de la meule a la vitesse Ω·r<sub>m</sub>, le point de contact est immobile :</p><div class="formula sm">ω·R = Ω·r<sub>m</sub> &nbsp;⟹&nbsp; ω = Ω·r<sub>m</sub>/R = ' + fx(r.Om, 3) + ' × ' + fx(r.rm, 2) + ' / ' + fx(r.R, 2) + ' = <b>' + fx(r.w, 2) + ' rad/s</b></div>' +
      '<p><b>2. Moment cinétique de rotation propre</b> (axe radial, horizontal) :</p><div class="formula sm">H = I·ω = ½·m·R²·ω = ' + fx(r.I, 0) + ' × ' + fx(r.w, 2) + ' = ' + fx(r.H, 0) + ' N·m·s</div>' +
      '<p><b>3. L’axe de la meule tourne avec l’arbre</b> (Ω vertical, perpendiculaire à H) :</p><div class="formula sm">dH/dt = Ω ∧ H, &nbsp;de module I·ω·Ω = ' + fx(r.C / 1000, 2) + ' kN·m (porté par l’axe tangent)</div>' +
      '<p><b>4. Théorème du moment dynamique</b> en O (articulation sur l’arbre, qui laisse la meule libre de monter ou descendre), en projection sur l’axe tangent. Seuls le poids P et la réaction N de la piste ont un moment, de bras de levier r<sub>m</sub> :</p><div class="formula sm">r<sub>m</sub>·(N − m·g) = I·ω·Ω</div>' +
      '<div class="formula sm">ΔN = N − m·g = I·ω·Ω / r<sub>m</sub> = I·Ω²/R = ½·m·R·Ω² = <b>' + fx(r.dN / 1000, 2) + ' kN</b></div>' +
      '<p><b>5. Effort d’écrasement.</b></p><div class="formula sm">N = m·g + ½·m·R·Ω² = ' + fx(r.P / 1000, 1) + ' + ' + fx(r.dN / 1000, 2) + ' = <b>' + fx(r.Nt / 1000, 1) + ' kN</b> ; &nbsp;ΔN / (m·g) = R·Ω² / (2g) = ' + fx(100 * r.gain, 1) + ' %</div>' +
      '<p>Le gain relatif ne dépend <b>ni de la masse ni du rayon de la piste</b>, seulement de R et de Ω (au carré). Doubler la vitesse de l’arbre multiplie l’effort ajouté par 4.</p>',
    plot: (A, r, box) => {
      const pts = []; for (let n = 0; n <= 60; n++) { const o = n * Math.PI / 30; pts.push([n, 100 * r.R * o * o / (2 * G)]); }
      const p = syPlot([{ pts, col: GCOL.O }], { y0: 0, x0: 0, x1: 60, pts: [[A.N, 100 * r.gain]], xl: 'N arbre (tr/min)', yl: 'ΔN / (m·g) en %', label: 'Gain d’effort en fonction de la vitesse de l’arbre' });
      plotBox(box, 'Effort ajouté par l’effet gyroscopique, en % du poids (point rouge : réglage actuel)', p);
    }
  },
  cmg: {
    prin: '<b>Principe.</b> Un volant tourne à vitesse constante ; un moteur fait pivoter son cardan. Le moment cinétique change de direction et le satellite reçoit un couple H·dδ/dt, bien plus grand que le couple du moteur : c’est un amplificateur de couple pour orienter satellites et stations spatiales.',
    ctl: (S, A) => [S('m (masse du volant, kg)', 10, 150, 5, 'm', v => v), S('R (rayon du volant, mm)', 100, 400, 10, 'R', v => v), S('N (vitesse du volant, tr/min)', 1000, 10000, 250, 'N', v => v), S('dδ/dt (vitesse du cardan, rad/s)', 0.05, 1, 0.05, 'dd', v => fx(v, 2)), S('J (inertie du satellite, kg·m²)', 500, 20000, 500, 'J', v => v), S('θ (angle de basculement, °)', 10, 180, 5, 'ang', v => v)],
    stats: (A, r) => [['H = I·ω', fx(r.H, 0) + ' N·m·s'], ['Couple sur le satellite τ = H·dδ/dt', fx(r.tau, 0) + ' N·m'], ['Durée du basculement (CMG)', fx(r.t, 1) + ' s'], ['Durée avec une roue de réaction (0,2 N·m)', fx(r.tRW, 0) + ' s (' + fx(r.tRW / 60, 1) + ' min)'], ['Gain de couple', '× ' + fx(r.tau / 0.2, 0)], ['Angle du cardan nécessaire δ<sub>max</sub>', fx(r.dmax, 2) + ' rad (' + fx(r.dmax * DEG, 0) + '°)']],
    note: (A, r) => r.dmax > 1 ? ['no', 'δ<sub>max</sub> &gt; 1 rad : cos δ chute et le couple diminue, le moment cinétique échangé J·ω<sub>max</sub> = ' + fx(r.Lmax, 0) + ' N·m·s approche H. Il faut un volant plus gros, ou une grappe de plusieurs CMG.'] : ['yes', 'Le cardan reste sous 1 rad : l’approximation cos δ ≈ 1 est acceptable.'],
    eq: (A, r) => '<p><b>1. Moment cinétique du volant</b> (vitesse constante) :</p><div class="formula sm">H = I·ω = ½·m·R²·ω = ' + fx(r.I, 2) + ' × ' + fx(r.w, 1) + ' = <b>' + fx(r.H, 0) + ' N·m·s</b></div>' +
      '<p><b>2. Couple fourni.</b> Le moteur du cardan fait tourner H à la vitesse dδ/dt autour d’un axe perpendiculaire. Le théorème du moment dynamique appliqué au volant donne le couple que le satellite doit lui fournir ; par réciprocité, le satellite reçoit :</p><div class="formula sm">τ = −dH/dt = H ∧ (dδ/dt), &nbsp;module τ = H·(dδ/dt)·cos δ ≈ ' + fx(r.H, 0) + ' × ' + fx(A.dd, 2) + ' = <b>' + fx(r.tau, 0) + ' N·m</b></div>' +
      '<p>Le moteur du cardan ne fournit que le petit couple nécessaire à faire tourner le cardan : c’est le volant qui « amplifie ».</p>' +
      '<p><b>3. Manœuvre en « bang-bang »</b> (accélération pendant t/2, puis freinage symétrique) d’un satellite d’inertie J sur un angle θ :</p><div class="formula sm">θ = 2 × ½·(τ/J)·(t/2)² = τ·t² / (4J) &nbsp;⟹&nbsp; t = 2·√(θ·J/τ) = 2 × √(' + fx(r.th, 3) + ' × ' + A.J + ' / ' + fx(r.tau, 0) + ') = <b>' + fx(r.t, 1) + ' s</b></div>' +
      '<p><b>4. Comparaison avec une roue de réaction</b> (le couple est celui de son moteur, ici 0,2 N·m) :</p><div class="formula sm">t = 2·√(θ·J / 0,2) = ' + fx(r.tRW, 0) + ' s, soit ' + fx(r.tRW / r.t, 0) + ' fois plus long</div>' +
      '<p><b>5. Limites.</b> Le moment cinétique échangé avec le satellite ne peut pas dépasser H :</p><div class="formula sm">J·ω<sub>max</sub> = τ·t/2 = ' + fx(r.Lmax, 0) + ' N·m·s ; &nbsp;δ<sub>max</sub> = J·ω<sub>max</sub> / H = (dδ/dt)·t/2 = ' + fx(r.dmax, 2) + ' rad</div>' +

const COURSE = [];
const ph = n => '<div class="fig" data-fig="' + n + '"></div>';
COURSE.push({ id: 'moment', t: 'Moment cinétique d’un rotor', h: `
<p>Un <b>rotor</b> est un solide de révolution qui tourne rapidement autour de son axe, à la vitesse angulaire ω. Pour un rotor dont l’axe passe par son centre de gravité G, le moment cinétique est porté par l’axe :</p>
<div class="formula">H = I · ω</div>
<p>où I est le moment d’inertie autour de l’axe (en kg·m²) et ω la vitesse de rotation en rad/s (ω = 2π·N / 60 si N est en tr/min). Le vecteur H est orienté par la règle de la main droite.</p>` + ph('disc') + `
<p>Le moment d’inertie dépend de la forme du rotor ; plus la masse est loin de l’axe, plus I est grand.</p>` + ph('inertia') + `
<div class="retain"><b>À retenir.</b> H = I·ω est un <b>vecteur</b> : sa direction est celle de l’axe du rotor. Tant qu’aucun moment ne s’exerce, H reste constant, donc l’axe du rotor garde une direction fixe.</div>` });
COURSE.push({ id: 'tmd', t: 'Théorème du moment dynamique', h: `
<p>La variation du moment cinétique par rapport à un point fixe O est égale au moment des actions extérieures :</p>
<div class="formula">dH/dt = M</div>
<p>Si M est <b>perpendiculaire</b> à H, le module de H ne change pas : seule sa <b>direction</b> varie. C’est ce qui se passe avec un rotor rapide : un moment ne le fait pas basculer, il fait tourner l’axe dans un plan perpendiculaire au moment.</p>` + ph('dh') + `
<p>Pendant dt, l’extrémité de H se déplace de dH = M·dt, perpendiculairement à H. L’angle parcouru est dφ = M·dt / H, la vitesse angulaire de H vaut donc :</p>
<div class="formula">Ω = dφ/dt = M / H</div>
<div class="retain"><b>À retenir.</b> Un moment perpendiculaire à H ne fait pas « tomber » le rotor : il fait <b>tourner H</b> autour de la direction du moment. Plus H est grand, plus la rotation est lente.</div>` });
COURSE.push({ id: 'precession', t: 'Précession gyroscopique', h: `
<p>Un rotor est monté sur une tige articulée en O, son centre de gravité G étant à la distance d de O. Son poids P = m·g crée un moment en O :</p>
<div class="formula">M = OG ∧ P, de module M = m·g·d</div>` + ph('gside') + `
<p>Ce moment est horizontal et perpendiculaire à H. Le vecteur H, et donc l’axe du rotor, tourne autour de la <b>verticale</b> à la vitesse :</p>
<div class="formula">Ω = M / H = m·g·d / (I·ω)</div>
<p>On appelle ce mouvement la <b>précession</b>. Elle est lente devant la rotation propre (Ω ≪ ω) quand le rotor tourne vite.</p>` + ph('gtop') + `
<ul><li>Ω est <b>inversement proportionnelle</b> à ω : un rotor plus rapide précesse plus lentement.</li><li>Ω est proportionnelle à d et à m (pour I fixé).</li><li>Si on inverse le sens de rotation du rotor, le sens de précession s’inverse.</li><li>Avec les frottements, ω diminue lentement : Ω augmente, et le gyroscope finit par basculer.</li></ul>` + ph('omegaN') + ph('live') + `
<div class="retain"><b>À retenir.</b> Précession : Ω = m·g·d / (I·ω), vecteur Ω vertical. Rotor plus rapide ⇒ précession plus lente.</div>` });
COURSE.push({ id: 'effet', t: 'Effet gyroscopique', h: `
<p>Quand l’axe d’un rotor est entraîné dans une rotation de vitesse Ω (le bâti qui supporte le rotor tourne), le vecteur H change de direction. Le bâti doit donc exercer sur le rotor un couple, et, par réciprocité, le rotor exerce sur le bâti un <b>couple gyroscopique</b> :</p>
<div class="formula">C = H ∧ Ω, de module C = I · ω · Ω · sin α</div>
<p>α est l’angle entre l’axe du rotor (le vecteur H) et le vecteur Ω.</p>` + ph('turn') + `
<p><b>Règle de sens.</b> Le couple gyroscopique exercé sur le bâti tend à amener le vecteur H vers le vecteur Ω, par le plus court chemin.</p>` + ph('rule') + `
<ul><li>α = 90° : effet maximal. α = 0° ou 180° : effet nul.</li><li>Le couple est proportionnel à I, ω et Ω.</li><li>Il est repris par les paliers : pour deux paliers distants de L, F = C / L sur chacun, avec des sens opposés.</li></ul>
<p><b>Exemple.</b> Rotor I = 0,01 kg·m², N = 3000 tr/min (ω = 314 rad/s), plateau à Ω = 3 rad/s, α = 90° : C = 0,01 × 314 × 3 = 9,4 N·m. Avec L = 300 mm : F = 31 N par palier.</p>
<div class="retain"><b>À retenir.</b> C = I·ω·Ω·sin α. Le couple amène H vers Ω. Il charge les paliers de forces opposées F = C / L.</div>` });
COURSE.push({ id: 'nutation', t: 'Nutation et validité de la formule', h: `
<p>La formule Ω = m·g·d / (I·ω) décrit la <b>précession régulière</b>. Si on lâche le gyroscope sans lui donner la vitesse de précession, l’axe commence par descendre un peu avant de remonter : l’inclinaison θ oscille autour de sa valeur moyenne. C’est la <b>nutation</b>.</p>` + ph('nut') + `
<ul><li>La nutation a une pulsation voisine de I·ω / I<sub>1</sub>, où I<sub>1</sub> est le moment d’inertie par rapport à un axe perpendiculaire passant par O. Elle est d’autant plus rapide et plus petite que ω est grand.</li><li>Avec les frottements de l’air et des liaisons, la nutation s’amortit vite : il ne reste que la précession.</li><li>La formule est valable si <b>Ω ≪ ω</b>. À faible vitesse de rotation, le mouvement est complexe, et pour ω = 0 le gyroscope se comporte comme un simple pendule qui tombe.</li></ul>
<div class="retain"><b>À retenir.</b> Précession : lente et régulière. Nutation : petites oscillations rapides, amorties. Formule valable pour un rotor rapide (Ω ≪ ω).</div>` });
COURSE.push({ id: 'appli', t: 'Applications', h: `
<p>L’effet gyroscopique est utilisé ou subi dans de nombreux systèmes.</p>
<ul><li><b>Toupie, roue de vélo, boomerang :</b> la rotation rapide stabilise l’axe et provoque précession.</li><li><b>Gyroscopes et gyrocompas :</b> un rotor garde une direction fixe dans l’espace ; dans un gyrocompas, la rotation de la Terre fait précesser l’axe vers le nord géographique.</li><li><b>Navires :</b> la turbine de propulsion subit les mouvements de tangage et de giration.</li><li><b>Véhicules à deux roues :</b> les roues sont de petits gyroscopes qui stabilisent l’équilibre en ligne droite.</li><li><b>Hélicoptères et drones :</b> le rotor principal ou les hélices créent des couples gyroscopiques lors des changements d’attitude.</li></ul>` + ph('moto') + `
<p><b>Moto en virage.</b> Les deux roues ont un axe horizontal ; le virage de rayon ρ à la vitesse v impose Ω = v / ρ, alors que ω = v / R<sub>w</sub>. Le couple C = 2·I·ω·Ω = 2·I·v² / (R<sub>w</sub>·ρ) varie avec le carré de la vitesse.</p>` + ph('ship') + `
<p><b>Navire.</b> Une turbine à axe longitudinal soumise à une giration produit un couple qui fait tanguer le navire (la proue monte ou descend selon le sens de la giration et celui de la turbine). Les paliers doivent résister à ce couple.</p>
<div class="retain"><b>À retenir.</b> Pour chaque application : identifier H, Ω et α, calculer C = I·ω·Ω·sin α, puis donner le sens par la règle « H vers Ω ».</div>` });
COURSE.push({ id: 'systemes', t: 'Systèmes exploitant l’effet gyroscopique', h: `
<p>Tous ces systèmes reposent sur la même relation : le théorème du moment dynamique appliqué à un rotor de moment cinétique H = I·ω dont l’axe tourne à la vitesse Ω.</p>
<div class="formula">dH/dt = Ω ∧ H &nbsp;⟺&nbsp; le rotor exerce sur son support le couple C = H ∧ Ω, de module I·ω·Ω·sin α</div>
<p>On l’exploite de trois façons :</p>
<ul><li><b>Produire un couple</b> en faisant tourner volontairement l’axe d’un rotor rapide : stabilisateur de bateau, actionneur gyroscopique de satellite (CMG), monorail gyroscopique. Un petit moteur ou un frein sur le cardan commande un grand couple.</li><li><b>Stabiliser une direction</b> : un moment perturbateur M ne fait que précesser l’axe, à la vitesse Ω = M / H, d’autant plus lentement que H est grand : toupie, gyrocompas, projectiles.</li><li><b>Transformer le couple gyroscopique en effort</b> : il augmente un effort de contact (broyeur à meules) ou, par frottement, entretient une rotation (powerball).</li></ul>
<h3>1. Stabilisateur gyroscopique de bateau</h3>
<p>Un volant lourd tourne à plusieurs milliers de tr/min autour d’un axe vertical z. Il est monté dans un cardan d’axe transversal y, équipé d’un frein ou d’un vérin piloté. Le roulis du bateau se fait autour de l’axe longitudinal x.</p>` + ph('sy_stab') + `
<ol><li>Le roulis dφ/dt (axe x) fait tourner H ; il en résulte un couple autour de y qui fait <b>précesser le cardan</b> : J<sub>c</sub>·d²β/dt² + c·dβ/dt = H·(dφ/dt)·cos β.</li><li>Cette précession dβ/dt (axe y) fait à son tour tourner H : le volant exerce sur la coque un couple autour de x, <b>opposé au roulis</b> : C<sub>x</sub> = −H·(dβ/dt)·cos β.</li><li>Cardan freiné, inertie négligée : dβ/dt ≈ H·(dφ/dt)/c, donc C<sub>x</sub> ≈ −(H²/c)·dφ/dt. C’est un amortissement ajouté b<sub>g</sub> = H²/c.</li></ol>
<div class="formula">J·d²φ/dt² + (b + H²/c)·dφ/dt + K·φ = M<sub>houle</sub>(t), &nbsp;avec K = Δ·g·GM</div>
<p>À la résonance, l’amplitude du roulis est divisée par (b + H²/c)/b. L’énergie est dissipée dans le frein : C<sub>x</sub>·dφ/dt = −c·(dβ/dt)². Le frein doit être bien réglé : trop faible, le cardan part en butée ; trop fort, il est bloqué et le volant ne précesse plus.</p>
<h3>2. Powerball (gyroscope de poignet)</h3>
<p>Un rotor tourne dans une coque sphérique ; les extrémités de son axe (rayon r, demi-longueur a) sont logées dans une gorge circulaire. L’utilisateur fait tourner la coque d’un mouvement circulaire du poignet, à la vitesse Ω perpendiculaire à l’axe du rotor.</p>` + ph('sy_pb') + `
<ul><li>Couple gyroscopique : C = I·ω·Ω ; il bascule l’axe, qui appuie sur les parois de la gorge avec N = C/(2a).</li><li>Le frottement aux deux contacts entraîne le rotor : I·dω/dt = 2·μ·N·r = μ·(r/a)·I·ω·Ω, d’où <b>ω(t) = ω<sub>0</sub>·e<sup>k·t</sup></b> avec k = μ·Ω·r/a. La croissance est exponentielle : il faut une vitesse initiale (ficelle de lancement).</li><li>Vitesse limite, quand l’axe roule sans glisser dans la gorge : ω·r = Ω·a, soit ω<sub>max</sub> = Ω·a/r. Le couple ressenti C<sub>max</sub> = I·Ω²·a/r croît comme le carré de la vitesse du poignet.</li></ul>
<h3>3. Toupie</h3>
<p>Solide de révolution posé sur sa pointe O, centre de gravité G à la distance d. Avec les angles d’Euler (précession φ, nutation θ, rotation propre ψ) :</p>` + ph('sy_top') + `
<div class="formula">T = ½·I<sub>1</sub>·[(dθ/dt)² + (dφ/dt)²·sin²θ] + ½·I<sub>3</sub>·ω<sub>3</sub>², &nbsp;ω<sub>3</sub> = dψ/dt + (dφ/dt)·cos θ ; &nbsp;V = m·g·d·cos θ</div>
<ul><li>Intégrales premières : I<sub>3</sub>·ω<sub>3</sub> = cte ; I<sub>1</sub>·(dφ/dt)·sin²θ + I<sub>3</sub>·ω<sub>3</sub>·cos θ = cte ; T + V = cte.</li><li>Équation de Lagrange en θ : I<sub>1</sub>·d²θ/dt² = I<sub>1</sub>·(dφ/dt)²·sin θ·cos θ − I<sub>3</sub>·ω<sub>3</sub>·(dφ/dt)·sin θ + m·g·d·sin θ.</li><li>Précession régulière (θ constant) : m·g·d = (dφ/dt)·(I<sub>3</sub>·ω<sub>3</sub> − I<sub>1</sub>·(dφ/dt)·cos θ), soit, pour une toupie rapide, Ω ≈ m·g·d / (I<sub>3</sub>·ω<sub>3</sub>).</li><li>Toupie « dormante » (axe vertical) : en posant ξ = θ·e<sup>iφ</sup>, les petits mouvements vérifient I<sub>1</sub>·d²ξ/dt² − i·I<sub>3</sub>·ω<sub>3</sub>·dξ/dt − m·g·d·ξ = 0. Ils restent bornés si <b>I<sub>3</sub>²·ω<sub>3</sub>² &gt; 4·I<sub>1</sub>·m·g·d</b>, d’où la vitesse critique ω<sub>c</sub> = 2·√(I<sub>1</sub>·m·g·d) / I<sub>3</sub>.</li><li>Les frottements font décroître ω<sub>3</sub> ; quand ω<sub>3</sub> &lt; ω<sub>c</sub>, la toupie devient instable, oscille de plus en plus et tombe.</li></ul>
<h3>4. Broyeur à meules</h3>
<p>Une meule de masse m et de rayon R, articulée sur un arbre vertical tournant à Ω, roule sans glisser sur la piste à la distance r<sub>m</sub> de l’axe (broyeurs et moulins à meules verticales, malaxeurs).</p>` + ph('sy_mill') + `
<ul><li>Roulement sans glissement : ω·R = Ω·r<sub>m</sub>.</li><li>L’axe de la meule tourne avec l’arbre : dH/dt = Ω ∧ H, de module I·ω·Ω.</li><li>Théorème du moment dynamique en O (articulation), sur l’axe tangent : r<sub>m</sub>·(N − m·g) = I·ω·Ω.</li></ul>
<div class="formula">N = m·g + I·Ω²/R = m·g + ½·m·R·Ω² &nbsp;(meule assimilée à un disque)</div>
<p>La force d’écrasement est augmentée de ΔN/(m·g) = R·Ω²/(2g), quelles que soient la masse et la distance r<sub>m</sub>.</p>
<h3>5. Actionneur gyroscopique de satellite (CMG)</h3>
<p>Un volant à vitesse constante (H = I·ω) est monté sur un cardan motorisé. En faisant tourner le cardan à dδ/dt, on fait tourner H : le satellite reçoit le couple τ = −dH/dt, de module <b>τ = H·(dδ/dt)·cos δ</b>.</p>` + ph('sy_cmg') + `
<p>Le moteur du cardan ne fournit qu’un faible couple, mais le couple de sortie est très grand : c’est un <b>amplificateur de couple</b>, bien plus puissant qu’une roue de réaction (dont le couple est celui de son moteur). La Station spatiale internationale est orientée par quatre CMG. Limites : le moment cinétique échangé ne peut pas dépasser H, et certaines orientations des cardans (singularités) sont à éviter ; on utilise donc des grappes de plusieurs CMG.</p>
<h3>6. Autres systèmes industriels</h3>` + SY_OTHERS + `
<div class="retain"><b>À retenir.</b> C = H ∧ Ω. On impose Ω pour produire un couple ou un effort (stabilisateur, CMG, broyeur, powerball) ; on subit un couple pour obtenir une précession lente Ω = M / H (toupie, gyrocompas). Dans tous les cas : identifier H, Ω et α, écrire le théorème du moment dynamique, puis vérifier le sens avec la règle « H vers Ω ».</div>` });
COURSE.push({ id: 'methode', t: 'Méthode', h: `
<ol>
<li><b>Schématiser</b> : repérer l’axe du rotor et orienter H (main droite), repérer la rotation Ω du bâti.</li>
<li><b>Convertir</b> : N en rad/s (ω = 2π·N/60), les angles en radians, les distances en mètres.</li>
<li><b>Calculer I</b> : ½·m·R² pour un disque homogène.</li>
<li><b>Précession d’un gyroscope pesant</b> : M = m·g·d, H = I·ω, Ω = M / H.</li>
<li><b>Effet gyroscopique</b> : C = I·ω·Ω·sin α, puis F = C / L sur chaque palier.</li>
<li><b>Sens</b> : le couple sur le bâti amène H vers Ω (le plus court chemin) ; la précession tourne dans le sens de M vu depuis H.</li>
<li><b>Contrôler</b> : unités (N·m, rad/s), ordre de grandeur, et hypothèse Ω ≪ ω pour la précession.</li>
</ol>
<div class="retain"><b>À retenir.</b> Précession : Ω = M / H. Effet gyroscopique : C = H ∧ Ω. Dans les deux cas, H cherche à rejoindre le vecteur qui lui impose sa rotation.</div>` });

/* ---------- interface ---------- */
const UI = { cur: 'g1' };
const AS = { key: 'g1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null, perm: {} };
const CS = { open: false, id: 'torseurs' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  stopSim();
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag; box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal', html: '<b>Objectif. </b>' + a.goal }));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    const perm = AS.perm[AS.key] || (AS.perm[AS.key] = a.qcm.map(q => shuffled(q.o.length)));
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      perm[i].forEach(j => {
        const o = q.o[j];
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w })); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
$('#bAct').addEventListener('click', () => { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); });

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  hydrateFigs(art);
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : effet gyroscopique et précession'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Six ateliers sur le gyroscope : un gyroscope pesant en précession (simulation 3D avec nutation), un rotor sur plateau tournant (effet gyroscopique), deux applications (moto, navire), les systèmes qui exploitent l’effet gyroscopique (stabilisateur de bateau, powerball, toupie, broyeur, CMG) et deux séries d’exercices.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Dans les ateliers 3D, modifiez les curseurs : la simulation se met à jour ; la souris tourne la vue, la molette zoome.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> donne le cours illustré.</li><li>Dans les exercices, tapez un nombre (virgule ou point) ; les réponses sont acceptées à 2 % près.</li></ul>' +
    '<h3>Couleurs</h3><p>H moment cinétique (vert), M moment ou couple (rouge), Ω vitesse de rotation du bâti ou de précession (bleu), P poids (orange), efforts sur les paliers (violet).</p>' +
    '<h3>Vos données</h3><p>Les réponses au QCM et le choix clair ou sombre sont mémorisés dans ce navigateur uniquement.</p>' }));
});
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  const b = $('#bTheme'); b.textContent = t === 'dark' ? 'Mode clair' : 'Mode sombre'; b.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
  refreshThreeTheme();
}
applyTheme(lsGet(KEYS.theme, 'light'));
$('#bTheme').addEventListener('click', () => { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(t); lsSet(KEYS.theme, t); });
function loop(ts) {
  const dt = Math.min(0.05, (ts - ANIM.last) / 1000 || 0); ANIM.last = ts;
  if (ANIM.fn && !CS.open && !document.hidden) { try { ANIM.fn(dt); } catch (e) { ANIM.fn = null; } }
  requestAnimationFrame(loop);
}
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); requestAnimationFrame(loop); })();

</script>
