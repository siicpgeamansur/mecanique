  F.demande = (() => {
    const g = (ox, slope, titleTxt, verdict, col, steep) => {
      const oy = 214, w = 210, h = 120; let s = '';
      s += ar(ox, oy, ox + w + 14, oy, C.K, 1.4) + ar(ox, oy, ox, oy - h - 12, C.K, 1.4) + m(ox + w + 12, oy + 18, 'F', { sz: 15 }) + t(ox - 4, oy - h - 20, 'frottement', { a: 'start', sz: 12 });

    };

  })();;

  /* ---------- 2. Coulomb ---------- */
  F.contact = (() => {

  F.regimes = (() => {
    const pan = (x, name, body, cond) => `<g transform="translate(${x},0)">${rect(2, 4, 178, 170, '#fbfcfd', '#d5dbe2', 1, 6)}${ln(14, 124, 168, 124, C.K, 2.2)}${hatch(16, 168, 124)}${body}${title(91, 24, name)}${t(91, 166, cond, { c: C.K, sz: 12.5 })}</g>`;

    return base(570, 178, 'Trois régimes de la loi de Coulomb : adhérence, glissement, décollement', s);
  })();;

  F.coulombGraph = (() => {
    const ox = 60, oy = 200, w = 270, h = 160, mu = .6; let s = '';
    const xe = Math.min(w, h / mu);
    s += poly([[ox, oy], [ox + xe, oy - xe * mu], [ox + xe, oy]], C.GL, 'none', 0);

  /* ---------- 3. Collier ---------- */
  F.eta = (() => {
    const ox = 60, oy = 190, w = 300, h = 140, xl = 200; let s = '';

  /* triangle A–B–I et zone de concours possible */
  F.seuil = (() => {
    const L = 140, phi = 30, mu = Math.tan(rad(phi)), yI = L / 2 / mu, y0 = 270, Ax = 60;

    s += ln(X(0), Y(0), X(mu * hT), Y(hT), C.G, 1.5, '6 4') + ln(X(L), Y(0), X(L - mu * hT), Y(hT), C.G, 1.5, '6 4');

    s += m(X(L / 2) + 10, Y(yI) + 20, 'I', { a: 'start', c: C.G, w: 600 });
    s += arc(X(0), Y(0), 46, 0, 90 - phi, C.G, 1.3) + m(X(0) + 60, Y(0) - 10, 'φ', { c: C.G, sz: 14 });
    const a1 = 70, a2 = 175;
    s += ln(30, Y(a1), 500, Y(a1), C.N, 1.8, '8 4') + ar(30, Y(a1), 86, Y(a1), C.N, 2.8) + v(52, Y(a1) - 8, 'F', { c: C.N, w: 600 });
    s += ln(30, Y(a2), 500, Y(a2), C.F, 1.8, '8 4') + ar(30, Y(a2), 86, Y(a2), C.F, 2.8) + v(52, Y(a2) - 8, 'F', { c: C.F, w: 600 });

    s += t(262, Y(a2) - 7, 'a ≥ a_lim : concours possible → bloqué', { c: C.F, w: 600, sz: 12.5, a: 'start' });

  })();;

  /* ---------- 4. Triangle des forces ---------- */
  F.troisForces = (() => {
    let s = '';
    const O = [150, 125], F1 = [90, -30], F2 = [-50, -60], F3 = [-40, 90];

    s += v((Q0[0] + Q1[0]) / 2 + 6, (Q0[1] + Q1[1]) / 2 + 22, 'F_1', { c: cols[0], w: 600 }) + v((Q1[0] + Q2[0]) / 2 + 28, (Q1[1] + Q2[1]) / 2, 'F_2', { c: cols[1], w: 600 }) + v((Q2[0] + Q0[0]) / 2 - 30, (Q2[1] + Q0[1]) / 2, 'F_3', { c: cols[2], w: 600 });
    s += v(350, 268, 'F_1', { c: cols[0], w: 600, a: 'start' }) + t(382, 268, '+', { c: C.K, a: 'start' }) + v(396, 268, 'F_2', { c: cols[1], w: 600, a: 'start' }) + t(428, 268, '+', { c: C.K, a: 'start' }) + v(442, 268, 'F_3', { c: cols[2], w: 600, a: 'start' }) + t(474, 268, '=', { c: C.K, a: 'start' }) + v(490, 268, '0', { c: C.K, w: 600, a: 'start' });
    return base(560, 282, 'Théorème des trois forces : lignes d’action concourantes et triangle des forces fermé', s);
  })();;

  F.collierBloque = (() => {
    const L = 130, psi = 25, tp = Math.tan(rad(psi)), a = L / (2 * tp), y0 = 272, A = [70, y0], B = [70 + L, y0], I = [70 + L / 2, y0 - a]; let s = '';

    s += ln(A[0], A[1], I[0], I[1], C.D, 1.4, '6 4') + ln(B[0], B[1], I[0], I[1], C.D, 1.4, '6 4');
    s += ln(A[0], A[1], A[0], A[1] + 70, C.M, 1, '4 4') + ln(B[0], B[1], B[0], B[1] - 90, C.M, 1, '4 4');

    s += ar(A[0], A[1], ra[0], ra[1], C.R, 3) + v(ra[0] - 8, ra[1] + 6, 'R_A', { c: C.R, w: 600, a: 'end' });
    s += ar(B[0], B[1], rb[0], rb[1], C.R, 3) + v(rb[0] - 8, rb[1] - 2, 'R_B', { c: C.R, w: 600, a: 'end' });
    s += arc(A[0], A[1], 32, 245, 270, C.M, 1.3) + m(A[0] + 8, A[1] + 50, 'ψ', { c: C.M, sz: 14 }) + arc(B[0], B[1], 32, 90, 115, C.M, 1.3) + m(B[0] + 8, B[1] - 40, 'ψ', { c: C.M, sz: 14 });
    s += ln(30, I[1], 230, I[1], C.F, 1.6, '8 4') + ar(30, I[1], 106, I[1], C.F, 3) + v(60, I[1] - 8, 'F', { c: C.F, w: 600 });
    s += ln(106, I[1], 106, y0 - 15, C.K, 3);
    s += dot(A[0], A[1]) + dot(B[0], B[1]) + dot(I[0], I[1], 4.5, C.G) + dot(I[0], y0, 3);
    s += m(A[0] - 6, A[1] - 12, 'A', { a: 'end', w: 600 }) + m(B[0] + 8, B[1] - 8, 'B', { a: 'start', w: 600 }) + m(I[0] + 8, I[1] + 18, 'I', { a: 'start', c: C.G, w: 600 }) + m(I[0] + 3, y0 + 36, 'G', { w: 600, a: 'middle' });
    s += dimV(245, I[1], y0, 'a', C.M, 10);
    s += dimH(A[0], B[0], y0 + 56, 'L');
    const F_ = 120, T = F_ / 2, N = T / tp, Q0 = [350, 296], Q1 = [Q0[0] + F_, Q0[1]], Q2 = [Q0[0] + T, Q0[1] - N];
    s += title(420, 20, 'Triangle des forces fermé');
    s += poly([Q0, Q1, Q2], 'rgba(27,74,118,.06)', 'none', 0);
    s += poly([Q0, [Q0[0] + F_ * .5, Q0[1]], [Q0[0] + F_ * .25, Q0[1] - N * .5]], 'none', C.D, 1.2, '4 3');
    s += ar(Q0[0], Q0[1], Q1[0], Q1[1], C.F, 3.2) + ar(Q1[0], Q1[1], Q2[0], Q2[1], C.R, 3.2) + ar(Q2[0], Q2[1], Q0[0], Q0[1], C.R, 3.2);
    s += ln(Q2[0], Q2[1], Q2[0], Q0[1], C.M, 1.3, '5 4') + m(Q2[0] + 8, Q0[1] - N * .28, 'N', { c: C.N, w: 600, a: 'start' });
    s += v((Q0[0] + Q1[0]) / 2, Q0[1] + 22, 'F', { c: C.F, w: 600 }) + v(Q1[0] - 20, Q0[1] - N / 2 - 4, 'R_B', { c: C.R, w: 600 }) + v(Q0[0] - 2, Q0[1] - N / 2 - 4, 'R_A', { c: C.R, w: 600, a: 'end' });
    s += arc(Q2[0], Q2[1], 34, 270, 270 + psi, C.M, 1.3) + arc(Q2[0], Q2[1], 34, 270 - psi, 270, C.M, 1.3) + m(Q2[0], Q2[1] + 50, 'ψ   ψ', { c: C.M, sz: 13 });
    s += m(Q0[0] + T / 2, Q0[1] - 6, 'F/2', { sz: 12, c: C.M }) + m(Q0[0] + 1.5 * T, Q0[1] - 6, 'F/2', { sz: 12, c: C.M });
    s += t(420, 40, 'tan ψ = T/N = L/(2a)', { c: C.K, sz: 12.5 }) + t(420, 56, 'pointillés : F plus petite, même forme', { c: C.D, sz: 11.5 });
    return base(560, 352, 'Collier bloqué : lignes d’action concourantes en I et triangle des forces fermé isocèle', s);
  })();;

  F.collierGlisse = (() => {
    const L = 130, phi = 30, mu = Math.tan(rad(phi)), aLim = L / (2 * mu), a = 70, y0 = 272, A = [70, y0], B = [70 + L, y0], I = [70 + L / 2, y0 - aLim]; let s = '';
    s += title(150, 20, 'Droites limites sans concours');
    s += rect(A[0], y0 - 15, L, 30, C.L, C.F, 1.8) + axisSym(25, 290, y0) + t(290, y0 + 18, 'axe (G,', { a: 'end', sz: 12 }) + v(291, y0 + 18, 'x', { a: 'start', sz: 13 }) + t(301, y0 + 18, ')', { a: 'start', sz: 12 });
    s += ln(A[0], A[1], I[0], I[1], C.D, 1.4, '6 4') + ln(B[0], B[1], I[0], I[1], C.D, 1.4, '6 4');
    const ra = P(A[0], A[1], 58, 270 - phi), rb = P(B[0], B[1], 58, 90 + phi);
    s += ar(A[0], A[1], ra[0], ra[1], C.R, 3) + v(ra[0] - 8, ra[1] + 6, 'R_A', { c: C.R, w: 600, a: 'end' });
    s += ar(B[0], B[1], rb[0], rb[1], C.R, 3) + v(rb[0] + 8, rb[1] + 8, 'R_B', { c: C.R, w: 600, a: 'start' });
    s += ln(30, y0 - a, 235, y0 - a, C.F, 1.6, '8 4') + ar(30, y0 - a, 92, y0 - a, C.F, 3) + v(56, y0 - a - 8, 'F', { c: C.F, w: 600 });
    s += ln(92, y0 - a, 92, y0 - 15, C.K, 3);

  /* ---------- 7. Échelle ---------- */
  F.echelle = (() => {

    s += arc(Fo[0], Fo[1], 48, 0, al, C.K, 1.4) + m(Fo[0] + 54, Fo[1] - 12, 'α', { sz: 15 });
    s += dot(Fo[0], Fo[1], 3.5) + dot(T[0], T[1], 3.5);
    s += t(Mi[0] - 40, Mi[1] + 4, 'longueur ℓ', { sz: 12, a: 'end' });
    s += t(T[0] + 30, 120, 'mur lisse', { sz: 12, a: 'start' });
    return base(380, 300, 'Échelle appuyée sur un mur lisse : poids W et W_P, réactions N_1, F_1 au sol et N_2 au mur', s);
  })();;

  F.echelleCone = (() => {
    const ox = 56, oy = 200, w = 310, h = 150, ymax = .5, mu = .35, al = 65, W = 120, Wp = 700;
    const tn = Math.tan(rad(al)), tpsi = s => (W / 2 + Wp * s) / (tn * (W + Wp)), smax = (mu * tn * (W + Wp) - W / 2) / Wp; let s = '';
    const X = u => ox + u * w, Y = y => oy - y / ymax * h;
    s += rect(X(smax), Y(ymax), X(1) - X(smax), h, C.RL, 'none', 0) + rect(ox, Y(ymax), X(smax) - ox, h, C.GL, 'none', 0);
    s += ar(ox, oy, ox + w + 16, oy, C.K, 1.4) + ar(ox, oy, ox, oy - h - 16, C.K, 1.4);
    s += ln(ox, Y(mu), X(1), Y(mu), C.G, 2, '7 4') + m(X(1) + 6, Y(mu) + 5, 'tan φ = μ', { c: C.G, a: 'start', sz: 13 });
    s += ln(X(0), Y(tpsi(0)), X(1), Y(tpsi(1)), C.F, 3) + m(X(.04), Y(tpsi(.04)) - 16, 'tan ψ = N₂/N₁', { c: C.F, a: 'start', sz: 14 });
    s += dot(X(smax), Y(mu), 5, C.T) + ln(X(smax), Y(mu), X(smax), oy, C.T, 1.3, '4 3') + m(X(smax), oy + 36, 's_max ≈ ' + smax.toFixed(2).replace('.', ','), { c: C.T, sz: 13 });
    for (let u = 0; u <= 1.001; u += .25) s += ln(X(u), oy - 4, X(u), oy + 4, C.K, 1) + t(X(u), oy + 18, String(u).replace('.', ','), { sz: 11.5 });
    s += m(ox + w + 12, oy + 18, 's', { sz: 15 }) + m(ox + 8, oy - h - 6, 'tan ψ', { a: 'start', sz: 14 });
    s += t(X(smax / 2), Y(ymax) + 18, 'tient', { c: C.G, w: 600 }) + t(X((1 + smax) / 2), Y(ymax) + 18, 'glisse', { c: C.N, w: 600 });
    s += t(ox + w / 2, 268, 'W = 120 N, W_P = 700 N, μ = 0,35, α = 65°', { sz: 12 });
    return base(440, 278, 'Échelle : tan ψ croît avec la position s de la personne et atteint μ en s_max', s);
  })();;

  /* ---------- 8. Méthode ---------- */
  F.methode = (() => {
    const box = (x, y, n, tt, sub, col) => rect(x, y, 210, 74, '#fbfcfd', col, 1.8, 8) + `<circle cx="${x + 22}" cy="${y + 22}" r="13" fill="${col}"/>` + t(x + 22, y + 27, String(n), { c: '#fff', w: 700, sz: 14 }) + t(x + 44, y + 27, tt, { a: 'start', c: C.K, w: 600, sz: 14 }) + t(x + 14, y + 52, sub, { a: 'start', sz: 12 });
    let s = box(10, 10, 1, 'Isoler', 'bilan des actions, sens de glissement', C.F) + box(250, 10, 2, 'Équations', 'résultante (2 directions) + moment', C.F);
    s += box(250, 112, 3, 'Lois de Coulomb', 'T = μN (glisse) ou T ≤ μN (adhère)', C.T) + box(10, 112, 4, 'Interpréter', 'dépend-il de F ? sinon : arc-boutement', C.G);
    s += ar(222, 47, 246, 47, C.K, 2) + ar(355, 88, 355, 108, C.K, 2) + ar(246, 149, 222, 149, C.K, 2);
    return base(470, 196, 'Méthode en quatre étapes : isoler, équations, lois de Coulomb, interpréter', s);
  })();

  F.mu = (() => {
    let s = '';
    s += ln(40, 90, 480, 90, C.K, 3) + rect(130, 78, 260, 24, '#eef3f8', C.B, 1.4);

    s += ar(375, 52, 440, 52, C.N, 2.6) + t(260, 40, 'Éviter l’arc-boutement (guidage, tiroir) : dimensionner avec μ_max', { c: C.N, w: 600, sz: 12.5 }).replace('260', '260');
    s += ar(145, 168, 80, 168, C.G, 2.6) + t(260, 160, 'Garantir le maintien (échelle, cale, vis) : dimensionner avec μ_min', { c: C.G, w: 600, sz: 12.5 });
    return base(520, 184, 'Fourchette de μ : prendre μ_max pour éviter l’arc-boutement, μ_min pour garantir le maintien', s);
  })();

  return F;
})();

COURSE.push({ id: 'phenomene', t: 'Le phénomène et son modèle', h: String.raw`
<p>Un tiroir de commode poussé d’un seul côté se coince. Un collier poussé trop loin de son axe se bloque sur sa tige. Une échelle trop couchée glisse, une cale bien enfoncée ne ressort plus. Dans tous ces cas, <b>plus on pousse, plus ça résiste</b>.</p>
${fig(FIGS.situations, 'Quatre situations où le blocage apparaît : tiroir poussé d’un côté, collier sur sa tige, échelle, cale.')}
<h3>Définition</h3>
<p>On dit qu’un solide en contact avec frottement est <b>arc-bouté</b> lorsque, pour une géométrie et des directions d’actions données, l’équilibre (l’adhérence) est maintenu <b>quelle que soit l’intensité</b> de la sollicitation. La condition d’arc-boutement ne porte alors que sur des <b>angles</b> et des <b>longueurs</b>, et sur le coefficient de frottement $\mu$ : jamais sur la valeur de la force.</p>
<h3>Pourquoi l’intensité disparaît</h3>
<p>Dans le modèle de Coulomb, la composante tangentielle maximale du contact est proportionnelle à la composante normale : $T_{\text{max}}=\mu N$. Or lorsqu’on augmente une force $F$ appliquée à un solide, toutes les réactions de liaison, normales comme tangentielles, augmentent dans le même rapport (équations linéaires en $F$). La comparaison entre $T$ nécessaire et $\mu N$ disponible se réduit donc à une inégalité entre rapports homogènes à $F$ qui se simplifie : il reste une condition purement géométrique.</p>
${fig(FIGS.demande, 'Le frottement nécessaire (F) et le frottement maximal disponible (2μN) sont tous deux proportionnels à F : seule la pente, donc la géométrie, décide.')}
<h3>Hypothèses du modèle</h3>
<ul>
<li>Solides indéformables, liaisons parfaites sauf le frottement de glissement. Pas de jeu pris en compte, pas de résistance au roulement ni au pivotement.</li>
<li>Loi de Coulomb avec un seul coefficient $\mu$ (on confond adhérence et frottement : $\mu_s=\mu_d=\mu$).</li>
<li>Étude plane, quasi-statique ou avec accélération du centre de masse sans rotation.</li>
<li>Les valeurs de $\mu$ sont des ordres de grandeur : un résultat de bureau d’études se calcule avec une valeur <b>défavorable</b> (voir la dernière section).</li>
</ul>
<div class="retain"><b>À retenir.</b> L’arc-boutement est un phénomène d’équilibre avec frottement dont la condition est géométrique : elle ne dépend pas de l’intensité des forces, seulement de directions, de longueurs et de $\mu$.</div>` });

COURSE.push({ id: 'coulomb', t: 'Lois de Coulomb, cône de frottement', h: String.raw`
<p>Soit deux solides 1 et 2 en <b>liaison sphère-plan</b> de centre $O$ : le plan tangent commun a pour normale l’axe $(O,\vec{n})$, où $\vec{n}$ est unitaire et dirigé <em>vers l’extérieur du solide 2</em> (vers le solide 1). L’action de 2 sur 1 est $\vec{R}=N\,\vec{n}+\vec{T}$, avec $\vec{T}\cdot\vec{n}=0$.</p>
${fig(FIGS.contact, 'Liaison sphère-plan : normale (O, n), réaction R = N n + T avec T dans le plan tangent.')}
<h3>Les trois régimes</h3>
<table class="ctable"><thead><tr><th>Régime</th><th>Condition cinématique</th><th>Loi</th></tr></thead><tbody>
<tr><td>Adhérence</td><td>$\vec{v}_g=\vec{0}$</td><td>$N\geq 0$ et $\|\vec{T}\|\leq \mu N$</td></tr>
<tr><td>Glissement</td><td>$\vec{v}_g\neq\vec{0}$</td><td>$N> 0$ et $\vec{T}=-\mu N\,\dfrac{\vec{v}_g}{\|\vec{v}_g\|}$</td></tr>
<tr><td>Décollement</td><td>contact rompu</td><td>$N=0$, $\vec{T}=\vec{0}$</td></tr></tbody></table>
<p>$\vec{v}_g$ est la vitesse de glissement du solide 1 par rapport au solide 2. Le frottement est <b>opposé</b> au glissement : il dissipe de la puissance, $\vec{T}\cdot\vec{v}_g=-\mu N\|\vec{v}_g\|\leq 0$.</p>
${fig(FIGS.regimes, 'Les trois régimes de la loi de Coulomb.')}
<h3>Cône de frottement</h3>
<p>On appelle <b>angle de frottement</b> $\varphi=\arctan\mu$. Tant que l’on n’a pas glissement, $\|\vec{T}\|/N\leq\mu=\tan\varphi$, c’est-à-dire :</p>
$$\vec{R}\ \text{dans le cône de sommet le point}\ O\text{, d’axe}\ (O,\vec{n})\ \text{et de demi-angle}\ \varphi$$
${fig(SVG_CONE, 'Cône de frottement : la réaction possible est dans le cône ; sur le bord, le glissement est imminent.')}
<div class="proof"><b>PROPRIÉTÉ</b>
<p>Un solide en contact avec frottement et soumis à d’autres actions (somme $\vec{F}$) reste en équilibre si et seulement si $-\vec{F}$ est dans le cône, soit $\|\vec{F}_t\|\leq\mu\,(-\vec{F}\cdot\vec{n})$. Si $\vec{F}$ est hors du cône, le solide glisse : le contact ne peut pas fournir la réaction qui équilibrerait $\vec{F}$.</p></div>
${fig(FIGS.coulombGraph, 'Dans le plan (N, ‖T‖) : adhérence sous la droite ‖T‖ = μN, glissement sur la droite, décollement pour N = 0.')}
<h3>Valeurs usuelles (ordres de grandeur)</h3>
<table class="ctable"><thead><tr><th>Couple de matériaux</th><th>$\mu$</th><th>$\varphi$</th></tr></thead><tbody>
<tr><td>acier / acier lubrifié</td><td>0,05 à 0,15</td><td>3° à 8,5°</td></tr>
<tr><td>acier / acier sec</td><td>0,15 à 0,30</td><td>8,5° à 17°</td></tr>
<tr><td>bois / bois</td><td>0,3 à 0,5</td><td>17° à 27°</td></tr>
<tr><td>caoutchouc / béton sec</td><td>0,6 à 0,9</td><td>31° à 42°</td></tr></tbody></table>
<div class="remark"><b>Adhérence et glissement.</b> Dans la réalité, le coefficient d’adhérence $\mu_s$ est un peu supérieur au coefficient de glissement $\mu_d$ ; la différence est à l’origine du broutement (<em>stick-slip</em>). L’arc-boutement porte sur l’adhérence : c’est $\mu_s$ qu’il faut prendre pour décider si ça tient.</div>
<div class="retain"><b>À retenir.</b> Pas de glissement $\Leftrightarrow$ la réaction est dans le cône de demi-angle $\varphi=\arctan\mu$. La question de l’arc-boutement devient : le cône est-il assez large pour contenir la réaction que l’équilibre exige ?</div>` });

COURSE.push({ id: 'collier', t: 'Le collier sur un guidage', h: String.raw`
<p>On étudie un collier (solide $S$, masse $m$) guidé en translation selon la direction $\vec{x}$ par deux <b>liaisons sphère-plan</b> : en $A$ (à l’arrière), sur une paroi, de normale $(A,\vec{y})$ ; en $B$ (à l’avant), sur la paroi opposée, de normale $(B,\vec{y})$. $A$ et $B$ sont distants de $L$ selon $\vec{x}$. Le centre de masse $G$ est sur l’axe de guidage $(G,\vec{x})$, à égale distance des deux parois. On pousse avec $\vec{F}=F\,\vec{x}$, dont la ligne d’action est parallèle à l’axe $(G,\vec{x})$, à la distance $a>0$.</p>
${fig(SVG_COLLIER, 'Collier de longueur de guidage L. La force F est à la hauteur a de l’axe. Liaisons sphère-plan en A (arrière, paroi haute) et B (avant, paroi basse).')}
<div class="proof"><b>DÉMONSTRATION DE LA CONDITION D’ARC-BOUTEMENT</b>
<p><b>Actions.</b> En $A$ : $\vec{R}_A=-N_A\,\vec{y}-T_A\,\vec{x}$. En $B$ : $\vec{R}_B=+N_B\,\vec{y}-T_B\,\vec{x}$. La force $F$ tend à faire tourner le collier dans le sens horaire ; les normales apparaissent en conséquence aux coins diagonalement opposés.</p>
<p><b>Théorème de la résultante dynamique selon $\vec{y}$</b> (pas d’accélération verticale) :</p>
$$N_B-N_A=0\ \Rightarrow\ N_A=N_B=N$$
<p><b>Théorème du moment dynamique en $G$ selon $\vec{z}$.</b> Le collier n’a pas de rotation et $G$ est son centre de masse : le moment dynamique en $G$ est nul. Le moment des normales vaut $N L$. Les frottements, de même module $\mu N$ au glissement et situés de part et d’autre de l’axe à la même distance de $G$, se compensent. Le moment de $\vec{F}$ vaut $-aF$ :</p>
$$N\,L-a\,F=0\ \Rightarrow\ N=\frac{a\,F}{L}$$
<p><b>Théorème de la résultante dynamique selon $\vec{x}$</b>, dans l’hypothèse du glissement ($T_A=T_B=\mu N$) :</p>
$$m\,\ddot{x}=F-2\mu N=F\left(1-\frac{2\mu a}{L}\right)$$
</div>
<p>Le collier ne peut glisser vers l’avant que si $\ddot{x}>0$. On en tire :</p>
$$$\text{glissement possible}\ \Leftrightarrow\ a<\frac{L}{2\mu}\qquad\text{arc-boutement}\ \Leftrightarrow\ a\geq\frac{L}{2\mu}$$$
<p>La <b>part utile</b> de la force est $\eta=1-\dfrac{2\mu a}{L}$ ; elle s’annule à la hauteur critique $a_{\text{lim}}=L/(2\mu)$. Le frottement maximal disponible vaut $2\mu N=\dfrac{2\mu a}{L}\,F$ : <b>proportionnel à $F$</b>, comme $F$ lui-même, avec un rapport qui ne dépend ni de $F$ ni de la masse.</p>
${fig(FIGS.eta, 'Part utile de la force : elle décroît linéairement avec a et s’annule à a_lim = L/(2μ).')}
<div class="proof"><b>ET À L’ARRÊT ?</b>
<p>Si $a\geq L/(2\mu)$, il reste à montrer que l’équilibre existe. Posons $T_A=T_B=F/2$ (somme égale à $F$ selon $x$) : le moment en $G$ donne $N=aF/L$, et la condition d’adhérence $T\leq\mu N$ s’écrit $F/2\leq\mu aF/L$, soit exactement $a\geq L/(2\mu)$. Elle ne dépend pas de $F$.</p></div>
<div class="remark"><b>Rigueur : hyperstatisme.</b> À l’arrêt les inconnues $T_A$ et $T_B$ ne sont pas séparément déterminées par les équations de la statique (système hyperstatique). Si l’on tient compte de l’épaisseur $d$ du guidage, le moment des frottements fait apparaître $(T_A-T_B)\,d/2$. On montre que, pour $\mu d<L$, le cas le plus favorable à l’équilibre est $T_A=T_B$ : c’est lui qui donne la condition ci-dessus. Pour ce résultat, $d$ n’intervient pas lorsque $a$ est mesurée depuis l’axe.</div>
<h3>Interprétation géométrique : les deux droites limites</h3>
<p>À la limite du glissement, $\vec{R}_A$ et $\vec{R}_B$ sont portées par les bords des cônes de frottement en $A$ et $B$. Avec les liaisons situées sur l’axe $(G,\vec{x})$ ($d\to0$) et l’origine en $A$, ces droites sont $y=x/\mu$ et $y=-(x-L)/\mu$ : elles se coupent au point d’abscisse $L/2$ et de hauteur $L/(2\mu)$. Le collier soumis à trois forces ($\vec{F},\vec{R}_A,\vec{R}_B$) est en équilibre si leurs lignes d’action sont concourantes : la droite d’action de $\vec{F}$ doit passer au-delà de ce point. On retrouve $a\geq L/(2\mu)$.</p>
${fig(FIGS.seuil, 'Les droites limites de R_A et R_B se coupent en I, à la distance L/(2μ) de l’axe. Une droite d’action de F au-delà de I peut concourir avec elles ; en deçà, jamais.')}
<h3>Que faire pour éviter l’arc-boutement ?</h3>
<ul>
<li><b>Diminuer $a$</b> : pousser au plus près de l’axe (poignée centrée, double poussée symétrique, vérin dans l’axe).</li>
<li><b>Augmenter $L$</b> : guidage long, ou guidage à deux paliers éloignés (règle usuelle : $L\gtrsim 2\mu a$ avec de la marge).</li>
<li><b>Diminuer $\mu$</b> : lubrification, bagues à bille ou à rouleaux (le $\mu$ équivalent tombe à 0,002–0,01). Contre-intuitif : moins de frottement <em>diminue</em> l’arc-boutement.</li>
</ul>
<h3>Exercice résolu</h3>
<p><b>Énoncé.</b> Un guidage acier lubrifié ($\mu=0{,}15$) de longueur $L=60$ mm est actionné par une poignée à $a=250$ mm de l’axe. Y a-t-il arc-boutement ? Quelle longueur minimale faudrait-il ?</p>
<p><b>Solution.</b> $a_{\text{lim}}=\dfrac{L}{2\mu}=\dfrac{60}{0{,}30}=200$ mm $<250$ mm : le collier est <b>arc-bouté</b>. Pour glisser il faut $L>2\mu a=2\times0{,}15\times250=75$ mm. Avec $L=90$ mm, la part utile est $\eta=1-\dfrac{2\times0{,}15\times250}{90}\approx0{,}17$ : le collier glisse, mais avec seulement 17 % de la force utile.</p>
<div class="retain"><b>À retenir.</b> Collier de longueur $L$, poussé à la hauteur $a$ de l’axe : $N=aF/L$ et glissement $\Leftrightarrow a<L/(2\mu)$. La force $F$ ne change pas la condition.</div>` });

COURSE.push({ id: 'triangle', t: 'Triangle des forces et concours', h: String.raw`
<p>Quand un solide est soumis à <b>trois forces</b> coplanaires, on peut raisonner graphiquement. C’est le cas du collier : la poussée $\vec{F}$ et les actions de contact $\vec{R}_A$ et $\vec{R}_B$ (chacune somme d’une normale et d’un frottement).</p>
<h3>Théorème des trois forces</h3>
<div class="proof"><b>PROPRIÉTÉ</b>
<p>Un solide en équilibre sous l’action de trois forces coplanaires non parallèles est tel que :</p>
<ul><li>la somme des trois forces est nulle : leurs représentants mis bout à bout forment un <b>triangle fermé</b> ;</li><li>leurs droites d’action sont <b>concourantes</b> (le moment résultant en leur point de concours est nul).</li></ul></div>
${fig(FIGS.troisForces, 'Théorème des trois forces : droites d’action concourantes en O (à gauche) et triangle des forces fermé (à droite).')}
<h3>Application au collier</h3>
<p>En reprenant les notations de la section précédente, avec le sens de poussée de $\vec{x}$ et $A$ à l’arrière :</p>
$$\vec{R}_A=-T_A\,\vec{x}-N\,\vec{y}\qquad\vec{R}_B=-T_B\,\vec{x}+N\,\vec{y}\qquad\vec{F}=F\,\vec{x}$$
<p>Notons $t_A=T_A/N$ et $t_B=T_B/N$ les tangentes des angles $\psi_A,\psi_B$ que font les réactions avec la normale. La droite d’action de $\vec{R}_A$ passe par $A$ avec la pente $1/t_A$ ; celle de $\vec{R}_B$ passe par $B$ avec la pente $-1/t_B$.</p>
<div class="proof"><b>CONCOURS ET CONDITION DE BLOCAGE</b>
<p>Plaçons l’origine en $A$, les liaisons situées sur l’axe $(G,\vec{x})$ (cas $d\to0$) et $B$ en $(L\,;0)$. La droite d’action de $\vec{F}$ est $y=a$. Elle coupe celle de $\vec{R}_A$ en $x_A=a\,t_A$ et celle de $\vec{R}_B$ en $x_B=L-a\,t_B$. Les trois droites sont concourantes si $x_A=x_B$ :</p>
$$a\,(t_A+t_B)=L$$
<p>Les contacts n’adhèrent que si $t_A\leq\mu$ et $t_B\leq\mu$, donc $t_A+t_B\leq 2\mu$. Le concours est possible si et seulement si</p>
$$L=a\,(t_A+t_B)\leq 2\mu a\ \Leftrightarrow\ a\geq\frac{L}{2\mu}$$
<p>On retrouve la condition d’arc-boutement, par la géométrie seule. Dans le cas symétrique $t_A=t_B=t$, on obtient $\tan\psi=t=\dfrac{L}{2a}$ : les deux réactions sont inclinées du même angle, et il faut $\psi\leq\varphi$.</p></div>
${fig(FIGS.collierBloque, 'Collier bloqué : les trois droites d’action concourent en I et le triangle F, R_B, R_A est isocèle fermé (base F, hauteur N = aF/L). Si F varie, le triangle est homothétique. Schéma hors échelle.')}
<h3>Le polygone des forces</h3>
<ul>
<li><b>Blocage</b> : $T_A=T_B=F/2$, le triangle $F,\ R_B,\ R_A$ est fermé. C’est un triangle isocèle de base $F$ et de hauteur $N=aF/L$ : il est <b>homothétique</b> quand $F$ varie. L’intensité de $F$ ne change pas sa forme, donc pas l’angle $\psi$.</li>
<li><b>Glissement</b> : $T_A=T_B=\mu N$ avec $2\mu N<F$ : le polygone est <b>ouvert</b>. Le côté qui manque est la résultante $F-2\mu N=F\left(1-\dfrac{2\mu a}{L}\right)=m\,\ddot{x}$. Les droites d’action limites de $\vec{R}_A$ et $\vec{R}_B$ se coupent à la distance $L/(2\mu)$ de l’axe $(G,\vec{x})$ : au-delà de la droite d’action de $\vec{F}$ si $a<L/(2\mu)$, donc pas de concours.</li>
</ul>
${fig(FIGS.collierGlisse, 'Collier qui glisse (a < L/(2μ)) : à gauche, les droites limites de R_A et R_B se coupent en I_lim, au-dessus de la droite d’action de F : pas de concours. À droite, le polygone reste ouvert ; le côté manquant est la résultante m ẍ.')}
${fig(FIGS.fermeture, 'Un triangle fermé existe dans les deux cas ; seule la réaction dans le cône est réalisable.')}
<div class="remark"><b>Pourquoi le triangle seul ne suffit pas.</b> Un triangle fermé traduit $\Sigma\vec{F}=\vec{0}$, mais ne dit rien sur le frottement : on peut toujours dessiner un triangle qui se ferme. Il faut en plus que $\vec{R}_A$ et $\vec{R}_B$ soient <b>dans leurs cônes</b>, c’est-à-dire $\psi\leq\varphi$. C’est la comparaison des angles qui conclut, pas la fermeture du triangle. Dans l’atelier, les deux informations sont affichées ensemble.</div>
<div class="remark"><b>Hyperstatisme.</b> En blocage, $T_A$ et $T_B$ ne sont pas séparément déterminés : seul leur total $T_A+T_B=F$ l’est. Le triangle symétrique ($T_A=T_B$) est le cas le plus favorable, celui retenu dans la démonstration précédente.</div>
<div class="retain"><b>À retenir.</b> Trois forces en équilibre : triangle fermé et droites concourantes. Pour le collier : concours $\Leftrightarrow a(t_A+t_B)=L$, et blocage $\Leftrightarrow \psi\leq\varphi$ avec $\tan\psi=L/(2a)$.</div>` });

COURSE.push({ id: 'cone', t: 'Condition angulaire : bloc et plan incliné', h: String.raw`
<p>Quand il n’y a pas de couple à étudier (force passant par le point de contact), il suffit de comparer des angles. Soit un solide en contact avec un plan de normale $\vec{n}$ (dirigée vers l’extérieur du plan), soumis à une force $\vec{P}$ et à son poids $\vec{W}$.</p>
<h3>Critère</h3>
<p>Le contact doit fournir $\vec{R}=-(\vec{P}+\vec{W})$. Avec $\vec{F}=\vec{P}+\vec{W}$ :</p>
$$N=-\vec{F}\cdot\vec{n}>0\quad\text{et}\quad \|\vec{F}_t\|\leq\mu N\ \Leftrightarrow\ \tan\theta_{\text{tot}}\leq\mu\ \Leftrightarrow\ \theta_{\text{tot}}\leq\varphi$$
<p>où $\theta_{\text{tot}}$ est l’angle de $\vec{F}$ avec la normale vers le plan.</p>
${fig(FIGS.coneBloc, 'Bloc sur un plan : F = P + W à équilibrer ; R = −F doit être dans le cône de frottement.')}
<h3>Sans pesanteur : l’arc-boutement pur</h3>
<p>Si $\|\vec{W}\|\ll P$, alors $\vec{F}\approx\vec{P}$ et le critère est $\theta\leq\varphi$, où $\theta$ est l’angle de $\vec{P}$ avec la normale. L’intensité de $\vec{P}$ ne figure plus : le solide ne glisse jamais, pour aucune valeur de $P$.</p>
<h3>Avec pesanteur sur plan horizontal</h3>
<p>Soit $\theta$ l’angle de $\vec{P}$ avec la verticale descendante. La composante tangentielle est $P\sin\theta$, la réaction normale $N=mg+P\cos\theta$. Pas de glissement si :</p>
$$P\sin\theta\leq\mu\,(mg+P\cos\theta)$$
<div class="proof"><b>DÉMONSTRATION</b>
<p>On regroupe : $P(\sin\theta-\mu\cos\theta)\leq\mu\,mg$. Avec $\mu=\tan\varphi$, on multiplie par $\cos\varphi>0$ :</p>
$$P\,(\sin\theta\cos\varphi-\cos\theta\sin\varphi)\leq mg\sin\varphi\ \Leftrightarrow\ P\,\sin(\theta-\varphi)\leq mg\,\sin\varphi$$
<p><b>Cas $\theta\leq\varphi$</b> : le premier membre est négatif ou nul, l’inégalité est vraie pour tout $P$ : <b>arc-boutement</b>.</p>
<p><b>Cas $\varphi<\theta<\dfrac{\pi}{2}$</b> : $\sin(\theta-\varphi)>0$ et le bloc tient pour</p>
$$P\leq P_c=\frac{mg\,\sin\varphi}{\sin(\theta-\varphi)}$$
<p>$P_c\to+\infty$ quand $\theta\to\varphi^+$ : plus la force est proche du bord du cône, plus il faut la pousser fort pour faire glisser.</p></div>
${fig(FIGS.coneCourbe, 'Intensité critique P_c/(mg) pour μ = 0,5 (φ ≈ 26,6°). À gauche de φ : arc-boutement pour toute valeur de P.')}
<p><b>Application numérique.</b> $m=5$ kg, $\mu=0{,}5$ ($\varphi\approx26{,}6^\circ$), $\theta=60^\circ$ : $P_c=\dfrac{49{,}05\times0{,}447}{\sin 33{,}4^\circ}\approx 40$ N. Au-delà de 40 N le bloc glisse.</p>
<h3>Plan incliné</h3>
<p>Sans autre force, le poids fait avec la normale un angle égal à l’inclinaison $\beta$. Le bloc reste en équilibre si $\tan\beta\leq\mu$, c’est-à-dire $\beta\leq\varphi$. L’angle de frottement est l’angle limite de talus (angle d’un tas de sable, d’un déblai).</p>
${fig(FIGS.planIncline, 'Plan incliné : la réaction R = −W est verticale ; elle est dans le cône si et seulement si β ≤ φ.')}
<div class="remark"><b>Lire la carte de stabilité.</b> Dans l’atelier, la carte représente le plan $(\theta,\log P)$. La bande verticale verte de largeur $2\varphi$ qui monte jusqu’en haut est l’arc-boutement. La zone verte au bas de la carte, hors bande, est la région où le poids suffit à retenir le bloc (valeurs de $P$ inférieures à $P_c$).</div>
<div class="retain"><b>À retenir.</b> Pour une force dont la ligne d’action passe par le contact, l’arc-boutement équivaut à $\theta\leq\varphi$, avec $\varphi=\arctan\mu$. Avec le poids, la condition devient $P\sin(\theta-\varphi)\leq mg\sin\varphi$.</div>` });

COURSE.push({ id: 'coin', t: 'Coin, vis, galet : l’irréversibilité', h: String.raw`
<p>Le même raisonnement sert à étudier les systèmes qui ne doivent pas revenir en arrière : on parle d’<b>irréversibilité</b> ou d’<b>autoblocage</b> (arc-boutement voulu).</p>
<h3>Coin symétrique (cale)</h3>
<p>Un coin de demi-angle $\alpha$ est enfoncé dans une fente. Chaque face exerce sur lui une force normale $N$ (perpendiculaire à la face) et une force de frottement $T$ (le long de la face). Projetons sur la direction de symétrie du coin, de vecteur unitaire $\vec{u}$ (dirigé de la pointe vers la base).</p>
${fig(FIGS.coin, 'Coin symétrique : à l’enfoncement le frottement s’oppose à l’avance ; une fois lâché, il retient la poussée axiale 2N sin α.')}
<div class="proof"><b>ENFONCER</b>
<p>L’effort $F_d$ pour enfoncer (glissement du coin vers l’intérieur, frottement vers l’extérieur) :</p>
$$F_d=2N\,(\sin\alpha+\mu\cos\alpha)$$
<p>L’effet multiplicateur est $N/F_d=1/\big(2(\sin\alpha+\mu\cos\alpha)\big)$ : plus le coin est pointu, plus la poussée sur les faces est grande.</p></div>
<div class="proof"><b>LÂCHER : LE COIN RESTE-T-IL ?</b>
<p>Une fois la frappe retirée, les faces serrées exercent encore $N$ sur le coin. La composante de ces poussées selon $\vec{u}$, dirigée vers l’extérieur de la fente, vaut $2N\sin\alpha$. Le frottement, au maximum $2\mu N\cos\alpha$, la retient. Le coin reste si :</p>
$$2N\sin\alpha\leq 2\mu N\cos\alpha\ \Leftrightarrow\ \tan\alpha\leq\mu\ \Leftrightarrow\ \alpha\leq\varphi$$
<p>L’effort nécessaire pour l’extraire est alors $F_e=2N(\mu\cos\alpha-\sin\alpha)\geq 0$.</p></div>
<h3>Vis et écrou</h3>
<p>Un filet carré est un plan incliné de pente $\gamma$ enroulé sur un cylindre : $\tan\gamma=\dfrac{p}{\pi d_m}$ ($p$ : pas, $d_m$ : diamètre moyen). La vis est <b>irréversible</b> (la charge ne fait pas tourner la vis) si $\tan\gamma\leq\mu$. Pour un filet triangulaire (profil ISO, demi-angle de flanc 30°), on remplace $\mu$ par $\mu'=\mu/\cos 30^\circ$.</p>
${fig(FIGS.vis, 'Le filet est un plan incliné de pente γ enroulé autour du cylindre.')}
<p><b>Exemple.</b> M10 à pas de 1,5 mm : $d_m\approx9{,}03$ mm, $\tan\gamma=\dfrac{1{,}5}{\pi\times9{,}03}\approx0{,}053$ ($\gamma\approx3{,}0^\circ$). Avec $\mu=0{,}15$, $\mu'\approx0{,}17>0{,}053$ : la vis est irréversible, d’où son usage en serrage et en levage.</p>
<h3>Galet coinceur (roue libre à galets)</h3>
<p>Un galet de rayon $r$ est placé dans le coin d’angle $\alpha$ formé par deux surfaces. Il n’est soumis qu’à deux actions de contact (poids négligé) : elles sont donc <b>portées par la droite joignant les deux points de contact</b>. Cette droite fait avec chaque normale l’angle $\alpha/2$ (triangle isocèle formé par le centre et les deux points de contact).</p>
$$\text{le galet se coince}\ \Leftrightarrow\ \frac{\alpha}{2}\leq\varphi\ \Leftrightarrow\ \alpha\leq2\varphi$$
${fig(FIGS.galet, 'Galet coinceur : les deux actions sont opposées et portées par la droite (P₁P₂), inclinée de α/2 sur chaque normale.')}
<p>Dans une roue libre, un sens de rotation fait remonter le galet dans le coin (blocage, transmission du couple), l’autre le fait descendre (roue libre).</p>
<div class="retain"><b>À retenir.</b> Coin : autobloquant si $\tan\alpha\leq\mu$. Vis à filet carré : irréversible si $\tan\gamma\leq\mu$. Galet : coincement si $\alpha\leq2\varphi$.</div>` });

COURSE.push({ id: 'echelle', t: 'Application : l’échelle', h: String.raw`
<p>Une échelle de longueur $\ell$ et de poids $W$ (appliqué en son milieu) s’appuie sur un mur lisse et sur un sol de frottement $\mu$. Une personne de poids $W_P$ est à la fraction $s\in[0,1]$ de la longueur à partir du pied. L’échelle fait l’angle $\alpha$ avec le sol.</p>
${fig(FIGS.echelle, 'Échelle sur sol rugueux et mur lisse : poids W (au milieu), poids de la personne W_P (à s·ℓ du pied).')}
<div class="proof"><b>RÉSOLUTION</b>
<p>Actions : en bas, $N_1$ (verticale) et $F_1$ (horizontale, vers le mur) ; en haut, $N_2$ (horizontale, du mur vers l’échelle, pas de frottement).</p>
$$\text{Résultante selon}\ \vec{y}\ :\ N_1=W+W_P\qquad\text{Résultante selon}\ \vec{x}\ :\ F_1=N_2$$
<p>Moments au pied de l’échelle :</p>
$$N_2\,\ell\sin\alpha=\left(\frac{W}{2}+W_P\,s\right)\ell\cos\alpha\ \Rightarrow\ N_2=\frac{W/2+W_P\,s}{\tan\alpha}$$
<p><b>Non-glissement</b> au pied : $F_1\leq\mu N_1$, c’est-à-dire</p>
$$\tan\alpha\geq\frac{W/2+W_P\,s}{\mu\,(W+W_P)}$$
</div>
<p>La condition la plus sévère correspond à $s=1$ (en haut). Pour tenir jusqu’en haut :</p>
$$$\alpha\geq\alpha_{\text{min}}=\arctan\left(\frac{W/2+W_P}{\mu\,(W+W_P)}\right)$$$
<p>et, à un angle $\alpha$ donné, la personne peut monter jusqu’à $s_{\text{max}}=\dfrac{\mu\,(W+W_P)\tan\alpha-W/2}{W_P}$.</p>
<p><b>Application numérique</b> (celle de l’atelier) : $W=120$ N, $W_P=700$ N, $\mu=0{,}35$ : $\tan\alpha_{\text{min}}=\dfrac{60+700}{0{,}35\times820}\approx2{,}65$, soit $\alpha_{\text{min}}\approx69{,}3^\circ$. Sans personne, $\tan\alpha\geq 1/(2\mu)\approx1{,}43$ suffirait ($55^\circ$) : le poids de la personne change tout.</p>
<h3>Vue par le cône</h3>
<p>La réaction au pied $\vec{R}_1=N_1\vec{y}-F_1\vec{x}$ fait avec la verticale un angle $\psi$ tel que $\tan\psi=F_1/N_1=N_2/N_1$. L’échelle tient tant que $\psi\leq\varphi$, soit $\vec{R}_1$ dans le cône. Quand la personne monte, $N_2$ croît, $\psi$ augmente et la réaction sort du cône : c’est pourquoi l’échelle glisse en haut et non en bas.</p>
${fig(FIGS.echelleCone, 'Avec W = 120 N, W_P = 700 N, μ = 0,35 et α = 65°, tan ψ atteint μ pour s = 0,79 : au-delà l’échelle glisse.')}
<div class="remark"><b>Mur rugueux ou non.</b> Avec un frottement au mur, le haut de l’échelle est lui aussi retenu : la solution se traite avec deux cônes et la concourance des trois forces. Négliger le frottement du mur est une hypothèse favorable à la sécurité.</div>
<div class="retain"><b>À retenir.</b> $N_2=\dfrac{W/2+W_P s}{\tan\alpha}$ et glissement si $N_2>\mu(W+W_P)$. Le point critique est en haut. Pour tenir, on augmente $\alpha$ (échelle plus verticale) ou $\mu$.</div>` });

COURSE.push({ id: 'methode', t: 'Méthode, cas défavorable et pièges', h: String.raw`
<h3>Méthode en quatre étapes</h3>
<ol>
<li><b>Isoler</b> le solide, faire le bilan des actions et repérer les liaisons qui frottent. Choisir le sens probable du glissement (celui de l’action motrice).</li>
<li><b>Écrire</b> les équations de la statique ou de la dynamique : résultante dans deux directions et moment en un point bien choisi (le point de concours de deux inconnues, ou $G$).</li>
<li><b>Écrire les lois de Coulomb</b> : égalité $T=\mu N$ pour les contacts qui glissent, inégalité $T\leq\mu N$ pour ceux qui adhèrent.</li>
<li><b>Interpréter</b> : le glissement est-il possible ? La condition dépend-elle de l’intensité ? Si elle ne dépend que d’angles ou de longueurs, c’est de l’arc-boutement.</li>
</ol>
${fig(FIGS.methode, 'Les quatre étapes de la méthode.')}
<h3>Quel $\mu$ prendre ?</h3>
<p>$\mu$ n’est connu que dans une fourchette $[\mu_{\min},\mu_{\max}]$. Il faut prendre le cas <b>défavorable</b>, qui n’est pas le même selon l’objectif :</p>
<table class="ctable"><thead><tr><th>On veut…</th><th>Exemple</th><th>Cas défavorable</th></tr></thead><tbody>
<tr><td><b>éviter</b> l’arc-boutement</td><td>guidage, tiroir</td><td>$\mu_{\max}$ (condition $L>2\mu a$)</td></tr>
<tr><td><b>garantir</b> le maintien</td><td>échelle, cale, vis, galet</td><td>$\mu_{\min}$ (condition $\tan\alpha\leq\mu$ ou $\alpha_{\min}$)</td></tr></tbody></table>
${fig(FIGS.mu, 'Choix de μ selon l’objectif.')}
<h3>Pièges fréquents</h3>
<ul>
<li><b>Oublier le sens du frottement</b> : il est opposé à la vitesse de glissement, pas à la force.</li>
<li><b>Croire que forcer aide.</b> En arc-boutement, augmenter $F$ augmente $N$ et $T$ dans le même rapport. Seule la géométrie change le résultat.</li>
<li><b>Mélanger adhérence et glissement</b> : pour un équilibre, on écrit une inégalité ; l’égalité $T=\mu N$ n’a lieu qu’au glissement ou à sa limite.</li>
<li><b>Écrire un moment avec les frottements au mauvais endroit</b> : les forces de frottement ont un bras de levier si les contacts sont à des hauteurs différentes (voir le collier avec l’épaisseur $d$).</li>
<li><b>Prendre $\mu$ = 0 « pour simplifier »</b> : pour un problème d’arc-boutement, cela supprime le phénomène.</li>
<li><b>Confondre hyperstatisme et impossibilité</b> : les inconnues non déterminées ne rendent pas la question vide. On cherche si une répartition admissible existe.</li>
</ul>
<h3>Limites du modèle</h3>
<p>Le modèle ignore la déformation des pièces, le jeu, le broutement et l’usure. Les marges de sécurité usuelles sont d’au moins 25 % sur les longueurs ou les angles critiques. En conception, on cherche souvent à <b>réduire</b> l’arc-boutement (guidages) ou à l’<b>exploiter</b> (étaux, serre-joints, coinceurs, roues libres).</p>
<div class="retain"><b>À retenir.</b> Tests de concours : une inégalité sur des longueurs ou des angles, indépendante de $F$, avec $\mu_{\max}$ pour éviter, $\mu_{\min}$ pour assurer.</div>` });

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Arc-boutement</dt><dd>Équilibre maintenu par adhérence, quelle que soit l’intensité de la force appliquée. Il ne dépend que de la géométrie et de μ.</dd>
<dt>Adhérence</dt><dd>Contact sans glissement : T ≤ μN.</dd>
<dt>Angle de frottement φ</dt><dd>φ = arctan μ, demi-angle du cône de frottement.</dd>
<dt>Cône de frottement</dt><dd>Ensemble des directions possibles de la réaction de contact sans glissement.</dd>
<dt>Autoblocage, irréversibilité</dt><dd>Arc-boutement recherché : un système ne revient pas en arrière quand on cesse de le solliciter (vis, cale).</dd>
<dt>Hauteur critique</dt><dd>Distance a_lim = L/(2μ) au-delà de laquelle un collier guidé est arc-bouté.</dd>
<dt>Part utile</dt><dd>Fraction de F qui fait avancer le collier : η = 1 − 2μa/L.</dd>
<dt>Hyperstatisme</dt><dd>Situation où les équations de la statique ne suffisent pas à déterminer toutes les actions de liaison.</dd>
<dt>Broutement (stick-slip)</dt><dd>Alternance d’adhérence et de glissement due à μ<sub>s</sub> &gt; μ<sub>d</sub>.</dd>
</dl>` });

  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: mathify(cur.h) }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : l’arc-boutement'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Quatre ateliers sur l’arc-boutement (PSI*) : le collier sur guidage, le cône de frottement, des défis de dimensionnement (échelle, cale, guidage) et le triangle des forces.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut. Déplacez la poignée ou la force avec la souris ou le doigt, ou avec les curseurs.</li><li>Le bouton <b>Valeurs numériques</b> de chaque atelier affiche les valeurs et les seuils.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> donne le modèle, les démonstrations et des exercices résolus.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM et les étoiles des défis sont mémorisées dans ce navigateur uniquement.</p>' }));
});
requestAnimationFrame(frame);
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
