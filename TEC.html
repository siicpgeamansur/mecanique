<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TEC · Rotor et roue de vélo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* ===== Base et charte (reprise du site Algorithmes de tri) ===== */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --node-stroke:#33475b;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  /* couleurs de tracé */
  --gcol:#1e7a2e;--mcol:#9a5b00;--wcol:#7b4fc2;--acol:#2e8b3a;
  --canvas:#f8fbff;--grid:#dce5ee;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary,label):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
/* ===== Activité ===== */
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px;overflow:auto;padding:12px;flex:1;min-height:0}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none;accent-color:var(--accent)}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
/* ===== Cours ===== */
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto;font-family:var(--font-mono);font-size:13.5px}
pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
/* ===== Éléments d'atelier ===== */
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}
.opts .fld{margin:0}
.opts input[type=range]{width:200px;max-width:100%}
.opts input[type=text]{font-family:var(--font-mono);min-width:240px}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
.fld b{color:var(--accent);font-family:var(--font-mono);font-weight:500;font-size:12px}
input[type=range]{padding:0;accent-color:var(--accent)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip input{accent-color:var(--accent);margin:0}
.chip i{width:11px;height:11px;border-radius:50%;display:inline-block}
.chip b{font-family:var(--font-mono);font-size:11.5px;font-weight:500;color:var(--muted)}
.chip.on b{color:var(--accent-fg);opacity:.8}
.stagebox{border:1px solid var(--line);border-radius:10px;padding:10px 10px 6px;background:var(--panel);margin:8px 0}
.stagebox canvas{display:block;width:100%;height:340px;background:var(--canvas);border-radius:8px}
.stagebox canvas.tplot{height:215px;margin-top:8px}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:13.5px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.tors{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.tbox{background:var(--panel2);border-radius:8px;padding:6px 10px;min-width:0;overflow-x:auto;border-left:4px solid var(--line)}
.gbox{border-left-color:var(--gcol)}.mbox{border-left-color:var(--mcol)}
.tbox .cap{font-size:12px;color:var(--muted);margin-bottom:4px}
.tbox mjx-container{margin:2px 0!important;font-size:92%!important}
.huygens-out{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:10px 0}
.hmat{background:var(--panel2);border-radius:8px;padding:8px 12px;min-width:0;overflow-x:auto;border-left:3px solid var(--accent)}
.hmat span{font-size:12px;color:var(--muted);display:block;margin-bottom:4px}
.hmat pre{margin:0;font:12.5px/1.4 var(--font-mono);white-space:pre}
.eq{font-family:var(--font-mono);font-size:12.5px}
.G{color:var(--gcol);font-weight:600}.M{color:var(--mcol);font-weight:600}
/* ===== Responsive ===== */
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  .stagebox canvas{height:260px}
  .stagebox canvas.tplot{height:180px}
  .tors{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
</style>
</head>
<body>
<div id="app">
  <header class="band"><div class="inner row">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <circle cx="13" cy="13" r="11" fill="none" stroke="var(--accent)" stroke-width="2"/>
        <circle cx="9" cy="15" r="5" fill="var(--ok)" opacity="0.85"/>
        <circle cx="9" cy="15" r="1.6" fill="var(--bg)"/>
      </svg>
      <span>TEC <small>Rotor et roue de vélo · CPGE</small></span>
    </div>
    <div class="files">
      <button class="btn" id="bAct" type="button" aria-pressed="false">Activité</button>
      <button class="btn" id="bCourse" type="button" aria-pressed="false">Cours</button>
      <button class="btn" id="bHelp" type="button">Aide</button>
    </div>
  </div></header>
  <div class="band" id="modes"><div class="inner row"><div class="seg" id="wsSeg" role="tablist" aria-label="Ateliers"></div></div></div>
  <main class="inner work" id="work">
    <section id="stage"><div id="hint"></div><div id="scroller"><div id="ws"></div></div></section>
    <aside id="act" hidden aria-label="Activité"></aside>
  </main>
  <section id="course" hidden aria-label="Cours"></section>
</div>
<div id="dlg" hidden></div>

<script>
window.MathJax={options:{enableMenu:false,enableAssistiveMml:false},svg:{fontCache:"none"},startup:{typeset:false}};

let triesB=0;
function renderTorsB(){
  if(!$("torBG")) return;
  const q=bq(),k=1/q.r,tk=fmt(k,2).replace(",","{,}");
  const tg=String.raw`\left\{\mathcal V_{2/0}\right\}=\left\{\begin{array}{l}\vec\Omega_{2/0}=\dot\psi\,\vec z_0=-\frac{\dot s}{r}\,\vec z_0=-${tk}\,\dot s\,\vec z_0\\ \vec V_{G,2/0}=\dot s\,\vec x_0\end{array}\right\}_{G}`;
  const ti=String.raw`\left\{\mathcal V_{2/0}\right\}=\left\{\begin{array}{l}\vec\Omega_{2/0}=\dot\psi\,\vec z_0=-\frac{\dot s}{r}\,\vec z_0=-${tk}\,\dot s\,\vec z_0\\ \vec V_{I,2/0}=\vec 0\end{array}\right\}_{I}`;
  const ok=typeset([
    {el:$("torBG"),cap:"Torseur cinématique de 2/0 en G",tex:tg,fb:"{V₂/₀} = { Ω = −"+fmt(k,2)+" ṡ z₀ ; V<sub>G</sub> = ṡ x₀ }<sub>G</sub>"},
    {el:$("torBI"),cap:"Torseur cinématique de 2/0 en I",tex:ti,fb:"{V₂/₀} = { Ω = −"+fmt(k,2)+" ṡ z₀ ; V<sub>I</sub> = 0 }<sub>I</sub>"}]);
  if(!ok&&triesB++<40)setTimeout(renderTorsB,500);
  const e=$("bAxes"); if(e) e.textContent="x₀ le long de la pente vers le bas, z₀ = x₀ ∧ y₀ sortant de l'écran";
}
function stepsB(){
  if(!$("stepsB")) return;
  const q=bq();
  const meff=q.m+q.C/(q.r*q.r),IM=q.C+q.m*q.r*q.r;
  let hh;
  if(B.method==="G"){
    hh=`<li><span class="t">1 · Cinématique en G</span><span class="eq">RSG en I : V<sub>I</sub> = 0 ⇒ V<sub>G</sub> = r Ω &nbsp;;&nbsp; Ω = v / r</span></li>
    <li><span class="t">2 · Comoment en G : deux termes</span><span class="eq">E<sub>c</sub> = ½ m v² + ½ C Ω² = ½ ( m + C/r² ) v²</span><br>
      <span class="eq"><span class="G">= ½ ( ${fmt(q.m,3)} + ${fmt(q.C/(q.r*q.r),3)} ) v² = ½ · ${fmt(meff,3)} v²</span></span></li>
    <li><span class="t">3 · Puissance extérieure</span><span class="eq">P<sub>ext</sub> = m g sin β · v &nbsp; (réaction en I : P = 0, car V<sub>I</sub> = 0)</span></li>
    <li><span class="t">4 · TEC</span><span class="eq">( m + C/r² ) v v̇ = m g sin β v ⇒ a = <span class="G">${fmt(q.a,3)} m/s²</span></span></li>`;
  }else{
    hh=`<li><span class="t">1 · Roulement sans glissement</span><span class="eq">V<sub>I,2/0</sub> = 0 : I est le centre instantané de rotation, rotation pure d'axe (I, z)</span></li>
    <li><span class="t">2 · Matrice d'inertie en I par Huygens (IG = r)</span><span class="eq">I<sub>I</sub>(2) · zz = C + m r² = ${fmt(q.C,4)} + ${fmt(q.m*q.r*q.r,4)} = <span class="M">${fmt(IM,4)}</span> kg·m²</span></li>
    <li><span class="t">3 · Énergie cinétique : un seul terme</span><span class="eq">E<sub>c</sub> = ½ (C + m r²) Ω² = ½ <span class="M">${fmt(IM,4)}</span> (v/r)²</span><br><span class="note">I se déplace sur le sol, mais IG = r reste constant : l'expression vaut à chaque instant, on peut la dériver.</span></li>
    <li><span class="t">4 · TEC</span><span class="eq">(C + m r²) Ω Ω̇ = m g sin β · r Ω ⇒ a = r Ω̇ = <span class="M">${fmt(q.a,3)} m/s²</span></span></li>`;
  }
  $("stepsB").innerHTML=hh;
  $("verdB").innerHTML=`a = g sin β / (1 + k) avec k = C/(m r²) = <b>${fmt(q.k,3)}</b> : la roue descend ${fmt(1+q.k,2)} fois moins vite qu'un bloc sans frottement. Arrivée en <b>${fmt(q.tf,2)} s</b>.
   Le frottement f = ${fmt(q.f,2)} N est non nul mais ne travaille pas. Il faut μ ≥ ${fmt(q.mu,3)} pour rouler sans glisser.`;
}
function resetB(){ B.t=0; B.hold=0; }
function onB(){ if(!$("bb")) return; resetB(); buildB(); stepsB(); renderTorsB(); drawB(); }

/* ================= HUYGENS ================= */
function huygensUpd(){
  if(!$("hMG")) return;
  const m=+$("hm").value,A=+$("hA").value,Bb=+$("hB").value,C=+$("hC").value,a=+$("hx").value,b=+$("hy").value,c=+$("hz").value;
  const G=[[A,0,0],[0,Bb,0],[0,0,C]];
  const H=[[b*b+c*c,-a*b,-a*c],[-a*b,a*a+c*c,-b*c],[-a*c,-b*c,a*a+b*b]];
  const M=G.map((r,i)=>r.map((v,j)=>v+m*H[i][j]));
  const mat=Mx=>Mx.map(r=>r.map(v=>(Math.abs(v)<5e-7?"0":f(v,4)).padStart(8)).join(" ")).join("\n");
  $("hMG").textContent=mat(G); $("hMM").textContent=mat(M);
  const off=Math.abs(a*b)+Math.abs(a*c)+Math.abs(b*c)>1e-9;
  $("hTxt").textContent=off?"MG n'est pas porté par un axe : des termes hors diagonale apparaissent (−m·a·b, −m·a·c, −m·b·c).":
    "MG est porté par un axe : la matrice reste diagonale. Seuls les deux termes des axes perpendiculaires à MG augmentent de m·d².";
}
function huygensSet(o){
  for(const k in o){
    const inp=$(k), out=$("o"+k);
    if(inp) inp.value=o[k];
    if(out){
      const isM = /h[xyz]/.test(k);
      out.textContent = fmt(+o[k], k==="hm"?1:isM?2:4) + (k==="hm"?" kg":isM?" m":"");
    }
  }
  huygensUpd();
}

/* ================= COURS ================= */
const COURSE = [
  { id:'torseurs', t:'Torseurs cinématique et cinétique', h:`
<p>Un <b>torseur</b> est défini par sa résultante et son moment en un point. On change de point par la relation de Varignon : le moment en Q vaut le moment en P plus QP ∧ résultante.</p>
<h3>Cinématique de S/R</h3>
<div class="formula">{V<sub>S/R</sub>} = { Ω<sub>S/R</sub> ; V<sub>P,S/R</sub> }<sub>P</sub> &nbsp; avec &nbsp; V<sub>Q</sub> = V<sub>P</sub> + QP ∧ Ω</div>
<h3>Cinétique de S/R</h3>
<div class="formula">{C<sub>S/R</sub>} = { m V<sub>G,S/R</sub> ; σ<sub>P,S/R</sub> }<sub>P</sub></div>
<p>avec σ<sub>P</sub> = σ<sub>G</sub> + PG ∧ m V<sub>G</sub> et σ<sub>G</sub> = I<sub>G</sub>(S) Ω. Le moment cinétique en G s'obtient avec la matrice d'inertie en G.</p>
<h3>Actions mécaniques sur S</h3>
<div class="formula">{T<sub>ext→S</sub>} = { R ; M<sub>P</sub> }<sub>P</sub></div>
<div class="retain"><b>À retenir.</b> Un torseur, c'est une résultante et un moment en un point. Varignon permet de changer de point, mais les deux termes changent ensemble.</div>` },

  { id:'comoment', t:'Comoment et puissance', h:`
<p>Le <b>comoment</b> de deux torseurs est un scalaire. Il se calcule avec les éléments de réduction écrits au <b>même point</b> P, et sa valeur ne dépend pas de ce point.</p>
<div class="formula">{A} ⊗ {B} = R<sub>A</sub> · M<sub>P,B</sub> + M<sub>P,A</sub> · R<sub>B</sub></div>
<h3>Puissance d'une action mécanique</h3>
<div class="formula">P(ext→S/R) = {T<sub>ext→S</sub>} ⊗ {V<sub>S/R</sub>} = R · V<sub>P,S/R</sub> + M<sub>P</sub> · Ω<sub>S/R</sub></div>
<h3>Énergie cinétique</h3>
<div class="formula">E<sub>c</sub>(S/R) = ½ {C<sub>S/R</sub>} ⊗ {V<sub>S/R</sub>} = ½ [ m V<sub>P</sub> · V<sub>G</sub> + σ<sub>P</sub> · Ω ]</div>
<h3>Liaison parfaite ou contact sans glissement</h3>
<div class="formula">P = {T} ⊗ {V} = 0 car la composante de V en jeu (vitesse de glissement) est nulle</div>
<div class="retain"><b>À retenir.</b> Le comoment donne le même nombre en tout point, mais l'expression est plus ou moins longue selon le point.</div>` },

  { id:'tec', t:"Théorème de l'énergie cinétique", h:`
<p>Dans un référentiel galiléen, pour un ensemble matériel E :</p>
<div class="formula">dE<sub>c</sub>(E/R<sub>g</sub>)/dt = P(ext→E/R<sub>g</sub>) + P<sub>int</sub>(E)</div>
<p>Pour un solide unique, P<sub>int</sub> = 0. Les liaisons parfaites ne contribuent pas. On obtient une équation scalaire sans inconnue de liaison, ce qui convient à un système à un degré de liberté.</p>
<h3>Méthode en quatre lignes</h3>
<ol>
<li><b>Cinématique</b> : exprimer Ω et V<sub>G</sub> avec un seul paramètre (ici θ̇), grâce au roulement sans glissement.</li>
<li><b>Choix du point</b> : chercher un point de vitesse nulle. S'il existe, y déplacer la matrice d'inertie.</li>
<li><b>Énergie cinétique et puissances</b> : calculer E<sub>c</sub> et ne garder que les puissances qui ne sont pas nulles.</li>
<li><b>TEC</b> : dériver E<sub>c</sub>, égaler à P<sub>ext</sub>, simplifier par θ̇ puis linéariser si besoin.</li>
</ol>
<div class="retain"><b>À retenir.</b> Le TEC fait disparaître les inconnues de liaison. C'est l'outil idéal pour un système à un degré de liberté.</div>` },

  { id:'point', t:'Où écrire E<sub>c</sub> ?', h:`
<p>Le comoment donne le même nombre en tout point, mais l'expression est plus ou moins longue.</p>
<h3>En G (formule de König)</h3>
<div class="formula">E<sub>c</sub> = ½ m V<sub>G</sub>² + ½ Ω · I<sub>G</sub> Ω</div>
<p>Deux termes. Pratique quand I<sub>G</sub> est donnée, comme pour le rotor.</p>
<h3>En un point P de vitesse nulle (point fixe ou centre instantané de rotation)</h3>
<div class="formula">V<sub>P</sub> = 0 ⇒ E<sub>c</sub> = ½ Ω · I<sub>P</sub> Ω</div>
<p>Un seul terme. Il suffit de déplacer la matrice d'inertie en P (Huygens). C'est le cas de M pour le rotor et de I pour la roue.</p>
<div class="verdict warn"><b>Attention :</b> la forme à un terme n'est valable que si V<sub>P</sub> = 0 à l'instant considéré. Un point P quelconque en mouvement garde le terme m V<sub>P</sub>·V<sub>G</sub>.</div>
<div class="retain"><b>À retenir.</b> Chercher un point de vitesse nulle (point fixe ou CIR) permet de diviser par deux le nombre de termes. C'est le réflexe à avoir.</div>` },

  { id:'huygens', t:'Huygens : déplacer la matrice', h:`
<p>Si G est le centre de masse de S et si MG = (a, b, c) dans la base choisie :</p>
<div class="formula">I<sub>M</sub>(S) = I<sub>G</sub>(S) + m · [ b²+c² &nbsp; −ab &nbsp; −ac ; −ab &nbsp; a²+c² &nbsp; −bc ; −ac &nbsp; −bc &nbsp; a²+b² ]</div>
<p>Sur la diagonale, on retrouve le théorème de Huygens scalaire : I<sub>Δ</sub> = I<sub>Δ<sub>G</sub></sub> + m d², avec d la distance entre les deux axes parallèles. Les termes hors diagonale apparaissent dès que MG n'est pas porté par un axe de la base.</p>
<ul>
<li>Les deux matrices s'écrivent dans la <b>même base</b>.</li>
<li>Un des deux points est obligatoirement G. Pour passer de M à M', on passe par G : on retire m[…] en M, puis on ajoute m[…] en M'.</li>
<li>La matrice en M est toujours « plus grande » sur la diagonale : on ajoute des termes positifs.</li>
</ul>
<div class="retain"><b>À retenir.</b> Huygens permet de déplacer la matrice d'inertie d'un point à un autre, à condition qu'un des deux points soit le centre de masse G.</div>` },

  { id:'bilan', t:'Méthode récapitulative', h:`
<table class="ctable"><thead><tr><th>Étape</th><th>Ce qu'on fait</th><th>Ce qu'on cherche</th></tr></thead><tbody>
<tr><td>1 · Cinématique</td><td>Exprimer Ω et V<sub>G</sub> en fonction d'un seul paramètre</td><td>La relation de roulement sans glissement</td></tr>
<tr><td>2 · Choix du point</td><td>Repérer un point de vitesse nulle (point fixe ou CIR)</td><td>Réduire le comoment à un seul terme</td></tr>
<tr><td>3 · Énergie cinétique</td><td>Calculer E<sub>c</sub> = ½ {C} ⊗ {V}</td><td>Le J<sub>eq</sub> du système</td></tr>
<tr><td>4 · Puissances</td><td>Ne garder que les puissances non nulles</td><td>P<sub>ext</sub> en fonction du paramètre</td></tr>
<tr><td>5 · TEC</td><td>Dériver E<sub>c</sub> = P<sub>ext</sub>, simplifier par θ̇</td><td>L'équation différentielle du mouvement</td></tr>
<tr><td>6 · Linéarisation</td><td>Si θ petit, sin θ ≈ θ</td><td>La période des petites oscillations</td></tr>
</tbody></table>
<h3>Que choisir comme point ?</h3>
<ul>
<li><b>Point fixe</b> (axe de rotation) : c'est le plus simple. La matrice d'inertie y est souvent donnée.</li>
<li><b>Centre instantané de rotation</b> (roulement sans glissement) : un seul terme aussi, mais il faut déplacer la matrice par Huygens.</li>
<li><b>Centre de masse G</b> : deux termes (König), mais la matrice y est souvent déjà connue.</li>
</ul>
<div class="retain"><b>À retenir.</b> Le TEC est une méthode puissante et systématique. Le choix du point où écrire E<sub>c</sub> détermine la longueur du calcul.</div>` },

  { id:'gloss', t:'Vocabulaire', h:`
<dl class="gloss">
<dt>Torseur</dt><dd>Objet défini par une résultante et un moment en un point. Change de point par Varignon.</dd>
<dt>Comoment</dt><dd>Produit scalaire de deux torseurs, calculé au même point. Indépendant du point.</dd>
<dt>Énergie cinétique</dt><dd>Demi-comoment du torseur cinétique par le torseur cinématique : E<sub>c</sub> = ½ {C} ⊗ {V}.</dd>
<dt>Théorème de l'énergie cinétique</dt><dd>dE<sub>c</sub>/dt = P(ext) + P(int). Pour un solide unique, P(int) = 0.</dd>
<dt>Centre instantané de rotation (CIR)</dt><dd>Point du solide dont la vitesse est nulle à l'instant considéré. Le mouvement est alors une rotation pure autour de ce point.</dd>

function renderAct(){
  const box=$("act"), btn=$("bAct");
  btn.setAttribute('aria-pressed',AS.open?'true':'false'); btn.classList.toggle('pri',AS.open);
  box.hidden=!AS.open;
  if(!AS.open){ box.innerHTML=""; return; }
  box.innerHTML="";
  const a=ACT[AS.key];
  const close=h('button',{class:'btn sm',type:'button',onclick:()=>{AS.open=false;renderAct();}},'Fermer');
  box.append(h('div',{class:'phead'},h('b',null,'Activité'),h('span',{class:'sub'},a.title),close));
  const nq=a.qcm.length;
  box.append(h('div',{class:'tabs',role:'tablist'},
    h('button',{type:'button',role:'tab','aria-selected':AS.tab==='steps'?'true':'false',onclick:()=>{AS.tab='steps';renderAct();}},'Consignes'),
    h('button',{type:'button',role:'tab','aria-selected':AS.tab==='qcm'?'true':'false',onclick:()=>{AS.tab='qcm';renderAct();}},'Questions ('+nq+')')));
  const body=h('div',{class:'pbody'});
  if(AS.tab==='steps'){
    body.append(h('p',{class:'small'},a.level+' · environ '+a.time), h('div',{class:'goal'},h('b',null,'Objectif. '),h('span',{html:a.goal})));
    body.append(h('ol',{class:'steps'},a.steps.map(s=>h('li',{html:s}))));
    body.append(h('div',{class:'defi'},h('b',null,'Défi'),h('p',{html:a.defi.q}),h('details',null,h('summary',null,'Voir la réponse'),h('p',{html:a.defi.a}))));
    if(a.course) body.append(h('p',null,h('button',{class:'btn',type:'button',onclick:()=>openCourse(a.course)},'Voir le cours : '+courseSection(a.course).t)));
    body.append(h('p',null,h('button',{class:'btn pri',type:'button',onclick:()=>{AS.tab='qcm';renderAct();}},'Passer aux questions')));
  } else {
    const s=actState(), show=s.checked||s.shown;
    a.qcm.forEach((q,i)=>{
      const fs=h('fieldset',{class:'q'},h('legend',{html:(i+1)+'. '+q.q}));
      q.o.forEach((o,j)=>{
        const good=show&&j===q.a, bad=s.checked&&!s.shown&&s.a[i]===j&&j!==q.a;
        const inp=h('input',{type:'radio',name:'q'+i,checked:show&&s.shown?j===q.a:s.a[i]===j,disabled:show});
        inp.addEventListener('change',()=>{s.a[i]=j;renderAct();});
        fs.append(h('label',{class:'opt'+(good?' good':'')+(bad?' bad':'')},inp,h('span',null,o+(good?'  ✓':''))));
      });
      if(show){ const miss=s.a[i]==null&&!s.shown; fs.append(h('p',{class:'why'},(miss?'Sans réponse. ':'')+q.w)); }
      body.append(fs);
    });
    const done=Object.keys(s.a).length;
    body.append(h('p',{class:'small'},s.shown?'Réponses affichées.':s.checked?'':done+' réponse(s) sur '+nq+'.'));
    if(s.checked&&!s.shown) body.append(h('p',{class:'score'},'Score : '+actScore(a)+' / '+nq));
    const row=h('div',{class:'files'});
    if(!show) row.append(h('button',{class:'btn pri',type:'button',onclick:()=>{s.checked=true;renderAct();}},'Corriger'));
    row.append(h('button',{class:'btn',type:'button',onclick:()=>{s.shown=true;renderAct();}},'Afficher les réponses'));
    if(show) row.append(h('button',{class:'btn',type:'button',onclick:()=>{AS.st[AS.key]={a:{},checked:false,shown:false};renderAct();}},'Recommencer'));
    body.append(row);
  }
  box.append(body);
}

  const go=id=>{CS.id=id;renderCourse();};
  const nav=h('nav',{class:'ctoc','aria-label':'Sommaire du cours'},COURSE.map((s,i)=>h('button',{type:'button',class:s.id===cur.id?'on':'','aria-current':s.id===cur.id?'true':'false',onclick:()=>go(s.id)},(i+1)+'. '+s.t)));
  const sel=h('select',{class:'ctoc-sel','aria-label':'Choisir une section',onchange:e=>go(e.target.value)},COURSE.map((s,i)=>h('option',{value:s.id,selected:s.id===cur.id},(i+1)+'. '+s.t)));
  const art=h('article',{class:'cbody'});
  art.append(h('p',{class:'ckick'},'Cours · section '+(idx+1)+' sur '+COURSE.length), h('h2',null,cur.t), h('div',{html:cur.h}));
  art.append(h('div',{class:'cpn'},
    idx>0?h('button',{class:'btn',type:'button',onclick:()=>go(COURSE[idx-1].id)},'← '+COURSE[idx-1].t):h('span'),
    idx<COURSE.length-1?h('button',{class:'btn pri',type:'button',onclick:()=>go(COURSE[idx+1].id)},COURSE[idx+1].t+' →'):h('span')));
  const top=h('div',{class:'ctop'},h('b',null,'Cours : torseurs et TEC'),h('button',{class:'btn pri sm',type:'button',onclick:()=>{CS.open=false;renderCourse();}},'Retour à l’atelier'));
  box.append(top,sel,h('div',{class:'cwrap'},nav,art));
}
function openCourse(id){ if(id) CS.id=id; CS.open=true; renderCourse(); }
$("bCourse").addEventListener('click',()=>{CS.open=!CS.open;renderCourse();});

function closeDlg(){ $("dlg").hidden=true; $("dlg").innerHTML=""; }
function openDlg(title,body){
  const d=$("dlg"); d.innerHTML=""; d.hidden=false;
  d.append(h('div',{class:'dlgbox',role:'dialog','aria-label':title},h('header',null,h('b',null,title),h('button',{class:'btn sm',type:'button',onclick:closeDlg},'Fermer')),h('div',{class:'dbody'},body)));
  d.onclick=ev=>{ if(ev.target===d) closeDlg(); };
}
document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&!$("dlg").hidden) closeDlg(); });
$("bHelp").addEventListener('click',()=>{
  openDlg('Aide', h('div',{html:'<p>Trois ateliers sur le théorème de l’énergie cinétique (CPGE) : banc d’inertie (rotor), roue de vélo, et calculateur de Huygens.</p>'+
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Réglez les paramètres, avancez ou laissez tourner la simulation.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> détaille les torseurs, le comoment, le TEC et Huygens.</li></ul>'+
    '<h3>Vos données</h3><p>Les réponses au QCM ne quittent pas cette page.</p>'}));
});

/* ================= BOUCLE PRINCIPALE ================= */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  if(UI.cur==='rotor' && $("cvR")){
    if(S.run){ const q=rotorQ(), n=10, ds=dt*(+$("vR").value); for(let i=0;i<n;i++) stepR(ds/n,q); }
    drawR();
  } else if(UI.cur==='velo' && $("cvB")){
    if(B.run){ const q=bq(); if(B.t<q.tf) B.t+=dt*(+$("vb").value); else { B.hold+=dt; if(B.hold>1.2) resetB(); } }
    drawB();
  }
  requestAnimationFrame(frame);
}
window.addEventListener('resize',()=>{ if($("cvR")) drawR(); if($("cvB")) drawB(); });

/* ================= INIT ================= */
const hmap={rotor:0,velo:1,huygens:2}, hh=location.hash.slice(1);
if(hh in hmap) UI.cur=hh;
AS.key=UI.cur;
renderSeg(); mountWs(); renderAct(); renderCourse();
requestAnimationFrame(frame);
})();
</script>
