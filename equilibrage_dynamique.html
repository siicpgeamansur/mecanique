<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Atelier Équilibrage</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&display=swap">
<style>
/* Atelier à la manière de « Algorithmes de tri » : barre d'outils, onglets d'ateliers, zone de travail blanche, panneau Activité à droite (feuille basse sur téléphone), vue Cours avec sommaire. Page volontairement claire (projection en classe). */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --font-math:'STIX Two Text','Cambria Math',Cambria,'Times New Roman',serif;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.big{font-size:17px;font-weight:600;padding:14px 26px;letter-spacing:.04em;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.btn.big.on{background:var(--bad);border-color:var(--bad);color:#fff}
:is(button,input,select,textarea,summary,canvas):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted);min-width:0}
.fld b{color:var(--fg);font-family:var(--font-mono);font-weight:500}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
/* cours */
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.65}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.remark{border-left:3px solid var(--warn);background:rgba(154,91,0,.08);padding:8px 12px;margin:12px 0;font-size:14px;border-radius:0 8px 8px 0}
.proof{border:1px solid var(--line);border-radius:8px;padding:2px 14px 4px;margin:12px 0;background:var(--panel)}
.proof>b:first-child{display:block;margin:8px 0 2px;font-size:13px;color:var(--accent-ink);letter-spacing:.02em}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:16px;overflow-x:auto;overflow-y:hidden}
.formula.key{background:var(--accent-soft);border-left-color:var(--accent-ink)}
pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
.cfig{margin:12px 0;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;overflow-x:auto}
.cfig svg{display:block;max-width:100%;height:auto;margin:0 auto}
.cfig figcaption{font-size:12.5px;color:var(--muted);padding:4px 6px 2px}
/* maths */
.m{font-family:var(--font-math);font-size:1.1em;white-space:nowrap}
.m i{font-style:italic}
.m .up{font-style:normal}
.m .fn{font-style:normal}
.m .rel{margin:0 .32em}
.m .op{margin:0 .16em}
.m sup,.m sub{font-size:.7em;line-height:0}
.m .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .14em;line-height:1.2}
.m .fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .25em .08em}
.m .fr>span:last-child{padding:.08em .25em 0}
.m .vec{position:relative;display:inline-block}
.m .vec::after{content:'\2192';position:absolute;left:.08em;top:-.66em;font-size:.68em;font-style:normal;line-height:1}
.m .ddot{position:relative;display:inline-block}
.m .ddot::after{content:'\\00A8';position:absolute;left:.12em;top:-.5em;font-style:normal;line-height:1}
.m .ov{border-top:1px solid currentColor;padding-top:1px;margin-left:1px}
.m .ss{display:inline-flex;flex-direction:column;vertical-align:middle;line-height:1.05}
.formula .m{font-size:1.2em}
/* ateliers */
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:1000px}
#ws.wide{max-width:1300px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0;flex:1 1 190px;max-width:280px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;align-items:center}
.chips .lab{font-size:12.5px;color:var(--muted);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line);min-height:40px}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.stagebox{border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff;margin:8px 0}
canvas.cv{display:block;width:100%;height:auto;touch-action:none;cursor:grab;border-radius:6px;background:#fff}
canvas.cv.grabbing{cursor:grabbing}
.leg{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:2px 0 6px}
.leg i{display:inline-block;width:11px;height:11px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.pushrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.stars{font-size:15px;letter-spacing:2px;color:#c98a00}
.stars.off{color:#c9ced4}
.twocol{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
.twocv{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-items:start;margin:8px 0}
.twocv.side{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
#s4-pv{max-width:560px;margin:0 auto}
.note{font-size:12.5px;color:var(--muted);margin:4px 0 8px}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
/* ---- rotor à masselottes (atelier 3 et 4), style « volets » ---- */
.rt{--rule:#cfd1d6;--head:#f4f4f6;--grid-minor:#eceef1;--ui:#2e6da4;--def:#e65100;--cor:#2e7d32;--fa:#d32f2f;--fb:#1565c0;--hot-bg:#ffe9d6;--hot-fg:#a14400;--ok-bg:#e6f4ea;--ok-fg:#1e6b34;--bad-bg:#fdecea;--bad-fg:#a12622}
.rt .hide,.rt.ch .only-free{display:none!important}
.rt:not(.ch) .ch-only{display:none!important}
.rt .top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start;margin-bottom:14px}
.rt .app{display:grid;grid-template-columns:370px minmax(0,1fr);gap:14px;align-items:start}
.rt .view{background:#fff;border:1px solid var(--rule);border-radius:6px;overflow:hidden;min-width:0}
.rt .view>h2,.rt .sub{margin:0;padding:7px 12px;background:var(--head);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);font-size:13px;font-weight:600}
.rt .view>h2:first-child{border-top:0}
.rt figure.view{margin:0}
.rt .stage{display:flex;flex-direction:column;gap:14px;min-width:0}
.rt .pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:14px}
.rt .item{display:flex;gap:12px;padding:11px 14px;border-bottom:1px solid var(--grid-minor)}
.rt .dot{flex:none;width:13px;height:13px;border-radius:50%;margin-top:5px;background:var(--ui);border:2px solid #fff;box-shadow:0 0 0 1px var(--ui)}
.rt .dot.def{background:var(--def);box-shadow:0 0 0 1px var(--def)}.rt .dot.cor{background:var(--cor);box-shadow:0 0 0 1px var(--cor)}
.rt .dot.fa{background:var(--fa);box-shadow:0 0 0 1px var(--fa)}.rt .dot.fb{background:var(--fb);box-shadow:0 0 0 1px var(--fb)}
.rt .dot.grey{background:var(--muted);box-shadow:0 0 0 1px var(--muted)}
.rt .item .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.rt .head-row{display:flex;align-items:center;gap:8px;justify-content:space-between}.rt .ttl{font-weight:600}
.rt .del{width:26px;height:26px;line-height:1;font-size:1.2rem;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:4px;cursor:pointer}
.rt .del:hover{background:var(--head);color:var(--fa)}
.rt .prm{display:grid;grid-template-columns:3.9rem 4.8rem minmax(0,1fr);gap:8px;align-items:center}
.rt .prm label{font-style:italic;text-align:right;white-space:nowrap}.rt .prm label .u{font-style:normal;color:var(--muted);font-size:12px}
.rt .prm input[type=number]{width:100%;border:0;border-bottom:1px solid var(--rule);border-radius:0;background:#fff;padding:2px 4px;font-variant-numeric:tabular-nums}
.rt .prm input[type=range]{width:100%;margin:0;height:22px;accent-color:var(--ui)}
.rt .btns{display:flex;flex-wrap:wrap;gap:6px}
.rt .btn[aria-pressed="true"]{background:var(--ui);border-color:var(--ui);color:#fff}
.rt .k{color:var(--muted);font-size:12.5px}
.rt .sol{margin:0;font-size:13px;line-height:1.6}
.rt .line{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 8px}.rt .line .v{font-weight:600;font-variant-numeric:tabular-nums}
.rt .pill{display:inline-block;padding:1px 10px;border-radius:999px;font-weight:600;font-size:13px}
.rt .pill.ok{background:var(--ok-bg);color:var(--ok-fg)}.rt .pill.bad{background:var(--bad-bg);color:var(--bad-fg)}
.rt .note{margin:0;padding:11px 14px;color:var(--muted);font-size:12.5px}
.rt .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding:10px 12px}
.rt .seg label{padding:3px 12px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}.rt .seg label:last-child{border-right:0}
.rt .seg input{position:absolute;opacity:0;pointer-events:none}
.rt .seg label:has(input:checked){background:var(--accent);color:#fff}
.rt .checks{display:flex;flex-wrap:wrap;gap:6px 16px}.rt .chk{display:flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.rt .chk input{accent-color:var(--accent);width:15px;height:15px;margin:0}
.rt .gain{display:flex;align-items:center;gap:8px}.rt .gain input{width:130px}.rt .gain output{min-width:3rem;font-variant-numeric:tabular-nums}
.rt canvas{display:block;width:100%;background:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px;margin:10px 0}.card{border:1px solid var(--line,#d5dbe2);border-radius:8px;padding:8px 12px;background:#fff}.card h4{margin:0 0 4px;font-size:14px}.card p{margin:0;font-size:13px}
canvas.viz{display:block;width:100%;height:250px;background:#fff;border:1px solid var(--line,#d5dbe2);border-radius:6px}
#vb-cv2{height:270px}
#cd-cv{height:290px}
.rt #cvSide{height:360px}.rt #cvEnd{height:300px}.rt #cvGraph{height:300px}
.rt figcaption{color:var(--muted);font-size:12.5px;padding:6px 12px 10px}
.rt figcaption .sw{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 4px 0 10px;vertical-align:-1px}.rt figcaption .sw:first-child{margin-left:0}
.rt .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:0;margin:0}
.rt .matwrap{overflow-x:auto}
.rt .mat{display:inline-grid;grid-template-columns:repeat(3,minmax(4.4rem,auto));gap:4px 14px;padding:8px 14px;border-left:2px solid var(--fg);border-right:2px solid var(--fg);border-radius:8px;font-variant-numeric:tabular-nums;text-align:right}
.rt .mat span{padding:1px 6px;border-radius:3px}.rt .mat span.hot{background:var(--hot-bg);color:var(--hot-fg);font-weight:600}

      if (hintLvl >= 4) chSolve();
    });
  }

  buildStatic();
  if (CH) loadScenario(0); else loadPreset('none');
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) { S.phi = 0.9; setRunning(false); }
  requestAnimationFrame(frame);
}

const FIGS = (() => {

  const rad = d => d * Math.PI / 180, f = n => +n.toFixed(1);
  const P = (x, y, l, a) => [x + l * Math.cos(rad(a)), y - l * Math.sin(rad(a))];
  const lab = s => s.replace(/_([A-Za-z0-9]+)/g, '<tspan baseline-shift="sub" font-size="72%" font-style="normal">$1</tspan>');
  const base = (w, h, lbl, body) => `<svg viewBox="0 0 ${w} ${h}" width="${w}" role="img" aria-label="${lbl}" font-family="IBM Plex Sans,sans-serif" font-size="13">${body}</svg>`;
  const ln = (x1, y1, x2, y2, c = C.K, w = 1.6, d = '') => `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="${c}" stroke-width="${w}"${d ? ` stroke-dasharray="${d}"` : ''}/>`;
  const ar = (x1, y1, x2, y2, c, w = 2.6) => {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, hs = Math.min(10, L * .45), bx = x2 - ux * hs, by = y2 - uy * hs;
    return ln(x1, y1, bx, by, c, w) + `<polygon points="${f(x2)},${f(y2)} ${f(bx - uy * hs * .38)},${f(by + ux * hs * .38)} ${f(bx + uy * hs * .38)},${f(by - ux * hs * .38)}" fill="${c}"/>`;
  };
  const dot = (x, y, r = 3.5, c = C.K) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${c}"/>`;
  const circ = (x, y, r, fill, stroke, w = 1.6) => `<circle cx="${f(x)}" cy="${f(y)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="${w}"/>`;
  const poly = (pts, fill, stroke, w = 1.6, d = '') => `<polygon points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" fill="${fill}" stroke="${stroke}" stroke-width="${w}" stroke-linejoin="round"${d ? ` stroke-dasharray="${d}"` : ''}/>`;
  const rect = (x, y, w, h, fill, stroke, sw = 1.4, rx = 0) => `<rect x="${f(x)}" y="${f(y)}" width="${f(w)}" height="${f(h)}" rx="${rx}" fill="${fill}" stroke="${stroke}" stroke-width="${sw}"/>`;

  const hatch = (x1, x2, y, dir = 1, step = 10, l = 8) => { let s = ''; for (let x = x1; x <= x2; x += step) s += ln(x, y, x - 6, y + dir * l, C.D, 1); return s; };
  const hatchV = (x, y1, y2, dir = 1, step = 10, l = 8) => { let s = ''; for (let y = y1; y <= y2; y += step) s += ln(x, y, x + dir * l, y + 6, C.D, 1); return s; };
  const m = (x, y, s, o = {}) => `<text x="${f(x)}" y="${f(y)}" fill="${o.c || C.K}" font-size="${o.sz || 15}" font-weight="${o.w || 400}" text-anchor="${o.a || 'middle'}" font-family="'STIX Two Text',serif" font-style="${o.i === false ? 'normal' : 'italic'}">${lab(s)}</text>`;

  const v = (x, y, s, o = {}) => {

    const p1 = [o[0] + U[0], o[1] + U[1]];

    const p2 = [p1[0] + c1[0], p1[1] + c1[1]];
    s += ar(p2[0], p2[1], p2[0] + c2[0], p2[1] + c2[1], '#1565c0', 2.8) + m(p2[0] + c2[0] / 2 - 18, p2[1] + c2[1] / 2 - 4, 'c₂', { c: '#1565c0', sz: 16 });
    s += dot(o[0], o[1], 4, C.K) + t(o[0] + 8, o[1] + 14, 'départ = arrivée', { sz: 12.5, a: 'start' });
    s += t(340, 80, 'Polygone fermé :', { w: 600, a: 'start', c: C.K }) + m(340, 106, 'U + c₁ + c₂ = 0', { a: 'start', sz: 16 });
    return base(520, 186, 'Fermeture du polygone des balourds', s.replace(/<text[^>]*>départ = arrivée<\/text>/, ''));
  })();

  /* ---------- 5. Pratique ---------- */
  F.pratique = (() => {
    let s = '';
    s += circ(120, 100, 64, '#eef1f4', C.K, 2.2) + circ(120, 100, 40, '#fff', C.D, 1.4) + dot(120, 100, 4, C.K);
    s += rect(176, 80, 14, 14, C.G, '#0e5a1a', 1.4) + t(120, 190, 'Ajout : masselotte sur la jante', { w: 600 }) + t(120, 20, 'Roue de voiture', { c: C.M });
    s += circ(390, 100, 64, '#e8edf2', C.K, 2.2) + circ(390, 100, 24, '#fff', C.D, 1.4) + dot(390, 100, 4, C.K);
    s += circ(342, 72, 9, '#fff', C.N, 2.2) + t(390, 190, 'Retrait : perçage côté du balourd', { w: 600 }) + t(390, 20, 'Rotor de moteur', { c: C.M });
    s += ar(250, 100, 278, 100, C.D, 1.6) + ar(250, 100, 222, 100, C.D, 1.6);
    return base(520, 200, 'Ajout ou retrait de matière', s);
  })();

  F.methode = (() => {
    const w = 150, h = 54;
    let s = box(10, 20, w, h, 'Mesurer', 'amplitude et phase', C.L, C.F) + box(185, 20, w, h, 'Calculer', 'c₁ et c₂', '#fff', C.F) + box(360, 20, w, h, 'Corriger', 'masse ou perçage', C.L, C.F);
    s += ar(160, 47, 185, 47, C.K, 1.8) + ar(335, 47, 360, 47, C.K, 1.8);
    s += ln(435, 74, 435, 120, C.K, 1.6) + ln(435, 120, 85, 120, C.K, 1.6) + ar(85, 120, 85, 76, C.K, 1.6) + t(260, 112, 'on vérifie : les efforts ont-ils disparu ?', { sz: 12.5, c: C.M });
    return base(520, 134, 'Méthode d’équilibrage en trois étapes', s);
  })();

  return F;
})();

COURSE.push({ id: 'probleme', t: 'Le problème de l’équilibrage', h: String.raw`
<p>Un rotor qui tourne vite peut vibrer fortement même si son mouvement est parfaitement uniforme : les vibrations ne viennent pas d’un couple moteur variable, mais de la <b>répartition des masses</b>. Ce sont des efforts tournants qui chargent les roulements, les usent, et rayonnent dans toute la structure.</p>
${fig(FIGS.familles, 'Les trois familles de problèmes de dynamique. L’équilibrage appartient à la troisième.')}
<h3>Ordre de grandeur</h3>
<p>Un rotor de $M = 10\ \text{kg}$ dont le centre de masse est décalé de $r = 0{,}05\ \text{mm}$ tourne à $30\,000$ tr/min, soit $\omega = 3141{,}6\ \text{rad/s}$. La force centrifuge vaut
$$Mr\omega^2 = 10 \times 5\cdot 10^{-5} \times 3141{,}6^2 \approx 4\,935\ \text{N}$$
alors que le poids n’est que de $98\ \text{N}$. Cette force tourne à $500$ Hz : elle est répétée $30\,000$ fois par minute.</p>
<p><b>Objectif.</b> Trouver les conditions sur la géométrie des masses pour que les efforts exercés sur les paliers soient <b>indépendants du temps</b>, puis les réaliser par ajout ou retrait de matière.</p>` });

COURSE.push({ id: 'modele', t: 'Modèle et paramétrage', h: String.raw`
<p>Le rotor $S$ est guidé par deux liaisons : un palier en $A$ ($z=0$) et un palier en $B$ ($z=L$). On le modélise par une liaison pivot d’axe $(A,z)$. Il tourne à vitesse constante : $\vec\Omega = \omega\,\vec z$ avec $\omega$ constant.</p>
${fig(FIGS.rotor, 'Rotor sur deux paliers A (z = 0) et B (z = L), repère lié au rotor.')}
<h3>Repère et grandeurs géométriques</h3>
<p>On utilise le repère $(A,x,y,z)$ lié au rotor, avec $x$ choisi dans le plan contenant l’axe et le centre de masse $G$. Alors $\vec{AG} = r\,\vec x + z_G\,\vec z$ : le nombre $r \geq 0$ est la <b>distance de G à l’axe</b>.</p>
${fig(FIGS.faces, 'Vue de face : à gauche G est sur l’axe (r = 0), à droite il en est écarté (r ≠ 0).')}
<h3>Matrice d’inertie</h3>
<p>En $A$, dans la base liée au rotor, la matrice d’inertie a pour composantes diagonales $A,B,C$ (moments d’inertie, $C$ autour de $z$) et pour termes croisés les <b>produits d’inertie</b> :
$$D = \int yz\,dm \qquad E = \int xz\,dm \qquad F = \int xy\,dm$$
Dans la convention française, la matrice s’écrit avec les signes $-D$, $-E$, $-F$ hors diagonale.</p>
<p>Ces constantes sont indépendantes du temps parce que le repère est lié au rotor : c’est ce qui rend le calcul simple.</p>` });

COURSE.push({ id: 'dynamique', t: 'Théorèmes généraux appliqués au rotor', h: String.raw`
<h3>Résultante dynamique</h3>
<p>$G$ décrit un cercle de rayon $r$ à vitesse $\omega$ constante : $\vec a_G = -\omega^2 r\,\vec x$. Le théorème de la résultante dynamique donne, en négligeant la pesanteur,
$$\vec R_A + \vec R_B = -M r \omega^2\,\vec x$$
où $\vec R_A$, $\vec R_B$ sont les actions des paliers sur le rotor.</p>
<h3>Moment dynamique en A</h3>
<p>Le point $A$ est fixe, donc le moment dynamique est la dérivée du moment cinétique. Avec $\vec\Omega=\omega\vec z$ :
$$\vec\sigma_A = \omega\,(-E\,\vec x - D\,\vec y + C\,\vec z)$$
Cette expression est constante dans le repère lié ; sa dérivée dans le repère fixe vaut donc $\vec\Omega\wedge\vec\sigma_A$ :
$$\vec\delta_A = \omega^2\,(D\,\vec x - E\,\vec y)$$
C’est un moment <b>perpendiculaire à l’axe</b> qui tourne avec le rotor.</p>
<h3>Réactions des paliers</h3>
<p>Le moment en $A$ des actions de liaison est $L\,\vec z\wedge\vec R_B = \vec\delta_A$ (la pivot parfaite n’exerce pas de moment transversal). En projetant, avec $\vec R_B$ dans le plan $(x,y)$ :
$$X_B = -\frac{\omega^2 E}{L} \qquad Y_B = -\frac{\omega^2 D}{L}$$
Les forces exercées <b>sur les paliers</b> sont les opposées. En notation complexe $X+iY$ :
$$\underline F_B = \frac{\omega^2}{L}\,(E + iD) \qquad \underline F_A = \omega^2\left(Mr - \frac{E}{L} - i\,\frac{D}{L}\right)$$
Dans le repère fixe, on multiplie par $e^{i\theta}$ avec $\theta = \omega t$. Les efforts tournent donc à la fréquence de rotation, avec une amplitude proportionnelle à $\omega^2$.</p>
<p><i>Remarque.</i> La pesanteur ajoute à chaque palier une force constante : elle ne fait pas vibrer et n’intervient pas dans l’équilibrage.</p>` });

COURSE.push({ id: 'vibrations', t: 'Vibrations linéaires et angulaires', h: String.raw`
<h3>Deux contributions</h3>
<p>Les formules précédentes se décomposent en un terme lié à la <b>force</b> ($Mr\omega^2$) et un terme lié au <b>couple</b> ($\omega^2\sqrt{D^2+E^2}$). Plus précisément :
$$\underline F_A + \underline F_B = \omega^2 M r \qquad L\,\|\underline F_B\| = \omega^2 \sqrt{D^2 + E^2}$$</p>
${fig(FIGS.statique, 'Rotor sur deux couteaux : il tourne jusqu’à placer G sous l’axe si r ≠ 0.')}
<h3>Balourd statique</h3>
<p>Si $D=E=0$ et $r\neq 0$, les deux forces sont égales et <b>en phase</b> : $F_A = F_B = Mr\omega^2/2$ si G est à mi-distance. C’est la <b>vibration linéaire</b>.</p>
${fig(FIGS.dynamique, 'Balourd dynamique : deux masses égales opposées dans deux plans différents. G est sur l’axe, mais les forces en A et B sont opposées.')}
<h3>Balourd dynamique</h3>
<p>Si $r=0$ et $(D,E)\neq(0,0)$, la résultante est nulle : $\underline F_A = -\underline F_B$. Les forces sont <b>en opposition de phase</b> et forment un couple tournant : c’est la <b>vibration angulaire</b>.</p>
${fig(FIGS.phases, 'Les forces sur les paliers en fonction de θ : en phase pour une vibration linéaire, en opposition pour une vibration angulaire.')}
<p>Le cas général superpose les deux : les efforts s’ajoutent en A et se retranchent en B (ou inversement).</p>` });

COURSE.push({ id: 'conditions', t: 'Conditions d’équilibrage', h: String.raw`
<h3>Énoncé</h3>
<p>Les efforts sur les paliers sont constants quel que soit $\omega$ si et seulement si
$$r = 0 \quad\text{et}\quad D = 0 \quad\text{et}\quad E = 0$$
En effet, $\underline F_B = 0$ impose $E = D = 0$, puis $\underline F_A = Mr\omega^2 = 0$ impose $r = 0$.</p>
<ul><li><b>Équilibrage statique</b> : $r=0$, G est sur l’axe. Le rotor reste immobile sur deux couteaux horizontaux.</li>
<li><b>Équilibrage dynamique</b> : $r=0$ et $D=E=0$. L’axe de rotation est un <b>axe principal d’inertie</b> et passe par G.</li></ul>
<p>L’équilibrage dynamique <b>contient</b> l’équilibrage statique, la réciproque est fausse.</p>
<h3>Pourquoi le test statique ne suffit pas</h3>
<p>Un cylindre dont l’axe de symétrie est incliné par rapport à l’arbre a son centre de masse sur l’axe de rotation : il reste immobile sur les couteaux. Pourtant $E\neq 0$ et il vibre en tournant.</p>` });

COURSE.push({ id: 'correction', t: 'Correction en deux plans', h: String.raw`
<h3>Écriture en balourds</h3>
<p>Le défaut est décrit par deux nombres complexes : le balourd résultant $U$ et le moment de balourd $C$, par rapport au point $A$ :
$$U = \sum m_k r_k e^{i\theta_k} \qquad C = \sum m_k r_k z_k\,e^{i\theta_k}$$
On ajoute deux masselottes de balourds $c_1 = m_1 R e^{i\varphi_1}$ et $c_2 = m_2 R e^{i\varphi_2}$ dans les plans $z_1$ et $z_2$. L’équilibre demande
$$c_1 + c_2 = -U \qquad z_1 c_1 + z_2 c_2 = -C$$</p>
${fig(FIGS.deuxPlans, 'Deux plans de correction P₁ et P₂ distincts, à distance z₂ − z₁.')}
<h3>Solution</h3>
<p>Si $z_1 \neq z_2$ :
$$c_2 = \frac{z_1 U - C}{z_2 - z_1} \qquad c_1 = -U - c_2$$
La masse de chaque masselotte est $m_k = |c_k|/R$ et son angle est $\arg c_k$. Si le module est trop grand ou si la masse est impossible à ajouter, on perce du côté du défaut : un retrait équivaut à une masse négative.</p>
${fig(FIGS.polygone, 'Les trois balourds U, c₁ et c₂ forment un polygone fermé : leur somme est nulle.')}
<p>Si $z_1 = z_2$ le système est impossible, sauf cas particulier : un seul plan ne permet pas de contrôler le moment.</p>` });

COURSE.push({ id: 'pratique', t: 'Mise en œuvre industrielle', h: String.raw`
${fig(FIGS.pratique, 'Ajout de masselotte sur une jante, ou perçage d’un rotor.')}
<h3>Méthode</h3>
${fig(FIGS.methode, 'Les trois étapes de l’équilibrage industriel.')}
<p>On ne connaît pas les défauts : on les déduit de <b>mesures</b> aux paliers. Une équilibreuse mesure l’amplitude et la phase des efforts à une vitesse donnée, puis calcule $c_1$ et $c_2$ à partir de la relation linéaire entre balourds et efforts.</p>
<h3>Méthode des coefficients d’influence</h3>
<p>On mesure les efforts $\underline F^{(0)}$ du rotor brut, puis $\underline F^{(1)}$ après ajout d’une masse d’essai connue. Le rapport $(\underline F^{(1)} - \underline F^{(0)})/c_{essai}$ donne un coefficient d’influence. Comme la relation est linéaire, la correction se déduit sans connaître la géométrie du rotor.</p>
<h3>Tolérance</h3>
<p>La norme ISO 1940 définit des classes $G = e\,\omega$ où $e = |OG|$ est l’excentricité résiduelle admissible et $\omega$ la vitesse de rotation. Une classe G 2,5 convient aux turbines, G 6,3 aux rotors de moteurs électriques.</p>
<h3>Exemple chiffré</h3>
<p>Pour $M = 10$ kg et $\omega = 3141{,}6$ rad/s, la classe G 2,5 donne $e = 2{,}5/3141{,}6 \approx 0{,}8\ \mu\text{m}$ : un décalage de 0,05 mm est donc largement trop grand.</p>` });

COURSE.push({ id: 'gloss', t: 'Glossaire', h: String.raw`
<dl class="gloss">
<dt>Balourd</dt><dd>Défaut de répartition des masses d’un rotor, à l’origine d’efforts tournants.</dd>
<dt>Balourd statique</dt><dd>Centre de masse hors de l’axe de rotation ($r\neq 0$).</dd>
<dt>Balourd dynamique</dt><dd>Axe de rotation non principal d’inertie ($D$ ou $E$ non nuls).</dd>
<dt>Masselotte</dt><dd>Petite masse ajoutée pour corriger un balourd.</dd>
<dt>Plan de correction</dt><dd>Plan perpendiculaire à l’axe où l’on ajoute ou retire de la matière.</dd>
<dt>Axe principal d’inertie</dt><dd>Axe pour lequel les produits d’inertie sont nuls.</dd>
<dt>Coefficient d’influence</dt><dd>Rapport entre l’effort mesuré et la masse d’essai ajoutée.</dd>
</dl>` });

  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: mathify(cur.h) }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : l’équilibrage dynamique'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Cinq ateliers sur l’équilibrage dynamique d’un solide en rotation (PSI*) : origine des vibrations, conditions d’équilibrage, rotor et masselottes, défi à défauts cachés, familles de problèmes et pratique.</p><h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut ; le bouton <b>Activité</b> ouvre consignes, défi et QCM ; le bouton <b>Cours</b> ouvre le cours illustré.</li><li>Dans l’atelier rotor, ajoutez des défauts, placez deux masselottes ou demandez la solution calculée.</li><li>Dans le défi, les défauts sont cachés : seules les forces sur les paliers sont mesurables. Les étoiles dépendent du résidu.</li></ul><h3>Vos données</h3><p>Les réponses au QCM et les étoiles sont mémorisées dans ce navigateur uniquement.</p>' }));
});
requestAnimationFrame(frame);
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();


</script>
