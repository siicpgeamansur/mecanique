<tr><td>Striée (Poly-V)</td><td>Plusieurs nervures, grande souplesse</td><td>Non</td><td>Automobile (accessoires)</td></tr>
<tr><td>Crantée (synchrone)</td><td>Engrènement dents-crans</td><td><b>Oui</b></td><td>Distribution, positionnement</td></tr></tbody></table>
<h3>Grandeurs et conventions</h3>
<ul><li>Poulie 1 : motrice, diamètre D₁, vitesse ω₁. Poulie 2 : réceptrice, D₂, ω₂.</li><li>Conversion : ω (rad/s) = 2πN/60, avec N en tr/min.</li><li>Vitesse de courroie : v = ω₁D₁/2 (en m/s, D en m).</li><li>Puissance : P = Cω = F<sub>u</sub>v, avec F<sub>u</sub> = T₁ − T₂ l’effort utile.</li></ul>
<div class="retain"><b>À retenir.</b> Les courroies lisses et trapézoïdales transmettent par adhérence, donc avec un glissement possible. Seule la courroie crantée impose un rapport exact.</div>` });

COURSE.push({ id: 'rapport', t: 'Rapport de transmission et glissement', h: `
<p>Si la courroie est inextensible et ne glisse pas, sa vitesse linéaire est la même sur les deux poulies.</p>
<div class="formula">ω₁D₁/2 = ω₂D₂/2 &nbsp;⇒&nbsp; k = ω₂/ω₁ = D₁/D₂ &nbsp;(courroie ouverte) &nbsp;; &nbsp; k = −D₁/D₂ &nbsp;(courroie croisée)</div>
<p>Pour une courroie crantée, k = ±Z₁/Z₂ avec Z le nombre de dents de chaque poulie.</p>
<h3>Glissement</h3>
<p>En pratique, une courroie lisse présente un <b>glissement élastique (fluage)</b> g de l’ordre de 1 à 3 % : la vitesse de la poulie réceptrice est un peu inférieure.</p>
<div class="formula">k = (D₁/D₂)(1 − g) &nbsp;⇒&nbsp; N₂ = N₁ (D₁/D₂)(1 − g)</div>
<p>Exemple : D₁ = 90 mm, D₂ = 225 mm, N₁ = 1 440 tr/min. Sans glissement N₂ = 576 tr/min ; avec g = 2 %, N₂ ≈ 564 tr/min.</p>
<h3>Trains à plusieurs étages</h3>
<p>Pour deux étages en série, les rapports se multiplient : k = k₁ k₂. Un rapport important se réalise avec plusieurs étages plutôt qu’avec une très grande poulie.</p>
<div class="retain"><b>À retenir.</b> k = ±D₁/D₂ sans glissement ; avec glissement, on multiplie par (1 − g).</div>` });

COURSE.push({ id: 'geometrie', t: 'Géométrie : angles et longueur', h: `
<p>On note R₁ = D₁/2 et R₂ = D₂/2, et E l’entraxe. Les angles se déduisent des tangentes communes aux deux poulies.</p>
<h3>Courroie ouverte (tangentes extérieures)</h3>
<div class="formula">sin γ = (D₂ − D₁)/(2E)<br>α₁ = π − 2γ &nbsp;; &nbsp; α₂ = π + 2γ<br>L = 2E cos γ + (α₁D₁ + α₂D₂)/2</div>
<p>L’angle d’enroulement le plus petit est sur la petite poulie : c’est lui qui limite l’adhérence. Valeur usuelle minimale : α₁ ≥ 120°.</p>
<h3>Courroie croisée (tangentes intérieures)</h3>
<div class="formula">sin λ = (D₁ + D₂)/(2E)<br>α₁ = α₂ = π + 2λ<br>L = 2E cos λ + (π + 2λ)(D₁ + D₂)/2</div>
<p>Les deux poulies tournent en sens contraire et les angles d’enroulement sont plus grands : le croisement améliore l’adhérence, mais use la courroie par frottement sur elle-même.</p>
<h3>Cas particulier</h3>
<p>Pour D₁ = D₂ = D, γ = 0 et L = 2E + πD : deux segments droits et un tour complet.</p>
<h3>Entraxe</h3>
<p>Règle usuelle : 0,7(D₁ + D₂) ≤ E ≤ 2(D₁ + D₂). Trop petit, les angles d’enroulement diminuent ; trop grand, la courroie vibre.</p>
<div class="retain"><b>À retenir.</b> Courroie ouverte : α₁ = π − 2γ sur la petite poulie. Courroie croisée : α = π + 2λ sur les deux.</div>` });

COURSE.push({ id: 'euler', t: 'Adhérence : formule d’Euler–Eytelwein', h: `
<p>On isole un élément de courroie d’angle dθ sur la poulie motrice, repéré dans le sens du mouvement de la courroie. Sa tension passe de T à T + dT. Appelons dN l’effort normal de la poulie sur l’élément et T<sub>c</sub> = μv² la tension centrifuge.</p>
<h3>Équilibre d’un élément</h3>
<ul><li>Radialement : dN = (T − T<sub>c</sub>) dθ (la tension centrifuge allège le contact).</li><li>Tangentiellement : sur la poulie motrice, la force de frottement exercée par la poulie sur la courroie est dirigée dans le sens du mouvement. Au seuil de glissement, elle vaut f dN, et dT = −f dN : la tension <b>diminue</b> dans le sens du mouvement.</li></ul>
<div class="formula">dT/(T − T<sub>c</sub>) = −f dθ &nbsp;⇒&nbsp; (T₁ − T<sub>c</sub>)/(T₂ − T<sub>c</sub>) = e<sup>fα</sup></div>
<p>La courroie arrive donc sur la poulie motrice avec la tension T₁ (brin tendu) et en repart avec T₂ (brin mou). En négligeant T<sub>c</sub> (vitesse faible), on retrouve T₁/T₂ = e<sup>fα</sup>, avec α en radians. Sur la poulie réceptrice, c’est l’inverse : la tension passe de T₂ à T₁.</p>
<h3>Courroie trapézoïdale</h3>
<p>L’effet de coin multiplie l’effort normal : on remplace f par <b>f′ = f/sin(β/2)</b>, avec β l’angle de la gorge. Pour β = 40°, f′ ≈ 2,9 f.</p>
<h3>Arc de repos et arc de glissement</h3>
<p>Tant que le rapport T₁/T₂ requis est inférieur à e<sup>f′α</sup>, la courroie n’a pas besoin d’utiliser toute l’adhérence disponible. Sur l’<b>arc de repos</b>, à l’arrivée sur la poulie, la courroie adhère et sa tension reste égale à T₁. Elle glisse ensuite sur l’<b>arc de glissement élastique</b> (fluage) θ<sub>g</sub> = ln[(T₁ − T<sub>c</sub>)/(T₂ − T<sub>c</sub>)]/f′, où sa tension décroît de T₁ à T₂. Le glissement global apparaît quand θ<sub>g</sub> atteint α.</p>
<h3>Précontrainte et effort maximal</h3>
<p>La précontrainte moyenne T₀ = (T₁ + T₂)/2 est imposée au montage. Avec F<sub>u</sub> = T₁ − T₂, la limite d’adhérence donne :</p>
<div class="formula">F<sub>max</sub> = 2(T₀ − T<sub>c</sub>)(e<sup>f′α</sup> − 1)/(e<sup>f′α</sup> + 1)</div>
<div class="retain"><b>À retenir.</b> Au seuil : (T₁ − μv²)/(T₂ − μv²) = e<sup>f′α</sup>. Le brin tendu arrive sur la poulie motrice. L’adhérence augmente avec α, avec f′ et avec la précontrainte, et diminue avec la vitesse.</div>` });

COURSE.push({ id: 'puissance', t: 'Puissance, couples et efforts sur les arbres', h: `
<p>La puissance transmise par la courroie vaut P = F<sub>u</sub>v. En régime permanent, le couple sur la poulie motrice est C = F<sub>u</sub>D₁/2.</p>
<div class="formula">F<sub>u</sub> = P/v &nbsp;; &nbsp; C = P/ω₁ &nbsp;; &nbsp; C₂ = k⁻¹C·η (arbre récepteur)</div>
<h3>Charge sur l’arbre</h3>
<p>Les deux brins exercent sur la poulie deux forces de modules T₁ et T₂, dont les directions font un angle π − α. La résultante, sollicitant l’arbre et ses paliers, a pour module :</p>
<div class="formula">F<sub>arbre</sub> = √(T₁² + T₂² − 2T₁T₂ cos α)</div>
<p>Pour α = π, on trouve T₁ + T₂ = 2T₀. La précontrainte détermine donc l’essentiel de la charge sur les paliers, d’où l’intérêt de ne pas surtendre la courroie.</p>
<h3>Vérifications de dimensionnement</h3>
<ul><li>Adhérence : T₁/T₂ requis ≤ e<sup>f′α</sup> sur la petite poulie.</li><li>Brin mou : T₂ doit rester supérieur à T<sub>c</sub>.</li><li>Résistance de la courroie : T₁ inférieure à la tension admissible.</li><li>Vitesse : environ 30 m/s au plus pour les courroies usuelles.</li></ul>
<div class="retain"><b>À retenir.</b> Puissance, effort utile et vitesse sont liés par P = F<sub>u</sub>v ; la charge sur l’arbre vaut √(T₁² + T₂² − 2T₁T₂ cos α).</div>` });

COURSE.push({ id: 'vocab', t: 'Poulies, moufles et palans : vocabulaire', h: `
<p>Une poulie seule ne travaille pas : il lui faut une <b>corde</b> et un <b>support</b>. Elle sert à changer la direction de l’effort et, selon le montage, à le diminuer.</p>
<h3>Anatomie d’une poulie</h3>
<svg viewBox="0 0 360 220" style="width:100%;max-width:420px;height:auto;display:block;margin:6px 0" role="img" aria-label="Anatomie d’une poulie simple"><path class="blk" d="M110 52 H250 V168 H110 Z" style="fill:none"/><circle class="pl" cx="180" cy="110" r="50"/><circle cx="180" cy="110" r="39" style="fill:none;stroke:var(--node-stroke);stroke-width:1.2"/><circle class="hub" cx="180" cy="110" r="6"/><path d="M180 52 V30 Q180 14 196 14 Q212 14 212 30" style="fill:none;stroke:var(--node-stroke);stroke-width:2.5"/><path d="M180 168 V190 Q180 206 196 206 Q212 206 212 190" style="fill:none;stroke:var(--node-stroke);stroke-width:2.5"/>
<line class="dimarr" x1="50" y1="156" x2="112" y2="150"/><text class="ts" x="8" y="172">chape</text>
<line class="dimarr" x1="46" y1="108" x2="174" y2="110"/><text class="ts" x="8" y="104">axe</text>
<line class="dimarr" x1="214" y1="82" x2="262" y2="58"/><text class="ts" x="264" y="56">réa</text>
<line class="dimarr" x1="222" y1="112" x2="262" y2="112"/><text class="ts" x="264" y="116">gorge</text>
<line class="dimarr" x1="208" y1="26" x2="262" y2="26"/><text class="ts" x="264" y="30">crochet</text></svg>
<ul><li><b>Réa</b> : la roue, qui tourne librement autour de l’<b>axe</b>.</li><li><b>Gorge</b> (rainure) : le creux du pourtour du réa, où passe la corde.</li><li><b>Chape</b> : la monture qui tient ensemble le réa et l’axe, et porte un ou deux crochets.</li><li><b>Moufle</b> : poulie double, triple ou quadruple, c’est-à-dire plusieurs réas coaxiaux dans une même chape.</li></ul>
<h3>Poulie fixe, poulie mobile, palan</h3>
<ul><li>Une poulie est <b>fixe</b> quand elle est retenue par un support ; elle est <b>mobile</b> quand elle voyage librement le long de la corde, la charge étant accrochée à sa chape.</li><li>Un <b>palan</b> associe deux moufles (une fixe, une mobile) reliés par une même corde. La charge soulevée s’appelait autrefois la <b>palanquée</b>.</li></ul>
<table class="ctable"><thead><tr><th>Montage</th><th>Segments porteurs n</th><th>Effort idéal F</th><th>Corde à tirer pour lever de h</th></tr></thead><tbody>
<tr><td>Poulie fixe</td><td>1</td><td>Mg (seule la direction change)</td><td>h</td></tr>
<tr><td>Poulie mobile, corde attachée au support</td><td>2</td><td>Mg/2</td><td>2h</td></tr>
<tr><td>Palan à 3 segments</td><td>3</td><td>Mg/3</td><td>3h</td></tr>
<tr><td>Palan à 4 segments</td><td>4</td><td>Mg/4</td><td>4h</td></tr></tbody></table>
<h3>Pourquoi l’effort diminue</h3>
<p>La corde est la même partout, donc la tension est la même dans chaque segment. Si trois segments portent simultanément un poids X, chacun reprend X/3 : la personne qui tire n’exerce que X/3. En contrepartie, pour hisser le poids d’une distance Y, il faut tirer la corde sur 3Y. Comme pour un plan incliné, on exerce une force moindre sur une plus longue distance : le travail (force × distance) est le même.</p>
<h3>Les poulies comme leviers</h3>
<p>Une poulie fixe se comporte comme un levier à bras égaux (R et R) : la tension est la même des deux côtés. Pour une poulie mobile dont un bout de corde est attaché au support, le point de contact côté support est le pivot : en prenant les moments, F × 2R = Mg × R, donc F = Mg/2.</p>
<h3>Limites du modèle idéal</h3>
<ul><li>Frottement des réas sur leur axe, surtout si la charge est lourde.</li><li>Étirement de la corde, qui ne transmet pas complètement l’effort.</li><li>Un peu de frottement de la corde sur la poulie est nécessaire pour qu’elle l’entraîne.</li></ul>
<p>On en tient compte par un rendement η par poulie (section suivante).</p>
<div class="retain"><b>À retenir.</b> Poulie fixe : direction seulement. Palan à n segments : F = Mg/n et n fois plus de corde à tirer. Vocabulaire : réa, gorge, axe, chape, moufle.</div>` });

COURSE.push({ id: 'palans', t: 'Palans : effort, justification et rendement', h: `
<p>Une <b>poulie fixe</b> change la direction du câble sans modifier sa tension (cas idéal). Une <b>poulie mobile</b> partage la charge sur deux brins. Un <b>palan</b> (ou mouflage) associe des poulies fixes et mobiles pour répartir la charge sur n brins porteurs.</p>
<h3>Palan idéal</h3>
<div class="formula">F = Mg/n &nbsp;; &nbsp; v<sub>brin</sub> = n·v<sub>charge</sub> &nbsp;; &nbsp; longueur tirée = n·h</div>
<p>On gagne un facteur n sur l’effort mais on perd le même facteur sur la course : la puissance Fnv = Mgv est conservée.</p>
<h3>Justification</h3>
<ol><li><b>Tension uniforme.</b> Câble sans masse et inextensible, poulies idéales. Pour une poulie de rayon R, le théorème du moment dynamique en son axe donne (T<sub>a</sub> − T<sub>b</sub>)R = Jθ̈ = 0, donc T<sub>a</sub> = T<sub>b</sub> : tous les brins ont la même tension T = F.</li><li><b>Équilibre de {bloc mobile + charge}.</b> Les n brins porteurs verticaux tirent vers le haut avec T chacun, le poids vers le bas : nT − Mg = 0, donc F = Mg/n.</li><li><b>Énergie.</b> Pour une montée dz de la charge, chaque brin porteur se raccourcit de dz, donc le brin tiré avance de n dz. Travaux : F n dz = Mg dz, d’où F = Mg/n, et v<sub>brin</sub> = n v.</li></ol>
<h3>Palan avec frottement</h3>
<p>Modèle retenu : le brin tiré porte la tension F ; chaque poulie qui sépare deux brins consécutifs multiplie la tension par le rendement η. Les tensions des n brins sont F, ηF, η²F, …, ηⁿ⁻¹F. L’équilibre de la charge s’écrit :</p>
<div class="formula">Mg = F(1 + η + … + ηⁿ⁻¹) = F(1 − ηⁿ)/(1 − η)<br>F = Mg(1 − η)/(1 − ηⁿ) &nbsp;; &nbsp; η<sub>g</sub> = Mg/(nF) = (1 − ηⁿ)/(n(1 − η))</div>
<p>Le rendement global décroît quand n augmente : on ne multiplie pas indéfiniment les brins.</p>
<h3>Exemple</h3>
<p>Pour M = 100 kg, n = 4 et η = 0,96 : F idéal = 245 N, F réel ≈ 260 N, η<sub>g</sub> ≈ 94 %.</p>
<div class="retain"><b>À retenir.</b> Palan idéal : F = Mg/n, vitesse du brin multipliée par n. Avec frottement : F = Mg(1 − η)/(1 − ηⁿ).</div>` });

COURSE.push({ id: 'dynamique', t: 'Dynamique : inertie équivalente', h: `
<p>On isole l’ensemble {arbre moteur, poulie 1, courroie, poulie 2, charge}, supposé sans glissement, avec ω₂ = kω₁.</p>
<h3>Énergie cinétique</h3>
<div class="formula">E<sub>c</sub> = ½(J<sub>m</sub> + J₁)ω₁² + ½(J₂ + J<sub>c</sub>)ω₂² = ½J<sub>eq</sub>ω₁²<br>J<sub>eq</sub> = J<sub>m</sub> + J₁ + k²(J₂ + J<sub>c</sub>)</div>
<p>La masse de la courroie peut aussi être ramenée : une masse m en translation à la vitesse v = ω₁R₁ ajoute mR₁² à J<sub>eq</sub>.</p>
<h3>Couple résistant ramené</h3>
<p>Avec un rendement η de la transmission, C<sub>r</sub>ω₂ = ηC<sub>r</sub>′ω₁, soit C<sub>r</sub>′ = kC<sub>r</sub>/η.</p>
<h3>Théorème de l’énergie-puissance</h3>
<div class="formula">C<sub>m</sub>ω₁ − C<sub>r</sub>ω₂ − P<sub>pertes</sub> = dE<sub>c</sub>/dt &nbsp;⇒&nbsp; J<sub>eq</sub> dω₁/dt = C<sub>m</sub> − C<sub>r</sub>′</div>
<h3>Démarrage d’un moteur à caractéristique linéaire</h3>
<p>Avec C<sub>m</sub> = C₀(1 − ω₁/ω₀) et C<sub>r</sub>′ constant :</p>
<div class="formula">τ dω₁/dt + ω₁ = ω<sub>f</sub> &nbsp;; &nbsp; τ = J<sub>eq</sub>ω₀/C₀ &nbsp;; &nbsp; ω<sub>f</sub> = ω₀(1 − C<sub>r</sub>′/C₀)</div>
<p>La solution est ω₁(t) = ω<sub>f</sub>(1 − e<sup>−t/τ</sup>). Le temps de réponse à 5 % vaut environ 3τ. Si C<sub>r</sub>′ ≥ C₀, le moteur ne démarre pas.</p>
<div class="retain"><b>À retenir.</b> J<sub>eq</sub> = J<sub>m</sub> + J₁ + k²(J₂ + J<sub>c</sub>) et J<sub>eq</sub>ω̇₁ = C<sub>m</sub> − C<sub>r</sub>′. Un réducteur de rapport k divise l’inertie de la charge par 1/k².</div>` });

COURSE.push({ id: 'methode', t: 'Méthode, pièges et glossaire', h: `
<h3>Méthode de résolution</h3>
<ol><li>Fixer les conventions : poulie motrice (1), réceptrice (2), sens positifs.</li><li>Convertir toutes les unités : mm en m, tr/min en rad/s.</li><li>Cinématique : k, v de courroie, vitesses.</li><li>Statique : F<sub>u</sub> = P/v, T₁ − T₂ = F<sub>u</sub>, T₁ + T₂ = 2T₀, puis condition d’adhérence sur la <b>petite</b> poulie.</li><li>Dynamique : ramener inerties et couples sur un même arbre, appliquer le théorème de l’énergie-puissance.</li><li>Contrôler les ordres de grandeur et les signes.</li></ol>
<h3>Pièges classiques</h3>
<ul><li>Utiliser α en degrés dans e<sup>fα</sup> : il faut des radians.</li><li>Vérifier l’adhérence sur la grande poulie au lieu de la petite.</li><li>Oublier f′ = f/sin(β/2) pour une courroie trapézoïdale.</li><li>Ramener les inerties avec k au lieu de k².</li><li>Confondre T₀ (précontrainte moyenne) et T₁ ou T₂.</li><li>Oublier le rendement dans le couple résistant ramené.</li></ul>
<h3>Glossaire</h3>
<dl class="gloss"><dt>Brin tendu / mou</dt><dd>Brin de tension T₁ / T₂, avec T₁ &gt; T₂.</dd><dt>Angle d’enroulement</dt><dd>Angle de l’arc de contact entre courroie et poulie.</dd><dt>Fluage</dt><dd>Glissement élastique de la courroie sur l’arc de glissement.</dd><dt>Précontrainte</dt><dd>Tension de montage, notée T₀ en moyenne.</dd><dt>Tension centrifuge</dt><dd>T<sub>c</sub> = μv², due à la vitesse de la courroie.</dd><dt>Mouflage</dt><dd>Montage de poulies fixes et mobiles réduisant l’effort de levage.</dd><dt>Inertie équivalente</dt><dd>Inertie fictive sur un arbre donné qui porte la même énergie cinétique.</dd></dl>
<div class="retain"><b>À retenir.</b> Toujours vérifier : unités, petite poulie, k² pour les inerties, radians pour les angles.</div>` });

  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w })); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : poulies et courroies'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Quatre ateliers sur les transmissions par poulies et courroie (SII, CPGE PSI*) : cinématique et géométrie, adhérence et tensions, poulies et palans, dynamique et démarrage.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut, puis déplacez les curseurs : les résultats et les graphes se mettent à jour.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi avec sa correction et un QCM.</li><li>Le bouton <b>Cours</b> reprend les formules et les méthodes.</li></ul>' +
    '<h3>Hypothèses</h3><p>Courroie sans épaisseur ni masse sauf la tension centrifuge μv², poulies coplanaires, frottement de Coulomb constant, régime permanent pour les tensions.</p>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); })();
</script>
