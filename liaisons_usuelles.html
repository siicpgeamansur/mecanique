<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liaisons usuelles & Torseurs – Animation 3D</title>
<style>
  :root {
    --bg: #ffffff; --card: #f8fafc; --accent: #2563eb; --accent2: #7c3aed;
    --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
    --input-bg: #fff; --code-bg: #f1f5f9;
  }
  [data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --accent2: #a78bfa;
    --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
    --input-bg: #0f172a; --code-bg: #0f172a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 1rem;
    transition: background .25s, color .25s;
  }
  h1 { text-align: center; font-size: 1.65rem; color: var(--accent); margin-bottom: .25rem; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 1.2rem; font-size: .95rem; }
  .container { max-width: 1300px; margin: 0 auto; display: grid; gap: 1.1rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.1rem;
  }
  .card h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: .7rem; }
  .top-controls {
    display: flex; flex-wrap: wrap; gap: .7rem; justify-content: center; margin-bottom: .5rem;
  }
  .btn {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; border: none; border-radius: 8px;
    padding: .5rem 1.1rem; font-size: .9rem; font-weight: 600; cursor: pointer;
  }
  [data-theme="dark"] .btn { background: linear-gradient(135deg, #0ea5e9, #6366f1); }
  .btn-secondary { background: #64748b; }
  [data-theme="dark"] .btn-secondary { background: #475569; }
  .btn.active { outline: 3px solid var(--accent); outline-offset: 2px; }
  .theme-toggle {
    position: fixed; top: 1rem; right: 1rem; z-index: 100;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: .4rem .9rem; font-size: .9rem; cursor: pointer;
    display: flex; align-items: center; gap: .35rem;
  }
  .liaison-select {
    display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center;
  }
  .liaison-select button {
    background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: .4rem .8rem; font-size: .85rem; cursor: pointer;
  }
  .liaison-select button.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .main-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1.1rem;
  }
  @media (max-width: 900px) { .main-grid { grid-template-columns: 1fr; } }
  #canvas-container {
    width: 100%; height: 380px; border-radius: 10px;
    overflow: hidden; border: 1px solid var(--border); background: #0a0a12;
  }
  [data-theme="light"] #canvas-container { background: #e2e8f0; }
  .svg-box {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: .8rem; text-align: center;
  }
  .svg-box svg { max-width: 100%; height: auto; }
  .torseur-col {
    font-family: 'Fira Code', Consolas, monospace;
    font-size: .88rem; line-height: 1.45;
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: .9rem 1rem; overflow-x: auto;
  }
  .torseur-col .label { font-size: .78rem; color: var(--muted); margin-bottom: .3rem; font-family: inherit; }
  .geo { font-size: .9rem; color: var(--muted); margin: .4rem 0; }
  .geo strong { color: var(--text); }
  .dof-badge {
    display: inline-block; background: var(--accent); color: #fff;
    font-size: .75rem; font-weight: 700; padding: .15rem .5rem; border-radius: 999px;
  }
  .info { font-size: .88rem; color: var(--muted); margin-top: .5rem; }
</style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">
    <span id="theme-icon">🌙</span> <span id="theme-label">Sombre</span>
  </button>

  <h1>Liaisons usuelles & Torseurs</h1>
  <p class="subtitle">Cinématique • Statique • Dualité – Animation 3D des mouvements</p>

  <div class="container">
    <!-- Contrôles -->
    <div class="card">
      <div class="top-controls">
        <button class="btn" id="btn-cine" onclick="setMode('cine')">Cinématique</button>
        <button class="btn btn-secondary" id="btn-stat" onclick="setMode('stat')">Statique</button>
        <button class="btn btn-secondary" id="btn-dual" onclick="setMode('dual')">Dualité</button>
      </div>
      <div class="liaison-select" id="liaison-buttons"></div>
    </div>

    <!-- Contenu principal -->
    <div class="main-grid">
      <!-- Gauche : info + SVG + torseurs -->
      <div class="card" id="info-panel">
        <h2 id="liaison-name">–</h2>
        <div id="liaison-dof"></div>
        <div class="geo" id="liaison-geo"></div>
        <div class="svg-box" id="svg-container"></div>
        <div id="torseurs-container" style="margin-top:1rem"></div>
      </div>

      <!-- Droite : 3D -->
      <div class="card">
        <h2>Animation 3D des mouvements autorisés</h2>
        <div id="canvas-container"></div>
        <p class="info">Souris = rotation de la vue • Molette = zoom</p>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ========== Thème ========== */
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  if (dark) {
    html.removeAttribute('data-theme');
    document.getElementById('theme-icon').textContent = '🌙';
    document.getElementById('theme-label').textContent = 'Sombre';
    localStorage.setItem('theme', 'light');
  } else {
    html.setAttribute('data-theme', 'dark');
    document.getElementById('theme-icon').textContent = '☀️';
    document.getElementById('theme-label').textContent = 'Clair';
    localStorage.setItem('theme', 'dark');
  }
  if (scene) scene.background = new THREE.Color(dark ? 0xf1f5f9 : 0x0a0a12);
}
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('theme-icon').textContent = '☀️';
  document.getElementById('theme-label').textContent = 'Clair';
}

/* ========== Données des liaisons ========== */
const LIAISONS = {

  },

  },

      <circle cx="100" cy="60" r="18" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
      <line x1="100" y1="10" x2="100" y2="110" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
      <text x="100" y="15" text-anchor="middle" font-size="11" fill="#ef4444">axe</text>
    </svg>`,
    cine: `{Ωx}\n{Ωy}\n{Ωz}\n{0}\n{0}\n{Vz}`,
    stat: `{Rx}\n{Ry}\n{0}\n{0}\n{0}\n{0}`,
    point: "A ∈ axe",
    base: "z // axe cylindre"
  },
  cylindreplan: {
    name: "Cylindre / Plan",
    dof: "4 ddl",
    geo: "Caractérisée par la <strong>direction des génératrices</strong> et le plan.",
    svg: `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
      <rect x="20" y="85" width="160" height="10" fill="#94a3b8"/>
      <rect x="60" y="40" width="80" height="45" rx="20" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
      <line x1="40" y1="62" x2="160" y2="62" stroke="#ef4444" stroke-width="2" stroke-dasharray="4"/>
      <text x="100" y="30" text-anchor="middle" font-size="11" fill="#ef4444">génératrices</text>
    </svg>`,
    cine: `{0}\n{Ωy}\n{Ωz}\n{Vx}\n{0}\n{Vz}`,
    stat: `{0}\n{Ry}\n{0}\n{0}\n{My}\n{0}`,
    point: "A sur la génératrice de contact",
    base: "x // génératrices, z ⊥ plan"
  },
  appuiplan: {
    name: "Appui plan (Plan / Plan)",
    dof: "3 ddl",
    geo: "Caractérisée par le <strong>plan de contact</strong>.",
    svg: `<svg viewBox="0 0 200 120" xmlns="http://www.w3.org/2000/svg">
      <rect x="30" y="70" width="140" height="14" fill="#94a3b8" stroke="#64748b"/>
      <rect x="50" y="40" width="100" height="30" fill="#93c5fd" stroke="#2563eb" stroke-width="2"/>
      <text x="100" y="105" text-anchor="middle" font-size="11" fill="#64748b">plan de contact</text>
    </svg>`,
    cine: `{0}\n{0}\n{Ωz}\n{Vx}\n{Vy}\n{0}`,
    stat: `{0}\n{0}\n{Rz}\n{0}\n{0}\n{Mz}`,
    point: "A dans le plan",
    base: "z ⊥ plan"
  }
};

let currentMode = 'cine';
let currentKey = 'pivot';

/* ========== Rendu UI ========== */
function setMode(mode) {
  currentMode = mode;
  ['cine','stat','dual'].forEach(m => {
    const b = document.getElementById('btn-' + m);
    b.classList.toggle('active', m === mode);
    b.classList.toggle('btn-secondary', m !== mode);
  });
  renderInfo();
}

function selectLiaison(key) {
  currentKey = key;
  document.querySelectorAll('.liaison-select button').forEach(b => {
    b.classList.toggle('active', b.dataset.key === key);
  });
  renderInfo();
  buildAnimation(key);
}

function renderInfo() {
  const L = LIAISONS[currentKey];
  document.getElementById('liaison-name').textContent = L.name;
  document.getElementById('liaison-dof').innerHTML = `<span class="dof-badge">${L.dof}</span>`;
  document.getElementById('liaison-geo').innerHTML = L.geo;
  document.getElementById('svg-container').innerHTML = L.svg;

  const cont = document.getElementById('torseurs-container');
  let html = '';

  const formatCol = (str) => str.split('\\n').map(l => l.trim()).join('<br>');

  if (currentMode === 'cine' || currentMode === 'dual') {
    html += `<div class="torseur-col" style="margin-bottom:.8rem">
      <div class="label">Torseur cinématique {V<sub>1/0</sub>} &nbsp;–&nbsp; point ${L.point} &nbsp;–&nbsp; base ${L.base}</div>
      ${formatCol(L.cine)}
    </div>`;
  }
  if (currentMode === 'stat' || currentMode === 'dual') {
    html += `<div class="torseur-col">
      <div class="label">Torseur des actions {T<sub>0→1</sub>} &nbsp;–&nbsp; point ${L.point} &nbsp;–&nbsp; base ${L.base}</div>
      ${formatCol(L.stat)}
    </div>`;
  }
  cont.innerHTML = html;
}

/* ========== Three.js ========== */
let scene, camera, renderer, controls, animGroup, clock;
let animFn = null;

function initThree() {
  const container = document.getElementById('canvas-container');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(
    document.documentElement.getAttribute('data-theme') === 'dark' ? 0x0a0a12 : 0xe2e8f0
  );
  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(5, 4, 7);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(devicePixelRatio);
  container.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const dir = new THREE.DirectionalLight(0xffffff, 0.7);
  dir.position.set(5, 10, 7);
  scene.add(dir);
  scene.add(new THREE.AxesHelper(2.5));
  animGroup = new THREE.Group();
  scene.add(animGroup);
  clock = new THREE.Clock();
  window.addEventListener('resize', () => {
    const w = container.clientWidth, h = container.clientHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
  animate();
}

function clearAnim() {
  while (animGroup.children.length) {
    const o = animGroup.children[0];
    animGroup.remove(o);
    if (o.geometry) o.geometry.dispose();
    if (o.material) {
      if (Array.isArray(o.material)) o.material.forEach(m => m.dispose());
      else o.material.dispose();
    }
  }
  animFn = null;
}

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  if (animFn) animFn(t);
  controls.update();
  renderer.render(scene, camera);
}

/* Constructions 3D simplifiées + animations */
function buildAnimation(key) {
  clearAnim();
  const matFix = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
  const matMob = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });
  const matContact = new THREE.MeshStandardMaterial({ color: 0xef4444 });

  if (key === 'encastrement') {
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), matFix);
    const b2 = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.8, 0.8), matMob);
    b1.position.x = -1.1; b2.position.x = 1.1;
    animGroup.add(b1, b2);
    // pas de mouvement
  }
  else if (key === 'pivot') {
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 2.5, 16), matFix);
    const arm = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.25, 0.4), matMob);
    arm.position.x = 0.9;
    const pivot = new THREE.Group();
    pivot.add(arm);
    animGroup.add(base, pivot);
    animFn = t => { pivot.rotation.y = Math.sin(t) * 1.2; };
  }
  else if (key === 'glissiere') {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(4, 0.15, 0.4), matFix);
    const slider = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.5, 0.6), matMob);
    animGroup.add(rail, slider);
    animFn = t => { slider.position.x = Math.sin(t) * 1.4; };
  }
  else if (key === 'helicoidale') {
    const axe = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3, 16), matFix);
    const nut = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.5, 16), matMob);
    animGroup.add(axe, nut);
    animFn = t => {
      nut.rotation.y = t * 2;
      nut.position.y = (t * 0.3) % 2 - 1;
    };
  }
  else if (key === 'pivotglissant') {
    const axe = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 3, 16), matFix);
    const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.8, 16), matMob);
    animGroup.add(axe, sleeve);
    animFn = t => {
      sleeve.rotation.y = t * 1.5;
      sleeve.position.y = Math.sin(t) * 0.9;
    };
  }
  else if (key === 'spherique') {
    const socket = new THREE.Mesh(new THREE.SphereGeometry(0.55, 24, 16), matFix);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.35, 24, 16), matMob);
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.4, 12), matMob);
    stick.position.y = 0.7;
    const joint = new THREE.Group();
    joint.add(ball, stick);
    animGroup.add(socket, joint);
    animFn = t => {
      joint.rotation.x = Math.sin(t * 0.8) * 0.6;
      joint.rotation.z = Math.cos(t * 0.6) * 0.5;
    };
  }
  else if (key === 'sphereplan') {
    const plane = new THREE.Mesh(new THREE.BoxGeometry(4, 0.08, 4), matFix);
    plane.position.y = -0.04;
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 16), matMob);
    sphere.position.y = 0.5;
    animGroup.add(plane, sphere);
    animFn = t => {
      sphere.position.x = Math.sin(t * 0.7) * 1.2;
      sphere.position.z = Math.cos(t * 0.5) * 1.0;
      sphere.rotation.x = t * 1.2;
      sphere.rotation.z = t * 0.8;
    };
  }
  else if (key === 'spherecylindre') {
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.7, 3, 24, 1, true), matFix);
    const sphere = new THREE.Mesh(new THREE.SphereGeometry(0.35, 20, 14), matMob);
    animGroup.add(cyl, sphere);
    animFn = t => {
      sphere.position.y = Math.sin(t) * 1.0;
      sphere.rotation.x = t;
      sphere.rotation.z = t * 0.7;
    };
  }
  else if (key === 'cylindreplan') {
    const plane = new THREE.Mesh(new THREE.BoxGeometry(4, 0.08, 3), matFix);
    plane.position.y = -0.04;
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.4, 2.2, 24), matMob);
    cyl.rotation.z = Math.PI / 2;
    cyl.position.y = 0.4;
    animGroup.add(plane, cyl);
    animFn = t => {
      cyl.position.x = Math.sin(t * 0.6) * 1.1;
      cyl.rotation.x = t * 0.9;
    };
  }
  else if (key === 'appuiplan') {
    const plane = new THREE.Mesh(new THREE.BoxGeometry(4, 0.08, 4), matFix);
    plane.position.y = -0.04;
    const block = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.3, 1.2), matMob);
    block.position.y = 0.15;
    animGroup.add(plane, block);
    animFn = t => {
      block.position.x = Math.sin(t * 0.7) * 1.0;
      block.position.z = Math.cos(t * 0.5) * 0.8;
      block.rotation.y = Math.sin(t * 0.4) * 0.8;
    };
  }
}

/* ========== Init ========== */
function initButtons() {
  const cont = document.getElementById('liaison-buttons');
  Object.keys(LIAISONS).forEach(key => {
    const b = document.createElement('button');
    b.textContent = LIAISONS[key].name;
    b.dataset.key = key;
    b.onclick = () => selectLiaison(key);
    cont.appendChild(b);
  });
}

initThree();
initButtons();
setMode('cine');
selectLiaison('pivot');
</script>
