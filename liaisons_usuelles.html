<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Liaisons usuelles – Torseurs & Mouvements</title>
<style>
  :root {
    --bg: #ffffff; --card: #f8fafc; --accent: #2563eb; --accent2: #7c3aed;
    --text: #1e293b; --muted: #64748b; --border: #e2e8f0;
    --input-bg: #fff; --code-bg: #f1f5f9;
    --ok: #16a34a; --ko: #dc2626;
  }
  [data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --accent: #38bdf8; --accent2: #a78bfa;
    --text: #e2e8f0; --muted: #94a3b8; --border: #334155;
    --input-bg: #0f172a; --code-bg: #0f172a;
    --ok: #4ade80; --ko: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 1rem;
    transition: background .25s, color .25s;
  }
  h1 { text-align: center; font-size: 1.6rem; color: var(--accent); margin-bottom: .3rem; }
  .subtitle { text-align: center; color: var(--muted); margin-bottom: 1.2rem; font-size: .95rem; }
  .container { max-width: 1300px; margin: 0 auto; display: grid; gap: 1.1rem; }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 12px; padding: 1.15rem;
  }
  .card h2 { font-size: 1.1rem; color: var(--accent); margin-bottom: .7rem; }
  .theme-toggle {
    position: fixed; top: 1rem; right: 1rem; z-index: 100;
    background: var(--card); border: 1px solid var(--border); color: var(--text);
    border-radius: 999px; padding: .4rem .9rem; font-size: .9rem; cursor: pointer;
    display: flex; align-items: center; gap: .35rem;
  }
  .liaison-select {
    display: flex; flex-wrap: wrap; gap: .45rem; justify-content: center;
  }
  .liaison-select button {
    background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
    border-radius: 8px; padding: .38rem .75rem; font-size: .84rem; cursor: pointer;
  }
  .liaison-select button.active {
    background: var(--accent); color: #fff; border-color: var(--accent);
  }
  .main-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1.1rem;
  }
  @media (max-width: 980px) { .main-grid { grid-template-columns: 1fr; } }
  #canvas-container {
    width: 100%; height: 390px; border-radius: 10px;
    overflow: hidden; border: 1px solid var(--border); background: #0a0a12;
  }
  [data-theme="light"] #canvas-container { background: #e2e8f0; }
  .geo { font-size: .92rem; color: var(--muted); margin: .4rem 0 .8rem; }
  .geo strong { color: var(--text); }
  .dof-badge {
    display: inline-block; background: var(--accent); color: #fff;
    font-size: .75rem; font-weight: 700; padding: .15rem .5rem; border-radius: 999px;
  }
  /* Torseurs */
  .torseurs {
    display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-top: .8rem;
  }
  @media (max-width: 600px) { .torseurs { grid-template-columns: 1fr; } }
  .torseur-box {
    background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 10px; padding: .9rem;
  }
  .torseur-title {
    font-size: .82rem; color: var(--muted); margin-bottom: .5rem;
  }
  .bmatrix {
    display: grid;
    grid-template-columns: auto auto auto;
    gap: 2px 8px;
    font-family: 'Fira Code', Consolas, monospace;
    font-size: .95rem;
    align-items: center;
    justify-content: start;
  }
  .bm-left, .bm-right {
    font-size: 2.2rem; line-height: 1; color: var(--muted);
  }
  .bm-cells {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 12px;
  }
  .comp {
    display: flex; align-items: center; gap: .35rem;
    padding: .25rem .4rem; border-radius: 6px; cursor: pointer;
    user-select: none; border: 1px solid transparent;
  }
  .comp:hover { background: rgba(37,99,235,.08); }
  .comp.selected {
    background: rgba(37,99,235,.18); border-color: var(--accent);
  }
  .comp.correct {
    background: rgba(22,163,74,.2); border-color: var(--ok); color: var(--ok);
  }
  .comp.wrong {
    background: rgba(220,38,38,.15); border-color: var(--ko); color: var(--ko);
  }
  .comp input { display: none; }
  .point-base {
    font-size: .8rem; color: var(--muted); margin-top: .45rem;
  }
  .btn {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: #fff; border: none; border-radius: 8px;
    padding: .5rem 1.1rem; font-size: .9rem; font-weight: 600; cursor: pointer;
  }
  [data-theme="dark"] .btn { background: linear-gradient(135deg, #0ea5e9, #6366f1); }
  .btn-row { margin-top: 1rem; display: flex; gap: .6rem; flex-wrap: wrap; }
  .feedback {
    margin-top: .7rem; font-size: .9rem; display: none;
    padding: .5rem .8rem; border-radius: 8px;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: rgba(22,163,74,.12); color: var(--ok); }
  .feedback.ko { background: rgba(220,38,38,.12); color: var(--ko); }
  /* Sliders */
  .sliders { margin-top: .8rem; }
  .slider-row {
    display: grid; grid-template-columns: 90px 1fr 50px;
    align-items: center; gap: .5rem; margin-bottom: .45rem;
    font-size: .88rem;
  }
  input[type=range] { width: 100%; }
  .info { font-size: .85rem; color: var(--muted); margin-top: .5rem; }
</style>
</head>
<body>
  <button class="theme-toggle" onclick="toggleTheme()">
    <span id="theme-icon">🌙</span> <span id="theme-label">Sombre</span>
  </button>

  <h1>Liaisons usuelles & Torseurs</h1>
  <p class="subtitle">Dualité cinématique / statique – Sélection des composantes – Mouvement interactif</p>

  <div class="container">
    <div class="card">
      <div class="liaison-select" id="liaison-buttons"></div>
    </div>

    <div class="main-grid">
      <!-- Gauche -->
      <div class="card">
        <h2 id="liaison-name">–</h2>
        <div id="liaison-dof"></div>
        <div class="geo" id="liaison-geo"></div>

        <div class="torseurs" id="torseurs">
          <!-- rempli en JS -->
        </div>

        <div class="btn-row">
          <button class="btn" onclick="checkAnswer()">Vérifier</button>
          <button class="btn" style="background:#64748b" onclick="resetSelection()">Réinitialiser</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>

      <!-- Droite : 3D + sliders -->
      <div class="card">
        <h2>Mouvement de la pièce mobile (bleue)</h2>
        <div id="canvas-container"></div>
        <div class="sliders" id="sliders"></div>
        <p class="info">Les curseurs correspondent aux degrés de liberté autorisés par la liaison.<br>
        Souris = tourner la vue • Molette = zoom</p>
      </div>
    </div>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* ========== Thème ========== */
function toggleTheme() {
  const html = document.documentElement;
  const dark = html.getAttribute('data-theme') === 'dark';
  if (dark) {
    html.removeAttribute('data-theme');
    document.getElementById('theme-icon').textContent = '🌙';
    document.getElementById('theme-label').textContent = 'Sombre';
    localStorage.setItem('theme', 'light');
  } else {
    html.setAttribute('data-theme', 'dark');
    document.getElementById('theme-icon').textContent = '☀️';
    document.getElementById('theme-label').textContent = 'Clair';
    localStorage.setItem('theme', 'dark');
  }
  if (scene) scene.background = new THREE.Color(
    document.documentElement.getAttribute('data-theme') === 'dark' ? 0x0a0a12 : 0xe2e8f0
  );
}
if (localStorage.getItem('theme') === 'dark') {
  document.documentElement.setAttribute('data-theme', 'dark');
  document.getElementById('theme-icon').textContent = '☀️';
  document.getElementById('theme-label').textContent = 'Clair';
}

/* ========== Données ========== */
const LIAISONS = {
  encastrement: {
    name: "Encastrement",
    dof: "0 ddl",
    geo: "Aucun élément géométrique particulier (liaison complète).",
    point: "A quelconque",
    base: "(\\vec{x},\\vec{y},\\vec{z})",
    cineFree: [],                // indices 0..5 = Ωx Ωy Ωz Vx Vy Vz
    statFree: [0,1,2,3,4,5],     // Rx Ry Rz Mx My Mz
    params: []
  },
  pivot: {
    name: "Pivot",
    dof: "1 ddl",
    geo: "Caractérisée par son <strong>axe Δ</strong>.",
    point: "A ∈ Δ",
    base: "\\vec{z} \\parallel \\Delta",
    cineFree: [2],               // Ωz
    statFree: [0,1,2,3,4],       // tout sauf Mz
    params: [{ id: "rz", label: "Ωz (rot)", min: -3.14, max: 3.14, step: 0.01, value: 0 }]
  },
  glissiere: {
    name: "Glissière",
    dof: "1 ddl",
    geo: "Caractérisée par sa <strong>direction \\(\\vec{u}\\)</strong>.",
    point: "A quelconque",
    base: "\\vec{z} \\parallel \\vec{u}",
    cineFree: [5],               // Vz
    statFree: [0,1,3,4,5],
    params: [{ id: "tz", label: "Vz (trans)", min: -1.8, max: 1.8, step: 0.01, value: 0 }]
  },
  helicoidale: {
    name: "Hélicoïdale",
    dof: "1 ddl",
    geo: "Caractérisée par son <strong>axe Δ</strong> et son <strong>pas p</strong>.",
    point: "A ∈ Δ",
    base: "\\vec{z} \\parallel \\Delta",
    cineFree: [2,5],             // Ωz et Vz (liés)
    statFree: [0,1,2,3,4],
    params: [{ id: "hel", label: "paramètre hélicoïdal", min: -3, max: 3, step: 0.01, value: 0 }]
  },
  pivotglissant: {
    name: "Pivot glissant",
    dof: "2 ddl",
    geo: "Caractérisée par son <strong>axe Δ</strong>.",
    point: "A ∈ Δ",
    base: "\\vec{z} \\parallel \\Delta",
    cineFree: [2,5],
    statFree: [0,1,3,4],
    params: [
      { id: "rz", label: "Ωz", min: -3.14, max: 3.14, step: 0.01, value: 0 },
      { id: "tz", label: "Vz", min: -1.5, max: 1.5, step: 0.01, value: 0 }
    ]
  },
  spherique: {
    name: "Sphérique",
    dof: "3 ddl",
    geo: "Caractérisée par son <strong>centre C</strong>.",
    point: "C (centre)",
    base: "(\\vec{x},\\vec{y},\\vec{z})",
    cineFree: [0,1,2],
    statFree: [0,1,2],
    params: [
      { id: "rx", label: "Ωx", min: -1.2, max: 1.2, step: 0.01, value: 0 },
      { id: "ry", label: "Ωy", min: -1.2, max: 1.2, step: 0.01, value: 0 },
      { id: "rz", label: "Ωz", min: -1.2, max: 1.2, step: 0.01, value: 0 }
    ]
  },
  sphereplan: {
    name: "Sphère / Plan",
    dof: "5 ddl",
    geo: "Caractérisée par le <strong>plan de contact</strong> et le <strong>point de contact</strong>.",
    point: "I (point de contact)",
    base: "\\vec{z} \\perp plan",
    cineFree: [0,1,2,3,4],
    statFree: [2],
    params: [
      { id: "tx", label: "Vx", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "ty", label: "Vy", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "rx", label: "Ωx", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "ry", label: "Ωy", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "rz", label: "Ωz", min: -1.5, max: 1.5, step: 0.01, value: 0 }
    ]
  },
  spherecylindre: {
    name: "Sphère / Cylindre",
    dof: "4 ddl",
    geo: "Caractérisée par l’<strong>axe du cylindre</strong>.",
    point: "A ∈ axe",
    base: "\\vec{z} \\parallel axe",
    cineFree: [0,1,2,5],
    statFree: [0,1],
    params: [
      { id: "tz", label: "Vz", min: -1.4, max: 1.4, step: 0.01, value: 0 },
      { id: "rx", label: "Ωx", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "ry", label: "Ωy", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "rz", label: "Ωz", min: -1.5, max: 1.5, step: 0.01, value: 0 }
    ]
  },
  cylindreplan: {
    name: "Cylindre / Plan",
    dof: "4 ddl",
    geo: "Caractérisée par la <strong>direction des génératrices</strong> et le plan.",
    point: "A sur la génératrice de contact",
    base: "\\vec{x} \\parallel génératrices, \\vec{z} \\perp plan",
    cineFree: [1,2,3,5],
    statFree: [1,4],
    params: [
      { id: "tx", label: "Vx", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "tz", label: "Vz", min: -1.2, max: 1.2, step: 0.01, value: 0 },
      { id: "ry", label: "Ωy", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "rz", label: "Ωz", min: -1.5, max: 1.5, step: 0.01, value: 0 }
    ]
  },
  appuiplan: {
    name: "Appui plan",
    dof: "3 ddl",
    geo: "Caractérisée par le <strong>plan de contact</strong>.",
    point: "A dans le plan",
    base: "\\vec{z} \\perp plan",
    cineFree: [2,3,4],
    statFree: [2,5],
    params: [
      { id: "tx", label: "Vx", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "ty", label: "Vy", min: -1.5, max: 1.5, step: 0.01, value: 0 },
      { id: "rz", label: "Ωz", min: -1.8, max: 1.8, step: 0.01, value: 0 }
    ]
  }
};

const COMP_CINE = ["Ωx","Ωy","Ωz","Vx","Vy","Vz"];
const COMP_STAT = ["Rx","Ry","Rz","Mx","My","Mz"];

let currentKey = "pivot";
let userCine = new Set();
let userStat = new Set();
let checked = false;

/* ========== UI ========== */
function initButtons() {
  const cont = document.getElementById("liaison-buttons");
  Object.keys(LIAISONS).forEach(key => {
    const b = document.createElement("button");
    b.textContent = LIAISONS[key].name;
    b.dataset.key = key;
    b.onclick = () => selectLiaison(key);
    cont.appendChild(b);
  });
}

function selectLiaison(key) {
  currentKey = key;
  document.querySelectorAll(".liaison-select button").forEach(b => {
    b.classList.toggle("active", b.dataset.key === key);
  });
  userCine.clear();
  userStat.clear();
  checked = false;
  renderInfo();
  buildScene(key);
  buildSliders(key);
}

function renderInfo() {
  const L = LIAISONS[currentKey];
  document.getElementById("liaison-name").textContent = L.name;
  document.getElementById("liaison-dof").innerHTML = `<span class="dof-badge">${L.dof}</span>`;
  document.getElementById("liaison-geo").innerHTML = L.geo;

  const torseurs = document.getElementById("torseurs");
  torseurs.innerHTML = `
    <div class="torseur-box">
      <div class="torseur-title">Torseur cinématique $\\{ \\mathcal{V}_{1/0} \\}$</div>
      <div class="bmatrix">
        <div class="bm-left">{</div>
        <div class="bm-cells" id="cine-cells"></div>
        <div class="bm-right">}</div>
      </div>
      <div class="point-base">point ${L.point} &nbsp;|&nbsp; base ${L.base}</div>
    </div>
    <div class="torseur-box">
      <div class="torseur-title">Torseur des actions $\\{ \\mathcal{T}_{0 \\to 1} \\}$</div>
      <div class="bmatrix">
        <div class="bm-left">{</div>
        <div class="bm-cells" id="stat-cells"></div>
        <div class="bm-right">}</div>
      </div>
      <div class="point-base">point ${L.point} &nbsp;|&nbsp; base ${L.base}</div>
    </div>
  `;

  // cellules cliquables
  const cineCells = document.getElementById("cine-cells");
  const statCells = document.getElementById("stat-cells");
  COMP_CINE.forEach((name, i) => {
    const div = document.createElement("div");
    div.className = "comp";
    div.dataset.idx = i;
    div.innerHTML = `<span>${name}</span>`;
    div.onclick = () => toggleComp("cine", i, div);
    cineCells.appendChild(div);
  });
  COMP_STAT.forEach((name, i) => {
    const div = document.createElement("div");
    div.className = "comp";
    div.dataset.idx = i;
    div.innerHTML = `<span>${name}</span>`;
    div.onclick = () => toggleComp("stat", i, div);
    statCells.appendChild(div);
  });

  document.getElementById("feedback").className = "feedback";
}

function toggleComp(type, idx, el) {
  if (checked) return;
  const set = type === "cine" ? userCine : userStat;
  if (set.has(idx)) {
    set.delete(idx);
    el.classList.remove("selected");
  } else {
    set.add(idx);
    el.classList.add("selected");
  }
}

function checkAnswer() {
  checked = true;
  const L = LIAISONS[currentKey];
  let allOk = true;

  // Cinématique
  document.querySelectorAll("#cine-cells .comp").forEach(el => {
    const idx = +el.dataset.idx;
    const should = L.cineFree.includes(idx);
    const selected = userCine.has(idx);
    el.classList.remove("selected", "correct", "wrong");
    if (should && selected) el.classList.add("correct");
    else if (!should && !selected) el.classList.add("correct");
    else { el.classList.add("wrong"); allOk = false; }
  });

  // Statique
  document.querySelectorAll("#stat-cells .comp").forEach(el => {
    const idx = +el.dataset.idx;
    const should = L.statFree.includes(idx);
    const selected = userStat.has(idx);
    el.classList.remove("selected", "correct", "wrong");
    if (should && selected) el.classList.add("correct");
    else if (!should && !selected) el.classList.add("correct");
    else { el.classList.add("wrong"); allOk = false; }
  });

  const fb = document.getElementById("feedback");
  fb.className = "feedback show " + (allOk ? "ok" : "ko");
  fb.textContent = allOk
    ? "✅ Parfait ! Toutes les composantes sont correctes."
    : "❌ Certaines composantes sont incorrectes (en rouge).";
}

function resetSelection() {
  userCine.clear();
  userStat.clear();
  checked = false;
  document.querySelectorAll(".comp").forEach(el => {
    el.classList.remove("selected", "correct", "wrong");
  });
  document.getElementById("feedback").className = "feedback";
}

/* ========== Three.js ========== */
let scene, camera, renderer, controls, mobile;
const paramValues = {};

function initThree() {
  const container = document.getElementById("canvas-container");
  scene = new THREE.Scene();
  scene.background = new THREE.Color(
    document.documentElement.getAttribute("data-theme") === "dark" ? 0x0a0a12 : 0xe2e8f0
  );
  camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 100);
  camera.position.set(5, 3.5, 6);
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.setPixelRatio(devicePixelRatio);
  container.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));
  const dir = new THREE.DirectionalLight(0xffffff, 0.75);
  dir.position.set(5, 10, 7);
  scene.add(dir);
  scene.add(new THREE.AxesHelper(2.2));
  window.addEventListener("resize", () => {
    const w = container.clientWidth, h = container.clientHeight;
    camera.aspect = w / h; camera.updateProjectionMatrix();
    renderer.setSize(w, h);
  });
  (function loop() {
    requestAnimationFrame(loop);
    controls.update();
    renderer.render(scene, camera);
  })();
}

function clearScene() {
  while (scene.children.length > 3) { // keep lights + axes
    const o = scene.children[3];
    scene.remove(o);
  }
  mobile = null;
}

function buildScene(key) {
  clearScene();
  const matFix = new THREE.MeshStandardMaterial({ color: 0x94a3b8 });
  const matMob = new THREE.MeshStandardMaterial({ color: 0x3b82f6 });

  if (key === "encastrement") {
    const b1 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.7, 0.7), matFix);
    const b2 = new THREE.Mesh(new THREE.BoxGeometry(1.1, 0.7, 0.7), matMob);
    b1.position.x = -1; b2.position.x = 1;
    scene.add(b1, b2);
    mobile = b2;
  }
  else if (key === "pivot") {
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.12, 2.4, 16), matFix);
    mobile = new THREE.Group();
    const arm = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.22, 0.35), matMob);
    arm.position.x = 0.8;
    mobile.add(arm);
    scene.add(base, mobile);
  }
  else if (key === "glissiere") {
    const rail = new THREE.Mesh(new THREE.BoxGeometry(3.6, 0.12, 0.35), matFix);
    mobile = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.45, 0.5), matMob);
    scene.add(rail, mobile);
  }
  else if (key === "helicoidale") {
    const axe = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.8, 16), matFix);
    mobile = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.32, 0.45, 16), matMob);
    scene.add(axe, mobile);
  }
  else if (key === "pivotglissant") {
    const axe = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.8, 16), matFix);
    mobile = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.7, 16), matMob);
    scene.add(axe, mobile);
  }
  else if (key === "spherique") {
    const socket = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 16), matFix);
    mobile = new THREE.Group();
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 14), matMob);
    const stick = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 1.3, 12), matMob);
    stick.position.y = 0.65;
    mobile.add(ball, stick);
    scene.add(socket, mobile);
  }
  else if (key === "sphereplan") {
    const plane = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.07, 3.5), matFix);
    plane.position.y = -0.035;
    mobile = new THREE.Mesh(new THREE.SphereGeometry(0.45, 24, 16), matMob);
    mobile.position.y = 0.45;
    scene.add(plane, mobile);
  }
  else if (key === "spherecylindre") {
    const cyl = new THREE.Mesh(new THREE.CylinderGeometry(0.65, 0.65, 2.8, 24, 1, true), matFix);
    mobile = new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 14), matMob);
    scene.add(cyl, mobile);
  }
  else if (key === "cylindreplan") {
    const plane = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.07, 2.8), matFix);
    plane.position.y = -0.035;
    mobile = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 2.0, 24), matMob);
    mobile.rotation.z = Math.PI / 2;
    mobile.position.y = 0.35;
    scene.add(plane, mobile);
  }
  else if (key === "appuiplan") {
    const plane = new THREE.Mesh(new THREE.BoxGeometry(3.5, 0.07, 3.5), matFix);
    plane.position.y = -0.035;
    mobile = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.25, 1.1), matMob);
    mobile.position.y = 0.125;
    scene.add(plane, mobile);
  }

  // reset params
  LIAISONS[key].params.forEach(p => paramValues[p.id] = p.value);
  applyParams(key);
}

function buildSliders(key) {
  const cont = document.getElementById("sliders");
  cont.innerHTML = "";
  const params = LIAISONS[key].params;
  if (params.length === 0) {
    cont.innerHTML = "<p class='info'>Aucun degré de liberté (encastrement).</p>";
    return;
  }
  params.forEach(p => {
    const row = document.createElement("div");
    row.className = "slider-row";
    row.innerHTML = `
      <span>${p.label}</span>
      <input type="range" id="sl-${p.id}" min="${p.min}" max="${p.max}" step="${p.step}" value="${p.value}">
      <span id="val-${p.id}">${p.value.toFixed(2)}</span>
    `;
    cont.appendChild(row);
    document.getElementById(`sl-${p.id}`).oninput = (e) => {
      const v = parseFloat(e.target.value);
      paramValues[p.id] = v;
      document.getElementById(`val-${p.id}`).textContent = v.toFixed(2);
      applyParams(key);
    };
  });
}

function applyParams(key) {
  if (!mobile) return;
  const v = paramValues;

  if (key === "pivot") {
    mobile.rotation.y = v.rz || 0;
  }
  else if (key === "glissiere") {
    mobile.position.x = v.tz || 0;
  }
  else if (key === "helicoidale") {
    const t = v.hel || 0;
    mobile.rotation.y = t * 2;
    mobile.position.y = t * 0.35;
  }
  else if (key === "pivotglissant") {
    mobile.rotation.y = v.rz || 0;
    mobile.position.y = v.tz || 0;
  }
  else if (key === "spherique") {
    mobile.rotation.x = v.rx || 0;
    mobile.rotation.y = v.rz || 0;
    mobile.rotation.z = v.ry || 0;
  }
  else if (key === "sphereplan") {
    mobile.position.x = v.tx || 0;
    mobile.position.z = v.ty || 0;
    mobile.rotation.x = v.rx || 0;
    mobile.rotation.y = v.rz || 0;
    mobile.rotation.z = v.ry || 0;
  }
  else if (key === "spherecylindre") {
    mobile.position.y = v.tz || 0;
    mobile.rotation.x = v.rx || 0;
    mobile.rotation.y = v.rz || 0;
    mobile.rotation.z = v.ry || 0;
  }
  else if (key === "cylindreplan") {
    mobile.position.x = v.tx || 0;
    mobile.position.z = v.tz || 0;
    mobile.rotation.x = v.rz || 0;
    mobile.rotation.y = v.ry || 0;
  }
  else if (key === "appuiplan") {
    mobile.position.x = v.tx || 0;
    mobile.position.z = v.ty || 0;
    mobile.rotation.y = v.rz || 0;
  }
}

/* ========== Init ========== */
initThree();
initButtons();
selectLiaison("pivot");
</script>
</body>
