<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Atelier Trapèze</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Mise en page : barre d'outils en haut, onglets d'ateliers, zone de travail, panneau Activité à droite (feuille basse sur téléphone), vue Cours avec sommaire. Même gabarit que l'Atelier Récursivité. */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;--run:#2e8b3a;
  --node-stroke:#33475b;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;
  --ok-soft:rgba(30,122,46,.15);--warn-soft:rgba(154,91,0,.13);--bad-soft:rgba(192,40,31,.13);
  --g-s:#cfe3f6;--g-p:#f6e2bf;--g-c:#d3ecd7;--g-ps:#dcd6ee;--g-m:#e4e8ee;
  --overlay:rgba(10,16,22,.55);--shadow:rgba(0,0,0,.28);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg:#14181d;--bar:#1d232a;--panel:#191e24;--panel2:#212830;--field:#14181d;--line:#3b4551;
  --fg:#e8ecf0;--muted:#9ba6b2;--accent:#5b9bd5;--accent-fg:#0b1620;--accent-soft:#203449;--accent-ink:#b3d4f2;--run:#62c673;
  --node-stroke:#a7b8c9;
  --ok:#62c673;--warn:#e3a94f;--bad:#f2766d;
  --ok-soft:rgba(98,198,115,.18);--warn-soft:rgba(227,169,79,.17);--bad-soft:rgba(242,118,109,.17);
  --g-s:#27425c;--g-p:#5b4420;--g-c:#25492d;--g-ps:#3d3760;--g-m:#2d3640;
  --overlay:rgba(0,0,0,.65);--shadow:rgba(0,0,0,.6);color-scheme:dark}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
.fld b{color:var(--fg);font-family:var(--font-mono);font-weight:500}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
input[type=checkbox]{accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
sub,sup{line-height:0}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}
#dlg{position:fixed;inset:0;background:var(--overlay);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:var(--ok-soft)}.opt.bad{background:var(--bad-soft)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
/* cours */
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
/* ateliers */
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:1000px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
.zsh{border:1px solid var(--line);border-radius:10px;padding:9px 12px 3px;background:var(--panel2)}.zsh-t{margin-bottom:6px}.zsh .chips{margin-bottom:8px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:220px;max-width:100%}
.opts input[type=number]{width:96px;font-family:var(--font-mono)}
.zgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin:6px 0 10px}
.zgrid .fld{margin:0 0 6px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:var(--ok-soft);border-color:var(--ok)}.verdict.no{background:var(--bad-soft);border-color:var(--bad)}.verdict.warn{background:var(--warn-soft);border-color:var(--warn)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.two>div{min-width:0}
.viewlbl{font-size:12.5px;color:var(--muted);margin:8px 0 2px!important}
.gwrap{border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--bg)}
svg.g{display:block;width:100%;height:auto}
.formula.sm{font-size:13.5px;line-height:1.7}
.calc{margin:6px 0 10px}.calc .formula{margin:4px 0}
.chk{display:flex;flex-direction:column;gap:5px;margin:6px 0}
.chk div{display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);border-radius:7px;padding:5px 9px;font-size:13.5px}
.chk .mk{flex:none;font-weight:700;width:1.2em;text-align:center}
.chk .okk{background:var(--ok-soft);border-color:var(--ok)}.chk .okk .mk{color:var(--ok)}
.chk .nok{background:var(--bad-soft);border-color:var(--bad)}.chk .nok .mk{color:var(--bad)}
.tbl{overflow-x:auto;margin:8px 0}
table.ctable{border-collapse:collapse;font-size:13px}
.ctable th,.ctable td{border:1px solid var(--line);padding:4px 8px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.ctable td.n{font-family:var(--font-mono);text-align:right;white-space:nowrap}
details.adv{border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin:12px 0;background:var(--panel)}
details.adv summary{cursor:pointer;font-weight:600;color:var(--accent-ink)}
details.adv[open] summary{margin-bottom:8px}
.sw{display:inline-block;width:11px;height:11px;border-radius:3px;border:1.5px solid var(--node-stroke);vertical-align:-1px;margin-right:5px}
.leg{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0}
/* dessins d'engrenages */
.gear{stroke:var(--node-stroke);stroke-width:1.2;stroke-linejoin:round}
.gear.s{fill:var(--g-s)}.gear.p{fill:var(--g-p)}.gear.c{fill:var(--g-c)}.gear.m{fill:var(--g-m)}.gear.in{fill:var(--g-s)}.gear.out{fill:var(--g-c)}
.pitch{fill:none;stroke:var(--muted);stroke-dasharray:4 3;stroke-width:.8;opacity:.75}
.hub{fill:var(--bg);stroke:var(--node-stroke);stroke-width:1.2}
.mk{fill:var(--bad)}
.arm{fill:var(--g-ps);stroke:var(--node-stroke);stroke-width:1.2;opacity:.62}
.shaft{stroke:var(--node-stroke);stroke-width:1.6}
.gtxt{font:600 12px var(--font-mono);fill:var(--fg);text-anchor:middle}
.gtxt.sm{font-size:10.5px;font-weight:500;fill:var(--muted)}
.gtxt.l{text-anchor:start}
.dirtxt{font:600 15px var(--font-ui);fill:var(--accent-ink);text-anchor:middle}
.hatchln{stroke:var(--node-stroke);stroke-width:1.1}
.fixlbl{font:600 11px var(--font-ui);fill:var(--bad);text-anchor:middle}
.ground{stroke:var(--node-stroke);stroke-width:1}
.rect{stroke:var(--node-stroke);stroke-width:1.2}
.rect.in{fill:var(--g-s)}.rect.out{fill:var(--g-c)}.rect.s{fill:var(--g-s)}.rect.p{fill:var(--g-p)}.rect.c{fill:var(--g-c)}.rect.m{fill:var(--g-m)}
.bean{stroke:var(--node-stroke);stroke-width:1;fill:none;opacity:.7}
.plot-ax{stroke:var(--muted);stroke-width:1}
.plot-grid{stroke:var(--line);stroke-width:.7;stroke-dasharray:3 3}
.plot-lbl{font:11px var(--font-mono);fill:var(--muted)}
.plot-ttl{font:600 12px var(--font-ui);fill:var(--fg)}
.curve{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round}
.curve.fill{fill:var(--accent-soft);stroke:none}
.cursor{stroke:var(--bad);stroke-width:1.4}
.cdot{fill:var(--bad)}
.rail{position:relative;height:34px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin:8px 0}
.rail .car{position:absolute;top:4px;width:34px;height:24px;margin-left:-17px;border-radius:5px;background:var(--accent);border:1px solid var(--accent-ink)}
/* exercices */
.exs{border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel);margin:8px 0}
.exs p{margin:4px 0}
.fieldrow{display:flex;gap:10px 16px;flex-wrap:wrap;margin:10px 0}
.fieldrow .fld{margin:0;min-width:150px;flex:1 1 150px}
.fieldrow input{font-family:var(--font-mono)}
.fieldrow input.okk{border-color:var(--ok);background:var(--ok-soft)}
.fieldrow input.nok{border-color:var(--bad);background:var(--bad-soft)}
.solbox{border-left:3px solid var(--accent);padding:2px 12px;margin:10px 0;background:var(--panel2);border-radius:0 8px 8px 0}
.scoreline{font:500 12.5px var(--font-mono);color:var(--muted);margin:2px 0}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px var(--shadow);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
}
/* illustrations du cours */
.fig{margin:14px 0;max-width:100%}
.fig .gwrap{background:var(--bg)}
.fig figcaption{font-size:13px;line-height:1.5;color:var(--muted);margin:6px 2px 0}
.figrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin:12px 0;align-items:start}
.figrow .fig{margin:0;min-width:0}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
/* atelier trapèze : couleurs propres au palan (roues 2/3/4, charge) et au dimensionnement */
:root{
  --surface:var(--panel);--surface2:var(--panel2);--ko:var(--bad);--ko-soft:var(--bad-soft);
  --f-body:var(--font-ui);--f-mono:var(--font-mono);--f-math:'STIX Two Text','Times New Roman',Times,serif;
  --c2:#E4161B;--c3:#2F5BD6;--c4:#0A9A48;--c5:#6B7480;
  --sv:#2F5BD6;--sa:#0A9A48;--sc:#E4161B;--sp:#D18A00;
  --st:#0A3178;--st-soft:#E1E8F6;--on-st:#FFFFFF;
  --dy:#F6A700;--dy-soft:#FDF0CF;--on-dy:#2A1B00;
  --env-max:#E3EAF8;--env-n:#D5ECDD;
}
:root[data-theme="dark"]{
  --c2:#FF6F61;--c3:#6F9BFF;--c4:#55C46C;--c5:#9DA8B5;
  --sv:#6EA6FF;--sa:#45C8CA;--sc:#FF7A6A;--sp:#E3AE4A;
  --st:#6EA6FF;--st-soft:#1B2B44;--on-st:#0A1326;
  --dy:#E3AE4A;--dy-soft:#3A2E14;--on-dy:#241800;
  --env-max:#1A2A3D;--env-n:#1B3A2B;
}
#ws{max-width:1240px}
var{font-family:var(--f-math);font-style:italic}
.panel{border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;min-width:0}
.panel h3{margin:0 0 8px!important}
.side{display:flex;flex-direction:column;gap:12px;min-width:0}
.note{font-size:13.5px;padding:8px 10px;border-radius:6px;background:var(--panel2);min-height:2.6em;margin:8px 0}
.note.warn{background:var(--warn-soft)}
.transport{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin-top:10px}
.transport input[type=range]{flex:1 1 100%;min-width:0;accent-color:var(--accent)}
.transport select{width:auto}
.readout{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px 12px;margin:12px 0 0}
.readout div{min-width:0}
.readout dt{font-size:12px;color:var(--muted)}
.readout dd{margin:0;font-family:var(--font-mono);font-size:14px;white-space:nowrap}
.ctl-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:10px 24px}
.grp{display:flex;flex-direction:column;gap:6px;min-width:0}
.grp-t{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.sub{font-size:13px;font-weight:600}
.srow{display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:baseline}
.srow label{font-size:13.5px}
.srow output{font-family:var(--font-mono);font-size:13.5px}
.srow input[type=range]{grid-column:1/-1;width:100%;margin:2px 0 0}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 14px;margin-top:10px}
.adv-grid label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted)}
.adv-grid input{font-family:var(--font-mono)}
.tag{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;padding:2px 8px;border-radius:4px;line-height:1.5}

.gauge i.ok{background:var(--ok)}.gauge i.warn{background:var(--warn)}.gauge i.ko{background:var(--bad)}
.limits{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:2px}
.limits b{color:var(--fg);font-family:var(--font-mono);font-weight:500}
.keyline{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:13px;color:var(--muted);margin:6px 0}

function gearD(Z,r,dep){
  const st=2*Math.PI/Z;let d='';
  for(let i=0;i<Z;i++){
    const a=i*st;
    [[r-dep/2,a],[r+dep/2,a+.16*st],[r+dep/2,a+.44*st],[r-dep/2,a+.6*st]].forEach(q=>{
      d+=(d?'L':'M')+(q[0]*Math.cos(q[1])).toFixed(2)+' '+(q[0]*Math.sin(q[1])).toFixed(2);
    });
  }
  return d+'Z';
}

function genDim(flt) {
  const kind = pick(flt === 'stat' ? ['stat'] : flt === 'dyn' ? ['dyn', 'vlim', 'je'] : ['kin', 'stat', 'je', 'dyn', 'vlim']);
  const Z = pick(ZSETS), k = (Z[0] / Z[1]) * (Z[2] / Z[3]), m = pick([50, 80, 100, 125, 150, 200]), Rmm = pick([25, 30, 40, 50]), R = Rmm / 1000, eta = pick([0.8, 0.85, 0.9]);
  const zt = 'Z<sub>2</sub> = ' + Z[0] + ', Z<sub>3a</sub> = ' + Z[1] + ', Z<sub>3b</sub> = ' + Z[2] + ', Z<sub>4</sub> = ' + Z[3];
  const kF = '<p>k = (Z<sub>2</sub>/Z<sub>3a</sub>)·(Z<sub>3b</sub>/Z<sub>4</sub>) = (' + Z[0] + '/' + Z[1] + ') × (' + Z[2] + '/' + Z[3] + ') = <b>1/' + fx(1 / k, 2) + '</b></p>';
  if (kind === 'kin') {
    const V = pick([0.1, 0.2, 0.25, 0.5]), wm = V / (R * k);
    return { tag: 'Chaîne cinématique', text: 'Le palan a un réducteur à deux étages (' + zt + ') et un tambour de rayon <b>R = ' + Rmm + ' mm</b>. Déterminer l’inverse du rapport de réduction 1/k (avec k = ω<sub>4</sub>/ω<sub>m</sub>), puis la vitesse de rotation ω<sub>m</sub> du moteur (en rad/s) quand la charge monte à <b>V = ' + fx(V, 2) + ' m/s</b>.',
      fields: [F('ik', '1/k', 1 / k, 0.01), F('wm', 'ω_m (rad/s)', wm, 0.01)],
      sol: kF + '<p>V = R·k·ω<sub>m</sub>, donc ω<sub>m</sub> = V/(R·k) = ' + fx(V, 2) + '/(' + fx(R, 3) + ' × ' + fx(k, 4) + ') = <b>' + fx(wm, 2) + ' rad/s</b>, soit ' + fx(wm * 60 / TAU, 0) + ' tr/min.</p>' };
  }
  if (kind === 'stat') {
    const Ch = m * G_ * R * k;
    return { tag: 'Dimensionnement statique', text: 'Une charge de <b>m = ' + m + ' kg</b> est levée par un tambour de rayon <b>R = ' + Rmm + ' mm</b>, avec un rapport de réduction <b>k = 1/' + fx(1 / k, 2) + '</b> et un rendement <b>η = ' + fx(eta, 2) + '</b> (g = 9,81 m/s²). Déterminer le couple moteur de maintien à l’arrêt, le couple à vitesse constante en montée et celui à vitesse constante en descente (en N·m).',
      fields: [F('Ch', 'C_maintien (N·m)', Ch, 0.001), F('Cm', 'C_montée (N·m)', Ch / eta, 0.001), F('Cd', 'C_descente (N·m)', Ch * eta, 0.001)],
      sol: '<p>C<sub>maintien</sub> = m·g·R·k = ' + m + ' × 9,81 × ' + fx(R, 3) + ' × ' + fx(k, 4) + ' = <b>' + fx(Ch, 3) + ' N·m</b>.</p><p>Montée : C<sub>maintien</sub>/η = <b>' + fx(Ch / eta, 3) + ' N·m</b>. Descente : C<sub>maintien</sub>·η = <b>' + fx(Ch * eta, 3) + ' N·m</b>.</p><p>Le moteur doit tenir le plus grand : C<sub>n</sub> ≥ ' + fx(Ch / eta, 3) + ' N·m.</p>' };
  }
  if (kind === 'je') {
    const Jm = pick([1, 1.5, 2, 3]), J3 = pick([4, 5, 8]), J4 = pick([40, 50, 80]), s3 = J3 * Math.pow(Z[0] / Z[1], 2), s4 = J4 * k * k, sl = m * R * R * k * k * 1e4, Je = Jm + s3 + s4 + sl;
    return { tag: 'Inertie équivalente', text: 'Palan à réducteur (' + zt + ', <b>R = ' + Rmm + ' mm</b>, <b>m = ' + m + ' kg</b>). Inerties : rotor <b>J<sub>m</sub> = ' + fx(Jm, 1) + ' kg·cm²</b> ; roue double 3 <b>J<sub>3</sub> = ' + J3 + ' kg·cm²</b> ; roue 4 avec tambour <b>J<sub>4</sub> = ' + J4 + ' kg·cm²</b>. Déterminer l’inertie équivalente J<sub>e</sub> ramenée à l’arbre moteur (en kg·cm²).',
      fields: [F('Je', 'J_e (kg·cm²)', Je, 0.005)],
      sol: kF + '<p>J<sub>e</sub> = J<sub>m</sub> + J<sub>3</sub>(Z<sub>2</sub>/Z<sub>3a</sub>)² + J<sub>4</sub>k² + m·R²·k²</p><p>= ' + fx(Jm, 2) + ' + ' + fx(s3, 3) + ' + ' + fx(s4, 3) + ' + ' + fx(sl, 3) + ' = <b>' + fx(Je, 3) + ' kg·cm²</b>.</p><p>Le rotor domine : la charge, ramenée par k², pèse très peu.</p>' };
  }
  if (kind === 'dyn') {
    const a = pick([0.5, 1, 1.5, 2]), Je = pick([1.2, 1.8, 2.5, 3.5]), Cr = pick([0.5, 0.8, 1, 1.2]), al = a / (R * k), dJ = Je * 1e-4 * al;
    return { tag: 'Dimensionnement dynamique', text: 'En montée, le couple résistant ramené au moteur vaut <b>C<sub>r</sub> = ' + fx(Cr, 2) + ' N·m</b> et l’inertie équivalente <b>J<sub>e</sub> = ' + fx(Je, 1) + ' kg·cm²</b>. Le tambour a un rayon <b>R = ' + Rmm + ' mm</b>, le rapport est <b>k = 1/' + fx(1 / k, 2) + '</b> et le trapèze demande <b>a = ' + fx(a, 2) + ' m/s²</b>. Déterminer l’accélération angulaire α<sub>m</sub> du moteur (en rad/s²), puis le couple moteur pendant l’accélération et pendant la décélération (en N·m).',
      fields: [F('al', 'α_m (rad/s²)', al, 0.5), F('Ca', 'C_accélération (N·m)', Cr + dJ, 0.001), F('Cd', 'C_décélération (N·m)', Cr - dJ, 0.001)],
      sol: '<p>α<sub>m</sub> = a/(R·k) = ' + fx(a, 2) + '/(' + fx(R, 3) + ' × ' + fx(k, 4) + ') = <b>' + fx(al, 1) + ' rad/s²</b>.</p><p>J<sub>e</sub>·α<sub>m</sub> = ' + fx(Je * 1e-4, 6) + ' × ' + fx(al, 1) + ' = ' + fx(dJ, 3) + ' N·m.</p><p>Accélération : C<sub>r</sub> + J<sub>e</sub>α<sub>m</sub> = <b>' + fx(Cr + dJ, 3) + ' N·m</b>. Décélération : C<sub>r</sub> − J<sub>e</sub>α<sub>m</sub> = <b>' + fx(Cr - dJ, 3) + ' N·m</b>.</p><p>Le pic est le plus grand en valeur absolue : C<sub>max</sub> ≥ ' + fx(Math.max(Math.abs(Cr + dJ), Math.abs(Cr - dJ)), 3) + ' N·m.</p>' };
  }
  const Nmax = pick([1500, 2400, 3000]), wmax = Nmax * TAU / 60, Vl = wmax * R * k;
  return { tag: 'Vitesse maximale atteignable', text: 'Le moteur a une vitesse maximale <b>N<sub>max</sub> = ' + Nmax + ' tr/min</b>. Le palan a un rapport <b>k = 1/' + fx(1 / k, 2) + '</b> et un tambour de rayon <b>R = ' + Rmm + ' mm</b>. Déterminer la vitesse maximale V<sub>lim</sub> de la charge (en m/s) puis en m/min.',
    fields: [F('Vl', 'V_lim (m/s)', Vl, 0.0005), F('Vm', 'V_lim (m/min)', Vl * 60, 0.01)],
    sol: '<p>ω<sub>max</sub> = 2π·N<sub>max</sub>/60 = ' + fx(wmax, 1) + ' rad/s.</p><p>V<sub>lim</sub> = ω<sub>max</sub>·R·k = ' + fx(wmax, 1) + ' × ' + fx(R, 3) + ' × ' + fx(k, 4) + ' = <b>' + fx(Vl, 3) + ' m/s</b> = <b>' + fx(Vl * 60, 2) + ' m/min</b>.</p>' };
}

const COURSE = [];
const ph = n => '<div class="fig" data-fig="' + n + '"></div>';
COURSE.push({ id: 'trapeze', t: 'Loi de vitesse en trapèze', h: `
<p>Pour déplacer la charge d'une course <var>h</var>, on envoie au variateur une consigne en trois temps : une rampe jusqu'à <var>V</var><sub>max</sub> à accélération constante <var>a</var>, un palier à <var>V</var><sub>max</sub>, puis une rampe symétrique jusqu'à l'arrêt. La vitesse dessine un trapèze, l'accélération un créneau.</p>` + ph('trapAV') + `
<div class="eq">
  <div><var>t</var><sub>a</sub> = <var>V</var><sub>max</sub> / <var>a</var> <span class="why">durée de chaque rampe</span></div>
  <div><var>d</var><sub>a</sub> = <var>V</var><sub>max</sub>² / (2<var>a</var>) <span class="why">distance parcourue pendant une rampe</span></div>
  <div><var>t</var><sub>c</sub> = ( <var>h</var> − <var>V</var><sub>max</sub>² / <var>a</var> ) / <var>V</var><sub>max</sub> <span class="why">durée du palier</span></div>
  <div><var>T</var> = 2<var>t</var><sub>a</sub> + <var>t</var><sub>c</sub> = <var>h</var> / <var>V</var><sub>max</sub> + <var>V</var><sub>max</sub> / <var>a</var></div>
</div>
<h3>Déplacement : l'aire sous la courbe de vitesse</h3>
<p>Le déplacement est l'intégrale de la vitesse, donc l'aire sous le trapèze. On note <var>t</var><sub>1</sub> la durée de montée en vitesse (égale à la descente quand les normes d'accélération et de décélération sont égales) et <var>t</var><sub>2</sub> la durée à vitesse constante : <var>t</var><sub>1</sub> = <var>t</var><sub>a</sub> et <var>t</var><sub>2</sub> = <var>t</var><sub>c</sub>. Les deux rampes sont deux triangles de même aire, qui se complètent en un rectangle de hauteur <var>V</var><sub>max</sub> et de largeur <var>t</var><sub>1</sub>.</p>` + ph('areas') + `
<div class="eq">
  <div>Δ<var>x</var> = ½ <var>V</var><sub>max</sub> <var>t</var><sub>1</sub> + <var>V</var><sub>max</sub> <var>t</var><sub>2</sub> + ½ <var>V</var><sub>max</sub> <var>t</var><sub>1</sub> = <var>V</var><sub>max</sub> ( <var>t</var><sub>1</sub> + <var>t</var><sub>2</sub> )</div>
  <div><var>t</var><sub>2</sub> = Δ<var>x</var> / <var>V</var><sub>max</sub> − <var>t</var><sub>1</sub></div>
  <div><var>T</var> = 2 <var>t</var><sub>1</sub> + <var>t</var><sub>2</sub> = Δ<var>x</var> / <var>V</var><sub>max</sub> + <var>t</var><sub>1</sub></div>
</div>
<p>Ce raccourci suppose des normes d'accélération et de décélération égales. Sinon, avec <var>t</var><sub>1</sub> pour la montée et <var>t</var><sub>3</sub> pour la descente : Δ<var>x</var> = <var>V</var><sub>max</sub> ( <var>t</var><sub>1</sub> / 2 + <var>t</var><sub>2</sub> + <var>t</var><sub>3</sub> / 2 ).</p>
<div class="live"><div class="hd">Avec les valeurs du simulateur</div><var>V</var><sub>max</sub> ( <var>t</var><sub>1</sub> + <var>t</var><sub>2</sub> ) = <b data-v="vp"></b> × ( <b data-v="ta"></b> + <b data-v="tc"></b> ) = <b data-v="dx"></b> m, soit la course demandée Δ<var>x</var> = <b data-v="hSet"></b> m.</div>
<h3>Quand la vitesse maximale n'est pas atteinte</h3>
<p>Si <var>h</var> &lt; <var>V</var><sub>max</sub>² / <var>a</var>, la vitesse maximale n'est jamais atteinte : le profil devient un triangle, de sommet <var>V</var><sub>p</sub> = √(<var>h a</var>) et de durée <var>T</var> = 2√(<var>h</var> / <var>a</var>).</p>` + ph('tri') + `
<div class="live"><div class="hd">Avec les valeurs du simulateur</div>Profil <b data-v="shape"></b> : <var>V</var><sub>p</sub> = <b data-v="vp"></b> m/s, <var>t</var><sub>a</sub> = <b data-v="ta"></b> s, <var>t</var><sub>c</sub> = <b data-v="tc"></b> s, durée totale <var>T</var> = <b data-v="T"></b> s.</div>
<h3>Accélération pour un temps imposé</h3>
<p>Quelle accélération pour parcourir <var>h</var> en un temps <var>T</var> imposé, avec <var>V</var><sub>max</sub> donnée ? On inverse l'expression de <var>T</var> :</p>
<div class="eq"><div><var>a</var> = <var>V</var><sub>max</sub>² / ( <var>V</var><sub>max</sub> <var>T</var> − <var>h</var> ) <span class="why">avec <var>V</var><sub>max</sub> <var>T</var> &gt; <var>h</var></span></div></div>
<p class="small">Les quatre changements d'accélération sont des échelons : le à-coup (dérivée de l'accélération) est infini. La mécanique et la charge, qui se balance au bout du câble, le ressentent. Une loi en S lisse ces transitions, au prix d'un trajet un peu plus long.</p>
<div class="retain"><b>À retenir.</b> Rampe, palier, rampe. La distance est l'aire du trapèze. Si la course est trop courte, le palier disparaît et le profil devient un triangle.</div>` });

COURSE.push({ id: 'arbre', t: 'Ramener la charge sur l’arbre moteur', h: `
<p>Le variateur pilote la vitesse du moteur, pas celle de la charge. Il faut donc écrire le trapèze côté moteur. Le rapport de réduction vient des quatre roues, et le câble relie la vitesse de la charge à celle du tambour.</p>` + ph('chain') + `
<div class="eq">
  <div><var>k</var> = <var>ω</var><sub>4</sub> / <var>ω</var><sub>m</sub> = ( <var>Z</var><sub>2</sub> / <var>Z</var><sub>3a</sub> ) · ( <var>Z</var><sub>3b</sub> / <var>Z</var><sub>4</sub> )</div>
  <div><var>V</var> = <var>R</var> <var>ω</var><sub>4</sub> = <var>R</var> <var>k</var> <var>ω</var><sub>m</sub></div>
  <div><var>ω</var><sub>m</sub> = <var>V</var> / (<var>R k</var>) <span class="why">et</span> <var>α</var><sub>m</sub> = <var>a</var> / (<var>R k</var>)</div>
</div>
<div class="live"><div class="hd">Avec les valeurs du simulateur</div><var>k</var> = <b data-v="k"></b>. Au palier, <var>ω</var><sub>m</sub> = <b data-v="wp"></b> rad/s, soit <b data-v="Np"></b> tr/min. Pendant les rampes, <var>α</var><sub>m</sub> = <b data-v="alpha"></b> rad/s².</div>
<h3>Inertie équivalente</h3>
<p>Les pièces tournantes ne tournent pas à la même vitesse, donc elles ne pèsent pas pareil vu du moteur. On les ramène par l'égalité des énergies cinétiques : ½ <var>J</var><sub>e</sub> <var>ω</var><sub>m</sub>² = Σ énergies.</p>
<div class="eq"><div><var>J</var><sub>e</sub> = <var>J</var><sub>m</sub> + <var>J</var><sub>3</sub> ( <var>Z</var><sub>2</sub> / <var>Z</var><sub>3a</sub> )² + <var>J</var><sub>4</sub> <var>k</var>² + <var>m</var> <var>R</var>² <var>k</var>²</div></div>` + ph('inertia') + `
<p>Terme dominant avec ces valeurs : <b class="v" data-v="dominant"></b>. Le réducteur divise l'inertie de la charge par le carré du rapport, donc elle pèse peu devant le rotor.</p>
<div class="retain"><b>À retenir.</b> On passe du côté charge au côté moteur par <var>R k</var> pour les vitesses et par <var>k</var>² pour les inerties.</div>` });

COURSE.push({ id: 'deux', t: 'Deux dimensionnements à ne pas mélanger', h: `
<p>Un même moteur doit satisfaire deux familles de conditions. Elles ne portent pas sur les mêmes situations ni sur les mêmes grandeurs du catalogue : on les traite séparément, puis on garde le moteur qui respecte les deux.</p>
<div class="duo">
  <div class="st"><h3><span class="tag tag-st">Statique</span> le couple</h3><dl>
    <dt>Situation</dt><dd>Charge maintenue à l'arrêt, ou déplacée à vitesse constante : <var>a</var> = 0.</dd>
    <dt>Équation</dt><dd>Somme des couples nulle sur l'arbre moteur.</dd>
    <dt>Ce qui compte</dt><dd>Le poids, le rapport de réduction, le rendement.</dd>
    <dt>Ce qui ne compte pas</dt><dd>L'inertie et la loi de vitesse.</dd>
    <dt>À vérifier</dt><dd>Le couple permanent <var>C</var><sub>n</sub>, qui fixe l'échauffement.</dd>
    <dt>Résultat</dt><dd>Le couple nominal minimal et le couple du frein de maintien.</dd></dl></div>
  <div class="dy"><h3><span class="tag tag-dy">Dynamique</span> la vitesse et l'accélération</h3><dl>
    <dt>Situation</dt><dd>Accélération imposée par le trapèze : <var>a</var> ≠ 0.</dd>
    <dt>Équation</dt><dd><var>J</var><sub>e</sub> <var>α</var><sub>m</sub> = <var>C</var><sub>m</sub> − <var>C</var><sub>r</sub>.</dd>
    <dt>Ce qui compte</dt><dd>L'inertie équivalente, la loi de vitesse, puis le couple statique qui s'ajoute.</dd>
    <dt>À vérifier</dt><dd>La vitesse <var>N</var><sub>max</sub>, le couple <var>C</var><sub>max</sub> pour l'accélération, le couple efficace.</dd>
    <dt>Résultat</dt><dd>La vitesse et l'accélération maximales atteignables, la puissance du variateur.</dd></dl></div>
</div>
<p class="small">Pendant une rampe, le moteur fournit les deux à la fois : le couple statique pour porter la charge, et le couple dynamique pour la mettre en vitesse. Le dimensionnement statique ne suffit donc jamais quand on impose une accélération.</p>
<div class="retain"><b>À retenir.</b> Statique : <var>C</var><sub>n</sub> et frein. Dynamique : <var>N</var><sub>max</sub>, <var>C</var><sub>max</sub> et couple efficace. Le moteur doit passer les deux.</div>` });

COURSE.push({ id: 'statique', t: 'Dimensionnement statique', h: `
<div class="kicker"><span class="tag tag-st">Statique</span><span>accélération nulle, on dimensionne en couple</span></div>
<p>Sans accélération, le théorème du moment dynamique se réduit à l'équilibre des couples. Le poids de la charge crée un couple sur le tambour, ramené ensuite sur l'arbre moteur.</p>
<div class="eq">
  <div><var>C</var><sub>t</sub> = <var>m g R</var> <span class="why">couple de la charge sur le tambour</span></div>
  <div><var>C</var><sub>maintien</sub> = <var>m g R k</var> <span class="why">à l'arrêt</span></div>
  <div><var>C</var><sub>montée</sub> = <var>m g R k</var> / <var>η</var> <span class="why">vitesse constante, les pertes s'opposent au moteur</span></div>
  <div><var>C</var><sub>descente</sub> = <var>m g R k</var> · <var>η</var> <span class="why">vitesse constante, les pertes aident le moteur à freiner</span></div>
</div>
<div class="tbl"><table class="ctable"><thead><tr><th>Situation</th><th>Couple moteur</th><th>Rapport à <var>C</var><sub>n</sub></th></tr></thead><tbody>
  <tr><td>Couple de la charge sur le tambour</td><td class="num" data-v="Ct"></td><td class="num">–</td></tr>
  <tr><td>Maintien à l'arrêt</td><td class="num" data-v="Chold"></td><td class="num" data-v="rHold"></td></tr>
  <tr><td>Montée à vitesse constante</td><td class="num" data-v="ClUp"></td><td class="num" data-v="rUp"></td></tr>
  <tr><td>Descente à vitesse constante</td><td class="num" data-v="ClDown"></td><td class="num" data-v="rDown"></td></tr>
</tbody></table></div>
<p>La condition de dimensionnement est <var>C</var><sub>statique</sub> ≤ <var>C</var><sub>n</sub>, le couple que le moteur fournit en permanence sans surchauffer. On retient le plus grand des couples statiques que le moteur doit tenir.</p>
<div class="live"><div class="hd">Avec les valeurs du simulateur</div>Couple statique à tenir : <b data-v="CsMax"></b> N·m, donc <var>C</var><sub>n</sub> ≥ <b data-v="CsMax"></b> N·m. Le moteur choisi a <var>C</var><sub>n</sub> = <b data-v="CnSet"></b> N·m : <span data-v="CnMsg"></span></div>
<p>En régime établi de montée, la puissance utile est <var>m g V</var> = <b class="v" data-v="Putile"></b> W, et le moteur fournit cette puissance divisée par <var>η</var>.</p>
<p>À l'arrêt, la charge entraînerait le moteur en sens inverse, car un train d'engrenages cylindriques est réversible. Un moteur bloqué sous tension chauffe : on tient la charge avec un frein à manque de courant. Le calcul de <var>C</var><sub>maintien</sub> sert alors à dimensionner ce frein, avec un coefficient de sécurité.</p>
<p class="small">Si l'énoncé néglige les frottements, poser <var>η</var> = 1 : montée et descente donnent alors le même couple statique.</p>
<div class="retain"><b>À retenir.</b> Le moteur tient <var>m g R k</var>, divisé par <var>η</var> en montée, multiplié par <var>η</var> en descente. On compare à <var>C</var><sub>n</sub> et on ajoute un frein pour le maintien.</div>` });

COURSE.push({ id: 'dynamique', t: 'Dimensionnement dynamique', h: `
<div class="kicker"><span class="tag tag-dy">Dynamique</span><span>accélération imposée, on dimensionne en vitesse et en couple de pointe</span></div>
<h3>Vitesse maximale atteignable</h3>
<p>La vitesse du palier se traduit en vitesse de rotation du moteur par le rapport de réduction. Elle ne doit pas dépasser la vitesse maximale du moteur <var>N</var><sub>max</sub>, d'où la vitesse maximale de la charge :</p>
<div class="eq"><div><var>V</var><sub>lim</sub> = <var>ω</var><sub>max</sub> <var>R k</var> <span class="why">avec <var>ω</var><sub>max</sub> = 2π <var>N</var><sub>max</sub> / 60</span></div></div>
<div class="live"><div class="hd">Avec les valeurs du simulateur</div><var>V</var><sub>lim</sub> = <b data-v="Vlim"></b> m/s (<b data-v="VlimMin"></b> m/min). Vitesse demandée : <b data-v="VmaxSet"></b> m/s. <span data-v="VlimMsg"></span></div>
<p class="small">Sur un moteur réel, le couple disponible baisse quand la vitesse monte. Le simulateur utilise une zone rectangulaire <var>C</var><sub>max</sub> × <var>N</var><sub>max</sub>, ce qui suffit pour un exercice.</p>
<h3>Couple pour l'accélération maximale du trapèze</h3>
<p>Imposer une accélération coûte un couple supplémentaire pour mettre en vitesse l'inertie équivalente. Le théorème du moment dynamique sur l'arbre moteur donne :</p>
<div class="eq"><div><var>J</var><sub>e</sub> · d<var>ω</var><sub>m</sub>/d<var>t</var> = <var>C</var><sub>m</sub> − <var>C</var><sub>r</sub> <span class="why">donc</span> <var>C</var><sub>m</sub> = <var>C</var><sub>r</sub> + <var>J</var><sub>e</sub> <var>α</var><sub>m</sub></div></div>
<p>Ici <var>C</var><sub>r</sub> est le couple résistant du cas statique : <var>m g R k</var> / <var>η</var> en montée, <var>m g R k</var> · <var>η</var> en descente. Le trapèze de vitesse donne un couple constant par phase.</p>` + ph('cPhases') + `
<div class="tbl"><table class="ctable"><thead><tr><th>Phase</th><th>Durée</th><th>Couple moteur (montée)</th><th>Valeur pour le sens choisi</th></tr></thead><tbody>
  <tr><td>Accélération</td><td class="num" data-v="ta2"></td><td><var>C</var><sub>r</sub> + <var>J</var><sub>e</sub> <var>a</var> / (<var>R k</var>)</td><td class="num" data-v="Ca"></td></tr>
  <tr><td>Palier</td><td class="num" data-v="tc2"></td><td><var>C</var><sub>r</sub></td><td class="num" data-v="Cc"></td></tr>
  <tr><td>Décélération</td><td class="num" data-v="ta3"></td><td><var>C</var><sub>r</sub> − <var>J</var><sub>e</sub> <var>a</var> / (<var>R k</var>)</td><td class="num" data-v="Cd"></td></tr>
</tbody></table></div>
<p>En descente, le signe de <var>α</var><sub>m</sub> s'inverse : la charge accélère toute seule et le moteur retient. Le pic de couple se produit alors au début de la décélération. Si <var>J</var><sub>e</sub> <var>α</var><sub>m</sub> dépasse <var>C</var><sub>r</sub>, le couple change de signe pendant une phase : le moteur doit pousser au lieu de retenir.</p>
<p>Le couple de pic doit rester sous <var>C</var><sub>max</sub>. On en tire l'accélération maximale que ce moteur peut imposer, en montée par exemple :</p>
<div class="eq">
  <div><var>a</var><sub>max, acc</sub> = ( <var>C</var><sub>max</sub> − <var>C</var><sub>r</sub> ) <var>R k</var> / <var>J</var><sub>e</sub> <span class="why">phase d'accélération</span></div>
  <div><var>a</var><sub>max, déc</sub> = ( <var>C</var><sub>max</sub> + <var>C</var><sub>r</sub> ) <var>R k</var> / <var>J</var><sub>e</sub> <span class="why">phase de décélération</span></div>
</div>
<p>En descente, les deux expressions sont échangées. L'accélération du trapèze doit être inférieure à la plus petite des deux.</p>
<div class="live"><div class="hd">Avec les valeurs du simulateur</div>Couple de pic demandé : <var>C</var><sub>pic</sub> = <b data-v="Cpk"></b> N·m pour <var>C</var><sub>max</sub> = <b data-v="CmaxSet"></b> N·m. Accélérations maximales : <b data-v="a1lim"></b> m/s² (mise en vitesse) et <b data-v="a2lim"></b> m/s² (décélération), pour <var>a</var> = <b data-v="aSet"></b> m/s² demandé. <span data-v="alimMsg"></span></div>
<h3>Échauffement et puissance</h3>
<p>Le pic de couple n'est supporté que brièvement. L'échauffement dépend de la moyenne quadratique du couple sur le cycle, qui doit rester sous <var>C</var><sub>n</sub> :</p>
<div class="eq"><div><var>C</var><sub>eff</sub> = √( Σ <var>C</var><sub>i</sub>² <var>t</var><sub>i</sub> / <var>T</var> ) ≤ <var>C</var><sub>n</sub></div></div>
<p>Ici <var>C</var><sub>eff</sub> = <b class="v" data-v="Crms"></b> N·m. La puissance instantanée est <var>P</var> = <var>C</var><sub>m</sub> <var>ω</var><sub>m</sub>, maximale en fin d'accélération, à <b class="v" data-v="Pmax"></b> W ici. Le variateur doit fournir cette pointe.</p>
<div class="live"><div class="hd">Moteur minimal pour la consigne demandée</div><var>C</var><sub>n</sub> ≥ <b data-v="CnNeed"></b> N·m (statique et couple efficace), <var>C</var><sub>max</sub> ≥ <b data-v="Cpk"></b> N·m (pic), <var>N</var><sub>max</sub> ≥ <b data-v="Np"></b> tr/min (palier).</div>` + ph('planCW') + `
<h3>Ce que fait vraiment le moteur</h3>
<p>Quand la consigne demande plus que le moteur ne peut donner, le variateur limite le courant, donc le couple. Les rampes s'adoucissent et la vitesse plafonne. Le profil réalisable se calcule avec les mêmes formules, en remplaçant <var>a</var> et <var>V</var><sub>max</sub> par les valeurs que le moteur permet :</p>
<div class="eq">
  <div><var>a</var><sub>1</sub> = min( <var>a</var> , <var>a</var><sub>max, acc</sub> ) <span class="why">accélération réelle</span></div>
  <div><var>a</var><sub>2</sub> = min( <var>a</var> , <var>a</var><sub>max, déc</sub> ) <span class="why">décélération réelle</span></div>
  <div><var>V</var><sub>réel</sub> = min( <var>V</var><sub>max</sub> , <var>V</var><sub>lim</sub> )</div>
</div>
<p>Si <var>C</var><sub>max</sub> est inférieur à <var>C</var><sub>r</sub>, le moteur ne lève pas la charge en montée, et ne la retient pas en descente.</p>
<div class="live"><div class="hd">Avec les valeurs du simulateur</div><span data-v="realMsg"></span></div>
<div class="retain"><b>À retenir.</b> On ajoute <var>J</var><sub>e</sub> <var>α</var><sub>m</sub> pendant les rampes. On vérifie <var>C</var><sub>pic</sub> ≤ <var>C</var><sub>max</sub> et <var>N</var><sub>p</sub> ≤ <var>N</var><sub>max</sub>, puis <var>C</var><sub>eff</sub> ≤ <var>C</var><sub>n</sub>.</div>` });

COURSE.push({ id: 'methode', t: 'Méthode : choisir un moteur', h: `
<ol>
<li><b>Loi de vitesse.</b> Calculer <var>t</var><sub>a</sub>, <var>t</var><sub>c</sub> et <var>T</var> (ou le triangle si la course est courte).</li>
<li><b>Chaîne cinématique.</b> Calculer <var>k</var>, puis <var>ω</var><sub>m</sub> = <var>V</var>/(<var>R k</var>) et <var>α</var><sub>m</sub> = <var>a</var>/(<var>R k</var>).</li>
<li><b>Statique.</b> Calculer <var>m g R k</var>, divisé ou multiplié par <var>η</var> selon le sens. Comparer à <var>C</var><sub>n</sub> ; dimensionner le frein.</li>
<li><b>Inertie.</b> Calculer <var>J</var><sub>e</sub> avec les termes en <var>k</var>².</li>
<li><b>Dynamique.</b> Calculer <var>C</var><sub>a</sub>, <var>C</var><sub>c</sub>, <var>C</var><sub>d</sub>, le pic, le couple efficace et la puissance maximale.</li>
<li><b>Comparer au catalogue.</b> <var>C</var><sub>n</sub> ≥ max(statique, <var>C</var><sub>eff</sub>), <var>C</var><sub>max</sub> ≥ <var>C</var><sub>pic</sub>, <var>N</var><sub>max</sub> ≥ <var>N</var><sub>p</sub>.</li>
<li><b>Vérifier</b> avec le simulateur : tous les badges doivent être verts.</li>
</ol>
<div class="retain"><b>À retenir.</b> Loi de vitesse → ramener sur le moteur → statique → inertie → dynamique → comparaison au catalogue.</div>` });

/* ---------- interface ---------- */
const UI = { cur: 'g1' };
const AS = { key: 'g1', tab: 'steps', open: false, st: lsGet(KEYS.act, {}), arm: null, perm: {} };
const CS = { open: false, id: 'torseurs' };
function actSave() { lsSet(KEYS.act, AS.st); }
function actState() { return AS.st[AS.key] || (AS.st[AS.key] = { a: {}, checked: false, shown: false }); }
function actScore(a) { const s = actState(); return a.qcm.filter((q, i) => s.a[i] === q.a).length; }
function wsById(id) { return WORKSHOPS.find(w => w.id === id) || WORKSHOPS[0]; }
function renderSeg() {
  const seg = $('#wsSeg'); seg.innerHTML = '';
  WORKSHOPS.forEach((w, i) => seg.append(h('button', { type: 'button', role: 'tab', 'aria-pressed': w.id === UI.cur ? 'true' : 'false', 'aria-selected': w.id === UI.cur ? 'true' : 'false', onclick: () => gotoWs(w.id) }, (i + 1) + '. ' + w.title)));
}
function mountWs() {
  const w = wsById(UI.cur), root = $('#ws');
  stopSim();
  $('#hint').textContent = w.hint; root.innerHTML = '';
  w.mount(root);
  const sc = $('#scroller'); if (sc) sc.scrollTop = 0;
}
function gotoWs(id) {
  if (CS.open) { CS.open = false; renderCourse(); }
  UI.cur = id; AS.key = id; AS.tab = 'steps';
  renderSeg(); mountWs(); renderAct();
}
function renderAct() {
  const box = $('#act'), btn = $('#bAct');
  btn.setAttribute('aria-pressed', AS.open ? 'true' : 'false'); btn.classList.toggle('pri', AS.open);
  box.hidden = !AS.open;
  if (!AS.open) { box.innerHTML = ''; return; }
  const oldB = box.querySelector('.pbody'), tag = AS.key + '|' + AS.tab, keep = oldB && box.dataset.k === tag ? oldB.scrollTop : 0;
  box.dataset.k = tag; box.innerHTML = '';
  const a = ACT[AS.key];
  const close = h('button', { class: 'btn sm', type: 'button', onclick: () => { AS.open = false; renderAct(); } }, 'Fermer');
  box.append(h('div', { class: 'phead' }, h('b', null, 'Activité'), h('span', { class: 'sub' }, a.title), close));
  const nq = a.qcm.length;
  box.append(h('div', { class: 'tabs', role: 'tablist' },
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'steps' ? 'true' : 'false', onclick: () => { AS.tab = 'steps'; renderAct(); } }, 'Consignes'),
    h('button', { type: 'button', role: 'tab', 'aria-selected': AS.tab === 'qcm' ? 'true' : 'false', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Questions (' + nq + ')')));
  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal', html: '<b>Objectif. </b>' + a.goal }));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    const perm = AS.perm[AS.key] || (AS.perm[AS.key] = a.qcm.map(q => shuffled(q.o.length)));
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', { html: (i + 1) + '. ' + q.q }));
      perm[i].forEach(j => {
        const o = q.o[j];
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', { html: o + (good ? '  ✓' : '') + (bad ? '  ✗' : '') })));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why', html: (miss ? 'Sans réponse. ' : '') + q.w })); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
$('#bAct').addEventListener('click', () => { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); });

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; return; }
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: cur.h }));
  recompute(); hydrateFigs(art); fillLive(art);
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : trapèze de vitesse et choix du moteur'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Trois ateliers sur la loi de vitesse en trapèze et le choix d’un moteur : un simulateur de palan, des exercices sur le trapèze et des exercices de dimensionnement.</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Dans le simulateur, réglez la consigne et les limites du moteur avec les curseurs. L’animation, les courbes et les vérifications se mettent à jour. « Théorique » montre la consigne, « Réel » ce que permet le moteur.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> donne les formules, avec les valeurs calculées pour vos réglages.</li><li>Dans les exercices, tapez un nombre (virgule ou point) ; les réponses sont acceptées à ± 2 %.</li></ul>' +
    '<h3>Conventions</h3><p>Statique en bleu, dynamique en jaune. Charge de masse m, tambour de rayon R, rapport de réduction k = ω<sub>4</sub>/ω<sub>m</sub>, g = 9,81 m/s².</p>' +
    '<h3>Vos données</h3><p>Les réponses au QCM et le choix clair ou sombre sont mémorisés dans ce navigateur uniquement.</p>' }));
});
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
  const b = $('#bTheme'); b.textContent = t === 'dark' ? 'Mode clair' : 'Mode sombre'; b.setAttribute('aria-pressed', t === 'dark' ? 'true' : 'false');
}
applyTheme(lsGet(KEYS.theme, 'light'));
$('#bTheme').addEventListener('click', () => { const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; applyTheme(t); lsSet(KEYS.theme, t); });
function loop(ts) {
  const dt = Math.min(0.05, (ts - ANIM.last) / 1000 || 0); ANIM.last = ts;
  if (ANIM.fn && !CS.open && !document.hidden) { try { ANIM.fn(dt); } catch (e) { ANIM.fn = null; } }
  requestAnimationFrame(loop);
}
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); requestAnimationFrame(loop); })();

</script>
