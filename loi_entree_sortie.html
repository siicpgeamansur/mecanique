<style>
/* Mise en page : barre d'outils en haut, onglets d'ateliers, zone de travail blanche, panneau Activité à droite (feuille basse sur téléphone), vue Cours avec sommaire. */
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;

  --node-stroke:#33475b;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:60;max-width:90vw}

.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}

.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}

.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}

.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
/* ateliers */
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}

.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}

/* barres de tri */
.stagebox{border:1px solid var(--line);border-radius:10px;padding:10px 10px 6px;background:#fff;margin:8px 0}

.bcol{flex:1 1 0;max-width:54px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bcol .v{font:600 12px var(--font-mono);margin-bottom:2px}

.leg i.s{background:rgba(30,122,46,.75);border-color:var(--ok)}.leg i.c{background:var(--accent);border-color:var(--accent-ink)}.leg i.k{background:#e8a33a;border-color:var(--warn)}.leg i.m{background:var(--violet);border-color:#52308f}.leg i.p{background:var(--bad);border-color:#8e1d15}

.cells{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0 4px}
.cell{width:40px;text-align:center}

.cell.sorted .v{background:rgba(30,122,46,.2);border-color:var(--ok)}
.cell.zero .v{color:#9aa3ad}
/* comparaison */
.cmpr{display:grid;grid-template-columns:120px 1fr 80px;gap:8px;align-items:center;font-size:13px;margin:3px 0}
.cmpr i{display:block;height:12px;background:var(--accent);border-radius:3px;min-width:2px}
.cmpr em{font-style:normal;font-family:var(--font-mono);text-align:right}
.seqr{display:flex;gap:4px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:6px;padding:2px 7px;font:600 12.5px var(--font-mono);background:#fff}
.card.t1{border-color:#2e6da4;color:#1b4a76}.card.t2{border-color:#9a5b00;color:#7a4700}.card.t3{border-color:#7b4fc2;color:#52308f}.card.t4{border-color:#1e7a2e;color:#1e7a2e}.card.t5{border-color:#c0281f;color:#8e1d15}.card.t6{border-color:#33475b;color:#33475b}

.formula{line-height:1.9}

function kinCalc(kind, v) {
  const S = Object.assign({ v, vec: false }, KP[kind]), t = v * DEG; let g, sol, terms, out, arrows, law;
  if (kind === 'bm') {
    g = bmGeo(S, t); const AB = vsub(g.B, g.A); sol = solve2(Jv(AB), [-1, 0], vmul(-1, Jv(g.A))); if (!sol) return null;
    const bd = sol[0], xd = sol[1]; out = xd;
    terms = [['θ̇ · z∧OB', vmul(1, Jv(g.B))], ['(β̇ − θ̇) · z∧AB', vmul(bd - 1, Jv(AB))], ['− ẋ · x₁', [-xd, 0]]];
    arrows = [[g.A, Jv(g.A), COL.blue, 'V(A,2/1)'], [g.B, [xd, 0], COL.red, 'V(B,4/1) = ẋ·x₁']]; law = tt => bmGeo(S, tt).x;
  } else if (kind === 'quad') {
    g = quadGeo(S, t); if (!g) return null; const ra = g.A, rab = vsub(g.B, g.A), r2b = vsub(g.B, g.O2);
    sol = solve2(Jv(rab), vmul(-1, Jv(r2b)), vmul(-1, Jv(ra))); if (!sol) return null;
    const bd = sol[0], pd = sol[1]; out = pd;
    terms = [['θ̇ · z∧O₁B', Jv(g.B)], ['(β̇ − θ̇) · z∧AB', vmul(bd - 1, Jv(rab))], ['− φ̇ · z∧O₂B', vmul(-pd, Jv(r2b))]];
    arrows = [[g.A, Jv(g.A), COL.blue, 'V(A)'], [g.B, vmul(pd, Jv(r2b)), COL.red, 'V(B) = φ̇ z∧O₂B']]; law = tt => { const q = quadGeo(S, tt); return q ? q.ph : NaN; };
  } else {
    g = clGeo(S, t); const lam = g.lam, vv = [sn(g.ph), -cs(g.ph)]; sol = solve2(vv, vmul(lam, Jv(vv)), Jv(g.A)); if (!sol) return null;
    const ld = sol[0], pd = sol[1]; out = pd;
    terms = [['θ̇ · z∧O₁A', Jv(g.A)], ['− λ̇ · v', vmul(-ld, vv)], ['− φ̇ · z∧O₂A', vmul(-pd * lam, Jv(vv))]];
    arrows = [[g.A, Jv(g.A), COL.blue, 'V(A,2/1)'], [g.A, vmul(ld, vv), COL.orange, 'glissement']]; law = tt => clGeo(S, tt).ph;
  }
  const e = 1e-5, num = (law(t + e) - law(t - e)) / (2 * e);
  return { S, g, terms, out, arrows, num };
}

const COURSE = [];
COURSE.push({ id: 'principe', t: 'Qu’est-ce qu’une loi entrée-sortie ?', h: `
<p>Un mécanisme transmet un mouvement d’un <b>solide d’entrée</b> (le moteur, le vérin) vers un <b>solide de sortie</b> (le piston, le levier). La <b>loi entrée-sortie</b> relie le paramètre de sortie au paramètre d’entrée.</p>
<div class="formula math"><b>Loi en position</b> : <i>s</i> = <i>f</i>(<i>e</i>) &nbsp;&nbsp; <b>Loi en vitesse</b> : <i>ṡ</i> = ${fr('d<i>f</i>', 'd<i>e</i>')} <i>ė</i></div>
<p>On dispose de deux méthodes équivalentes :</p>
<ul><li>la <b>méthode géométrique</b> : on écrit que la somme des vecteurs le long d’une boucle est nulle, on projette, on élimine les angles intermédiaires, puis on <b>dérive</b> pour avoir la relation cinématique ;</li><li>la <b>méthode cinématique</b> : on écrit que la somme des torseurs cinématiques le long de la boucle est nulle ; on obtient directement la relation entre vitesses.</li></ul>
<div class="retain"><b>À retenir.</b> Position et vitesse sont liées par la dérivation. La méthode géométrique donne la loi complète ; la méthode cinématique donne directement le rapport des vitesses à l’instant considéré.</div>` });

COURSE.push({ id: 'geo', t: 'Méthode géométrique : fermeture de chaîne', h: `
<ol><li><b>Graphe de liaisons</b> et repérage : on choisit un repère par solide et un paramètre par liaison (angle <i>θ</i>, longueur <i>x</i>…).</li><li><b>Fermeture géométrique</b> : en parcourant la boucle, ${V('OA')} + ${V('AB')} + ${V('BO')} = ${V('0')}. Chaque vecteur s’exprime avec une longueur et un vecteur unitaire.</li><li><b>Projection</b> sur deux directions : on obtient deux équations scalaires.</li><li><b>Élimination</b> des paramètres intermédiaires (voir « Outils de simplification »).</li><li><b>Loi entrée-sortie</b> : <i>s</i> = <i>f</i>(<i>e</i>).</li><li><b>Dérivation par rapport au temps</b> pour obtenir la relation cinématique : <i>ṡ</i> = <i>f′</i>(<i>e</i>) <i>ė</i>.</li></ol>
<div class="formula math">Bielle-manivelle : ${V('OA')} = <i>r</i>(cos<i>θ</i> ${X1} + sin<i>θ</i> ${Y1}), &nbsp; ${V('AB')} = <i>L</i>(cos<i>β</i> ${X1} + sin<i>β</i> ${Y1}), &nbsp; ${V('BO')} = − <i>x</i> ${X1}<br>(1) <i>r</i> cos<i>θ</i> + <i>L</i> cos<i>β</i> = <i>x</i> &nbsp; (2) <i>r</i> sin<i>θ</i> + <i>L</i> sin<i>β</i> = 0 &nbsp;⇒&nbsp; <i>x</i> = <i>r</i> cos<i>θ</i> + √(<i>L</i>² − <i>r</i>² sin²<i>θ</i>)</div>
<div class="retain"><b>À retenir.</b> Deux équations scalaires par boucle plane. Si l’on a deux inconnues (<i>s</i> et un angle intermédiaire), on en tire <i>s</i>. Si un mécanisme a deux angles intermédiaires, il faut une boucle de plus ou un carré scalaire bien choisi.</div>` });

COURSE.push({ id: 'cine', t: 'Méthode cinématique : fermeture des torseurs', h: `
<p>Pour une chaîne fermée de solides 1, 2, …, n :</p>
<div class="formula math">{<i>V</i>(2/1)} + {<i>V</i>(3/2)} + … + {<i>V</i>(1/n)} = {0}</div>
<ol><li>On écrit le <b>torseur cinématique de chaque liaison</b> (pivot : <i>Ω</i> = <i>ω</i> ${VZ}, vitesse nulle sur l’axe ; glissière : <i>Ω</i> = 0 et vitesse de glissement le long de l’axe).</li><li>On <b>réduit tous les torseurs au même point</b> : <i>V</i>(<i>B</i>,<i>i</i>/<i>j</i>) = <i>V</i>(<i>A</i>,<i>i</i>/<i>j</i>) + <i>Ω</i>(<i>i</i>/<i>j</i>) ∧ <i>AB</i>.</li><li><b>Somme des résultantes</b> : relation entre vitesses angulaires ; <b>somme des moments</b> : deux équations scalaires en plan.</li><li>On <b>projette</b> dans une direction qui élimine l’inconnue indésirable (par exemple perpendiculaire à une barre : (${VZ}∧<i>AB</i>)·<i>AB</i> = 0).</li></ol>
<div class="formula math">Bielle-manivelle : <i>θ̇</i> ${VZ}∧<i>OB</i> + (<i>β̇</i> − <i>θ̇</i>) ${VZ}∧<i>AB</i> − <i>ẋ</i> ${X1} = ${V('0')} &nbsp;⇒&nbsp; <i>ẋ</i> = <i>θ̇</i> <i>x</i> tan<i>β</i></div>
<div class="retain"><b>À retenir.</b> La méthode cinématique ne demande pas de résoudre la loi de position : elle fournit la relation entre vitesses à partir de la configuration (<i>x</i>, <i>β</i>) à l’instant considéré. Elle est équivalente à la dérivée de la loi géométrique.</div>` });

COURSE.push({ id: 'simpl', t: 'Outils de simplification', h: `
<h3>1. Formules trigonométriques</h3>
<ul><li><b>cos² + sin² = 1</b> : on passe de sin<i>β</i> à cos<i>β</i> ; on élimine un angle entre deux projections élevées au carré.</li><li>cos(<i>a</i> − <i>b</i>) = cos<i>a</i> cos<i>b</i> + sin<i>a</i> sin<i>b</i>, &nbsp; cos(<i>a</i> + <i>b</i>) = cos<i>a</i> cos<i>b</i> − sin<i>a</i> sin<i>b</i>.</li><li><b>Angle auxiliaire</b> : <i>P</i> cos<i>φ</i> + <i>Q</i> sin<i>φ</i> = <i>ρ</i> cos(<i>φ</i> − <i>ψ</i>), avec <i>ρ</i> = √(<i>P</i>² + <i>Q</i>²), cos<i>ψ</i> = <i>P</i>/<i>ρ</i>, sin<i>ψ</i> = <i>Q</i>/<i>ρ</i>. Solution : <i>φ</i> = <i>ψ</i> ± arccos(<i>R</i>/<i>ρ</i>) si |<i>R</i>| ≤ <i>ρ</i>.</li><li>Tangente de l’angle moitié : <i>t</i> = tan(<i>φ</i>/2), cos<i>φ</i> = (1 − <i>t</i>²)/(1 + <i>t</i>²), sin<i>φ</i> = 2<i>t</i>/(1 + <i>t</i>²).</li></ul>
<h3>2. Carré scalaire</h3>
<p>Dans la fermeture, on isole le vecteur dont on veut éliminer la direction, puis on prend le carré scalaire des deux membres. Pour des vecteurs unitaires, ${VU}·${VU} = 1 et ${VU}·${X1} = cos<i>θ</i> (cosinus de l’angle entre eux).</p>
<div class="formula math"><i>L</i>${VW} = <i>x</i>${X1} − <i>r</i>${VU} &nbsp;⇒&nbsp; <i>L</i>² = <i>x</i>² − 2<i>rx</i> cos<i>θ</i> + <i>r</i>²</div>
<p>Résultat classique : <b>(<i>A</i> − <i>B</i>)² = <i>A</i>² − 2 <i>A</i>·<i>B</i> + <i>B</i>²</b>. Le carré scalaire revient à projeter, élever au carré et additionner (et utilise donc sin² + cos² = 1 en une seule ligne).</p>
<h3>3. Manipulation d’un système d’équations</h3>
<ul><li><b>Substitution</b> : on exprime une inconnue avec une équation et on la remplace dans l’autre.</li><li><b>Division</b> membre à membre pour éliminer une inconnue en facteur : <i>λ</i> sin<i>φ</i> = <i>A</i>, <i>λ</i> cos<i>φ</i> = <i>B</i> ⇒ tan<i>φ</i> = <i>A</i>/<i>B</i> (vérifier <i>B</i> ≠ 0).</li><li><b>Combinaison linéaire</b> : (1) × cos<i>φ</i> − (2) × sin<i>φ</i> élimine <i>λ</i>.</li><li><b>Somme des carrés</b> : <i>λ</i>² = <i>A</i>² + <i>B</i>².</li></ul>
<div class="retain"><b>À retenir.</b> Un angle connu par deux projections se traite par division (on garde l’angle) ou par somme des carrés (on le supprime). Le carré scalaire est l’outil de choix pour une longueur ; la division pour un angle.</div>` });

COURSE.push({ id: 'cas', t: 'Quatre mécanismes, quatre lois', h: `
<table class="kv mtab"><thead><tr><th>Mécanisme</th><th>Entrée → sortie</th><th>Outil principal</th><th>Loi</th></tr></thead><tbody>
<tr><td>Bielle-manivelle</td><td><i>θ</i> → <i>x</i></td><td>cos² + sin² = 1 ou carré scalaire</td><td><i>x</i> = <i>r</i> cos<i>θ</i> + √(<i>L</i>² − <i>r</i>² sin²<i>θ</i>)</td></tr>
<tr><td>Vérin et bras</td><td><i>λ</i> → <i>θ</i></td><td>Carré scalaire (Al-Kashi)</td><td><i>θ</i> = arccos ${fr('<i>a</i>² + <i>c</i>² − <i>λ</i>²', '2<i>ac</i>')}</td></tr>
<tr><td>Quadrilatère articulé</td><td><i>θ</i> → <i>φ</i></td><td>Carré scalaire puis angle auxiliaire</td><td><i>P</i> cos<i>φ</i> + <i>Q</i> sin<i>φ</i> = <i>R</i></td></tr>
<tr><td>Coulisse</td><td><i>θ</i> → <i>φ</i></td><td>Division de deux équations</td><td>tan<i>φ</i> = ${fr('<i>r</i> cos<i>θ</i>', '<i>d</i> − <i>r</i> sin<i>θ</i>')}</td></tr></tbody></table>
<h3>Relations cinématiques correspondantes</h3>
<ul><li>Bielle-manivelle : <i>ẋ</i> = <i>θ̇</i> <i>x</i> tan<i>β</i> (par torseurs) ou <i>ẋ</i> = − <i>r θ̇</i> sin<i>θ</i> (1 + <i>r</i> cos<i>θ</i>/√(…)).</li><li>Vérin : <i>λ̇</i> = ${fr('<i>ac</i> sin<i>θ</i>', '<i>λ</i>')} <i>θ̇</i>.</li><li>Coulisse : <i>φ̇</i> = <i>θ̇</i> ${fr('<i>r</i>(<i>r</i> − <i>d</i> sin<i>θ</i>)', '<i>λ</i>²')}.</li><li>Quadrilatère : <i>φ̇</i> = <i>θ̇</i> ${fr('<i>a</i>(<i>d</i> sin<i>θ</i> + <i>c</i> sin(<i>θ</i> − <i>φ</i>))', '<i>c</i>(<i>d</i> sin<i>φ</i> + <i>a</i> sin(<i>θ</i> − <i>φ</i>))')}.</li></ul>
<div class="retain"><b>À retenir.</b> Quel que soit le mécanisme, la démarche est la même : fermer, projeter, éliminer, dériver.</div>` });

COURSE.push({ id: 'pieges', t: 'Pièges et vérifications', h: `
<ul><li><b>Signe d’une racine</b> : il traduit le choix du montage. Il faut le fixer avec la géométrie (par exemple <i>x</i> &gt; 0, ou |<i>β</i>| &lt; 90°).</li><li><b>Conditions d’existence</b> : |<i>R</i>| ≤ <i>ρ</i> pour l’angle auxiliaire ; inégalité triangulaire pour l’arccos du vérin ; <i>L</i> &gt; <i>r</i> pour la bielle-manivelle.</li><li><b>Points singuliers</b> (points morts) : le rapport de transmission devient nul ou infini.</li><li><b>Division par zéro</b> : vérifier le diviseur avant de diviser deux équations.</li><li><b>Vérifications rapides</b> : tester la loi pour des angles simples (0°, 90°, 180°) et la comparer au dessin.</li><li><b>Homogénéité</b> : longueur sous la racine = longueur² ; les arguments des trigonométriques sont des angles.</li></ul>
<div class="retain"><b>À retenir.</b> Une loi sans condition d’existence ni choix de montage est une loi incomplète.</div>` });

  const body = h('div', { class: 'pbody' });
  if (AS.tab === 'steps') {
    body.append(h('p', { class: 'small' }, a.level + ' · environ ' + a.time), h('div', { class: 'goal' }, h('b', null, 'Objectif. '), a.goal));
    body.append(h('ol', { class: 'steps' }, a.steps.map(s => h('li', { html: s }))));
    body.append(h('div', { class: 'defi' }, h('b', null, 'Défi'), h('p', { html: a.defi.q }), h('details', null, h('summary', null, 'Voir la réponse'), h('p', { html: a.defi.a }))));
    if (a.course) body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: () => openCourse(a.course) }, 'Voir le cours : ' + courseSection(a.course).t)));
    body.append(h('p', null, h('button', { class: 'btn', type: 'button', onclick: ev => {
      const b = ev.currentTarget;
      if (!AS.arm) { b.textContent = 'Confirmer ? Votre travail sera effacé'; AS.arm = setTimeout(() => { b.textContent = 'Recommencer l’atelier'; AS.arm = null; }, 3500); return; }
      clearTimeout(AS.arm); AS.arm = null; wsById(UI.cur).reset(); mountWs(); renderAct(); } }, 'Recommencer l’atelier')));
    body.append(h('p', null, h('button', { class: 'btn pri', type: 'button', onclick: () => { AS.tab = 'qcm'; renderAct(); } }, 'Passer aux questions')));
  } else {
    const s = actState(), show = s.checked || s.shown;
    a.qcm.forEach((q, i) => {
      const fs = h('fieldset', { class: 'q' }, h('legend', null, (i + 1) + '. ' + q.q));
      q.o.forEach((o, j) => {
        const good = show && j === q.a, bad = s.checked && !s.shown && s.a[i] === j && j !== q.a;
        const inp = h('input', { type: 'radio', name: 'q' + i, checked: show && s.shown ? j === q.a : s.a[i] === j, disabled: show });
        inp.addEventListener('change', () => { s.a[i] = j; actSave(); renderAct(); });
        fs.append(h('label', { class: 'opt' + (good ? ' good' : '') + (bad ? ' bad' : '') }, inp, h('span', null, o + (good ? '  ✓' : '') + (bad ? '  ✗' : ''))));
      });
      if (show) { const miss = s.a[i] == null && !s.shown; fs.append(h('p', { class: 'why' }, (miss ? 'Sans réponse. ' : '') + q.w)); }
      body.append(fs);
    });
    const done = Object.keys(s.a).length;
    body.append(h('p', { class: 'small' }, s.shown ? 'Réponses affichées.' : s.checked ? '' : done + ' réponse(s) sur ' + nq + '.'));
    if (s.checked && !s.shown) body.append(h('p', { class: 'score' }, 'Score : ' + actScore(a) + ' / ' + nq));
    const row = h('div', { class: 'files' });
    if (!show) row.append(h('button', { class: 'btn pri', type: 'button', onclick: () => { s.checked = true; actSave(); renderAct(); } }, 'Corriger'));
    row.append(h('button', { class: 'btn', type: 'button', onclick: () => { s.shown = true; actSave(); renderAct(); } }, 'Afficher les réponses'));
    if (show) row.append(h('button', { class: 'btn', type: 'button', onclick: () => { AS.st[AS.key] = { a: {}, checked: false, shown: false }; actSave(); renderAct(); } }, 'Recommencer'));
    body.append(row);
  }
  box.append(body); body.scrollTop = keep;
}
function actToggle() { if (CS.open) { CS.open = false; renderCourse(); } AS.open = !AS.open; renderAct(); }
$('#bAct').addEventListener('click', actToggle);

function courseSection(id) { return COURSE.find(s => s.id === id) || COURSE[0]; }
function renderCourse() {
  const box = $('#course'), btn = $('#bCourse'), work = $('#work');
  btn.setAttribute('aria-pressed', CS.open ? 'true' : 'false'); btn.classList.toggle('pri', CS.open);
  box.hidden = !CS.open; work.hidden = CS.open; $('#modes').hidden = CS.open;
  if (!CS.open) { box.innerHTML = ''; if (UI.mounted) { mountWs(); } return; }
  stopAll();
  box.innerHTML = '';
  const cur = courseSection(CS.id), idx = COURSE.indexOf(cur);
  const go = id => { CS.id = id; renderCourse(); };
  const nav = h('nav', { class: 'ctoc', 'aria-label': 'Sommaire du cours' }, COURSE.map((s, i) => h('button', { type: 'button', class: s.id === cur.id ? 'on' : '', 'aria-current': s.id === cur.id ? 'true' : 'false', onclick: () => go(s.id) }, (i + 1) + '. ' + s.t)));
  const sel = h('select', { class: 'ctoc-sel', 'aria-label': 'Choisir une section', onchange: e => go(e.target.value) }, COURSE.map((s, i) => h('option', { value: s.id, selected: s.id === cur.id }, (i + 1) + '. ' + s.t)));
  const art = h('article', { class: 'cbody' });
  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { class: 'math', html: cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : les lois entrée-sortie'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l’atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title }, h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')), h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Six ateliers sur les lois entrée-sortie : quatre mécanismes animés (bielle-manivelle, vérin et bras, quadrilatère articulé, coulisse), la fermeture cinématique par torseurs et un atelier d’entraînement aux simplifications (identités trigonométriques, carré scalaire, manipulation de système).</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Faites glisser les <b>curseurs</b> pour changer le système, et les <b>points rouges ou bleus</b> sur les graphiques pour déplacer P, les curseurs de mesure ou le temps.</li><li>Dans les modes « système mystère », mesurez sur la courbe, entrez vos valeurs puis révélez le système réel.</li><li>Le bouton <b>Activité</b> affiche les consignes, un défi et un QCM avec correction.</li><li>Le bouton <b>Cours</b> rappelle les méthodes.</li></ul>' +
    '<h3>Vos données</h3><p>Les réponses au QCM sont mémorisées dans ce navigateur uniquement.</p><p class="small">Les démonstrations et exercices sont rédigés pour cet atelier.</p>' }));
});
(function init() { AS.open = !isSmall(); renderSeg(); mountWs(); renderAct(); renderCourse(); UI.mounted = true; })();
</script>
</body></html>
