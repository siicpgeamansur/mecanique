<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Théorie des mécanismes — SII · CPGE PSI*</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
*{box-sizing:border-box}
[hidden]:not([hidden="until-found"]){display:none!important}
:root{
  --font-ui:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#ffffff;--bar:#eeeeee;--panel:#ffffff;--panel2:#f1f3f6;--field:#ffffff;--line:#b9bfc7;
  --fg:#111111;--muted:#5a6068;--accent:#2e6da4;--accent-fg:#ffffff;--accent-soft:#dcebf8;--accent-ink:#1b4a76;
  --ok:#1e7a2e;--warn:#9a5b00;--bad:#c0281f;--violet:#7b4fc2;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 var(--font-ui)}
button,input,select,textarea{font:inherit;color:inherit}
.inner{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#app{height:100%;display:flex;flex-direction:column;min-height:0}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:16px;letter-spacing:.01em}
.brand small{font-weight:400;color:var(--muted);font-size:13px}
.files{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.btn{font-weight:500;font-size:13px;padding:6px 11px;border:1px solid var(--line);background:var(--panel);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.sm{padding:3px 8px;font-size:12px}
:is(button,input,select,textarea,summary):focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:500;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}
#stage{flex:1;min-width:0;position:relative;border:1px solid var(--line);border-radius:10px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden}
#hint{flex:none;padding:6px 12px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);background:var(--bar)}
#scroller{flex:1;min-height:0;overflow:auto}
.phead{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line);flex:none}
.phead b{font-size:15px}
.phead .sub{color:var(--muted);font-size:12.5px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tabs{display:flex;gap:2px;padding:6px 8px 0;border-bottom:1px solid var(--line);overflow-x:auto;flex:none}
.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;padding:6px 10px;font-weight:500;font-size:13px;cursor:pointer;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
.pbody{overflow:auto;padding:12px;flex:1;min-height:0}
.fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;font-size:12.5px;color:var(--muted)}
input[type=text],input[type=number],textarea,select{width:100%;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:5px 8px;color:var(--fg)}
input[type=range]{width:100%;padding:0;accent-color:var(--accent)}
.mono{font-family:var(--font-mono);font-size:12.5px}
.small{font-size:12px;color:var(--muted);margin:0 0 9px}
#dlg{position:fixed;inset:0;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.dlgbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;width:min(640px,100%);max-height:88%;display:flex;flex-direction:column}
.dlgbox header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.dlgbox header b{font-size:16px}
.dlgbox .dbody{padding:14px 16px;overflow:auto}
.dlgbox h3{margin:14px 0 4px;font-size:14px}.dlgbox p,.dlgbox li{margin:4px 0;font-size:13.5px}
#act{flex:none;width:clamp(280px,24vw,340px);display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;background:var(--panel);min-height:0;max-height:100%}
#act .pbody{font-size:13.5px}
.goal{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:8px 10px;margin:0 0 10px}
.steps{margin:0 0 10px;padding-left:20px}.steps li{margin-bottom:9px}
.defi{border:1px dashed var(--accent);border-radius:8px;padding:8px 10px;margin:0 0 12px}.defi p{margin:6px 0}
.defi summary{cursor:pointer;font-weight:500;color:var(--accent-ink)}
fieldset.q{border:1px solid var(--line);border-radius:8px;padding:8px 10px 6px;margin:0 0 10px;min-width:0}
fieldset.q legend{font-weight:600;padding:0 4px;max-width:100%}
.opt{display:flex;gap:8px;align-items:flex-start;padding:4px 6px;border-radius:6px;cursor:pointer}
.opt input{margin-top:3px;width:auto;flex:none}
.opt.good{background:rgba(30,122,46,.15)}.opt.bad{background:rgba(192,40,31,.15)}
.why{font-size:12.5px;color:var(--muted);margin:6px 4px 2px}
.score{font-weight:600;font-size:15px;margin:4px 0 8px}
#course{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--bg)}
.ctop,.cwrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ctop{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding-block:8px;border-bottom:1px solid var(--line);background:var(--bar)}
.cwrap{flex:1;min-height:0;display:flex;gap:28px;padding-block:14px}
.ctoc{flex:none;width:250px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.ctoc button{display:block;width:100%;text-align:left;padding:6px 10px;border:0;border-left:3px solid transparent;background:transparent;cursor:pointer;font-size:13.5px}
.ctoc button:hover{background:var(--panel2)}
.ctoc button.on{border-left-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.ctoc-sel{display:none;margin:8px max(16px,env(safe-area-inset-left,0px)) 0;width:auto}
.cbody{flex:1;min-width:0;overflow:auto;max-width:860px;padding-right:6px}
.ckick{color:var(--muted);font-size:12.5px;margin:0}
.cbody h2{font-size:26px;margin:2px 0 12px;text-wrap:balance}
.cbody h3{font-size:16.5px;margin:22px 0 6px}
.cbody p,.cbody li{font-size:14.5px;line-height:1.6}
.cbody ul,.cbody ol{padding-left:22px}.cbody li{margin-bottom:4px}
.cbody table{display:block;overflow-x:auto;max-width:100%}
.ctable{border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
.ctable th,.ctable td{border:1px solid var(--line);padding:5px 9px;text-align:left;vertical-align:top}
.ctable th{background:var(--panel2);font-weight:600}
.retain{background:var(--accent-soft);color:var(--accent-ink);border-radius:8px;padding:9px 12px;margin:16px 0 6px;font-size:14px}
.formula{background:var(--panel2);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;font-size:15px;overflow-x:auto}
pre.code{font:12.5px/1.55 var(--font-mono);margin:8px 0;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:5px 18px;font-size:14px}.gloss dt{font-weight:600}.gloss dd{margin:0}
.cpn{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin:24px 0 32px}
#ws{padding:16px max(16px,env(safe-area-inset-left,0px)) 30px;max-width:980px}
#ws h2{font-size:24px;margin:0 0 8px;text-wrap:balance}
#ws h3{font-size:16.5px;margin:24px 0 6px}
#ws p,#ws li{font-size:14.5px;line-height:1.55}
#ws .small{font-size:12.5px}
.opts{display:flex;gap:10px 18px;flex-wrap:wrap;align-items:flex-end;margin:6px 0 10px}.opts .fld{margin:0}
.opts input[type=range]{width:180px;max-width:100%}
.opts select{min-width:150px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--accent)}.chip.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.gstats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin:10px 0}
.stat{border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--panel);display:flex;flex-direction:column;gap:2px;min-width:0}
.stat span{font-size:12px;color:var(--muted)}.stat b{font-size:14px;font-family:var(--font-mono);overflow-wrap:anywhere}
.verdict{border-radius:8px;padding:9px 12px;margin:10px 0;font-size:14px;background:var(--panel2);border:1px solid var(--line)}
.verdict.yes{background:rgba(30,122,46,.15);border-color:var(--ok)}.verdict.no{background:rgba(192,40,31,.13);border-color:var(--bad)}.verdict.warn{background:rgba(154,91,0,.13);border-color:var(--warn)}
.verdict h4{margin:0 0 4px;font-size:14px}
.verdict p{margin:4px 0}
.task-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.task-row:last-child{border-bottom:0}
.task-row .chips{margin:0}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:10px 0}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel)}
.card h4{margin:0 0 6px;font-size:14px;color:var(--accent-ink)}
.card p{font-size:13px;margin:4px 0}
.dwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0}
.dt{border-collapse:collapse;width:100%;font-size:13.5px}
.dt th,.dt td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.dt thead th{background:var(--panel2);font-weight:600}
.dt td.m{font-family:var(--font-mono);font-size:12.5px}
.dt tr:last-child td{border-bottom:0}
.methode-tab{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.methode-tab button{border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.methode-tab button.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.etape{border-left:3px solid var(--accent);padding-left:10px;margin:10px 0}
.etape h4{margin:0 0 4px;font-size:14px;color:var(--accent-ink)}
.etape p{margin:2px 0;font-size:13px}
.liaison-pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px;margin:8px 0}
.sollist{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:6px 12px;margin:8px 0;background:var(--panel2)}
.sollist li{font-size:13px;margin:2px 0}
.gsvg{width:100%;max-width:520px;height:auto;display:block;margin:8px 0;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
@media (max-width:820px){
  .ctoc{display:none}.ctoc-sel{display:block}.cwrap{padding-top:8px}.cbody{padding-right:0}.gloss{grid-template-columns:1fr}.gloss dd{margin-bottom:6px}
  #act{position:fixed;left:0;right:0;bottom:0;width:auto;height:70%;max-height:none;border-radius:14px 14px 0 0;z-index:35;box-shadow:0 -8px 30px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom,0px)}
  .work{flex-direction:column;gap:8px}
  .task-row{grid-template-columns:1fr}
  .opts input[type=range]{width:140px}
}
@media (prefers-reduced-motion:no-preference){.btn{transition:border-color .12s,background .12s}}
/* --- vecteurs, schémas cinématiques, graphes --- */
.vec{position:relative;display:inline-block;font-style:italic;line-height:1}
.vec::before{content:"\2192";position:absolute;left:.02em;top:-.72em;font-size:.72em;font-style:normal;line-height:1}
.gsvg .ge{stroke:#5a6068;stroke-width:1.8;fill:none}
.gsvg .gn{fill:#dcebf8;stroke:#2e6da4;stroke-width:1.8}
.gsvg .gr{fill:none;stroke:#2e6da4;stroke-width:1.2}
.gsvg .gt{font:600 13px var(--font-ui);fill:#111;text-anchor:middle}
.gsvg .gl{font:500 10.5px var(--font-ui);fill:#1b4a76;paint-order:stroke;stroke:#fff;stroke-width:4px;stroke-linejoin:round}
.gcap{font-size:12.5px;color:var(--muted);margin:0 0 10px}
.gfig{margin:8px 0 12px}
.gfig b{font-size:13px}
.skrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:8px 0}
.skrow .card{padding:8px 10px}
.skrow .card p{margin:6px 0 0}
.skthumb{margin-bottom:6px}

/* --- schémas cinématiques de la fiche (bleu = solide 1, rouge = solide 2, vert = point et vecteurs) --- */
.sk2{width:100%;height:auto;display:block;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.sk2 .t{stroke:#1f5fd1;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sk2 .wf{fill:#fff;stroke:none}
.sk2 .tt{stroke:#1f5fd1;stroke-width:1.9;fill:none;stroke-linecap:round}
.sk2 .tk{stroke:#1f5fd1;stroke-width:3.4;fill:none;stroke-linecap:round}
.sk2 .tw{stroke:#1f5fd1;stroke-width:2.4;fill:#fff;stroke-linejoin:round}
.sk2 .o{stroke:#d62828;stroke-width:2.4;fill:none;stroke-linecap:round;stroke-linejoin:round}
.sk2 .ow{stroke:#d62828;stroke-width:2.4;fill:#fff;stroke-linejoin:round}
.sk2 .bl{stroke:#17913c;stroke-width:1.6;fill:none;stroke-linecap:round}
.sk2 .blf,.sk2 .bld{fill:#17913c;stroke:none}
.sk2 .vh2{stroke:#17913c;stroke-width:1.2;fill:none}
.sk2 .vt{font:italic 600 13px 'Times New Roman',Georgia,serif;fill:#17913c}
.sk2 .pt2{font:500 13px var(--font-ui);fill:#17913c}
.sklegend{display:flex;gap:6px 16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 10px;align-items:center}
.sklegend i{display:inline-block;width:18px;height:0;border-top:3px solid;vertical-align:middle;margin-right:5px}
.skmode{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted)}
.skmode .seg button{padding:5px 10px;font-size:12.5px}
body[data-sk="both"] .skrow{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
body[data-sk="both"] .liaison-pair{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
body[data-sk="both"] #li-grid,body[data-sk="both"] .cards.skcards{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
body[data-sk="2d"] #li-grid,body[data-sk="2d"] .cards.skcards{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.gsvg .gn.gn1{fill:#fff;stroke:#1f5fd1;stroke-width:2.4}
.gsvg .gn.gn2{fill:#fff;stroke:#d62828;stroke-width:2.4}
</style>
</head>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fff"/><line x1="0" y1="0" x2="0" y2="6" stroke="#8894a4" stroke-width="1.4"/></pattern></defs></svg>
<div id="app">

      <svg width="28" height="28" viewBox="0 0 26 26" aria-hidden="true">

'use strict';
const $ = (s, r) => (r || document).querySelector(s);
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k === 'html') el.innerHTML = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else el.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) el.append(k.nodeType ? k : document.createTextNode(k));
  return el;
}
function isSmall() { try { return window.matchMedia('(max-width:820px)').matches; } catch (e) { return false; } }
const KEYS = { act: 'atelier-theorie-meca-v3' };
function lsGet(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
const WORKSHOPS = [];

/*ENGINE-START*/
/* ============ MOTEUR DE CALCUL DES LIAISONS ============
   Torseur cinématique exprimé à l'origine A : (wx, wy, wz, vx, vy, vz).
   Une liaison est définie par : son type, une DIRECTION (vecteur x, y ou z) et un POINT (A, B, C ou D).
   Un axe = un point + un vecteur directeur : l'axe (B, z) est la droite passant par B de vecteur directeur z.
   Les composantes LIBRES sont décrites dans le repère local (axe / normale = z), puis réorientées. */
const COMPS = ['wx', 'wy', 'wz', 'vx', 'vy', 'vz'];
const LTYPES = {
  encastrement: { nom: 'Encastrement', libre: [], kind: null },
  pivot: { nom: 'Pivot', libre: ['wz'], kind: 'axe' },
  glissiere: { nom: 'Glissière', libre: ['vz'], kind: 'dir' },
  pivotglissant: { nom: 'Pivot glissant', libre: ['wz', 'vz'], kind: 'axe' },
  doigt: { nom: 'Sphérique à doigt', libre: ['wx', 'wy'], kind: 'doigt' },
  spherique: { nom: 'Sphérique', libre: ['wx', 'wy', 'wz'], kind: 'centre' },
  appuiplan: { nom: 'Appui plan', libre: ['wz', 'vx', 'vy'], kind: 'normale' },
  spherecyl: { nom: 'Sphère-cylindre', libre: ['wx', 'wy', 'wz', 'vz'], kind: 'axe' },
  sphereplan: { nom: 'Sphère-plan', libre: ['wx', 'wy', 'wz', 'vx', 'vy'], kind: 'normale' }

function skLegend() {
  return '<div class="sklegend"><span><i style="border-color:#1f5fd1"></i>solide 1 (référence, bâti)</span><span><i style="border-color:#d62828"></i>solide 2 (solide mobile)</span>'
    + '<span><i style="border-color:#17913c"></i>point et vecteurs de la liaison : <b>un axe = un point + un vecteur</b></span></div>';
}
/* maxw : largeur maximale en px ; pt : point imposé (ex. 'B') ; vec : vecteur imposé (ex. 'z') */
function skSvg(key, maxw, pt, vec) {
  const V = SKV[key]; if (!V) return '';
  const L = { p: pt || V.dp || '', ex: !!pt, v: vec || V.dv || 'x', n: 'z', m: 'y' };
  if (V.norm && vec) L.n = vec;
  if (key === 'doigt' && vec) { L.v = ORI[vec].x; L.m = ORI[vec].y; }
  let cells;
  if (V.one) cells = [V.one];
  else {
    cells = [];
    if (SKS.mode !== '2d') cells.push(V.d3);
    if (SKS.mode !== '3d') { cells.push(V.side); if (V.face) cells.push(V.face); }
  }
  let x = 0, s = '';
  cells.forEach(c => { s += '<g transform="translate(' + x + ',0)">' + c.f(L) + '</g>'; x += c.w; });
  return '<svg class="sk2" viewBox="0 0 ' + x + ' 150" style="max-width:' + (maxw || Math.round(x * 1.7)) + 'px" role="img" aria-label="Schéma cinématique : ' + SKNAME[key] + '">' + s + '</svg>';
}

  { c: 'Pivot + glissière', l: [{ t: 'pivot', o: 'z', p: 'A' }, { t: 'glissiere', o: 'z', p: 'A' }],
    why: `Les deux mouvements subsistent : rotation autour de l'axe ${axS('A', 'z')} et translation selon ${VH('z')}. Pivot glissant d'axe ${axS('A', 'z')}.` },
  { c: '3 pivots concourants', l: [{ t: 'pivot', o: 'x', p: 'A' }, { t: 'pivot', o: 'y', p: 'A' }, { t: 'pivot', o: 'z', p: 'A' }],

/* ============ ATELIER 3 : GRAPHE ============ */
const GR = { step: 0, nl: 4, np: 4 };
const BM_LABELS = ['Pivot (O, z)', 'Pivot (A, z)', 'Pivot (B, z)', 'Glissière (x)'];
const GR_STEPS = [
  { title: 'Étape 1 — Classes d\'équivalence', body: '<p>Regrouper les pièces sans mouvement relatif. Chaque classe devient un solide unique.</p><p><b>Exemple :</b> le bâti et ses vis forment une seule classe ; la bielle et ses bagues aussi.</p>' },
  { title: 'Étape 2 — Identifier les liaisons', body: '<p>Entre chaque paire de classes en contact, déterminer la liaison normalisée (pivot, glissière, sphérique…) et ses paramètres géométriques : <b>un axe est un point et un vecteur</b>, par exemple le pivot d\'axe (O, ' + VH('z') + ').</p>' },
  { title: 'Étape 3 — Tracer le graphe', body: '<p>Chaque classe est un nœud (le bâti est entouré d\'un double cercle), chaque liaison un arc étiqueté par son nom et ses paramètres. Le graphe permet de repérer chaînes ouvertes (séries) et boucles (parallèles, cycles).</p><p>Exemple : bielle-manivelle (0 bâti, 1 manivelle, 2 bielle, 3 piston).</p>' },

  { title: 'Étape 5 — Fermetures cinématiques', body: '<p>Pour chaque cycle indépendant :</p><div class="formula">V₁ + V₂ + … + V<sub>n</sub> = 0</div><p>Chaque fermeture fournit au plus 6 équations scalaires, soit E<sub>c</sub> = 6γ équations au total.</p>' }

    + '<div class="gfig"><p class="gcap"><b>Parallèle</b> : plusieurs arcs entre les mêmes nœuds. Une boucle : γ = 2 − 2 + 1 = 1. Seuls subsistent les mouvements compatibles avec toutes les liaisons.</p>' + graphPar(['Pivot (A, z)', 'Pivot (B, z)']) + '</div>'

function graphSvg() { return graphDraw(ringGraph(BM_LABELS[0], BM_LABELS[1], BM_LABELS[2], BM_LABELS[3]), 'Graphe des liaisons de la bielle-manivelle'); }

function renderGRcalc() {

}

const DIRV = { x: [1, 0, 0], y: [0, 1, 0], z: [0, 0, 1] };
function axisRel(a, b) {
  const ka = LTYPES[a.t].kind, kb = LTYPES[b.t].kind;

    + '<label class="fld"><span>N<sub>P</sub> = <b id="met-np-o"></b></span><input type="range" id="met-np" min="2" max="10" step="1" value="4"></label>'
    + '</div><div id="met-calc"></div>'
    + '<div class="methode-tab" id="met-tabs"></div>'
    + '<div id="met-content"></div>';
  const pre = $('#met-pre');
  MET_PRE.forEach(p => pre.append(h('button', { type: 'button', class: 'chip', onclick: () => { MET.nl = p.nl; MET.np = p.np; $('#met-nl').value = p.nl; $('#met-np').value = p.np; renderMetCalc(); } }, p.nom)));
  $('#met-nl').value = MET.nl; $('#met-np').value = MET.np;
  $('#met-nl').addEventListener('input', e => { MET.nl = +e.target.value; renderMetCalc(); });
  $('#met-np').addEventListener('input', e => { MET.np = +e.target.value; renderMetCalc(); });
  renderMetCalc(); renderMet();
}
function renderMetCalc() {
  $('#met-nl-o').textContent = MET.nl; $('#met-np-o').textContent = MET.np;
  const g = MET.nl - MET.np + 1, box = $('#met-calc'); box.innerHTML = '';
  if (g < 0) { box.append(h('div', { class: 'verdict warn', html: '<b>Graphe non connexe</b> : il faut N<sub>L</sub> ≥ N<sub>P</sub> − 1.' })); return; }
  const Ec = 6 * g, Es = 6 * (MET.np - 1);
  box.append(h('div', { class: 'gstats' },
    h('div', { class: 'stat' }, h('span', null, 'γ'), h('b', null, String(g))),
    h('div', { class: 'stat' }, h('span', null, 'E_c = 6γ'), h('b', null, String(Ec))),
    h('div', { class: 'stat' }, h('span', null, 'E_s = 6(N_P − 1)'), h('b', null, String(Es)))));
  let txt, cls = 'yes';
  if (g === 0) txt = '<b>Chaîne ouverte (γ = 0) :</b> aucune fermeture à écrire ; la cinématique se réduit à composer les torseurs.';
  else if (Ec < Es) txt = '<b>Cinématique plus économique</b> (' + Ec + ' équations contre ' + Es + ') pour la mobilité et la loi entrée-sortie.';
  else if (Ec > Es) { txt = '<b>Statique plus économique</b> (' + Es + ' équations contre ' + Ec + ') : typique d\'une « pieuvre ».'; cls = 'warn'; }
  else txt = '<b>Équivalent</b> : même nombre d\'équations (' + Ec + ').';
  box.append(h('div', { class: 'verdict ' + cls, html: txt + '<br><span class="small">À objectif égal. Pour les efforts dans les liaisons, la statique reste incontournable.</span>' }));
}
function renderMet() {
  const tabs = $('#met-tabs'); tabs.innerHTML = '';
  ['statique', 'cinematique'].forEach(m => {
    tabs.append(h('button', {
      type: 'button', class: MET.mode === m ? 'on' : '',
      onclick: () => { MET.mode = m; renderMet(); }
    }, MET_DATA[m].titre));
  });
  const d = MET_DATA[MET.mode];
  const content = $('#met-content'); content.innerHTML = '';
  content.append(
    h('div', { class: 'verdict ' + (MET.mode === 'statique' ? 'warn' : 'yes') },
      h('p', { html: '<b>Quand l\'utiliser :</b> ' + d.quand }),
      h('p', { html: '<b>Principe :</b> ' + d.principe })));
  d.etapes.forEach((e, i) => {
    content.append(h('div', { class: 'etape' },
      h('h4', null, (i + 1) + '. ' + e.t),
      h('p', null, e.c)));
  });
  content.append(h('h3', null, 'Exemple : ' + d.exemple.nom));
  content.append(h('p', { html: d.exemple.desc }));
  content.append(h('div', { class: 'verdict' },
    h('p', { html: '<b>Étapes clés :</b>' }),
    h('ol', null, d.exemple.etapes.map(s => h('li', { html: s })))));
  content.append(h('p', { class: 'small', html: d.exemple.note }));
}

COURSE.push({ id: 'isostatique', t: 'Rendre isostatique', h: `
<p>Un système hyperstatique a des conditions redondantes. Pour le rendre isostatique <b>sans changer sa fonction</b> (même liaison équivalente, donc même m) :</p>

<h3>Cinématique (fermeture)</h3>

COURSE.push({ id: 'gloss', t: 'Vocabulaire', h: `
<dl class="gloss">
<dt>Sphérique</dt><dd>3 rotations autour d'un centre (ex-rotule).</dd>
<dt>Appui plan</dt><dd>Plan-plan : rotation autour de la normale + 2 translations dans le plan (3 ddl).</dd>
<dt>Sphère-plan</dt><dd>Ex-ponctuelle : 3 rotations + 2 translations (5 ddl).</dd>
<dt>Sphère-cylindre</dt><dd>Ex-linéaire annulaire : 3 rotations + translation selon l'axe (4 ddl).</dd>
<dt>Cylindre-plan</dt><dd>Ex-linéaire rectiligne : 2 rotations + 2 translations (4 ddl).</dd>
<dt>ddl</dt><dd>Degré de liberté.</dd>
<dt>Chaîne ouverte</dt><dd>Sans cycle (γ = 0).</dd>
<dt>Chaîne fermée</dt><dd>Avec au moins un cycle (γ ≥ 1).</dd>
<dt>γ</dt><dd>Nombre de cycles indépendants.</dd>
<dt>m</dt><dd>Mobilité (utile + interne).</dd>
<dt>I<sub>c</sub></dt><dd>Inconnues cinématiques (somme des ddl).</dd>
<dt>h</dt><dd>Degré d'hyperstatisme.</dd>
<dt>Isostatique</dt><dd>h = 0.</dd>
<dt>Hyperstatique</dt><dd>h &gt; 0 : conditions redondantes.</dd>
<dt>PFS</dt><dd>Principe fondamental de la statique.</dd>
<dt>Fermeture cinématique</dt><dd>Somme des torseurs cinématiques nulle sur un cycle.</dd>
</dl>
` });

  art.append(h('p', { class: 'ckick' }, 'Cours · section ' + (idx + 1) + ' sur ' + COURSE.length), h('h2', null, cur.t), h('div', { html: typeof cur.h === 'function' ? cur.h() : cur.h }));
  art.append(h('div', { class: 'cpn' },
    idx > 0 ? h('button', { class: 'btn', type: 'button', onclick: () => go(COURSE[idx - 1].id) }, '← ' + COURSE[idx - 1].t) : h('span'),
    idx < COURSE.length - 1 ? h('button', { class: 'btn pri', type: 'button', onclick: () => go(COURSE[idx + 1].id) }, COURSE[idx + 1].t + ' →') : h('span')));
  const top = h('div', { class: 'ctop' }, h('b', null, 'Cours : théorie des mécanismes'), h('button', { class: 'btn pri sm', type: 'button', onclick: () => { CS.open = false; renderCourse(); } }, 'Retour à l\'atelier'));
  box.append(top, sel, h('div', { class: 'cwrap' }, nav, art));
  const sc = box.querySelector('.cwrap'); if (sc) sc.scrollTop = 0; box.scrollTop = 0;
}
function openCourse(id) { if (id) CS.id = id; CS.open = true; renderCourse(); }
$('#bCourse').addEventListener('click', () => { CS.open = !CS.open; renderCourse(); });

function closeDlg() { $('#dlg').hidden = true; $('#dlg').innerHTML = ''; }
function openDlg(title, body) {
  const d = $('#dlg'); d.innerHTML = ''; d.hidden = false;
  d.append(h('div', { class: 'dlgbox', role: 'dialog', 'aria-label': title },
    h('header', null, h('b', null, title), h('button', { class: 'btn sm', type: 'button', onclick: closeDlg }, 'Fermer')),
    h('div', { class: 'dbody' }, body)));
  d.onclick = ev => { if (ev.target === d) closeDlg(); };
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#dlg').hidden) closeDlg(); });
$('#bHelp').addEventListener('click', () => {
  openDlg('Aide', h('div', { html: '<p>Sept ateliers interactifs sur la théorie des mécanismes : liaisons normalisées, liaison équivalente, graphe, mobilité, chaînes, rendre isostatique, méthodes statique/cinématique.</p>' +
    '<h3>Nomenclature</h3><p><b>Sphérique</b> (ex-rotule, 3 ddl), <b>sphère-plan</b> (ex-ponctuelle, 5 ddl), <b>sphère-cylindre</b> (ex-linéaire annulaire, 4 ddl), <b>cylindre-plan</b> (ex-linéaire rectiligne, 4 ddl), <b>appui plan</b> (plan-plan, 3 ddl).</p>' +
    '<h3>Utilisation</h3><ul><li>Choisissez un atelier dans la barre du haut.</li><li>Un <b>axe</b> est défini par un point et un vecteur : (A, z) est la droite passant par A et dirigée par z.</li><li>Le bouton <b>Activité</b> propose consignes, défi et QCM.</li><li>Le bouton <b>Cours</b> propose une synthèse.</li><li>Le sélecteur <b>Schémas</b> affiche les schémas cinématiques en 3D, en 2D (profil et face) ou les deux.</li><li>Les résultats des ateliers 2 et 6 sont calculés par un moteur de torseurs : vous pouvez changer les liaisons, leur vecteur et leur point.</li></ul>' +
    '<h3>Vos données</h3><p>Réponses mémorisées dans ce navigateur uniquement.</p>' }));
});

const SKM = [['3d', '3D'], ['2d', '2D'], ['both', '3D + 2D']];
let SKMODE = 'both';
try { const v = localStorage.getItem('atelier-theorie-meca-sk'); if (v === '3d' || v === '2d' || v === 'both') SKMODE = v; } catch (e) {}
function skApply() {
  document.body.setAttribute('data-sk', SKMODE);
  const seg = $('#skSeg'); seg.innerHTML = '';
  SKM.forEach(m => seg.append(h('button', { type: 'button', class: 'btn sm' + (SKMODE === m[0] ? ' pri' : ''), 'aria-pressed': SKMODE === m[0] ? 'true' : 'false', onclick: () => skSet(m[0]) }, m[1])));
}
function skSet(m) {
  SKMODE = m; SKS.mode = m;
  try { localStorage.setItem('atelier-theorie-meca-sk', m); } catch (e) {}
  skApply();
  const sc = $('#scroller'), keep = sc ? sc.scrollTop : 0, cw = document.querySelector('.cwrap'), ck = cw ? cw.scrollTop : 0;
  if (CS.open) { renderCourse(); const c2 = document.querySelector('.cwrap'); if (c2) c2.scrollTop = ck; }
  else { mountWs(); const s2 = $('#scroller'); if (s2) s2.scrollTop = keep; }
}
(function init() {
  skApply();
  isoLoad(0);
  AS.open = !isSmall();
  renderSeg();
  mountWs();
  renderAct();
  renderCourse();
})();
</script>
</body>
</html>
