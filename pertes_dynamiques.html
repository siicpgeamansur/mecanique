<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Atelier Pertes dynamiques</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--fu:'IBM Plex Sans',system-ui,sans-serif;--fm:'IBM Plex Mono',ui-monospace,monospace;--bg:#fff;--bar:#eee;--pn:#fff;--p2:#f1f3f6;--line:#b9bfc7;--fg:#111;--mu:#5a6068;--ac:#2e6da4;--soft:#dcebf8;--ink:#1b4a76;--ok:#1e7a2e;--bad:#c0281f;--vi:#7b4fc2;--b1:#0a5fd0;--g2:#0b9a4a;--r3:#d6222a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:14px/1.45 var(--fu)}
#app{height:100%;display:flex;flex-direction:column}
.in{padding-inline:max(14px,env(safe-area-inset-left,0px))}
.band{background:var(--bar);border-bottom:1px solid var(--line);flex:none}
.row{display:flex;align-items:center;gap:8px 14px;flex-wrap:wrap;padding-block:7px}
.brand{font-weight:600;font-size:16px}.brand small{font-weight:400;color:var(--mu);font-size:13px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--pn);overflow-x:auto;max-width:100%}
.seg button{border:0;background:0;padding:7px 12px;font:500 13px var(--fu);color:var(--fg);cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--line)}.seg button[aria-pressed=true]{background:var(--ac);color:#fff}
.btn{font:500 13px var(--fu);padding:6px 11px;border:1px solid var(--line);background:var(--pn);color:var(--fg);border-radius:7px;cursor:pointer}
.btn:hover{border-color:var(--ac)}.btn.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
:is(button,input,summary):focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.tabs{display:flex;gap:2px;overflow-x:auto}.tabs button{border:0;border-bottom:2px solid transparent;background:0;padding:7px 12px;font:500 13px var(--fu);color:var(--mu);cursor:pointer;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--fg);border-bottom-color:var(--ac)}
.work{flex:1;min-height:0;display:flex;gap:10px;padding-block:10px}

#act{flex:none;width:clamp(280px,27vw,370px);overflow:auto;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:13.5px}
@media(max-width:820px){.work{flex-direction:column;overflow:auto}#stage,#act{width:auto;flex:none;overflow:visible}}
.ctl{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 16px;margin-bottom:8px}
.fld{display:flex;flex-direction:column;font-size:12.5px;color:var(--mu)}.fld b{color:var(--fg);font-family:var(--fm);font-weight:500}
input[type=range]{width:100%;accent-color:var(--ac)}
canvas{display:block;width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;margin:8px 0}.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:0 8px}.dwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;margin:8px 0}.tb{border-collapse:collapse;width:100%;font-size:12.5px}.tb th{background:var(--p2);text-align:left;padding:5px 8px;font-weight:600}.tb td{padding:3px 8px;border-top:1px solid var(--line);white-space:nowrap}.tb input{width:110px;vertical-align:middle}.tb b{font:500 12px var(--fm);display:inline-block;min-width:38px}.sc{height:190px}.pl{height:210px}
.kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(115px,1fr));gap:6px;margin:6px 0}

fieldset.q{border:1px solid var(--line);border-radius:8px;margin:0 0 10px;padding:6px 10px;min-width:0}fieldset.q legend{font-weight:600;padding:0 4px}
.opt{display:flex;gap:8px;padding:3px 5px;border-radius:6px;cursor:pointer}.opt.good{background:rgba(30,122,46,.2)}.opt.bad{background:rgba(192,40,31,.2)}
.why{font-size:12.5px;color:var(--mu);margin:4px}.score{font-weight:600;margin-top:8px}

@media(max-width:700px){#cov{flex-direction:column}.toc{width:auto;flex-direction:row}}
</style></head><body><div id="app">

<script>

x.setLineDash([]);let lx=L+14;x.textAlign='left';o.ser.forEach(s=>{if(s.n){x.fillStyle=s.c;x.fillText('— '+s.n,lx,T+10);lx+=x.measureText('— '+s.n).width+14}});return{x,X,Y,L,w,h,T,B}}
const ar=(x,a,b,c,d,col)=>{if(Math.hypot(c-a,d-b)<3)return;x.strokeStyle=x.fillStyle=col;x.lineWidth=2;x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();const t=Math.atan2(d-b,c-a);x.beginPath();x.moveTo(c,d);x.lineTo(c-8*Math.cos(t-.4),d-8*Math.sin(t-.4));x.lineTo(c-8*Math.cos(t+.4),d-8*Math.sin(t+.4));x.fill()};

/* ---------- Atelier 1 : Coulomb, adhérence / glissement, stick-slip ---------- */
let S0;function r0(){S0={t:0,x:0,v:0,T:0,h:[],lh:0}}
function step0(n){const f0=V('f0'),f=Math.min(V('f'),f0),c=V('c'),k=V('k'),Vd=V('Vd')/1000,s=S0,dt=.001;

if(s.v!==0&&s.v*vn<=0&&Math.abs(Fs)<=f0*G){s.v=0;s.T=Fs}else{s.v=vn;s.x+=vn*dt;s.T=T}}
s.t+=dt;if(s.t-s.lh>=.02){s.lh=s.t;s.h.push([s.t,Fs,s.T,s.v*1000]);if(s.h.length>400)s.h.shift()}}}
function draw0(){const s=S0,f0=V('f0'),f=Math.min(V('f'),f0),k=V('k'),Vd=V('Vd')/1000,[x,w,h]=sz($('#cv0')),fl=h-44,bx=w*.3,ext=Vd*s.t-s.x,st=s.v===0;
x.strokeStyle=C('--fg');x.lineWidth=1.5;x.beginPath();x.moveTo(0,fl);x.lineTo(w,fl);x.stroke();

x.fillStyle=C('--soft');x.strokeStyle=C('--b1');x.lineWidth=2;x.fillRect(bx-35,fl-44,70,44);x.strokeRect(bx-35,fl-44,70,44);
const sx=bx+35,ex=sx+40+ext*1500,y=fl-22;x.strokeStyle=C('--mu');x.lineWidth=1.5;x.beginPath();x.moveTo(sx,y);for(let i=1;i<=12;i++)x.lineTo(sx+(ex-sx)*i/13,y+(i%2?-7:7));x.lineTo(ex,y);x.stroke();x.fillStyle=C('--g2');x.fillRect(ex,y-12,12,24);
const ph=Math.atan(st?f0:f),Lc=78;x.fillStyle='rgba(123,79,194,.16)';x.beginPath();x.moveTo(bx,fl);x.lineTo(bx-Math.tan(ph)*Lc,fl-Lc);x.lineTo(bx+Math.tan(ph)*Lc,fl-Lc);x.fill();
ar(x,bx,fl,bx,fl-G*5,'#e08a00');ar(x,bx,fl,bx-Math.abs(s.T)*5,fl,'#e08a00');ar(x,bx,fl,bx-Math.abs(s.T)*5,fl-G*5,C('--vi'));
x.font='12.5px '+C('--fu');x.fillStyle=st?C('--ok'):C('--bad');x.textAlign='left';x.fillText(st?'ADHÉRENCE : |T| = F ≤ f₀N (R dans le cône de demi-angle φ₀)':'GLISSEMENT : T = fN + c·v (R sur le cône de demi-angle φ)',8,16);
x.fillStyle=C('--mu');x.fillText('|T|/N = '+F(Math.abs(s.T)/G,2)+'   (f₀ = '+F(f0,2)+', f = '+F(f,2)+')   N = mg = 9,81 N',8,34)}
function plots0(){const h=S0.h,t=S0.t,x0=Math.max(0,t-8),f0=V('f0'),f=Math.min(V('f'),f0),Vd=V('Vd');
plot($('#cv1'),{x0,x1:x0+8,y0:0,y1:Math.max(f0,.2)*G*1.5,xl:'t (s)',yl:'forces (N)',hl:[{y:f0*G,c:C('--vi'),t:'f₀N'},{y:f*G,c:C('--ok'),t:'fN'}],ser:[{p:h.map(q=>[q[0],q[1]]),c:C('--g2'),n:'F ressort'},{p:h.map(q=>[q[0],q[2]]),c:C('--r3'),n:'T frottement'}]});
plot($('#cv2'),{x0,x1:x0+8,y0:Math.min(0,...h.map(q=>q[3])),y1:Math.max(Vd*2,...h.map(q=>q[3]))*1.1,xl:'t (s)',yl:'v (mm/s)',ser:[{p:[[x0,Vd],[x0+8,Vd]],c:C('--mu'),d:[4,3],n:'tireur'},{p:h.map(q=>[q[0],q[3]]),c:C('--b1'),n:'bloc'}]})}

/* ---------- Atelier 2 : rendement d'une liaison hélicoïdale ---------- */
const set=(id,v)=>{$('#'+id).value=v};
function pre(f,p,r){set('fr',f);set('p',p);set('rm',r);out();upd1()}
let D1=0,TH1=0;
function calc1(){const p=V('p')/1e3,rm=V('rm')/1e3,f=V('fr'),al=Math.atan(p/2/PI/rm),ph=Math.atan(f),T=Math.tan;return{p,rm,f,al,ph,ed:T(al)/T(al+ph),ei:al>ph?T(al-ph)/T(al):0}}
const tg1=()=>{D1=1-D1;$('#dir').textContent=D1?'Sens : inverse (écrou → vis)':'Sens : direct (vis → écrou)';upd1()};
function frc(c){const{al,ph,f}=c,Fa=V('Fa'),sa=Math.sin(al),ca=Math.cos(al),blk=!!D1&&al<=ph;let Q,N,T;
if(!D1){Q=Fa*Math.tan(al+ph);N=Q*sa+Fa*ca;T=f*N}else if(blk){Q=0;N=Fa*ca;T=Fa*sa}else{Q=Fa*Math.tan(al-ph);N=Q*sa+Fa*ca;T=f*N}return{Q,N,T,blk,Fa}}
function draw1b(c){const[x,w,h]=sz($('#cv12')),{al,ph}=c,{Q,N,T,blk,Fa}=frc(c),sa=Math.sin(al),ca=Math.cos(al),td=D1?1:-1,
Nv=[-sa*N,ca*N],Tv=[td*ca*T,td*sa*T],Rv=[Nv[0]+Tv[0],Nv[1]+Tv[1]],sc=95/Math.max(Fa,Q,N,T,Math.hypot(Rv[0],Rv[1]),1),
Lp=Math.min(w*.55,(h-70)/Math.max(.15,sa)),A=[44,h-24],Bx=A[0]+Lp*ca,By=A[1]-Lp*sa,sp=blk?.5:((TH1*.06)%1+1)%1*.6+.2,
K=[A[0]+sp*Lp*ca,A[1]-sp*Lp*sa],nc=[-sa,-ca],Bc=[K[0]+13*nc[0],K[1]+13*nc[1]],P=(o,v,col,t)=>{const e=[o[0]+v[0]*sc,o[1]-v[1]*sc];ar(x,o[0],o[1],e[0],e[1],col);x.fillStyle=col;x.textAlign='center';x.font='12px '+C('--fu');x.fillText(t,e[0]+(e[0]>=o[0]?10:-10),e[1]-5)};
x.fillStyle=C('--p2');x.strokeStyle=C('--g2');x.lineWidth=2;x.beginPath();x.moveTo(A[0],A[1]);x.lineTo(Bx,A[1]);x.lineTo(Bx,By);x.closePath();x.fill();x.stroke();
x.fillStyle=C('--mu');x.font='12px '+C('--fu');x.textAlign='left';x.fillText('α = '+F(al*180/PI)+'°',A[0]+30,A[1]-5);
const a0=Math.atan2(nc[1],nc[0]);x.fillStyle='rgba(123,79,194,.16)';x.beginPath();x.moveTo(K[0],K[1]);x.lineTo(K[0]+85*Math.cos(a0-ph),K[1]+85*Math.sin(a0-ph));x.lineTo(K[0]+85*Math.cos(a0+ph),K[1]+85*Math.sin(a0+ph));x.fill();
x.save();x.translate(Bc[0],Bc[1]);x.rotate(-al);x.fillStyle='rgba(214,34,42,.2)';x.strokeStyle=C('--r3');x.lineWidth=2;x.fillRect(-20,-11,40,22);x.strokeRect(-20,-11,40,22);x.restore();
P(K,Nv,'#e08a00','N');P(K,Tv,'#e08a00','T');P(K,Rv,C('--vi'),'R = N + T');P(Bc,[0,-Fa],C('--r3'),'F');if(Q>0)P(Bc,[Q,0],C('--b1'),'Q');
x.fillStyle=blk?C('--bad'):C('--mu');x.textAlign='left';x.fillText(blk?'Adhérence : T = F·sin α ≤ f·N, R reste dans le cône (α ≤ φ)':'Glissement : T = f·N, R sur le cône de demi-angle φ = '+F(ph*180/PI)+'°  —  Q = F·tan(α'+(D1?'−':'+')+'φ)',8,16);
x.fillText('Développement du filet : l’écrou est un bloc sur un plan incliné d’angle α. N : réaction normale du filet ; T : frottement tangentiel ; Q = C/rₘ : effort tangentiel de la vis.',8,h-6)}
function upd1(){const c=calc1(),{p,rm,al,ph,ed,ei}=c,fc=frc(c),Fa=V('Fa'),T=Math.tan,dg=180/PI,d=[],iv=[];
for(let a=.5;a+ph*dg<89;a+=.5){const r=a/dg;d.push([a,T(r)/T(r+ph)]);iv.push([a,r>ph?T(r-ph)/T(r):0])}

x.fillStyle='rgba(123,79,194,.15)';x.fillRect(o.L,o.T,o.X(ph*dg)-o.L,o.h-o.T-o.B);x.fillStyle=C('--vi');x.textAlign='left';x.fillText('α ≤ φ : irréversible',o.L+4,o.h-o.B-6);
x.strokeStyle=C('--r3');x.setLineDash([3,3]);x.beginPath();x.moveTo(o.X(al*dg),o.T);x.lineTo(o.X(al*dg),o.h-o.B);x.stroke();x.setLineDash([]);
[[ed,C('--b1')],[ei,C('--g2')]].forEach(q=>{x.fillStyle=q[1];x.beginPath();x.arc(o.X(al*dg),o.Y(q[0]),5,0,2*PI);x.fill()});
$('#kp1').innerHTML=[['α',F(al*dg)+' °'],['φ = atan f',F(ph*dg)+' °'],['η direct',F(ed)],['η inverse',ei>0?F(ei):'irréversible'],['C sans frott.',F(Fa*p/2/PI)+' N·m'],['C réel',F(Fa*rm*T(al+ph))+' N·m'],['Pertes (direct)',F((1-ed)*100)+' %'],['N réaction du filet',F(fc.N)+' N'],['T tangentiel',F(fc.T)+' N'],['Q = C/rₘ',F(fc.Q)+' N']].map(a=>`<div>${a[0]}<b>${a[1]}</b></div>`).join('');
const e=D1?ei:ed,[y,w,h]=sz($('#cv5'));y.fillStyle=C('--g2');y.fillRect(0,0,w*e,h);y.fillStyle=C('--r3');y.fillRect(w*e,0,w*(1-e),h);y.fillStyle='#fff';y.font='500 13px '+C('--fu');y.textAlign='left';y.fillText(e>0?(D1?'effort restitué ':'couple utile ')+F(e*100,3)+' %':'BLOQUÉ : η inverse ≤ 0',8,h/2+4);if(e<.9&&e>0){y.textAlign='right';y.fillText('perdu par frottement',w-8,h/2+4)}}
function draw1(dt){const c=calc1(),[x,w,h]=sz($('#cv8')),y0=h/2+6,R=Math.max(14,Math.min(34,c.rm*1e3*2.2)),pp=Math.max(12,Math.min(150,c.p*1e3*2.5)),L=34,Rr=w-20,blk=D1&&c.al<=c.ph,om=blk?0:(D1?-3:3),Fa=V('Fa');TH1+=om*dt;
x.save();x.beginPath();x.rect(L,y0-R,Rr-L,2*R);x.clip();x.fillStyle=C('--p2');x.fillRect(L,y0-R,Rr-L,2*R);x.strokeStyle=C('--g2');x.lineWidth=2;

/* ---------- Cours ---------- */
const CO=[['Le frottement : approche locale',`<p>Dans chaque liaison, on écrit les lois de Coulomb et on détermine les efforts de contact (PFD). Il y a deux régimes :</p><div class="fm">Adhérence (V = 0) : ‖T‖ ≤ f₀‖N‖ — R dans le cône d’adhérence<br>Glissement (V ≠ 0) : ‖T‖ = f‖N‖, T opposé à V — R sur le cône (tan φ = f)</div><p>En général f₀ ≳ f : c’est l’effet Stribeck, source de broutement (stick-slip). Pour une liaison pivot, on retient le modèle global :</p><div class="fm">C_f = Cs·sgn(ω) + fv·ω</div><div class="ret"><b>À retenir.</b> Le frottement sec agit comme un couple résistant constant (ω∞ diminue, τ inchangé) ; le visqueux comme un amortissement (ω∞ et τ diminuent).</div>`],
['Le rendement : approche globale',`<p>On ne détaille plus le contact : on affecte au transmetteur un rendement η, et on fait un bilan de puissance.</p><div class="fm">η = P_s / P_e = (C_s ω_s)/(C_e ω_e) ≤ 1 ; P_pertes = (1 − η) P_e ; en série : η = η₁η₂…ηₙ</div><h3>Liaison hélicoïdale</h3><div class="fm">tan α = p/(2π rₘ)   η_direct = tan α / tan(α+φ)   η_inverse = tan(α−φ)/tan α</div><p>Si α ≤ φ : η_inverse ≤ 0, la vis est irréversible (maintien sans frein) mais η_direct < ½.</p><div class="ret"><b>Attention.</b> η dépend du sens de transit de la puissance : une charge motrice impose η_inverse (et la réversibilité).</div>`],
['Ramener sur l’arbre moteur',`<p>Théorème de l’énergie cinétique sur l’ensemble, avec tout exprimé en fonction de ωm :</p><div class="fm">J_eq = J₁ + r²J₂/ηₑ + Mλ²/(ηₑη_h)<br>C_r,eq = Cs₁ + r·Cs₂/ηₑ + λ(µMg + Fₑ)/(ηₑη_h)<br>f_eq = fv₁ + r²fv₂/ηₑ</div><div class="fm">J_eq·dωm/dt = Cm − C_r,eq − f_eq·ωm   avec Cm = C₀ − k·ωm</div><div class="fm">τ = J_eq/(k + f_eq)     ω∞ = (C₀ − C_r,eq)/(k + f_eq)</div><div class="ret"><b>À retenir.</b> Inertie ramenée : × (rapport)². Effort ramené : × (rapport). Rendement (régime moteur) : ÷ η pour tout ce qui est en aval.</div>`],
['Méthode et pièges',`<ol><li>Choisir le paramètre de mouvement (celui de l’actionneur).</li><li>Écrire les lois entrée-sortie (r, λ, R).</li><li>E_c = ½ J_eq ωm² (ou ½ M_eq v²).</li><li>Puissances : frottement local, ou ÷ η global.</li><li>TEC ⇒ équation différentielle ; identifier τ et la valeur finale.</li></ol><div class="ret"><b>Pièges.</b> Oublier le carré du rapport pour les inerties ; appliquer η dans le mauvais sens ; utiliser η direct pour une charge motrice ; oublier que Cs·sgn(ω) impose C₀ > C_r,eq pour démarrer.</div>`]];
